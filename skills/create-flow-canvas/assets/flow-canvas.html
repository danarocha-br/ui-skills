          fly({
            k: cam.k,
            x: (innerWidth - inset.right) / 2 - (r.x + r.w / 2) * cam.k,
            y: (innerHeight - inset.bottom) / 2 - (r.y + r.h / 2) * cam.k,
          });
        } else focusScreen(to);
      }
      seltb.addEventListener("click", (e) => {
        const a = e.target.closest("button")?.dataset.a;
        if (!a || !selection.count()) return;
        e.stopPropagation();
        const id = selection.primary() || selection.ids()[0],
          L = groupOf(id);
        if (a === "focus") focusScreen(id);
        if (a === "inspect") panel.open("inspect", id);
        if (a === "comment")
          createNote({ text: "Add a comment…", frame: id, local: FlowDevice.restingSpot(DEV.id, 60) });
        if (a === "play") {
          if (L) play(L.screens.slice(L.screens.indexOf(id)));
          else toast("Group this frame to play it as a flow");
        }
        if (a === "code")
          toast("Opens " + SCREENS[id].file + " in your editor");
        if (a === "group") groupSel();
        if (a === "connect") connectSel();
        if (a === "ungroup") removeSel();
      });

      /* panel: search + inspect share the right-hand half, like Spatial's search. FlowPanel (above) owns whether it is
         open, its mode, its screen and the sweep; paintPanel is the one place that turns that into the page. */
      const panelEl = $("#panel"),
        pbody = $("#pbody"),
        ptitle = $("#ptitle");
      let panelReturn = null;
      const setTitle = (text, sub) => {
        ptitle.innerHTML = esc(text) + (sub ? `<span class="psub">${esc(sub)}</span>` : "");
      };
      /* a sweep on the page: every screen that uses the component keeps its colour, the rest recede */
      function paintSweep(sw) {
        ORDER.forEach((id) => {
          const col = colOf(id);
          if (!col) return;
          const hit = !!sw && sw.uses.includes(id);
          col.classList.toggle("u-hit", hit);
          col.classList.toggle("u-dim", !!sw && !hit);
        });
      }
      /* a sweep that has just begun: show the screens it found (closed groups open for it) and go there. Opening is
         view state like any other: it is saved at once, stays after the sweep ends, and is not an undo step. */
      function revealSweep(sw) {
        const closed = sw.uses.map(groupOf).filter((L) => L && !L.open);
        if (closed.length) commit(() => layout.setOpen(closed.map((L) => L.id), true));
        paintSweep(sw);
        let x0 = 1e9,
          y0 = 1e9,
          x1 = -1e9,
          y1 = -1e9;
        sw.uses.forEach((id) => {
          const b = geo.frameBox(id);
          x0 = Math.min(x0, b.x);
          y0 = Math.min(y0, b.y);
          x1 = Math.max(x1, b.x + b.w);
          y1 = Math.max(y1, b.y + b.h);
        });
        fly(fitRect({ x: x0 - 40, y: y0 - 40, w: x1 - x0 + 80, h: y1 - y0 + 80 }, 40, 1));
      }
      /* the panel changed (or the page needs it drawn again, `rebuild`): paint exactly what FlowPanel now says */
      function paintPanel(st, ch) {
        panelEl.setAttribute("aria-label", st.label);
        if (!st.open) {
          if (!ch.closed) return;
          FrameDom.clearSpot();
          paintSweep(null);
          panelEl.classList.remove("open");
          const back = panelReturn;
          panelReturn = null;
          if (panelEl.contains(document.activeElement)) {
            if (back && back !== document.body && document.contains(back) && !panelEl.contains(back) && back.focus) back.focus({ preventScroll: true });
            else document.activeElement.blur();
          }
          panelEl.inert = true;
          if (selection.primary()) focusScreen(selection.primary());
          return;
        }
        if (ch.opened) panelReturn = document.activeElement;
        panelEl.inert = false;
        panelEl.classList.add("open");
        if (ch.opened || ch.mode || ch.subject || ch.rebuild) renderBody(st, !(ch.opened || ch.mode));
        if (ch.sweep) {
          if (st.sweep) revealSweep(st.sweep);
          else paintSweep(null);
          refreshSweepUI();
        }
        if (ch.opened) {
          if (selection.primary()) focusScreen(selection.primary());
          /* a keyboard user who opens the inspector lands in it; closing hands focus back */
          if (st.mode === "inspect")
            setTimeout(() => {
              if (panel.state().open) ptitle.focus({ preventScroll: true });
            }, 60);
        }
      }
      panel.on(paintPanel);
      /* the page changed under the panel (another device, a frame in another state): draw it again as it is */
      const repaintPanel = () => {
        const st = panel.state();
        paintSweep(st.sweep);
        if (!st.open) return;
        if (st.mode === "search") {
          if ($("#q")) renderSearch(); /* new tiles; what was typed stays */
        } else paintPanel(st, { rebuild: true });
      };
      $("#pclose").onclick = () => panel.close();
      async function copyText(t) {
        try {
          await navigator.clipboard.writeText(t);
          return true;
        } catch (e) {
          try {
            const ta = document.createElement("textarea");
            ta.value = t;
            ta.style.cssText = "position:fixed;opacity:0";
            document.body.appendChild(ta);
            ta.select();
            const ok = document.execCommand("copy");
            ta.remove();
            return ok;
          } catch (e2) {
            return false;
          }
        }
      }
      /* ---------- the inspector ---------- */
      const coarse = () => matchMedia("(hover: none)").matches;
      const sweepMsgFor = (sw) =>
        sw
          ? `Showing ${sw.uses.length === 1 ? "the 1 screen" : "the " + sw.uses.length + " of " + ORDER.length + " screens"} that ${sw.uses.length === 1 ? "uses" : "use"} <b>${esc(sw.component)}</b>. ${coarse() ? "Tap it again" : "Click it again"} or press Esc to clear.`
          : coarse()
            ? "Tap one to light it up on the screen. Tap it again to find every screen that uses it."
            : "Hover one to light it up on the screen. Click to find every screen that uses it.";
      function usesHTML(sw) {
        if (!sw) return "";
        return `<ul class="uses" aria-label="Screens that use ${esc(sw.component)}">${sw.uses
          .map((x) => {
            const S = SCREENS[x];
            return `<li><button data-uid="${esc(x)}"${x === selection.primary() ? ' aria-current="true"' : ""}><span class="un">${esc(S.name)}</span><span class="ur">${esc(S.route)}</span></button></li>`;
          })
          .join("")}</ul>`;
      }
      /* sweep on/off changes a few nodes in place, so focus and the cursor stay where they are */
      function refreshSweepUI() {
        const hint = $("#ipHint"),
          st = panel.state();
        if (!hint || !st.open || st.mode !== "inspect") return;
        const sw = st.sweep;
        hint.classList.toggle("hot", !!sw);
        hint.innerHTML = sweepMsgFor(sw);
        pbody.querySelectorAll(".cc").forEach((b) => {
          const on = !!sw && b.dataset.comp === sw.component;
          b.classList.toggle("on", on);
          b.setAttribute("aria-pressed", on);
        });
        const u = $("#ipUses");
        u.innerHTML = usesHTML(sw);
        u.querySelectorAll("[data-uid]").forEach((b) =>
          b.addEventListener("click", () => select(b.dataset.uid, true)),
        );
      }
      /* write the panel's body for what FlowPanel says it shows. Rebuilding replaces the nodes, so the focused one is found again afterwards. */
      function renderBody(st, still) {
        FrameDom.clearSpot();
        const focusKey = (() => {
          const el = document.activeElement;
          if (!el || !pbody.contains(el)) return null;
          const d = el.dataset;
          return d.comp ? `[data-comp="${cssStr(d.comp)}"]` : d.uid ? `[data-uid="${cssStr(d.uid)}"]` : d.st ? `[data-st="${cssStr(d.st)}"]` : null;
        })();
        if (st.mode === "search") renderSearchBody();
        else if (st.subject) renderInspect(st.subject, st.sweep, still);
        else renderInspectEmpty();
        if (focusKey) {
          const el = pbody.querySelector(focusKey);
          if (el) el.focus({ preventScroll: true });
        }
      }
      function renderInspectEmpty() {
        setTitle("Inspect");
        pbody.innerHTML = `<div class="ip still"><p class="iempty">Select a screen to see what the code knows about it: its route, components, states and source.</p><p class="iempty sub">Click a frame, or press <kbd>I</kbd> with one selected.</p></div>`;
      }
      function renderInspect(id, sw, still) {
        const s = SCREENS[id],
          L = groupOf(id),
          file = s.file.split("/"),
          nOnly = s.states.filter((x) => !x.reachable).length,
          many = FrameDom.switchable(id);
        const code = `<svg aria-hidden="true"><use href="#i-code"/></svg>`;
        setTitle(s.name);
        const swept = (c) => !!sw && sw.component === c;
        const chips = s.components
          .map((c) => {
            const n = FrameDom.count(id, c);
            const lbl = `${c}, ${n ? n + " on this screen" : "not on screen in this state"}`;
            return `<button class="cc${swept(c) ? " on" : ""}${n ? "" : " off"}" data-comp="${esc(c)}" aria-pressed="${swept(c)}" aria-label="${esc(lbl)}" title="${n ? "" : "Not on screen in this state"}">${esc(c)}<small aria-hidden="true">${n ? "×" + n : "—"}</small></button>`;
          })
          .join("");
        const only = (st) => !st.reachable;
        const shown = FrameDom.shownStates(id),
          at = FrameDom.stateIndex(id);
        const states = many
          ? `<div class="chipsrow">${s.states
              .map(
                (st, i) =>
                  `<button class="st${only(st) ? " code" : ""}${i === at ? " on" : ""}" data-st="${i}" aria-pressed="${i === at}"${shown.includes(i) ? "" : " disabled"}>${only(st) ? code : ""}${esc(st.name)}${only(st) ? '<span class="vh"> (only reachable in code)</span>' : ""}</button>`,
              )
              .join("")}</div>`
          : `<ul class="slist">${s.states
              .map(
                (st) =>
                  `<li${only(st) ? ' class="code"' : ""}>${only(st) ? code : ""}${esc(st.name)}${only(st) ? '<span class="vh"> (only reachable in code)</span>' : ""}</li>`,
              )
              .join("")}</ul>`;
        pbody.innerHTML = `<div class="ip${still ? " still" : ""}">
    <header class="ihead" style="--n:0"><code class="r">${esc(s.route)}</code><p class="icap">${L ? esc(groupName(L)) : "Free frame"} · ${DEV.vp} · ${DEV.label}</p></header>
    <section style="--n:1"><h3>Source</h3><div class="srcrow"><div class="crumbs">${file.map((p, i) => `<span class="${i === file.length - 1 ? "last" : ""}">${esc(p)}</span>`).join('<i aria-hidden="true">›</i>')}</div><button class="copy" aria-label="Copy path" title="Copy path"><svg class="ic-copy" aria-hidden="true"><use href="#i-copy"/></svg><svg class="ic-done" aria-hidden="true"><use href="#i-check"/></svg></button></div><button class="open"><svg aria-hidden="true"><use href="#i-code"/></svg>Open in code</button></section>
    <section style="--n:2"><h3>Components<em>${s.components.length}</em></h3><div class="chipsrow">${chips}</div><p class="ihint" id="ipHint" aria-live="polite"></p><div id="ipUses"></div></section>
    <section style="--n:3"><h3>States<em>${s.states.length}</em></h3><p class="sfact">${s.states.length} found${nOnly ? `. <b>${nOnly} only reachable in code.</b>` : ", all reachable from the UI."}${many ? " Tap one to see it on the screen." : ""}</p>${states}</section>
    <section style="--n:4"><h3>Notes</h3><p class="inote">${esc(s.note)}</p></section></div>`;
        const hint = $("#ipHint");
        let armed = null;
        pbody.querySelectorAll(".cc").forEach((b) => {
          const c = b.dataset.comp,
            n = FrameDom.count(id, c);
          const on = () => {
            FrameDom.spotlight(id, c);
            hint.classList.add("hot");
            hint.innerHTML = `<b>${esc(c)}</b>: ${n ? n + " on this screen" : "not on screen in this state"}, used on ${usesOf(c).length} of ${ORDER.length} screens.`;
          };
          const off = () => {
            FrameDom.clearSpot();
            const now = panel.state().sweep;
            hint.classList.toggle("hot", !!now);
            hint.innerHTML = sweepMsgFor(now);
          };
          b.addEventListener("mouseenter", on);
          b.addEventListener("focus", on);
          b.addEventListener("mouseleave", off);
          b.addEventListener("blur", off);
          b.addEventListener("click", () => {
            /* touch has no hover: the first tap lights it up, the second finds every screen */
            if (coarse() && !swept(c) && armed !== c) {
              armed = c;
              on();
              return;
            }
            armed = null;
            FrameDom.clearSpot();
            panel.toggleSweep(c);
          });
        });
        pbody.querySelectorAll(".st[data-st]").forEach((b) =>
          b.addEventListener("click", () => {
            if (selection.primary() !== id) select(id);
            setState(id, +b.dataset.st);
            repaintPanel();
          }),
        );
        pbody.querySelector(".open").onclick = () =>
          toast("Opens " + s.file + " in your editor");
        const cp = pbody.querySelector(".copy");
        cp.onclick = async () => {
          const ok = await copyText(s.file);
          cp.classList.toggle("done", ok);
          cp.setAttribute("aria-label", ok ? "Path copied" : "Copy path");
          toast(ok ? "Path copied" : "Couldn’t copy. Select the path and copy it by hand.");
          setTimeout(() => {
            cp.classList.remove("done");
            cp.setAttribute("aria-label", "Copy path");
          }, 1700);
        };
        refreshSweepUI();
      }
      function openSearch() {
        panel.open("search");
        setTimeout(() => $("#q") && $("#q").focus(), 350);
      }
      function renderSearchBody() {
        pbody.innerHTML = `<div class="qrow"><input id="q" placeholder="Describe what you’re looking for" autocomplete="off"><label>Filter by</label>
    <select id="fType"><option value="any">Any type</option><option value="screens">Screens</option><option value="routes">Routes</option><option value="components">Components</option></select>
    <select id="fWhere"><option value="any">Anywhere</option>${layout.groups.filter(
      (l) => l.screens.length,
    )
      .map((l) => `<option value="${esc(l.id)}">${esc(groupName(l))}</option>`)
      .join(
        "",
      )}<option value="free">On the canvas</option></select></div><div id="results"></div>`;
        ["#q", "#fType", "#fWhere"].forEach((s) =>
          $(s).addEventListener(s === "#q" ? "input" : "change", renderSearch),
        );
        $("#q").addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            const t = $("#results .tile");
            if (t) t.click();
          }
        });
        renderSearch();
      }
      function renderSearch() {
        const q = $("#q").value.trim().toLowerCase(),
          type = $("#fType").value,
          where = $("#fWhere").value;
        const whereName =
          where === "any"
            ? "anywhere"
            : where === "free"
              ? "on the canvas"
              : "in " + groupName(layout.groups.find((l) => l.id === where) || { id: where });
        setTitle("Search", `${type === "any" ? "Any type" : { screens: "Screens", routes: "Routes", components: "Components" }[type]} of content ${whereName}`);
        const hit = ORDER.filter((id) => {
          const s = SCREENS[id],
            g = groupOf(id);
          if (where !== "any" && (g ? g.id : "free") !== where) return false;
          if (!q) return true;
          const hay =
            type === "screens"
              ? s.name
              : type === "routes"
                ? s.route + " " + s.file
                : type === "components"
                  ? s.components.join(" ")
                  : [
                      s.name,
                      s.route,
                      s.file,
                      s.components.join(" "),
                      s.states.map((x) => x.name).join(" "),
                      s.note,
                    ].join(" ");
          return hay.toLowerCase().includes(q);
        });
        const res = $("#results");
        res.innerHTML = "";
        if (!hit.length) {
          res.innerHTML =
            '<div class="empty">Nothing in this codebase matches.</div>';
          return;
        }
        hit.forEach((id) => {
          const s = SCREENS[id],
            t = document.createElement("div");
          t.className = "tile";
          t.innerHTML = `<div class="th"></div><b>${esc(s.name)}</b><small>${esc(s.route)}</small>`;
          FrameDom.copyInto(id, t.querySelector(".th"));
          t.onclick = () => select(id, true);
          res.appendChild(t);
        });
      }

      /* ======================================================================
   PLAY FLOW
   ====================================================================== */
      let playing = false,
        playGroup = null;
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      async function play(ids) {
        if (!ids.length) return;
        const L = groupOf(ids[0]);
        if (!L) return;
        ids =
          ids.length >= L.screens.length ? FlowLayout.flowOrder(L, layout.conns) : FlowLayout.flowOrder(L, layout.conns, ids[0]);
        stopPlay();
        playing = true;
        playGroup = L.id;
        const pl = groupEl(playGroup).querySelector(".fplay");
        pl.classList.add("on");
        pl.querySelector("use").setAttribute("href", "#i-stop");
        pl.querySelector("span").textContent = "Stop";
        if (!L.open) {
          setGroup(L.id, true, { fly: false });
          await sleep(450);
        }
        let prev = null;
        for (const id of ids) {
          if (!playing) break;
          const hop = prev && layout.conns.find((c) => c.from === prev && c.to === id);
          if (hop) tokenAlong(hop.id);
          select(id, true);
          prev = id;
          await sleep(1900);
        }
        stopPlay();
      }
      function stopPlay() {
        playing = false;
        playGroup = null;
        document.querySelectorAll(".fplay").forEach((b) => {
          b.classList.remove("on");
          b.querySelector("use").setAttribute("href", "#i-play");
          b.querySelector("span").textContent = "Play flow";
        });
      }

      /* ======================================================================
   CONNECTORS
   A connector belongs to two frames, not to a group. It leaves the side that faces the other
   frame, bends around whatever is between them, and follows both ends while they move.
   ====================================================================== */
      let connDrag = null;
      const connEls = new Map();
      function worldM() {
        return new DOMMatrixReadOnly(getComputedStyle(world).transform);
      }
      function mkConnEl(c) {
        const g = document.createElementNS(svgNS, "g");
        g.setAttribute("class", "conn");
        g.dataset.id = c.id;
        g.innerHTML =
          '<path class="hit"/><path class="ln"/><circle class="dot" r="4.5"/><polygon class="arr"/>';
        $("#conns").appendChild(g);
        const chip = document.createElement("div");
        chip.className = "echip";
        chip.dataset.id = c.id;
        chip.tabIndex = 0;
        chip.setAttribute("role", "button");
        chip.title = "Click to follow · double-click to rename";
        chip.innerHTML =
          '<span class="lb"></span><button class="ex" aria-label="Delete connector" title="Delete connector">×</button>';
        $("#cchips").appendChild(chip);
        const o = {
          g,
          chip,
          lb: chip.querySelector(".lb"),
          ln: g.querySelector(".ln"),
          hit: g.querySelector(".hit"),
          dot: g.querySelector(".dot"),
          arr: g.querySelector(".arr"),
        };
        connEls.set(c.id, o);
        return o;
      }
      function drawConns(now = performance.now()) {
        const alive = new Set();
        layout.conns.forEach((c) => {
          alive.add(c.id);
          const o = connEls.get(c.id) || mkConnEl(c);
          const hidden =
            !geo.place(c.from) ||
            !geo.place(c.to) ||
            geo.isDeck(c.from) ||
            geo.isDeck(c.to);
          o.g.classList.toggle("off", hidden);
          o.chip.classList.toggle("off", hidden);
          o.g.dataset.to = c.to;
          o.chip.dataset.to = c.to;
          o.chip.dataset.from = c.from;
          if (document.activeElement !== o.lb && o.lb.textContent !== c.label)
            o.lb.textContent = c.label;
          if (hidden) return;
          const a = geo.screenRect(c.from, now),
            b = geo.screenRect(c.to, now);
          if (!a || !b) return;
          const r = FlowRouting.route(a, b, DEV.metrics.edge),
            sh = FlowRouting.shape(r);
          o.ln.setAttribute("d", sh.d);
          o.hit.setAttribute("d", sh.d);
          o.dot.setAttribute("cx", r.p0.x);
          o.dot.setAttribute("cy", r.p0.y);
          o.arr.setAttribute("points", sh.arr);
          o.chip.style.left = sh.mid.x + "px";
          o.chip.style.top = sh.mid.y + "px";
        });
        connEls.forEach((o, id) => {
          if (!alive.has(id)) {
            o.g.remove();
            o.chip.remove();
            connEls.delete(id);
          }
        });
        markActive();
      }
      const connBetween = (a, b) =>
        layout.conns.find((c) => c.from === a && c.to === b);
      function tokenAlong(id) {
        const o = connEls.get(id);
        if (!o || o.g.classList.contains("off")) return Promise.resolve();
        const len = o.ln.getTotalLength();
        if (!len) return Promise.resolve();
        const dot = document.createElementNS(svgNS, "circle");
        dot.setAttribute("r", 7);
        dot.setAttribute("class", "token");
        $("#conns").appendChild(dot);
        const t0 = performance.now(),
          D = Math.min(950, 420 + len * 0.3);
        return new Promise((res) => {
          const done = () => {
            dot.remove();
            res();
          };
          const step = (now) => {
            const k = Math.min(1, (now - t0) / D),
              e = 1 - Math.pow(1 - k, 3),
              pt = o.ln.getPointAtLength(len * e);
            dot.setAttribute("cx", pt.x);
            dot.setAttribute("cy", pt.y);
            if (k < 1) requestAnimationFrame(step);
            else done();
          };
          requestAnimationFrame(step);
          setTimeout(done, D + 250);
        });
      }
      function addConn(from, to, opts = {}) {
        if (from === to || connBetween(from, to)) {
          toast(
            from === to
              ? "A frame can’t connect to itself."
              : "Those frames are already connected.",
          );
          return null;
        }
        const c = commit(() => {
          const link = {
            id: layout.nextId("c"),
            from,
            to,
            label: opts.label || "Next",
          };
          layout.add("conns", link);
          return link;
        });
        if (!opts.noEdit) setTimeout(() => editChip(c.id), 40);
        return c;
      }
      function deleteConn(id) {
        if (layout.conns.some((x) => x.id === id)) annotations.remove("conns", id);
      }
      function selectConn(id) {
        selection.selectConn(id);
        toast(
          "Connector selected. Delete removes it, double-click its label to rename.",
        );
      }
      function editChip(id) {
        const o = connEls.get(id);
        if (!o) return;
        o.lb.contentEditable = CE;
        o.lb.focus();
        const r = document.createRange();
        r.selectNodeContents(o.lb);
        const sel = getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
      }
      function connectSel() {
        const ids = FlowGeometry.readingOrder(
          selection.ids().filter((i) => geo.place(i) && !geo.place(i).deck),
          geo.place,

        if (ids.length < 2) {
          toast("Select two or more frames to connect them in order.");
          return;

        const n = commit(
          () => {
            let n = 0;
            for (let i = 0; i < ids.length - 1; i++) {

          { redraw: ["conns"] },

      /* drag from an edge dot to another frame */
      function startConnect({ id, side }) {
        connDrag = { from: id, side, tgt: null, el: null };

      function updateConnDrag(pt) {
        const now = performance.now(),
          w = toWorld(pt.x, pt.y),
          a = geo.screenRect(connDrag.from, now);

        if (tgt !== connDrag.tgt) {

            .querySelectorAll(".col.tgt")

          const g = document.createElementNS(svgNS, "g");

          $("#conns").appendChild(g);

        let r;
        if (tgt) {
          r = FlowRouting.route(a, geo.screenRect(tgt, now), DEV.metrics.edge);
        } else {
          const p0 = FlowRouting.sidePt(a, connDrag.side, DEV.metrics.edge);
          r = { p0, pts: FlowRouting.ortho(p0, { x: w.x, y: w.y, nx: 0, ny: 0 }) };
        }
        const sh = FlowRouting.shape(r);
        connDrag.el.querySelector(".ln").setAttribute("d", sh.d);
        connDrag.el.querySelector(".dot").setAttribute("cx", r.p0.x);
        connDrag.el.querySelector(".dot").setAttribute("cy", r.p0.y);

      }
      /* labels: click follows, double-click renames, × deletes */
      let chipT;
      world.addEventListener(
        "click",
        (e) => {
          const ex = e.target.closest(".echip .ex");
          if (ex) {

          }
          const hit = e.target.closest(".conn .hit");

      world.addEventListener("dblclick", (e) => {

      });
      world.addEventListener("focusout", (e) => {
        const lb = e.target.closest && e.target.closest(".echip .lb");
        if (!lb || !lb.isContentEditable) return;

        const id = lb.closest(".echip").dataset.id,

        if (!c) return;

      });
      world.addEventListener("keydown", (e) => {

        } else if (e.key === "F2") {

        }
      });

      /* ======================================================================
   EDIT THE ARRANGEMENT: group, name, remove, drag, undo
   ====================================================================== */
      function undo() {
        const done = commit.undo(() => {
          selection.clearConn();
          selection.prune((id) => !!SCREENS[id]);
          reflectSel(); /* the layout may have been drawn again: its frames are new elements */
        });
        toast(done ? "Undone" : "Nothing to undo");
      }
      /* what follows a new group, however it was made: select it, bring it into view if it was placed for the user,
         and ask for its name */
      function afterGrouped(L, ids, { fly: bring }) {
        setSel(ids, ids[ids.length - 1]);
        if (bring) fly(fitRect(groupRect(L), 40));
        setTimeout(() => focusTitle(L.id), 650);
        toast(
          ids.length === 1
            ? "Grouped. Name it, then drag frames in."
            : `Grouped ${ids.length} frames. Name the group.`,
        );
      }
      function groupFrames(ids) {
        ids = [...new Set(ids)].filter((id) => SCREENS[id]);
        if (!ids.length) return null;
        const allFree = ids.every(isFree);
        ids = FlowGeometry.readingOrder(ids, geo.place);
        const minX = Math.min(...ids.map((i) => geo.place(i).x)),
          minY = Math.min(...ids.map((i) => geo.place(i).y));
        /* frames that were all loose keep their spot; otherwise the group takes the next free one */
        const at = allFree ? geo.groupCornerFor({ x: minX, y: minY }) : undefined;
        const L = commit(() => layout.groupFrames(ids, { device: DEV.id, at }));
        afterGrouped(L, ids, { fly: !allFree });
        return L;
      }
      function removeFromGroup(ids) {
        const taken = commit(() => arrange.takeOut(ids));
        if (!taken.length) return;
        toast(
          taken.length === 1
            ? "Removed from group. ⌘Z to undo."
            : `Removed ${taken.length} frames from their groups. ⌘Z to undo.`,
        );
      }
      function dissolveGroup(L) {
        const name = groupName(L);
        commit(() => arrange.dissolve(L));
        toast(`Ungrouped “${name}”. Frames stay on the canvas. ⌘Z to undo.`);
      }
      function groupSel() {
        if (selection.count()) groupFrames(selection.ids());
      }
      function removeSel() {
        removeFromGroup(selection.ids());
      }
      /* put the view back in order without touching what the flows are: group membership and order,
         connectors, names, annotations and every note's text stay; only positions are reset on this device (a finding's
         moved places on every device: they are carried across devices, see below) */
      function tidy() {
        const changed = commit(() => arrange.tidy(), { redraw: "all" });
        if (!changed) {
          toast("Already tidy.");
          return;
        }
        fly(fitRect(geo.bounds(), 40, 1.1));
        toast("Tidied. Groups, flows and connectors are as they were. ⌘Z to undo.");
      }
      function resetLayout() {
        commit(
          () => {
            layout.reset();
            selection.clearConn();
            setSel([]);
          },
          { redraw: ["world"] },
        );
        fly(fitRect(geo.bounds(), 40, 1.1));
        toast("Layout reset to the scanned arrangement");
      }
      function focusTitle(id) {
        const L = layout.groups.find((l) => l.id === id);
        if (!L) return;
        if (!L.open) setGroup(id, true, { fly: false });
        const t = groupEl(id) && groupEl(id).querySelector(".gtitle");
        if (!t) return;
        t.focus();
        const r = document.createRange();
        r.selectNodeContents(t);
        const s = getSelection();
        s.removeAllRanges();
        s.addRange(r);
      }

      /* group options menu (header “…”) */
      function openGroupMenu(L, btn) {
        const m = $("#mGroup");
        const r = btn.getBoundingClientRect();
        m.innerHTML = `<button class="mi" data-ga="rename"><svg><use href="#i-note"/></svg>Rename</button>
    <button class="mi" data-ga="toggle"><svg><use href="#i-layers"/></svg>${L.open ? "Close group" : "Open group"}</button>
    <button class="mi" data-ga="play"><svg><use href="#i-play"/></svg>Play flow</button>
    <hr><button class="mi" data-ga="ungroup"><svg><use href="#i-ungroup"/></svg>Ungroup<span>keeps the frames</span></button>`;
        m.style.left = Math.min(r.left, innerWidth - 260) + "px";
        m.style.top = Math.min(r.bottom + 8, innerHeight - 220) + "px";
        m.style.bottom = "auto";
        closeMenus();
        m.classList.add("open");
        m.querySelectorAll("[data-ga]").forEach(
          (b) =>
            (b.onclick = (ev) => {
              ev.stopPropagation();
              closeMenus();
              const a = b.dataset.ga;
              if (a === "rename") focusTitle(L.id);
              if (a === "toggle") setGroup(L.id, !L.open);
              if (a === "play") play(L.screens);
              if (a === "ungroup") dissolveGroup(L);
            }),

      }

      /* ---------- dragging ---------- */
      /* what a press and a drag mean is FlowPointer's (below); the page draws the marquee it asks for */
      let mq = null;
      function setHand(on) {
        pointer.setHand(on);
        toast(
          on
            ? "Hand tool: drag to pan. V returns to select."
            : "Select tool: drag to select frames.",
        );
      }
      const selbox = document.createElement("div");
      selbox.className = "selbox";
      selbox.innerHTML = "<span></span>";
      world.insertBefore(selbox, notesEl);
      function updateSelBox() {
        const ids = selection.ids().filter(
          (id) => geo.place(id) && !geo.place(id).deck && colOf(id),
        );
        if (ids.length < 2) {
          selbox.style.display = "none";
          return;
        }
        let x0 = 1e9,
          y0 = 1e9,
          x1 = -1e9,
          y1 = -1e9;
        ids.forEach((id) => {
          const r = geo.screenRect(id);
          x0 = Math.min(x0, r.x);
          y0 = Math.min(y0, r.y);
          x1 = Math.max(x1, r.x + r.w);
          y1 = Math.max(y1, r.y + r.h);
        });
        const pad = 14;
        Object.assign(selbox.style, {
          display: "block",
          left: x0 - pad + "px",
          top: y0 - pad + "px",
          width: x1 - x0 + pad * 2 + "px",
          height: y1 - y0 + pad * 2 + "px",
        });
        selbox.firstChild.textContent = ids.length + " frames";
      }
      const hint = $("#hint");
      const hideHint = () => hint.classList.add("gone");
      setTimeout(hideHint, 9000);
      /* the page's side of a gesture: draw its preview, and clean up after it. Everything a drag puts on the page is
         drawn from the preview and cleared in settleGesture, which a drop and a cancel both end in. */
      function showGesture(pv) {
        if (pv.kind === "group") {
          document.body.classList.add("gdrag");
          document.querySelectorAll(".col.fan").forEach((c) => c.classList.remove("fan"));
          /* a group dragged by its grip moves as one piece with its header: the frames do not slide after it */
          if (pv.regrouped) {
            arrangeFrames({ snap: true });
            syncGroups();
            updateBars();
            drawConns();
          }
          return;
        }
        selbox.classList.add("live");
        Object.entries(pv.held).forEach(([id, at]) => {

          if (!c) return;
          geo.hold(id, at.x, at.y);
          c.classList.add("dragging");
          c.classList.remove("deck");

        if (pv.mergeFrame) colOf(pv.mergeFrame)?.classList.add("merge");

        }

        groupEls.forEach((el) => el.classList.remove("drop"));
      }
      /* a press on a frame or group has travelled far enough: take hold of it. False when there is nothing to drag. */
      function beginDrag(press, from) {
        stage.classList.remove("fly");
        hideHint();
        const at = toWorld(from.x, from.y);
        if (press.kind === "group") {
          if (!press.group) return false;
          gesture.begin({ kind: "group", id: press.group.id, pointer: at });
          return true;
        }
        const id = press.id;
        const ids =
          selection.has(id) && selection.count() > 1
            ? selection.ids().filter((x) => geo.place(x) && !geo.place(x).deck)
            : [id];
        if (!selection.has(id) || selection.count() <= 1) setSel([id], id);
        gesture.begin({ kind: "frame", ids, pid: id, pointer: at });
        return true;
      }
      function endDrag() {
        const r = gesture.end();
        if (!r) return;
        if (r.kind === "merge") afterGrouped(r.group, r.ids, { fly: false });
        else if (r.kind === "into") {
          const where = layout.groups.find((l) => l.id === r.group);
          toast((r.moved ? `Moved into “${groupName(where)}”` : "Reordered") + ". ⌘Z to undo.");
        } else if (r.kind === "loose" && r.moved) toast("Taken out of its group. ⌘Z to undo.");
      }
      function marqueeHits(r) {
        const a = toWorld(r.x, r.y),
          b = toWorld(r.x + r.w, r.y + r.h),
          now = performance.now();
        return ORDER.filter((id) => {
          if (!geo.place(id) || geo.isDeck(id)) return false;
          const q = geo.screenRect(id, now);
          return q.x + q.w > a.x && q.x < b.x && q.y + q.h > a.y && q.y < b.y;

      }
      function startMarquee(at, additive) {
        mq = { sx: at.x, sy: at.y, el: null, base: additive ? selection.ids() : [], last: null };
      }
      function updateMarquee(pt) {
        if (!mq.el) {
          mq.el = document.createElement("div");
          mq.el.className = "marquee";
          document.body.appendChild(mq.el);
          hideHint();
          document.body.classList.add("selecting");
          getSelection().removeAllRanges();
          document.activeElement &&
            document.activeElement.blur &&
            document.activeElement.blur();
        }
        const x = Math.min(pt.x, mq.sx),
          y = Math.min(pt.y, mq.sy),
          w = Math.abs(pt.x - mq.sx),
          h = Math.abs(pt.y - mq.sy);
        Object.assign(mq.el.style, {
          left: x + "px",
          top: y + "px",
          width: w + "px",
          height: h + "px",

        const hits = marqueeHits(mq.r),
          next = [...new Set([...mq.base, ...hits])],
          key = next.join();
        if (key !== mq.last) {
          mq.last = key;
          setSel(next, next[next.length - 1] || null);
        }
      }
      /* the pointer was taken away mid-marquee (pointercancel): what was selected so far stays, the box goes */
      function cancelMarquee() {
        const m = mq;
        mq = null;
        document.body.classList.remove("selecting");
        if (m && m.el) m.el.remove();
      }
      function endMarquee() {
        const m = mq;
        mq = null;
        document.body.classList.remove("selecting");
        if (!m || !m.el) return;
        m.el.remove();
        if (selection.count() > 1)
          toast(
            selection.count() +
              " selected. ⌘G groups them, ⌘⇧G takes them out of their groups.",
          );
      }

      /* what a press landed on, in the order that matters. Not a pure question: the annotations get the first look and a
         press on one begins its drag (annotations.down), then the edge dot, the group's grip, a frame or a deck, then anything that is not the canvas */
      function classifyPress(e) {
        const t = e.target;
        const grabbed = annotations.down(t, { x: e.clientX, y: e.clientY });
        if (grabbed) return { kind: "annotation", prevent: !!grabbed.prevent };
        /* a press on any part of an annotation (a note's button, a connector chip, a caption) is not a press on the canvas */
        if (annotations.owns(t)) return { kind: "annotation", prevent: false };
        const port = t.closest(".port");
        if (port) return { kind: "port", id: port.closest(".col").dataset.id, side: port.dataset.side };
        const grip = t.closest(".grip");
        if (grip) return { kind: "grip", group: layout.groups.find((l) => l.id === grip.closest(".lane").id) };
        const col = t.closest(".col");
        if (col && !t.closest(".states,button,[contenteditable]"))
          return col.classList.contains("deck")
            ? { kind: "deck", group: groupOf(col.dataset.id) }
            : { kind: "frame", id: col.dataset.id };

        return { kind: "canvas" };
      }
      /* FlowPointer decides; these are the things it asks the page to do */
      const pointer = FlowPointer.create({
        stopPlay,
        hand: (on) => stage.classList.toggle("hand", on),
        camera: () => cam,
        moveCamera: (x, y) => {
          cam.x = x;
          cam.y = y;
          apply();
        },
        panStarted: () => {
          stage.classList.add("panning");
          hideHint();
          stage.classList.remove("fly");
        },
        panEnded: () => stage.classList.remove("panning"),
        gestureActive: () => gesture.active(),
        beginDrag,
        moveDrag: (pt) => gesture.move(toWorld(pt.x, pt.y)),
        endDrag,
        cancelDrag: () => gesture.cancel(),
        annotationDragging: () => annotations.dragging(),
        moveAnnotation: (pt) => annotations.move(pt, cam.k),
        endAnnotation: () => annotations.up(),
        cancelAnnotation: () => annotations.cancel(),
        startMarquee,
        moveMarquee: updateMarquee,
        endMarquee,
        cancelMarquee,
        startConnect,
        moveConnect: updateConnDrag,
        endConnect: endConnDrag,
      });
      stage.addEventListener("pointerdown", (e) => {
        const { prevent } = pointer.down({
          button: e.button,
          x: e.clientX,
          y: e.clientY,
          shift: e.shiftKey,
          hit: e.button === 0 ? classifyPress(e) : null,

      addEventListener("pointerup", () => pointer.up());
      addEventListener("pointercancel", () => pointer.cancel());

      stage.addEventListener(
        "click",
        (e) => {
          if (pointer.consumeMoved()) {
            e.stopPropagation();
            e.preventDefault();
          }
        },
        true,
      );
      stage.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          stopPlay();
          hideHint();
          stage.classList.remove("fly");
          if (e.ctrlKey || e.metaKey)
            zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.012));
          else {
            cam.x -= e.deltaX;
            cam.y -= e.deltaY;
            apply();
          }
        },
        { passive: false },
      );

      /* deck hover fans the cards */
      function fanGroup(id, on) {
        const L = layout.groups.find((l) => l.id === id);
        if (L)
          L.screens.forEach((s) => {
            const c = colOf(s);
            if (c) c.classList.toggle("fan", on && !gesture.active());
          });
      }
      world.addEventListener("pointerover", (e) => {
        const c = e.target.closest(".col.deck");
        if (c) {
          fanGroup(c.dataset.lane, true);
          return;
        }
        const h = e.target.closest(".ghead");
        if (h) {
          const L = layout.groups.find((l) => l.id === h.closest(".lane").id);
          if (L && !L.open) fanGroup(L.id, true);
        }
      });
      world.addEventListener("pointerout", (e) => {
        const c = e.target.closest(".col.deck");
        if (c) {
          const to =
            e.relatedTarget &&
            e.relatedTarget.closest &&
            e.relatedTarget.closest(".col.deck");
          if (!to || to.dataset.lane !== c.dataset.lane)
            fanGroup(c.dataset.lane, false);
          return;
        }
        const h = e.target.closest(".ghead");
        if (h) {
          const L = layout.groups.find((l) => l.id === h.closest(".lane").id);
          if (L && !(e.relatedTarget && h.contains(e.relatedTarget)))
            fanGroup(L.id, false);
        }
      });

      world.addEventListener("click", (e) => {
        const col = e.target.closest(".col");
        if (col && col.classList.contains("deck")) {
          const L = groupOf(col.dataset.id);
          if (L) setGroup(L.id, true);
          return;
        }
        if (col) {
          const id = col.dataset.id;
          if (e.shiftKey) {
            selection.toggle(id);
            return;
          }
          if (!(selection.count() > 1 && selection.has(id)) && selection.primary() !== id)
            select(id, false);
        }
        const hit = FrameDom.hit(e);
        if (hit) {
          /* the ripple and the product's own reactions, if the scan brought any */
          const { go: to } = FrameDom.tap(hit);
          /* a button that leads somewhere follows the connector that says so; no connector, no jump (a button
             that leads to its own screen has nowhere to go and needs none) */
          if (to && SCREENS[to]) {
            const from = hit.id;
            if (from === to || layout.conns.some((c) => c.from === from && c.to === to)) setTimeout(() => go(from, to), 180);
            else toast(`No connector from ${shortName(from)} to ${shortName(to)}. Draw one to follow this button.`);
          }
        }
        if (!col && !annotations.owns(e.target) && !e.target.closest(".ghead")) {
          select(null);
        }
      });
      world.addEventListener("dblclick", (e) => {
        const col = e.target.closest(".col");
        if (
          col &&
          !col.classList.contains("deck") &&
          /* .cap is not part of captionKind.owns on purpose: a press on a caption's padding still drags the frame */
          !e.target.closest(".states,.cap") &&
          !FrameDom.interactive(FrameDom.hit(e)) &&
          !annotations.owns(e.target)
        )
          select(col.dataset.id, true);
      });

      /* states: a switchable frame shows one state at a time, from the state's own render */
      const stateLabel = (id) => `${FrameDom.shownStates(id).length} states · ${esc(SCREENS[id].states[FrameDom.stateIndex(id)].name)}`;
      function setState(id, i) {
        if (!FrameDom.setState(id, i)) return;
        const b = colOf(id) && colOf(id).querySelector(".states");
        if (b) b.innerHTML = stateLabel(id);
      }

      /* ======================================================================
   CHROME: menus, pager, keys
   ====================================================================== */
      const menus = {
        space: $("#mSpace"),
        views: $("#mViews"),
        add: $("#mAdd"),
        group: $("#mGroup"),
      };
      function menu(n) {
        Object.entries(menus).forEach(([k, el]) =>
          el.classList.toggle(
            "open",
            k === n && !el.classList.contains("open"),
          ),
        );
      }
      function closeMenus() {
        Object.values(menus).forEach((m) => m.classList.remove("open"));
      }
      $("#btnTidy").onclick = (e) => {
        e.stopPropagation();
        closeMenus();
        tidy();
      };
      $("#btnSpace").onclick = (e) => {
        e.stopPropagation();
        menu("space");
      };
      $("#btnViews").onclick = (e) => {
        e.stopPropagation();
        buildViews();
        menu("views");
      };
      $("#btnAdd").onclick = (e) => {
        e.stopPropagation();
        menu("add");
      };
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".menu")) closeMenus();
      });
      function buildViews() {
        $("#mViews").innerHTML =
          `<button class="mi" data-view="all"><svg><use href="#i-frame"/></svg>Overview<span class="k">1</span></button>` +
          layout.groups.filter((l) => l.screens.length)
            .map(
              (l, i) =>
                `<button class="mi" data-view="${esc(l.id)}"><svg><use href="#i-frame"/></svg>${esc(groupName(l))}<span class="k">${i < 3 ? i + 2 : ""}</span></button>`,
            )
            .join("");
        $("#mViews")
          .querySelectorAll("[data-view]")
          .forEach(
            (b) =>
              (b.onclick = () => {
                view(b.dataset.view);
                closeMenus();
              }),
          );
      }
      menus.space.querySelectorAll("[data-hide]").forEach(
        (b) =>
          (b.onclick = (e) => {
            e.stopPropagation();
            const on = b.classList.toggle("on");
            document.body.classList.toggle("hide-" + b.dataset.hide, !on);
          }),
      );
      document.querySelectorAll(".menu [data-a]").forEach((b) =>
        b.addEventListener("click", () => {
          const a = b.dataset.a;
          closeMenus();
          if (a === "note") newNote();
          if (a === "group") groupSel();
          if (a === "tidy") tidy();
          if (a === "resetlayout") resetLayout();
          if (a === "resetann") resetAnn();
          if (a === "rescan")
            toast(`${SCAN.product.name}: ${ORDER.length} screens in this scan. Regenerate the canvas to rescan.`);
          if (a === "route") toast("Pick a route to render it on the canvas");
        }),
      );
      function newNote() {
        const wx = (innerWidth / 2 - cam.x) / cam.k - 98,
          wy = (innerHeight / 2 - cam.y) / cam.k - 50,
          f = homeFor(wx + 98, wy + 50);
        createNote(f ? { frame: f, local: localFrom(f, wx, wy) } : { world: [Math.round(wx), Math.round(wy)] });
      }
      const step = (d) => {
        const i = selection.primary() ? ORDER.indexOf(selection.primary()) : -1;
        stopPlay();
        select(ORDER[clamp(i + d, 0, ORDER.length - 1)], true);
      };
      $("#next").onclick = () => step(1);
      $("#prev").onclick = () => step(-1);
      $("#zoom").onclick = () => view("all");
      $("#btnSearch").onclick = () => {
        const st = panel.state();
        if (st.open && st.mode === "search") panel.close();
        else openSearch();
      };
      let tt;
      function toast(m) {
        const t = $("#toast");
        t.textContent = m;
        t.classList.add("show");
        clearTimeout(tt);
        tt = setTimeout(() => t.classList.remove("show"), 2800);
      }

      /* Delete and the arrow keys on an annotation: one handler for every kind, ahead of the others */
      addEventListener(
        "keydown",
        (e) => {
          if (!e.target.closest) return; /* the document itself */
          /* Cmd/Ctrl/Alt + arrow belongs to the browser (back, forward), not to a note */
          if ((e.metaKey || e.ctrlKey || e.altKey) && e.key.startsWith("Arrow")) return;
          if (annotations.keyDown(e.target, e.key, { shift: e.shiftKey })) {
            e.preventDefault();
            e.stopPropagation();
          }
        },
        true,
      );
      addEventListener("keydown", (e) => {
        const typing = e.target.closest?.("input,select,[contenteditable]");
        const mod = e.metaKey || e.ctrlKey;
        if (mod && e.key.toLowerCase() === "k") {
          e.preventDefault();
          openSearch();
          return;
        }
        if (!typing && mod && e.key.toLowerCase() === "g") {
          e.preventDefault();
          if (e.shiftKey) removeSel();
          else groupSel();
          return;
        }
        if (!typing && mod && e.key.toLowerCase() === "z" && !e.shiftKey) {
          e.preventDefault();
          undo();
          return;
        }
        if (!typing && mod && e.key.toLowerCase() === "a") {
          e.preventDefault();
          const ids = ORDER.filter((id) => geo.place(id) && !geo.place(id).deck);
          setSel(ids, ids[ids.length - 1] || null);
          toast(ids.length + " frames selected");
          return;
        }
        if (
          e.code === "Space" &&
          !typing &&
          !(
            e.target.closest && e.target.closest("button,select,input,textarea")
          )
        ) {
          e.preventDefault();
          pointer.space(true);
          return;
        }
        if (e.key === "Escape") {
          if (pointer.cancelConnect()) return;
          if (selection.conn()) {
            selection.clearConn();
            return;
          }
          if (pointer.cancelDrag()) {
            e.preventDefault();
            return;
          }
          if (panel.clearSweep()) return;
          if (typing) e.target.blur();
          closeMenus();
          stopPlay();
          if (panel.state().open) panel.close();
          else if (selection.count()) select(null);
          return;
        }
        if (typing) return;
        if (e.key === "c" && selection.count() > 1) {
          connectSel();
          return;
        }
        if (e.key === "h") setHand(true);
        if (e.key === "v") setHand(false);
        if (e.key === "a") toggleAll();
        if (e.key === "l") tidy();
        const device = FlowDevice.idForKey(e.key);
        if (device) setDevice(device);
        if (e.key === "1") view("all");
        if (e.key === "2" && layout.groups[0]) view(layout.groups[0].id);
        if (e.key === "3" && layout.groups[1]) view(layout.groups[1].id);
        if (e.key === "4" && layout.groups[2]) view(layout.groups[2].id);
        if (e.key === "ArrowRight") {
          step(1);
          e.preventDefault();
        }
        if (e.key === "ArrowLeft") {
          step(-1);
          e.preventDefault();
        }
        if (e.key === "f" && selection.primary()) focusScreen(selection.primary());
        if (e.key === "i") {
          panel.open("inspect", selection.primary());
        }
        if (e.key === "n") {
          e.preventDefault();
          newNote();
        }
        if (e.key === "=" || e.key === "+")
          zoomAt(innerWidth / 2, innerHeight / 2, 1.2);
        if (e.key === "-") zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.2);
        if (e.key === "/") {
          e.preventDefault();
          openSearch();
        }
      });
      addEventListener("keyup", (e) => {
        if (e.code === "Space") pointer.space(false);
      });
      addEventListener("blur", () => pointer.blur());
      let resizeT;
      addEventListener("resize", () => {
        updateBars();
        /* the panel may have turned into a sheet or back: keep what is selected in the room that is left */
        clearTimeout(resizeT);
        resizeT = setTimeout(() => {
          if (panel.state().open && selection.primary()) focusScreen(selection.primary());
        }, 120);
      });

      /* ======================================================================
   OPEN / CLOSE ALL GROUPS
   ====================================================================== */
      function updateAllBtn() {
        const b = $("#btnAll");
        if (!b) return;
        /* what is drawn: a group a drag has emptied does not count */
        const L = gesture.view().groups.filter((g) => g.screens.length),
          all = L.length > 0 && L.every((g) => g.open);
        b.querySelector("span").textContent = all ? "Close all" : "Open all";
        b.querySelector("use").setAttribute(
          "href",
          all ? "#i-collapse" : "#i-expand",
        );
        b.title = (all ? "Close" : "Open") + " all groups (A)";
        b.disabled = !L.length;
      }
      function toggleAll() {
        stopPlay();
        const L = layout.groups.filter((l) => l.screens.length);
        if (!L.length) return;
        const open = !L.every((l) => l.open);
        if (!open && selection.ids().some((i) => groupOf(i))) select(null);
        commit(() => layout.setOpen(L.map((l) => l.id), open));
        fly(fitRect(geo.bounds(), 40, 1.1));
      }

      /* ======================================================================
   DEVICE: same scan, same flows, rendered at another viewport
   ====================================================================== */
      let switching = false;
      async function setDevice(id) {
        if (id === DEV.id || switching) return;
        switching = true;
        stopPlay();
        closeMenus();
        const sel = selection.ids(),
          prim = selection.primary();
        world.style.transition = "opacity .18s";
        world.style.opacity = 0;
        await sleep(200);
        document.body.classList.add("boot");
        applyDevice(id);
        buildWorld();
        setSel(sel, prim);
        FrameDom.clearSpot();
        repaintPanel(); /* the new world is drawn from the panel's own word: the sweep, and the screen it shows */
        if (prim) {
          const q = geo.screenRect(prim);
          cam = fitRect(
            { x: q.x - 30, y: q.y - 40, w: q.w + 60, h: q.h + 70 },
            30,
            1.6,
          );
        } else cam = fitRect(geo.bounds(), 30);
        stage.classList.remove("fly");
        apply();
        await sleep(80);
        document.body.classList.remove("boot");
        world.style.opacity = 1;
        await sleep(240);
        world.style.transition = "";
        switching = false;
        toast(DEV.label + " · " + DEV.vp);
      }
      /* one button per device, from its description */
      FlowDevice.ids().forEach((id) => {
        const d = FlowDevice.describe(id),
          b = document.createElement("button");
        b.dataset.dev = id;
        b.title = d.title;
        b.innerHTML = `<svg><use href="#${d.icon}" /></svg>`;
        b.onclick = () => setDevice(id);
        $("#devsw").appendChild(b);
      });
      $("#btnAll").onclick = toggleAll;

      /* ======================================================================
   BOOT
   ====================================================================== */
      function labelUi() {
        document.querySelectorAll("button[title]").forEach((b) => {
          if (!b.getAttribute("aria-label"))
            b.setAttribute(
              "aria-label",
              b.title.replace(/\s*\([^)]*\)\s*$/, ""),
            );
        });
        $("#seltb").setAttribute("role", "toolbar");
        $("#seltb").setAttribute("aria-label", "Selected frames");
        $("#devsw").setAttribute("role", "group");
        $("#devsw").setAttribute("aria-label", "Device size");
        $("#toast").setAttribute("role", "status");
        $("#toast").setAttribute("aria-live", "polite");
        $("#panel").setAttribute("role", "complementary");
        paintPanel(panel.state(), {}); /* the landmark's label is the panel's to say */
      }
      function boot() {
        labelUi();
        $("#productName").textContent = SCAN.product.name;
        $("#rescanFacts").textContent = SCAN.product.name;
        $("#productFacts").textContent =
          ORDER.length + " screens" + (SCAN.product.scanned ? " · scanned " + SCAN.product.scanned : "");
        document.body.classList.add("boot");
        applyDevice(FlowDevice.ids()[0]);
        buildWorld();
        cam = fitRect(geo.bounds(), 30);
        apply();
        if (SCAN.start) select(SCAN.start, false);
        requestAnimationFrame(() =>
          requestAnimationFrame(() => document.body.classList.remove("boot")),
        );
      }
      (document.fonts && document.fonts.ready
        ? document.fonts.ready
        : Promise.resolve()
      ).then(boot);
    </script>
  </body>
</html>
