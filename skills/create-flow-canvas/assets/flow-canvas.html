    <script id="layout-module">
      /* ======================================================================
         LAYOUT MODULE
         Owns the persisted layout: groups (saved as "lanes"), positions per device, connectors,
         scanner-card state and notes, plus the id counters and the undo history. It knows nothing about
         the page: no DOM, no screens, no demo data. Everything it needs is handed to create().
      
         A group is { id, screens, open, title, sub, subOn }: its frames, whether it is fanned out, its
         title (the text before a colon is its name), its description, and whether the description is
         shown. The text belongs to the group, so it is saved, snapshotted, undone and reset with it, and
         is gone when the group is. Frame captions are not part of the layout.

         Interface
           const layout = FlowLayout.create({ key, storage, hasScreen, defaults, legacyGroupText? })
             key        localStorage key the layout is saved under
             storage    anything with getItem(key) / setItem(key, value)
             hasScreen  (id) => boolean, so saved layouts drop frames that no longer exist
             defaults   () => { lanes, pos, conns, scans?, notes }, called for a fresh copy each time;
                        a default group may carry title, sub and subOn (blank when it does not)
             legacyGroupText  () => { [groupId]: { title, sub, on } }, the group text an older build kept
                        elsewhere. Read once at load, only for groups that were saved without text, then
                        saved into the layout. Optional; a throwing reader is ignored.
           FlowLayout.groupName(group)   the short name: the title before its first colon, or
                                         "Untitled group". Pure; never changes the group.
           layout.lanes layout.pos layout.conns layout.scans layout.notes
                      Live state. Read through layout every time, never keep your own reference:
                      restore, undo and reset swap the arrays and objects for new ones.
           layout.newGroup(screens)  a blank, open group with the next id ("g4"), not yet in layout.lanes
           layout.resetGroupText()   every group's title, description and visibility back to the scanned
                                     text (blank for a group that was not scanned); the caller commits it
           layout.save()           write to storage. FlowCommit calls it after every edit; restore and reset
                             save by themselves.
           layout.snapshot()       the persisted kinds as an opaque string; equal state, equal string
           layout.restore(s)       put a snapshot back and save. Two things are not restored: the counters
                             (they never fall below an id the snapshot brings back) and the open state
                             of groups that still exist (view state, not an edit).
           layout.reset()          back to the defaults, counters included, and save
           layout.nextId("c"|"g")  the next connector / group id, "c7" / "g4"
           layout.mark(s?)         push s (default: a snapshot now) on the undo history, 40 deep (FlowCommit
                             is its caller)
           layout.undo()           restore the latest mark; false when there is none
      
         A new persisted kind is added here, in persisted() and load(), and nowhere else.
         ====================================================================== */
      var FlowLayout = (function () {
        "use strict";
        const MAX_UNDO = 40;
        /* id prefix -> the field the counter is saved in */
        const COUNTER_FIELD = { c: "cc", g: "gc" };
        const clone = (o) => JSON.parse(JSON.stringify(o));
        const BLANK_TEXT = { title: "Untitled group", sub: "", subOn: false };
        /* the short name of a group: its title up to the first colon */
        const groupName = (g) => String((g && g.title) || "").split(":")[0].trim() || BLANK_TEXT.title;
        /* what is persisted of a group; text a group does not have yet is blank */
        const groupRecord = (g) => ({
          id: g.id,
          screens: g.screens,
          open: g.open,
          title: typeof g.title === "string" ? g.title : BLANK_TEXT.title,
          sub: typeof g.sub === "string" ? g.sub : BLANK_TEXT.sub,
          subOn: g.subOn === true,
        });
        /* the highest number among ids like "c12": ids are never handed out twice */
        function highestId(list, prefix) {
          let top = 0;
          (list || []).forEach((x) => {
            const m = x && typeof x.id === "string" && x.id.startsWith(prefix) && /^\d+$/.test(x.id.slice(prefix.length));
            if (m) top = Math.max(top, Number(x.id.slice(prefix.length)));
          });
          return top;
        }

        function create({ key, storage, hasScreen, defaults, legacyGroupText }) {
          const layout = {};
          let history = [];
          let counters = { c: 0, g: 0 };

          function freshDefaults() {
            const d = clone(defaults());
            return {
              lanes: d.lanes.map(groupRecord),
              pos: d.pos,
              conns: d.conns,
              scans: d.scans || {},
              notes: d.notes,
            };
          }
          /* the scanned text of a group, or blank when it is not a scanned group */
          const scannedText = (id) => {
            const l = defaults().lanes.find((x) => x.id === id);
            const { title, sub, subOn } = l ? groupRecord(l) : BLANK_TEXT;
            return { title, sub, subOn };
          };
          /* text an older build kept outside the layout: the fields that are usable, or null. Any field it
             lacks keeps the scanned text, as the old loader merged it onto the defaults. */
          function legacyText() {
            try {
              const all = (legacyGroupText && legacyGroupText()) || {};
              return (id) => {
                const e = all[id];
                if (!e || typeof e !== "object") return null;
                const out = {};
                if (typeof e.title === "string") out.title = e.title;
                if (typeof e.sub === "string") out.sub = e.sub;
                if (typeof e.on === "boolean") out.subOn = e.on;
                return Object.keys(out).length ? out : null;
              };
            } catch (e) {
              return () => null;
            }
          }
          const startCounters = (d) => ({ c: highestId(d.conns, "c"), g: highestId(d.lanes, "g") });
          function adopt(state) {
            layout.lanes = state.lanes;
            layout.pos = state.pos;
            layout.conns = state.conns;
            layout.scans = state.scans;
            layout.notes = state.notes;
          }
          /* what is saved and snapshotted: lanes keep id, screens and open; the page keeps its own
             geometry on the same objects (x, top, pinned, el) and none of it is persisted */
          const persisted = () => ({
            lanes: layout.lanes.map(groupRecord),
            pos: layout.pos,
            conns: layout.conns,
            scans: layout.scans,
            notes: layout.notes,
          });

          function load() {
            const d = freshDefaults();
            const start = startCounters(d);
            const legacy = legacyText();
            let migrated = false;
            const fallBack = () => {
              /* no layout yet: the user's old group text, if there is any, goes onto the default groups */
              d.lanes.forEach((l) => {
                const old = legacy(l.id);
                if (old) {
                  Object.assign(l, old);
                  migrated = true;
                }
              });
              adopt(d);
              counters = start;
              if (migrated) layout.save();
            };
            let st = null;
            try {
              st = JSON.parse(storage.getItem(key) || "null");
            } catch (e) {}
            if (!st || !Array.isArray(st.lanes)) return fallBack();
            try {
              const seen = new Set(),
                lanes = [];
              st.lanes.forEach((l) => {
                const sc = ((l && l.screens) || []).filter((id) => hasScreen(id) && !seen.has(id));
                sc.forEach((id) => seen.add(id));
                if (!sc.length) return;
                const g = { id: l.id, screens: sc, open: !!l.open };
                if (typeof l.title === "string") Object.assign(g, groupRecord({ ...l, screens: sc, open: g.open }));
                else {
                  /* saved before groups carried their text: the old annotations, else the scanned text */
                  Object.assign(g, scannedText(l.id), legacy(l.id));
                  migrated = true;
                }
                lanes.push(g);
              });
              const out = {
                lanes,
                pos: Object.assign(d.pos, st.pos || {}),
                conns: Array.isArray(st.conns)
                  ? st.conns.filter((c) => c && hasScreen(c.from) && hasScreen(c.to) && c.from !== c.to)
                  : d.conns,
                scans: st.scans && typeof st.scans === "object" ? st.scans : d.scans,
                notes: Array.isArray(st.notes)
                  ? st.notes.filter((n) => n && n.id && typeof n.text === "string")
                  : d.notes,
              };
              adopt(out);
              counters = {
                c: Math.max(Number(st.cc) || start.c, highestId(out.conns, "c")),
                g: Math.max(Number(st.gc) || start.g, highestId(out.lanes, "g")),
              };
              if (migrated) layout.save();
            } catch (e) {
              fallBack();
            }
          }

          layout.save = () => {
            try {
              storage.setItem(
                key,
                JSON.stringify(Object.assign(persisted(), { cc: counters.c, gc: counters.g })),
              );
            } catch (e) {}
          };
          layout.snapshot = () => JSON.stringify(persisted());
          layout.restore = (s) => {
            const st = JSON.parse(s);
            /* open or closed is view state: a group still here keeps how it is shown now */
            const shown = new Map(layout.lanes.map((l) => [l.id, l.open]));
            st.lanes.forEach((l) => shown.has(l.id) && (l.open = shown.get(l.id)));
            adopt({
              lanes: st.lanes.map(groupRecord),
              pos: st.pos,
              conns: st.conns || layout.conns,
              scans: st.scans || {},
              notes: st.notes || layout.notes,
            });
            /* ids that came back with the snapshot must not be handed out again */
            counters = {
              c: Math.max(counters.c, highestId(layout.conns, "c")),
              g: Math.max(counters.g, highestId(layout.lanes, "g")),
            };
            layout.save();
          };
          layout.reset = () => {
            const d = freshDefaults();
            adopt(d);
            counters = startCounters(d);
            layout.save();
          };
          layout.newGroup = (screens) => ({ id: layout.nextId("g"), screens, open: true, ...BLANK_TEXT });
          layout.resetGroupText = () => layout.lanes.forEach((l) => Object.assign(l, scannedText(l.id)));
          layout.nextId = (kind) => {
            if (!COUNTER_FIELD[kind]) throw new Error("FlowLayout.nextId: unknown kind " + kind);
            counters[kind] += 1;
            return kind + counters[kind];
          };
          layout.mark = (s) => {
            history.push(s || layout.snapshot());
            if (history.length > MAX_UNDO) history.shift();
          };
          layout.undo = () => {
            const s = history.pop();
            if (!s) return false;
            layout.restore(s);
            return true;
          };

          load();
          return layout;
        }

        return { create, groupName };
      })();
    </script>

    <script id="commit-module">
      /* ======================================================================
         COMMIT MODULE
         The one place that decides what happens after an edit to the layout: the undo point, the save,
         and which parts of the page are redrawn, in a fixed order. Callers say what changed, not how
         to finish. It knows nothing about the DOM: the page hands it the redraw functions.

         Interface
           const commit = FlowCommit.create({ layout, redraw })
             layout  a FlowLayout
             redraw  { world, layout, scans, notes, conns }, one function each, all required
           commit(change, { redraw, undo })
             Runs change(), returns its result. If the layout is now different: marks the state before
             as one undo step, saves, then redraws what was asked for. If nothing changed, nothing
             happens. A commit inside a change joins the outer one.
               redraw  "all" (layout, scans, notes, conns) or a list of kinds; default none.
                       Always drawn in this order: world, layout, scans, notes, conns.
               undo    false for edits that are saved and redrawn but are not undo steps (folding a group)
             Only the outermost commit decides: a commit inside another one can add redraws, but its own
             undo option and since() are ignored.
           commit.since(before, { redraw, undo })
             For a drag: the change already happened live, `before` is layout.snapshot() from the start.
             Marks and saves only if something changed, but always redraws.
           commit.undo(afterRestore)
             Undoes one step, runs afterRestore() (the page's own clean-up), redraws everything.
             Returns false when there is nothing to undo.
         ====================================================================== */
      var FlowCommit = (function () {
        "use strict";
        const ORDER = ["world", "layout", "scans", "notes", "conns"];
        const ALL = ORDER.filter((k) => k !== "world");

        function create({ layout, redraw }) {
          ORDER.forEach((k) => {
            if (typeof redraw[k] !== "function") throw new Error('FlowCommit: missing redraw function for "' + k + '"');
          });
          /* the kinds a caller asked for, checked, so a typo fails before anything is changed */
          const kindsOf = (kinds) => {
            const list = kinds === "all" ? ALL : kinds || [];
            list.forEach((k) => {
              if (!ORDER.includes(k)) throw new Error('FlowCommit: unknown redraw kind "' + k + '"');
            });
            return list;
          };
          const redrawInOrder = (kinds) => ORDER.filter((k) => kinds.includes(k)).forEach((k) => redraw[k]());
          let running = null; /* the outer commit's pending redraws while its change runs */

          /* the tail every edit shares: undo point, save, redraw. Nothing changed, nothing to record;
             a live gesture (alwaysRedraw) still redraws, because it moved things on screen. */
          function finish(before, opts, kinds, alwaysRedraw) {
            if (layout.snapshot() === before) {
              if (alwaysRedraw) redrawInOrder(kinds);
              return;
            }
            if (opts.undo !== false) layout.mark(before);
            layout.save();
            redrawInOrder(kinds);
          }
          function commit(change, opts = {}) {
            const kinds = kindsOf(opts.redraw);
            if (running) {
              kinds.forEach((k) => running.add(k));
              return change();
            }
            const before = layout.snapshot();
            running = new Set(kinds);
            let result, wanted;
            try {
              result = change();
            } finally {
              wanted = [...running];
              running = null;
            }
            finish(before, opts, wanted, false);
            return result;
          }
          commit.since = (before, opts = {}) => finish(before, opts, kindsOf(opts.redraw), true);
          commit.undo = (afterRestore) => {
            if (!layout.undo()) return false;
            if (afterRestore) afterRestore();
            redrawInOrder(ALL);
            return true;
          };
          return commit;
        }
        return { create };
      })();
    </script>

    <script id="annotations-module">
      /* ======================================================================
         ANNOTATIONS MODULE
         What notes, scanner cards and connectors share: one drag (threshold, zoom scale, cancel), one
         keyboard move (arrow keys, bursts count as one undo step), one delete, and one "is this an
         annotation" check. Each kind brings an adapter for what is its own: finding itself in the DOM,
         showing and saving a position, cleaning up. The module never touches the DOM and saves only
         through FlowCommit, so every move and delete is one undoable commit.

         Interface
           const annotations = FlowAnnotations.create({ commit, kinds, threshold, clock })
             commit     a FlowCommit
             kinds      adapters, see below
             threshold  screen px before a press becomes a drag (default 4)
             clock      () => ms, for the keyboard burst (default Date.now)
           annotations.owns(target)             any kind recognises target as its own
           annotations.down(target, {x, y})     null, or { prevent } when a movable annotation was grabbed
           annotations.dragging()               a grab is in progress (pressed, moved or not)
           annotations.move({x, y}, k)          pointer moved; k is the zoom, so places follow in world units
           annotations.up()                     { moved } or null; saves a drag, or taps if it never moved
           annotations.cancel()                 the pointer was taken away: put the item back, save nothing
           annotations.keyDown(target, key, {shift})   true when handled: Delete/Backspace, arrow keys
           annotations.remove(kindName, item)   the same removal, for a × button

         Adapter. Only name is required; the rest depends on what the kind does, and create() refuses a
         movable kind that is missing origin, place or save.
           name
           owns(target)               is target part of this kind (a kind without it is not part of owns())
           movable, preventDefault    can it be grabbed and moved; should the page preventDefault on press
           match(target, how)         the item, or null. how is "pointer", "nudge" or "delete".
                                      The same item must come back as the same object (a DOM element does).
           origin(item) -> {x, y}     where it is now, in the units place() takes
           lift(item)                 a drag began
           place(item, pos)           show it at pos while it moves (DOM only)
           save(item, pos, {nudged})  the data change for a move, run inside a commit. nudged is true for an
                                      arrow-key move, so a note can move in place instead of re-homing.
           settle(item, {moved, cancelled, nudged})   DOM clean-up, after the commit and its redraws
           tap(item)                  pressed and released without moving
           erase(item)                the data change for a delete, run inside a commit (needed to be deletable)
           erased(item)               DOM clean-up and message after a delete
           redraw                     FlowCommit kinds to redraw after a save or an erase (default none)

         One order throughout: the data change, then the commit's undo point and save, then its redraws,
         then settle()/erased(). The drag threshold is 4 screen px for every kind (notes used 3).
         ====================================================================== */
      var FlowAnnotations = (function () {
        "use strict";
        const ARROWS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
        const NUDGE = 8,
          NUDGE_BIG = 32,
          BURST_MS = 600;

        function create({ commit, kinds, threshold = 4, clock = Date.now }) {
          kinds.forEach((k) => {
            if (!k.name) throw new Error("FlowAnnotations: every kind needs a name");
            if (k.movable)
              for (const need of ["origin", "place", "save"])
                if (typeof k[need] !== "function") throw new Error('FlowAnnotations: "' + k.name + '" is movable but has no ' + need);
          });
          const redrawOf = (kind) => kind.redraw || [];
          let grab = null;
          let burst = null; /* the arrow-key burst in progress: { item, at } */
          const find = (target, how) => {
            for (const kind of kinds) {
              const item = kind.match && kind.match(target, how);
              if (item) return { kind, item };
            }
            return null;
          };
          function erase(kind, item) {
            commit(() => kind.erase(item), { redraw: redrawOf(kind) });
            if (kind.erased) kind.erased(item);
          }
          return {
            /* does any kind recognise this target as one of its own? Lets the page keep one list of
               "not canvas background" instead of one per handler */
            owns: (target) => kinds.some((k) => k.owns && k.owns(target)),
            /* a × button, or any other way a kind has of asking to be removed */
            remove(name, item) {
              const kind = kinds.find((k) => k.name === name);
              if (!kind) throw new Error('FlowAnnotations: unknown annotation kind "' + name + '"');
              erase(kind, item);
            },
            down(target, pt) {
              const f = find(target, "pointer");
              if (!f || !f.kind.movable) return null;
              burst = null; /* a new gesture: the next arrow press starts a new undo step */
              const origin = f.kind.origin(f.item);
              grab = { ...f, start: pt, origin, pos: origin, moved: false };
              return { prevent: !!f.kind.preventDefault };
            },
            dragging: () => !!grab,
            move(pt, k = 1) {
              if (!grab) return;
              const dx = pt.x - grab.start.x,
                dy = pt.y - grab.start.y;
              if (!grab.moved) {
                if (Math.hypot(dx, dy) < threshold) return;
                grab.moved = true;
                if (grab.kind.lift) grab.kind.lift(grab.item);
              }
              grab.pos = { x: grab.origin.x + dx / k, y: grab.origin.y + dy / k };
              grab.kind.place(grab.item, grab.pos);
            },
            up() {
              const g = grab;
              grab = null;
              if (!g) return null;
              if (g.moved) commit(() => g.kind.save(g.item, g.pos, {}), { redraw: redrawOf(g.kind) });
              else if (g.kind.tap) g.kind.tap(g.item);
              if (g.kind.settle) g.kind.settle(g.item, { moved: g.moved });
              return { moved: g.moved };
            },
            /* arrow keys move the focused item; a quick burst on one item is a single undo step */
            keyDown(target, key, mods = {}) {
              if (key === "Delete" || key === "Backspace") {
                const f = find(target, "delete");
                if (!f) return false;
                erase(f.kind, f.item);
                return true;
              }
              const dir = ARROWS[key];
              if (!dir) return false;
              const f = find(target, "nudge");
              if (!f || !f.kind.movable) return false;
              const by = mods.shift ? NUDGE_BIG : NUDGE;
              const at = f.kind.origin(f.item);
              const pos = { x: at.x + dir[0] * by, y: at.y + dir[1] * by };
              f.kind.place(f.item, pos);
              const now = clock();
              const first = !burst || burst.item !== f.item || now - burst.at >= BURST_MS;
              if (first) burst = { item: f.item, at: now };
              commit(() => f.kind.save(f.item, pos, { nudged: true }), { undo: first, redraw: redrawOf(f.kind) });
              if (f.kind.settle) f.kind.settle(f.item, { moved: true, nudged: true });
              return true;
            },
            /* the pointer was taken away (not released): put it back, save nothing */
            cancel() {
              const g = grab;
              grab = null;
              if (!g) return false;
              if (g.moved) g.kind.place(g.item, g.origin);
              if (g.kind.settle) g.kind.settle(g.item, { moved: false, cancelled: true });
              return true;
            },
          };
        }
        return { create };

      function createNote({ text = "New note", frame = null, local = null, world = null }) {

        name: "scan",

        },

      /* captions (titles and descriptions) are typed in place and live in their own store: they only

      const captionKind = { name: "caption", owns: (t) => !!t.closest("[data-f],.cx,.cadd") };
      const annotations = FlowAnnotations.create({ commit, kinds: [noteKind, scanKind, linkKind, captionKind] });
      const laneOf = (id) => layout.lanes.find((l) => l.id && l.screens.includes(id));

      const colOf = (id) => document.querySelector(`.col[data-id="${id}"]`);

                d: (n - 1 - i) * 40,

                fy: -10 * i,

        ORDER.filter(isFree).forEach((id) => {
          let p = P[id];

            k++;
          }
          FR[id] = {
            x: p.x,
            y: p.y,
            r: 0,
            d: 0,

      }
      function applyFrames() {
        ORDER.forEach((id) => {

            st = col.style;

            st.setProperty("--y", f.y + "px");

          st.setProperty("--r", f.r + "deg");
          st.setProperty("--d", f.d + "ms");
          st.setProperty("--z", f.z);

        });
      }

      /* a group's own objects: headline, standfirst, edges between consecutive frames */
      function makeLane(L) {
        const el = document.createElement("section");
        el.className = "lane";
        el.id = L.id;
        el.innerHTML = `<div class="ghead">
      <div class="gt"><button class="grip" title="Drag to move this group" aria-label="Drag to move group"><svg><use href="#i-grip"/></svg></button><button class="chev" title="Open or close this group" aria-label="Open or close group"><svg><use href="#i-chevup"/></svg></button><h2 class="gtitle" contenteditable="${CE}" spellcheck="false" data-k="${L.id}" data-f="title" data-ph="Name this group" role="textbox" aria-label="Group name">${esc(L.title)}</h2></div>
      ${gsubHTML(L)}
      <div class="gs"><span class="gcount"></span><span class="gmeta"></span><button class="fplay" title="Play flow"><svg><use href="#i-play"/></svg><span>Play flow</span></button><button class="fmore" title="Group options" aria-label="Group options"><svg><use href="#i-more"/></svg></button></div>
    </div>
    <div class="content"><div class="dz"></div></div>`;
        world.insertBefore(el, notesEl);
        el.querySelector(".ghead").addEventListener("click", (e) => {
          e.stopPropagation();
          const Lc = layout.lanes.find((l) => l.id === el.id);
          if (!Lc) return;
          if (e.target.closest(".grip")) return;
          if (e.target.closest(".fmore")) {

      }
      function sizeDz(L, extra) {
        const dz = L.el.querySelector(".dz"),
          n = L.screens.length;
        if (L.open) {
          const w = Math.max(1, n) * (COL_W + GAP) - GAP;
          Object.assign(dz.style, {
            left: "-28px",
            top: "-34px",
            width: w + 56 + "px",
            height: PH_TOP + PH_H + CAP + 60 + "px",

          Object.assign(dz.style, {
            left: "-34px",
            top: -HEAD - 14 + "px",
            width: DECK_W + PEEK_X * Math.max(n - 1, 0) + 68 + "px",
            height: COLL_H + 10 + "px",

        }
      }
      /* the group's title and description as the layout has them (after an undo, a reset, a load); the field
         being typed in is left alone */
      function showGroupText(L) {
        const put = (sel, text) => {
          const f = L.el.querySelector(sel);
          if (f !== document.activeElement && f.textContent !== text) f.textContent = text;
        };
        put(".gtitle", L.title);
        put(".gsub", L.sub);
        L.el.querySelector(".gsubw").classList.toggle("off", !L.subOn);
      }
      function syncLanes() {
        const ids = new Set(layout.lanes.map((l) => l.id));

          let el = document.getElementById(L.id);

      /* ---------- scanner findings: a card tied to its frame by a leader; drag it, dismiss it ---------- */
      /* default: leave the frame's bottom edge, slip between frame and caption, run down the gutter and land on the card.
         once the card has been moved: a smooth curve from the same dock to the nearest side of the card */
      function leaderGeom(left, top, w, h, moved) {
        const fr = PH_TOP + PH_H,
          x0 = COL_W - 62,
          right = left + w;
        if (!moved) {
          const yRun = fr + 24,
            runX = COL_W + 22,
            midY = top + 26,
            toTop = runX <= right - 14,
            lead = `M${x0} ${fr}V${fr + 10}Q${x0} ${yRun} ${x0 + 14} ${yRun}H${runX - 14}Q${runX} ${yRun} ${runX} ${yRun + 14}`;
          return {
            x0,
            y0: fr,
            d: toTop
              ? `${lead}V${top}`

            end: toTop ? [runX, top] : [right, midY],

          nB = { nx: -1, ny: 0 };
        } else if (right <= 4) {
          T = [right, top + h / 2];
          nB = { nx: 1, ny: 0 };
        } else {
          T = [clamp(x0, left + 18, right - 18), top + h];
          nB = { nx: 0, ny: 1 };

        return { x0, y0: fr, d: rounded(pts, 12), end: T };
      }
      function buildScan(col, sc) {
        const rec = layout.scans[sc.key];

            st.remove();
            d.remove();

          },
          dragged: () => {

          e.stopPropagation(); /* a click on the finding is not a click on the frame behind it */
          if (justDragged) return;
          if (e.target.closest(".sx")) return dismiss();
          const h = e.target.closest(".hop");
          if (h && h.dataset.to) select(h.dataset.to, true);

        });
      }
      function refreshScans() {

      }

      /* frames */
      function makeCol(id) {

          col = document.createElement("div");

    <div class="pwrap">${id === "s3" ? '<div class="stack b"></div><div class="stack a"></div>' : ""}<div class="phone ${DEV.cls}" id="p-${id}">${PRODUCT[id]}</div><i class="port" data-side="R"></i><i class="port" data-side="L"></i><i class="port" data-side="T"></i><i class="port" data-side="B"></i></div>${capHTML(id, 0)}`;
        SCANS.filter((sc) => sc.frame === id).forEach((sc) => buildScan(col, sc));

      function buildWorld() {

      }

      /* ---------- geometry helpers ---------- */
      function laneRect(L) {

      world.addEventListener("dblclick", (e) => {
        const c = e.target.closest(".echip");
        if (!c || e.target.closest(".ex")) return;
        clearTimeout(chipT);
        editChip(c.dataset.id);
      });
      world.addEventListener("focusout", (e) => {
        const lb = e.target.closest && e.target.closest(".echip .lb");
        if (!lb || !lb.isContentEditable) return;
        lb.contentEditable = "false";
        const id = lb.closest(".echip").dataset.id,
          c = layout.conns.find((x) => x.id === id);
        if (!c) return;
        const v = lb.textContent.trim() || "Next";
        lb.textContent = v;
        if (c.label !== v) {
          commit(() => {
            c.label = v;
          });
        }
      });
      world.addEventListener("keydown", (e) => {
        const chip = e.target.closest && e.target.closest(".echip");
        if (!chip) return;
        const lb = chip.querySelector(".lb");
        if (lb.isContentEditable) {
          e.stopPropagation();
          if (e.key === "Enter" || e.key === "Escape") {
            e.preventDefault();
            lb.blur();
          }
        } else if (e.key === "Enter") {
          go(chip.dataset.from, chip.dataset.to);
        } else if (e.key === "F2") {
          e.preventDefault();
          editChip(chip.dataset.id);
        }
      });

      /* ======================================================================
   EDIT THE ARRANGEMENT: group, name, remove, drag, undo
   ====================================================================== */
      function undo() {
        const done = commit.undo(() => {
          selConn = null;
          document.querySelectorAll(".lane").forEach((e) => delete e.dataset.sig);
          setSel(
            [...selSet].filter((id) => SCREENS[id]),
            selected,
          );
        });
        toast(done ? "Undone" : "Nothing to undo");
      }
      function pruneLanes() {
        layout.lanes = layout.lanes.filter((L) => L.screens.length);
      }
      function dropPos(ids) {
        ids.forEach((i) =>
          Object.values(layout.pos).forEach((p) => {
            delete p[i];
          }),
        );
      }
      function readingOrder(ids) {
        return [...ids]
          .sort((a, b) => FR[a].y - FR[b].y || FR[a].x - FR[b].x)
          .sort((a, b) =>
            Math.abs(FR[a].y - FR[b].y) < 60
              ? FR[a].x - FR[b].x
              : FR[a].y - FR[b].y,
          );
      }

      function groupFrames(ids, opts = {}) {
        ids = [...new Set(ids)].filter((id) => SCREENS[id]);
        if (!ids.length) return null;
        const allFree = ids.every(isFree);
        if (!opts.keepOrder) ids = readingOrder(ids);
        const minX = Math.min(...ids.map((i) => FR[i].x)),
          minY = Math.min(...ids.map((i) => FR[i].y));
        const make = () => {
          layout.lanes.forEach((L) => {
            L.screens = L.screens.filter((x) => !ids.includes(x));
          });
          pruneLanes();
          const L = layout.newGroup(ids);
          layout.lanes.push(L);
          dropPos(ids);
          if (allFree)
            posOf()[L.id] = { x: Math.round(minX), y: Math.round(minY - HEAD) };
          return L;
        };
        /* a drag-end merge commits itself, from the snapshot taken when the drag began */
        let L;
        if (opts.uncommitted) {
          L = make();
          relayout();
        } else L = commit(make, { redraw: ["layout"] });
        const id = L.id;
        setSel(ids, ids[ids.length - 1]);
        if (!allFree) fly(fitRect(laneRect(L), 40));
        setTimeout(() => focusTitle(id), 650);
        toast(
          ids.length === 1
            ? "Grouped. Name it, then drag frames in."
            : `Grouped ${ids.length} frames. Name the group.`,
        );
        return L;
      }
      function removeFromGroup(ids) {
        ids = ids.filter((i) => laneOf(i));
        if (!ids.length) return;
        commit(
          () => {
            const P = posOf();
            const byLane = new Map();
            ids.forEach((i) => {
              const L = laneOf(i);
              if (!byLane.has(L)) byLane.set(L, []);
              byLane.get(L).push(i);
            });
            byLane.forEach((list, L) => {
              const end =
                L.x +
                (L.open
                  ? L.screens.length * (COL_W + GAP) + 40
                  : DECK_W + PEEK_X * 3 + 120);
              let k = 0;
              list.forEach((i) => {
                P[i] = {
                  x: Math.round(end + k * (COL_W + 70)),
                  y: Math.round(L.open ? FR[i].y : L.top + HEAD),
                };
                k++;
                L.screens = L.screens.filter((x) => x !== i);
              });
            });
            pruneLanes();
          },
          { redraw: ["layout"] },
        );
        toast(
          ids.length === 1
            ? "Removed from group. ⌘Z to undo."
            : `Removed ${ids.length} frames from their groups. ⌘Z to undo.`,
        );
      }
      function dissolveGroup(L) {
        const name = laneName(L);
        commit(
          () => {
            const P = posOf();
            L.screens.forEach((i, k) => {
              P[i] = {
                x: Math.round(L.x + k * (COL_W + GAP)),
                y: Math.round(L.top + HEAD),
              };
            });
            L.screens = [];
            pruneLanes();
          },
          { redraw: ["layout"] },
        );
        toast(`Ungrouped “${name}”. Frames stay on the canvas. ⌘Z to undo.`);
      }
      function groupSel() {
        if (selSet.size) groupFrames([...selSet]);
      }
      function removeSel() {
        removeFromGroup([...selSet]);
      }
      /* put the view back in order without touching what the flows are: group membership and order,
         connectors, names, annotations and every note's text stay; only positions are reset on this device */
      function tidy() {
        const changed = commit(
          () => {
            const was = layout.snapshot();
            /* keep the stacking order you arranged: top to bottom, then left to right */
            const rank = (L) => (L.screens.length ? 0 : 1);
            layout.lanes = layout.lanes.slice().sort((a, b) => rank(a) - rank(b) || a.top - b.top || a.x - b.x);
            const loose = readingOrder(ORDER.filter(isFree));
            const P = layout.pos[DEV.id];
            layout.lanes.forEach((L) => delete P[L.id]);
            loose.forEach((id) => delete P[id]);
            placeLanes();
            let bottom = TOP0;
            layout.lanes.forEach((L) => {
              if (L.screens.length) bottom = Math.max(bottom, L.top + laneH(L));
            });
            loose.forEach((id, k) => (P[id] = freeSlot(k, bottom)));
            /* scanner cards back beside their frames; scanned notes back where the scan put them */
            Object.values(layout.scans).forEach((r) => r && r.pos && delete r.pos[DEV.id]);
            layout.notes.forEach((n) => {
              const seed = NOTES.find((x) => x.frame + ":" + x.who === n.id);
              if (seed && n.frame === seed.frame && n.pos) n.pos[DEV.id] = [...seed.pos[DEV.id]];
            });
            return layout.snapshot() !== was; /* the same test commit uses */
          },
          { redraw: "all" },
        );
        if (!changed) {
          toast("Already tidy.");
          return;
        }
        fly(fitRect(allRect(), 40, 1.1));
        toast("Tidied. Groups, flows and connectors are as they were. ⌘Z to undo.");
      }
      function resetLayout() {
        commit(
          () => {
            layout.reset();
            selConn = null;
            setSel([]);
          },
          { redraw: ["world"] },
        );
        fly(fitRect(allRect(), 40, 1.1));
        toast("Layout reset to the scanned arrangement");
      }
      function focusTitle(id) {
        const L = layout.lanes.find((l) => l.id === id);
        if (!L) return;
        if (!L.open) setLane(id, true, { fly: false });
        const t = laneEl(id) && laneEl(id).querySelector(".gtitle");
        if (!t) return;
        t.focus();
        const r = document.createRange();
        r.selectNodeContents(t);
        const s = getSelection();
        s.removeAllRanges();
        s.addRange(r);
      }

      /* group options menu (header “…”) */
      function openGroupMenu(L, btn) {
        const m = $("#mGroup");
        const r = btn.getBoundingClientRect();
        m.innerHTML = `<button class="mi" data-ga="rename"><svg><use href="#i-note"/></svg>Rename</button>
    <button class="mi" data-ga="toggle"><svg><use href="#i-layers"/></svg>${L.open ? "Close group" : "Open group"}</button>
    <button class="mi" data-ga="play"><svg><use href="#i-play"/></svg>Play flow</button>
    <hr><button class="mi" data-ga="ungroup"><svg><use href="#i-ungroup"/></svg>Ungroup<span>keeps the frames</span></button>`;
        m.style.left = Math.min(r.left, innerWidth - 260) + "px";
        m.style.top = Math.min(r.bottom + 8, innerHeight - 220) + "px";
        m.style.bottom = "auto";
        closeMenus();
        m.classList.add("open");
        m.querySelectorAll("[data-ga]").forEach(
          (b) =>
            (b.onclick = (ev) => {
              ev.stopPropagation();
              closeMenus();
              const a = b.dataset.ga;
              if (a === "rename") focusTitle(L.id);
              if (a === "toggle") setLane(L.id, !L.open);
              if (a === "play") play(L.screens);
              if (a === "ungroup") dissolveGroup(L);
            }),
        );
      }

      /* ---------- dragging ---------- */
      let pan = null,
        moved = false,
        drag = null,
        press = null,
        mq = null,
        handMode = false,
        spaceDown = false;
      function setHand(on) {
        handMode = on;
        stage.classList.toggle("hand", on || spaceDown);
        toast(
          on
            ? "Hand tool: drag to pan. V returns to select."
            : "Select tool: drag to select frames.",
        );
      }
      const selbox = document.createElement("div");
      selbox.className = "selbox";
      selbox.innerHTML = "<span></span>";
      world.insertBefore(selbox, notesEl);
      function updateSelBox() {
        const ids = [...selSet].filter(
          (id) => FR[id] && !FR[id].deck && colOf(id),
        );
        if (ids.length < 2) {
          selbox.style.display = "none";
          return;
        }
        let x0 = 1e9,
          y0 = 1e9,
          x1 = -1e9,
          y1 = -1e9;
        ids.forEach((id) => {
          const f = FR[id];
          x0 = Math.min(x0, f.x);
          y0 = Math.min(y0, f.y + PH_TOP);
          x1 = Math.max(x1, f.x + COL_W);
          y1 = Math.max(y1, f.y + PH_TOP + PH_H);
        });
        const pad = 14;
        Object.assign(selbox.style, {
          display: "block",
          left: x0 - pad + "px",
          top: y0 - pad + "px",
          width: x1 - x0 + pad * 2 + "px",
          height: y1 - y0 + pad * 2 + "px",
        });
        selbox.firstChild.textContent = ids.length + " frames";
      }
      const hint = $("#hint");
      const hideHint = () => hint.classList.add("gone");
      setTimeout(hideHint, 9000);
      function findTarget(c, ids) {
        let best = null;
        for (const L of layout.lanes) {
          const others = L.screens.filter((x) => !ids.includes(x)),
            m = others.length;
          if (L.open) {
            const rowW = Math.max(1, m) * (COL_W + GAP);
            if (
              c.x >= L.x - 90 &&
              c.x <= L.x + m * (COL_W + GAP) + COL_W * 1.4 &&
              c.y >= L.top - 30 &&
              c.y <= L.top + HEAD + PH_TOP + PH_H + CAP + 70
            ) {
              const idx = clamp(
                  Math.round((c.x - L.x - COL_W / 2) / (COL_W + GAP)),
                  0,
                  m,
                ),
                dist = Math.abs(c.x - (L.x + rowW / 2));
              if (!best || dist < best.dist)
                best = { kind: "lane", id: L.id, idx, dist };
            }
          } else if (
            c.x >= L.x - 30 &&
            c.x <= L.x + DECK_W + PEEK_X * 3 + 70 &&
            c.y >= L.top - 30 &&
            c.y <= L.top + COLL_H + 20
          ) {
            best = { kind: "lane", id: L.id, idx: m, dist: 0 };
          }
        }
        if (best) return best;
        for (const id of ORDER) {
          if (ids.includes(id) || !isFree(id)) continue;
          const f = FR[id];
          if (
            c.x > f.x &&
            c.x < f.x + COL_W &&
            c.y > f.y + PH_TOP &&
            c.y < f.y + PH_TOP + PH_H
          )
            return { kind: "merge", id };
        }
        return { kind: "free" };
      }
      function applyTarget(t, ids) {
        const cur = drag.target;
        if (cur && cur.kind === t.kind && cur.id === t.id && cur.idx === t.idx)
          return;
        layout.lanes.forEach((L) => {
          L.screens = L.screens.filter((x) => !ids.includes(x));
        });
        if (t.kind === "lane") {
          const L = layout.lanes.find((l) => l.id === t.id);
          L.screens.splice(t.idx, 0, ...ids);
        }
        drag.target = t;
        document
          .querySelectorAll(".col.merge")
          .forEach((c) => c.classList.remove("merge"));
        if (t.kind === "merge") {
          const c = colOf(t.id);
          if (c) c.classList.add("merge");
        }
        relayout();
        layout.lanes.forEach((L) =>
          L.el.classList.toggle("drop", t.kind === "lane" && t.id === L.id),
        );
        if (t.kind === "lane") {
          const L = layout.lanes.find((l) => l.id === t.id);
          sizeDz(L);
        }
      }
      function beginDrag(e) {
        moved = true;
        stage.classList.remove("fly");
        hideHint();
        if (press.kind === "group") {
          const L = press.lane;
          if (!L) {
            press = null;
            return;
          }
          const w = toWorld(press.sx, press.sy);
          drag = {
            kind: "group",
            L,
            start: { x: L.x, y: L.top },
            w0: w,
            snapshot: layout.snapshot(),
          };
          document.body.classList.add("gdrag");
          document
            .querySelectorAll(".col.fan")
            .forEach((c) => c.classList.remove("fan"));
          return;
        }
        const id = press.id;
        let ids =
          selSet.has(id) && selSet.size > 1
            ? [...selSet].filter((x) => FR[x] && !FR[x].deck)
            : [id];
        if (!selSet.has(id) || selSet.size <= 1) setSel([id], id);
        const w = toWorld(press.sx, press.sy);
        drag = {
          kind: "frame",
          ids,
          pid: id,
          off: {},
          snapshot: layout.snapshot(),
          wasIn: new Map(layout.lanes.flatMap((l) => l.screens.map((s) => [s, l.id]))),
          target: null,
        };
        ids.forEach((i) => {
          drag.off[i] = { x: w.x - FR[i].x, y: w.y - FR[i].y };
          const c = colOf(i);
          c.classList.add("dragging");
          c.classList.remove("deck");
        });
        dragSet = new Set(ids);
        const L0 = laneOf(id);
        drag.target = {
          kind: L0 ? "lane" : "free",
          id: L0 && L0.id,
          idx: L0 ? L0.screens.indexOf(id) : undefined,
        };
      }
      function updateDrag(e) {
        const w = toWorld(e.clientX, e.clientY);
        if (drag.kind === "group") {
          const L = drag.L;
          posOf()[L.id] = {
            x: Math.round(drag.start.x + (w.x - drag.w0.x)),
            y: Math.round(drag.start.y + (w.y - drag.w0.y)),
          };
          placeLanes();
          computeFrames();
          applyFrames();
          syncLanes();
          updateBars();
          drawConns();
          return;
        }
        selbox.classList.add("live");
        const np = {};
        drag.ids.forEach((i) => {
          np[i] = { x: w.x - drag.off[i].x, y: w.y - drag.off[i].y };
        });
        const hold = () =>
          drag.ids.forEach((i) => {
            FR[i].x = np[i].x;
            FR[i].y = np[i].y;
            const st = colOf(i).style;
            st.setProperty("--x", np[i].x + "px");
            st.setProperty("--y", np[i].y + "px");
          });
        hold();
        const p = np[drag.pid],
          c = { x: p.x + COL_W / 2, y: p.y + PH_TOP + PH_H / 2 };
        applyTarget(findTarget(c, drag.ids), drag.ids);
        hold();
        updateSelBox();
        drawConns(); // a regroup re-lays everything out; keep the dragged cards under the pointer
      }
      function endDrag() {
        const d = drag;
        drag = null;
        if (!d) return;
        selbox.classList.remove("live");
        if (d.kind === "group") {
          document.body.classList.remove("gdrag");
          commit.since(d.snapshot);
          return;
        }
        const t = d.target || { kind: "free" };
        document
          .querySelectorAll(".col.merge")
          .forEach((c) => c.classList.remove("merge"));
        layout.lanes.forEach((L) => L.el && L.el.classList.remove("drop"));
        let msg = "";
        if (t.kind === "merge") {
          const target = t.id,
            ids = d.ids;
          d.ids.forEach((i) => colOf(i).classList.remove("dragging"));
          dragSet = new Set();
          groupFrames([target, ...ids], { keepOrder: true, uncommitted: true });
          commit.since(d.snapshot, { redraw: ["layout"] });
          return;
        }
        if (t.kind === "free") {
          d.ids.forEach((i) => {
            posOf()[i] = { x: Math.round(FR[i].x), y: Math.round(FR[i].y) };
          });
        } else {
          d.ids.forEach((i) =>
            Object.values(layout.pos).forEach((p) => {
              delete p[i];
            }),
          );
        }
        const moved0 = d.ids.some(
          (i) => (d.wasIn.get(i) || null) !== (t.kind === "lane" ? t.id : null),
        );
        const nm =
          t.kind === "lane" ? laneName(layout.lanes.find((l) => l.id === t.id)) : "";
        pruneLanes();
        d.ids.forEach((i) => colOf(i).classList.remove("dragging"));
        dragSet = new Set();
        commit.since(d.snapshot, { redraw: ["layout"] });
        if (moved0)
          msg =
            t.kind === "lane" ? `Moved into “${nm}”` : "Taken out of its group";
        else if (t.kind === "lane") msg = "Reordered";
        if (msg) toast(msg + ". ⌘Z to undo.");
      }
      function marqueeHits(r) {
        return ORDER.filter((id) => {
          const c = colOf(id);
          if (!c || c.classList.contains("deck")) return false;
          const b = c.querySelector(".pwrap").getBoundingClientRect();
          return (
            b.right > r.x &&
            b.left < r.x + r.w &&
            b.bottom > r.y &&
            b.top < r.y + r.h
          );
        });
      }
      function updateMarquee(e) {
        if (!mq.el) {
          mq.el = document.createElement("div");
          mq.el.className = "marquee";
          document.body.appendChild(mq.el);
          moved = true;
          hideHint();
          document.body.classList.add("selecting");
          getSelection().removeAllRanges();
          document.activeElement &&
            document.activeElement.blur &&
            document.activeElement.blur();
        }
        const x = Math.min(e.clientX, mq.sx),
          y = Math.min(e.clientY, mq.sy),
          w = Math.abs(e.clientX - mq.sx),
          h = Math.abs(e.clientY - mq.sy);
        Object.assign(mq.el.style, {
          left: x + "px",
          top: y + "px",
          width: w + "px",
          height: h + "px",
        });
        mq.r = { x, y, w, h };
        const hits = marqueeHits(mq.r),
          next = [...new Set([...mq.base, ...hits])],
          key = next.join();
        if (key !== mq.last) {
          mq.last = key;
          setSel(next, next[next.length - 1] || null);
        }
      }
      function endMarquee() {
        const m = mq;
        mq = null;
        document.body.classList.remove("selecting");
        if (!m || !m.el) return;
        m.el.remove();
        if (selSet.size > 1)
          toast(
            selSet.size +
              " selected. ⌘G groups them, ⌘⇧G takes them out of their groups.",
          );
      }

      stage.addEventListener("pointerdown", (e) => {
        if (e.button === 1) {
          e.preventDefault();
          stopPlay();
          moved = false;
          pan = { sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y };
          return;
        }
        if (e.button !== 0) return;
        const grabbed = annotations.down(e.target, { x: e.clientX, y: e.clientY });
        if (grabbed) {
          if (grabbed.prevent) e.preventDefault();
          return;
        }
        /* a press on any part of an annotation (a note's button, a connector chip, a caption) is not a press on the canvas */
        if (annotations.owns(e.target)) return;
        const port = e.target.closest(".port");
        if (port) {
          startConnDrag(e, port);
          return;
        }
        const grip = e.target.closest(".grip");
        if (grip) {
          const L = layout.lanes.find((l) => l.id === grip.closest(".lane").id);
          e.preventDefault();
          stopPlay();
          moved = false;
          press = { kind: "group", lane: L, sx: e.clientX, sy: e.clientY };
          return;
        }
        const col = e.target.closest(".col");
        if (
          col &&
          !e.target.closest(".states,button,[contenteditable]")
        ) {
          stopPlay();
          moved = false;
          press = col.classList.contains("deck")
            ? {
                kind: "group",
                lane: laneOf(col.dataset.id),
                sx: e.clientX,
                sy: e.clientY,
              }
            : {
                kind: "frame",
                id: col.dataset.id,
                sx: e.clientX,
                sy: e.clientY,
              };
          return;
        }
        if (e.target.closest(".ghead,button,[contenteditable]")) return;
        stopPlay();
        moved = false;
        if (handMode || spaceDown) {
          pan = { sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y };
          return;
        }
        mq = {
          sx: e.clientX,
          sy: e.clientY,
          el: null,
          base: e.shiftKey ? [...selSet] : [],
          last: null,
        };
      });
      addEventListener("pointermove", (e) => {
        if (connDrag) {
          updateConnDrag(e);
          return;
        }
        if (annotations.dragging()) {
          annotations.move({ x: e.clientX, y: e.clientY }, cam.k);
          return;
        }
        if (
          press &&
          !drag &&
          Math.hypot(e.clientX - press.sx, e.clientY - press.sy) > 5
        )
          beginDrag(e);
        if (drag) {
          updateDrag(e);
          return;
        }
        if (mq) {
          updateMarquee(e);
          return;
        }
        if (!pan) return;
        const dx = e.clientX - pan.sx,
          dy = e.clientY - pan.sy;
        if (!moved && Math.hypot(dx, dy) > 4) {
          moved = true;
          stage.classList.add("panning");
          hideHint();
          stage.classList.remove("fly");
        }
        if (moved) {
          cam.x = pan.cx + dx;
          cam.y = pan.cy + dy;
          apply();
        }
      });
      addEventListener("pointerup", () => {
        if (connDrag) {
          endConnDrag(false);
          press = null;
          return;
        }
        annotations.up();
        if (drag) endDrag();
        if (mq) endMarquee();
        press = null;
        pan = null;
        stage.classList.remove("panning");
      });
      addEventListener("pointercancel", () => {
        annotations.cancel();
        if (connDrag) endConnDrag(true);
        if (drag) {
          const d = drag;
          drag = null;
          document.body.classList.remove("gdrag");
          layout.restore(d.snapshot);
          dragSet = new Set();
          document
            .querySelectorAll(".col.dragging")
            .forEach((c) => c.classList.remove("dragging"));
          relayout();
        }
        press = null;
        pan = null;
        mq = null;
      });
      stage.addEventListener(
        "click",
        (e) => {
          if (moved) {
            e.stopPropagation();
            e.preventDefault();
            moved = false;
          }
        },
        true,
      );
      stage.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          stopPlay();
          hideHint();
          stage.classList.remove("fly");
          if (e.ctrlKey || e.metaKey)
            zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.012));
          else {
            cam.x -= e.deltaX;
            cam.y -= e.deltaY;
            apply();
          }
        },
        { passive: false },
      );

      /* deck hover fans the cards */
      function fanLane(id, on) {
        const L = layout.lanes.find((l) => l.id === id);
        if (L)
          L.screens.forEach((s) => {
            const c = colOf(s);
            if (c) c.classList.toggle("fan", on && !drag);
          });
      }
      world.addEventListener("pointerover", (e) => {
        const c = e.target.closest(".col.deck");
        if (c) {
          fanLane(c.dataset.lane, true);
          return;
        }
        const h = e.target.closest(".ghead");
        if (h) {
          const L = layout.lanes.find((l) => l.id === h.closest(".lane").id);
          if (L && !L.open) fanLane(L.id, true);
        }
      });
      world.addEventListener("pointerout", (e) => {
        const c = e.target.closest(".col.deck");
        if (c) {
          const to =
            e.relatedTarget &&
            e.relatedTarget.closest &&
            e.relatedTarget.closest(".col.deck");
          if (!to || to.dataset.lane !== c.dataset.lane)
            fanLane(c.dataset.lane, false);
          return;
        }
        const h = e.target.closest(".ghead");
        if (h) {
          const L = layout.lanes.find((l) => l.id === h.closest(".lane").id);
          if (L && !(e.relatedTarget && h.contains(e.relatedTarget)))
            fanLane(L.id, false);
        }
      });

      world.addEventListener("click", (e) => {
        const col = e.target.closest(".col");
        if (col && col.classList.contains("deck")) {
          const L = laneOf(col.dataset.id);
          if (L) setLane(L.id, true);
          return;
        }
        if (col) {
          const id = col.dataset.id;
          if (e.shiftKey) {
            const s = new Set(selSet);
            if (s.has(id)) s.delete(id);
            else s.add(id);
            setSel([...s], s.has(id) ? id : [...s].pop() || null);
            return;
          }
          if (!(selSet.size > 1 && selSet.has(id)) && selected !== id)
            select(id, false);
        }
        const ph = e.target.closest(".phone");
        if (ph && col) {
          const r = ph.getBoundingClientRect(),
            rp = document.createElement("span");
          rp.className = "ripple";
          rp.style.left = (e.clientX - r.left) / cam.k + "px";
          rp.style.top = (e.clientY - r.top) / cam.k + "px";
          ph.appendChild(rp);
          setTimeout(() => rp.remove(), 650);
          const goEl = e.target.closest("[data-go]");
          const plant = e.target.closest(".plant");
          if (plant) {
            plant.classList.toggle("sel");
            ph.querySelector("[data-cnt]").textContent =
              ph.querySelectorAll(".plant.sel").length + " selected";
          }
          const t = e.target.closest(".time");
          if (t)
            t.parentElement
              .querySelectorAll(".time")
              .forEach((x) => x.classList.toggle("on", x === t));
          const tog = e.target.closest(".tog");
          if (tog) tog.querySelector(".sw").classList.toggle("on");
          const pl = e.target.closest("[data-plan]");
          if (pl)
            pl.parentElement
              .querySelectorAll(".plan")
              .forEach((x) => x.classList.toggle("on", x === pl));
          const pk = e.target.closest("[data-pick]");
          if (pk) {
            ph.querySelectorAll(".lrow2").forEach((x) =>
              x.classList.toggle("sel", x === pk),
            );
            ph.querySelector("[data-pickLbl]").textContent =
              "Continue with " + pk.dataset.pick;
          }
          if (goEl && goEl.dataset.go) {
            const from = col.dataset.id,
              to = goEl.dataset.go;
            setTimeout(() => go(from, to), 180);
          }
        }
        if (!col && !annotations.owns(e.target) && !e.target.closest(".ghead")) {
          select(null);
        }
      });
      world.addEventListener("dblclick", (e) => {
        const col = e.target.closest(".col");
        if (
          col &&
          !col.classList.contains("deck") &&
          !e.target.closest(
            /* .cap is not part of captionKind.owns on purpose: a press on a caption's padding still drags the frame */
            "[data-go],.plant,.tog,.time,.plan,[data-pick],.states,.cap",
          ) &&
          !annotations.owns(e.target)
        )
          select(col.dataset.id, true);
      });

      /* S3 states */
      function setState(n) {
        n = ((n % 3) + 3) % 3;
        s3State = n;
        const ph = $("#p-s3");
        ph.dataset.state = n;
        ["v0l", "v1l", "v2l"].forEach(
          (c, i) =>
            (ph.querySelector("." + c).style.display = i === n ? "" : "none"),
        );
        $("#stateBtn").textContent =
          "3 states · " + ["Prompt", "Denied", "Error"][n];
        ph.dataset.state = n;
      }
      let s3State = 0;
      function wireState() {
        setState(s3State);
        $("#stateBtn").addEventListener("click", (e) => {
          e.stopPropagation();
          select("s3");
          setState(s3State + 1);
        });
      }

      /* ======================================================================
   CHROME: menus, pager, keys
   ====================================================================== */
      const menus = {
        space: $("#mSpace"),
        views: $("#mViews"),
        add: $("#mAdd"),
        group: $("#mGroup"),
      };
      function menu(n) {
        Object.entries(menus).forEach(([k, el]) =>
          el.classList.toggle(
            "open",
            k === n && !el.classList.contains("open"),
          ),
        );
      }
      function closeMenus() {
        Object.values(menus).forEach((m) => m.classList.remove("open"));
      }
      $("#btnTidy").onclick = (e) => {
        e.stopPropagation();
        closeMenus();
        tidy();
      };
      $("#btnSpace").onclick = (e) => {
        e.stopPropagation();
        menu("space");
      };
      $("#btnViews").onclick = (e) => {
        e.stopPropagation();
        buildViews();
        menu("views");
      };
      $("#btnAdd").onclick = (e) => {
        e.stopPropagation();
        menu("add");
      };
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".menu")) closeMenus();
      });
      function buildViews() {
        $("#mViews").innerHTML =
          `<button class="mi" data-view="all"><svg><use href="#i-frame"/></svg>Overview<span class="k">1</span></button>` +
          layout.lanes.filter((l) => l.screens.length)
            .map(
              (l, i) =>
                `<button class="mi" data-view="${l.id}"><svg><use href="#i-frame"/></svg>${esc(laneName(l))}<span class="k">${i < 3 ? i + 2 : ""}</span></button>`,
            )
            .join("");
        $("#mViews")
          .querySelectorAll("[data-view]")
          .forEach(
            (b) =>
              (b.onclick = () => {
                view(b.dataset.view);
                closeMenus();
              }),
          );
      }
      menus.space.querySelectorAll("[data-hide]").forEach(
        (b) =>
          (b.onclick = (e) => {
            e.stopPropagation();
            const on = b.classList.toggle("on");
            document.body.classList.toggle("hide-" + b.dataset.hide, !on);
          }),
      );
      document.querySelectorAll(".menu [data-a]").forEach((b) =>
        b.addEventListener("click", () => {
          const a = b.dataset.a;
          closeMenus();
          if (a === "note") newNote();
          if (a === "group") groupSel();
          if (a === "tidy") tidy();
          if (a === "resetlayout") resetLayout();
          if (a === "resetann") resetAnn();
          if (a === "rescan")
            toast("Scanned 14 routes · 9 screens · no changes since 2m ago");
          if (a === "route") toast("Pick a route to render it on the canvas");
        }),
      );
      function newNote() {
        const wx = (innerWidth / 2 - cam.x) / cam.k - 98,
          wy = (innerHeight / 2 - cam.y) / cam.k - 50,
          f = homeFor(wx + 98, wy + 50);
        createNote(f ? { frame: f, local: localFrom(f, wx, wy) } : { world: [Math.round(wx), Math.round(wy)] });
      }
      const step = (d) => {
        const i = selected ? ORDER.indexOf(selected) : -1;
        stopPlay();
        select(ORDER[clamp(i + d, 0, ORDER.length - 1)], true);
      };
      $("#next").onclick = () => step(1);
      $("#prev").onclick = () => step(-1);
      $("#zoom").onclick = () => view("all");
      $("#btnSearch").onclick = () => {
        if (panelOpen && panelMode === "search") closePanel();
        else openSearch();
      };
      let tt;
      function toast(m) {
        const t = $("#toast");
        t.textContent = m;
        t.classList.add("show");
        clearTimeout(tt);
        tt = setTimeout(() => t.classList.remove("show"), 2800);
      }

      /* Delete and the arrow keys on an annotation: one handler for every kind, ahead of the others */
      addEventListener(
        "keydown",
        (e) => {
          if (!e.target.closest) return; /* the document itself */
          /* Cmd/Ctrl/Alt + arrow belongs to the browser (back, forward), not to a note */
          if ((e.metaKey || e.ctrlKey || e.altKey) && e.key.startsWith("Arrow")) return;
          if (annotations.keyDown(e.target, e.key, { shift: e.shiftKey })) {
            e.preventDefault();
            e.stopPropagation();
          }
        },
        true,
      );
      addEventListener("keydown", (e) => {
        const typing = e.target.closest?.("input,select,[contenteditable]");
        const mod = e.metaKey || e.ctrlKey;
        if (mod && e.key.toLowerCase() === "k") {
          e.preventDefault();
          openSearch();
          return;
        }
        if (!typing && mod && e.key.toLowerCase() === "g") {
          e.preventDefault();
          if (e.shiftKey) removeSel();
          else groupSel();
          return;
        }
        if (!typing && mod && e.key.toLowerCase() === "z" && !e.shiftKey) {
          e.preventDefault();
          undo();
          return;
        }
        if (!typing && mod && e.key.toLowerCase() === "a") {
          e.preventDefault();
          const ids = ORDER.filter((id) => FR[id] && !FR[id].deck);
          setSel(ids, ids[ids.length - 1] || null);
          toast(ids.length + " frames selected");
          return;
        }
        if (
          e.code === "Space" &&
          !typing &&
          !(
            e.target.closest && e.target.closest("button,select,input,textarea")
          )
        ) {
          e.preventDefault();
          if (!spaceDown) {
            spaceDown = true;
            stage.classList.add("hand");
          }
          return;
        }
        if (e.key === "Escape") {
          if (connDrag) {
            endConnDrag(true);
            return;
          }
          if (selConn) {
            selConn = null;
            markActive();
            return;
          }
          if (drag && drag.kind === "frame") {
            e.preventDefault();
            return;
          }
          if (usageComp !== null) {
            clearSweep();
            return;
          }
          if (typing) e.target.blur();
          closeMenus();
          stopPlay();
          if (panelOpen) closePanel();
          else if (selSet.size) select(null);
          return;
        }
        if (typing) return;
        if (e.key === "c" && selSet.size > 1) {
          connectSel();
          return;
        }
        if (e.key === "h") setHand(true);
        if (e.key === "v") setHand(false);
        if (e.key === "a") toggleAll();
        if (e.key === "l") tidy();
        if (e.key === "m") setDevice("mobile");
        if (e.key === "t") setDevice("tablet");
        if (e.key === "d") setDevice("desktop");
        if (e.key === "1") view("all");
        if (e.key === "2" && layout.lanes[0]) view(layout.lanes[0].id);
        if (e.key === "3" && layout.lanes[1]) view(layout.lanes[1].id);
        if (e.key === "4" && layout.lanes[2]) view(layout.lanes[2].id);
        if (e.key === "ArrowRight") {
          step(1);
          e.preventDefault();
        }
        if (e.key === "ArrowLeft") {
          step(-1);
          e.preventDefault();
        }
        if (e.key === "f" && selected) focusScreen(selected);
        if (e.key === "i") {
          if (selected) inspect(selected);
          else inspectEmpty(true);
        }
        if (e.key === "n") {
          e.preventDefault();
          newNote();
        }
        if (e.key === "=" || e.key === "+")
          zoomAt(innerWidth / 2, innerHeight / 2, 1.2);
        if (e.key === "-") zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.2);
        if (e.key === "/") {
          e.preventDefault();
          openSearch();
        }
      });
      addEventListener("keyup", (e) => {
        if (e.code === "Space") {
          spaceDown = false;
          stage.classList.toggle("hand", handMode);
        }
      });
      addEventListener("blur", () => {
        spaceDown = false;
        stage.classList.toggle("hand", handMode);
      });
      addEventListener("resize", () => {
        updateBars();
        if (panelOpen) {
          insetR = panelW();
          insetB = panelH();
        }
      });

      /* ======================================================================
   OPEN / CLOSE ALL GROUPS
   ====================================================================== */
      function updateAllBtn() {
        const b = $("#btnAll");
        if (!b) return;
        const L = layout.lanes.filter((l) => l.screens.length),
          all = L.length > 0 && L.every((l) => l.open);
        b.querySelector("span").textContent = all ? "Close all" : "Open all";
        b.querySelector("use").setAttribute(
          "href",
          all ? "#i-collapse" : "#i-expand",
        );
        b.title = (all ? "Close" : "Open") + " all groups (A)";
        b.disabled = !L.length;
      }
      function toggleAll() {
        stopPlay();
        const L = layout.lanes.filter((l) => l.screens.length);
        if (!L.length) return;
        const open = !L.every((l) => l.open);
        if (!open && [...selSet].some((i) => laneOf(i))) select(null);
        commit(
          () => {
            L.forEach((l) => {
              l.open = open;
            });
          },
          VIEW_STATE,
        );
        fly(fitRect(allRect(), 40, 1.1));
      }

      /* ======================================================================
   DEVICE: same scan, same flows, rendered at another viewport
   ====================================================================== */
      let switching = false;
      async function setDevice(id) {
        if (id === DEV.id || switching) return;
        switching = true;
        stopPlay();
        closeMenus();
        const sel = [...selSet],
          prim = selected;
        world.style.transition = "opacity .18s";
        world.style.opacity = 0;
        await sleep(200);
        document.body.classList.add("boot");
        applyDevice(id);
        buildWorld();
        setSel(sel, prim);
        clearSpot();
        if (usageComp !== null) {
          const u = usageComp;
          usageComp = null;
          sweepQuiet(u);
        }
        if (panelOpen && panelMode === "inspect" && prim)
          inspect(prim, true, true);
        if (prim) {
          const q = screenRect(prim);
          cam = fitRect(
            { x: q.x - 30, y: q.y - 40, w: q.w + 60, h: q.h + 70 },
            30,
            1.6,
          );
        } else cam = fitRect(allRect(), 30);
        stage.classList.remove("fly");
        apply();
        await sleep(80);
        document.body.classList.remove("boot");
        world.style.opacity = 1;
        await sleep(240);
        world.style.transition = "";
        switching = false;
        toast(DEV.label + " · " + DEV.vp);
      }
      document
        .querySelectorAll("#devsw button")
        .forEach((b) => (b.onclick = () => setDevice(b.dataset.dev)));
      $("#btnAll").onclick = toggleAll;

      /* ======================================================================
   BOOT
   ====================================================================== */
      function labelUi() {
        document.querySelectorAll("button[title]").forEach((b) => {
          if (!b.getAttribute("aria-label"))
            b.setAttribute(
              "aria-label",
              b.title.replace(/\s*\([^)]*\)\s*$/, ""),
            );
        });
        $("#seltb").setAttribute("role", "toolbar");
        $("#seltb").setAttribute("aria-label", "Selected frames");
        $("#devsw").setAttribute("role", "group");
        $("#devsw").setAttribute("aria-label", "Device size");
        $("#toast").setAttribute("role", "status");
        $("#toast").setAttribute("aria-live", "polite");
        $("#panel").setAttribute("role", "complementary");
        $("#panel").setAttribute("aria-label", "Inspector");
      }
      function boot() {
        labelUi();
        document.body.classList.add("boot");
        applyDevice("mobile");
        buildWorld();
        cam = fitRect(allRect(), 30);
        apply();
        select("s2", false);
        requestAnimationFrame(() =>
          requestAnimationFrame(() => document.body.classList.remove("boot")),
        );
      }
      (document.fonts && document.fonts.ready
        ? document.fonts.ready
        : Promise.resolve()
      ).then(boot);
    </script>
  </body>
</html>
