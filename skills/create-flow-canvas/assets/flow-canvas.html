            const kindsBack = overlays(st, d);
            adopt(Object.assign({ groups: g.groups, pos: st.pos }, kindsBack));
            freshIds();
            /* ids that came back with the snapshot must not be handed out again */
            counters = counted(counters, (c) => S[c.field]);
            touched.add("layout");
            layout.save();
          };
          layout.reset = () => {
            const d = freshDefaults();
            textual().forEach((k) => (d[k.name] = clone(S[k.name])));
            adopt(d);
            setView({});
            counters = startCounters(d);
            touched.add("layout");
            layout.save();
          };

          /* ---- groups ---- */
          const leave = (ids) =>
            S.groups.forEach((L) => {
              L.screens = L.screens.filter((x) => !ids.includes(x));
            });
          const dropEmpty = () => {
            S.groups = S.groups.filter((L) => L.screens.length);
          };
          const placesOf = (device) => S.pos[device] || (S.pos[device] = {});
          const whole = (at) => ({ x: Math.round(at.x), y: Math.round(at.y) });
          /* only devices that have places: letting go on one that has none must not make it */
          const forget = (ids, device) => (device ? [S.pos[device]] : Object.values(S.pos)).forEach((P) => P && ids.forEach((i) => delete P[i]));
          layout.groupOf = (id) => view("groups").find((l) => l.screens.includes(id));
          layout.takeOut = (ids) => {
            leave(ids);
            dropEmpty();
            wrote("layout");
          };
          layout.moveInto = (ids, groupId, idx) => {
            const into = S.groups.find((l) => l.id === groupId);
            if (!into) throw new Error('FlowLayout.moveInto: there is no group "' + groupId + '"'); /* before anything changes */
            leave(ids);
            into.screens.splice(idx, 0, ...ids);
            forget(ids);
            dropEmpty();
            wrote("layout");
          };
          layout.groupFrames = (ids, { device, at } = {}) => {
            leave(ids);
            dropEmpty();
            const g = { id: layout.nextId("g"), screens: ids.slice(), ...BLANK_TEXT };
            S.groups.push(g);
            forget(ids);
            if (at) placesOf(device)[g.id] = whole(at);
            wrote("layout");
            return view("groups").find((l) => l.id === g.id);
          };
          /* the order the groups are stacked in; never adds or drops one. Those not named follow, in their order. */
          layout.orderGroups = (ids) => {
            const by = new Map(S.groups.map((g) => [g.id, g]));
            const first = [...new Set(ids)].filter((id) => by.has(id)).map((id) => by.get(id));
            S.groups = first.concat(S.groups.filter((g) => !first.includes(g)));
            wrote("layout");
          };
          /* a group's title, description and whether the description is shown: the page draws a field as it is typed in,
             so nothing is asked to be redrawn */
          layout.setGroupText = (id, changes) => {
            for (const k in changes) {
              if (!(k in BLANK_TEXT)) throw new Error('FlowLayout.setGroupText: only title, sub and subOn can be set, not "' + k + '"');
              if (typeof changes[k] !== typeof BLANK_TEXT[k]) throw new Error("FlowLayout.setGroupText: " + k + " must be a " + typeof BLANK_TEXT[k]);
            }
            const g = S.groups.find((x) => x.id === id);
            if (!g) return false;
            Object.assign(g, changes);
            wrote();
            return true;
          };
          layout.resetText = () => {
            S.groups.forEach((l) => Object.assign(l, scannedText(l.id)));
            const d = freshDefaults();
            textual().forEach((k) => (S[k.name] = d[k.name]));
            wrote();
          };

          /* ---- positions: where a frame or a group sits on one device ---- */
          const exists = (id) => hasScreen(id) || S.groups.some((g) => g.id === id);
          layout.place = (device, id, at) => {
            if (!exists(id) || !Number.isFinite(at.x) || !Number.isFinite(at.y)) return false;
            placesOf(device)[id] = whole(at);
            wrote("layout");
            return true;
          };
          /* let go of places: on one device, or (no device named) on every one */
          layout.forgetPlaces = (ids, device) => {
            forget(ids, device);
            wrote("layout");
          };

          /* ---- annotations: any kind, by name ---- */
          layout.add = (name, item) => {
            const k = kindOf(name);
            if (!isObj(item) || typeof item.id !== "string" || !item.id) throw new Error('FlowLayout.add("' + name + '"): an item needs an id');
            if (S[name].some((x) => x.id === item.id)) throw new Error('FlowLayout.add("' + name + '"): "' + item.id + '" is already there');
            const it = clone(item);
            if (k.valid && !k.valid(it, { hasScreen })) return false;
            S[name].push(it);
            wrote(name);
            return true;
          };
          layout.edit = (name, id, changes) => {
            const k = kindOf(name);
            if ("id" in changes && changes.id !== id) throw new Error('FlowLayout.edit("' + name + '"): an item keeps its id');
            const it = S[name].find((x) => x.id === id);
            if (!it) return false;
            const next = { ...it };
            for (const f in changes) {
              if (f === "id") continue;
              if (changes[f] === undefined) delete next[f];
              else next[f] = clone(changes[f]);
            }
            if (k.valid && !k.valid(next, { hasScreen })) return false; /* the kind's rule holds after an edit too */
            S[name][S[name].indexOf(it)] = next;
            wrote(name);
            return true;
          };
          layout.remove = (name, id) => {
            kindOf(name);
            const n = S[name].length;
            S[name] = S[name].filter((x) => x.id !== id);
            if (S[name].length === n) return false;
            wrote(name);
            return true;
          };
          /* every kind's moved places on this device back as the scan had them (Tidy), each by its kind's own rule */
          layout.letGoOfMoves = (device) => {
            kinds.forEach((k) => {
              if (typeof k.letGo !== "function") return;
              S[k.name].forEach((it) => k.letGo(it, D0[k.name].find((x) => x.id === it.id), device));
              wrote(k.name);
            });
          };

          /* ---- view state: how the groups are shown. Saved with the layout, never in a snapshot or an undo step. ---- */
          layout.setOpen = (ids, open) => {
            const next = { ...openSaid };
            let changed = false;
            (Array.isArray(ids) ? ids : [ids]).forEach((id) => {
              if (!S.groups.some((g) => g.id === id) || isOpen(id) === open) return;
              if (open === openDefault(id)) delete next[id];
              else next[id] = open;
              changed = true;
            });
            if (!changed) return false;
            openSaid = next;
            viewRev++;
            touched.add("layout");
            return true;
          };
          layout.viewStamp = () => viewRev;
          layout.takeTouched = () => {
            const out = [...touched];
            touched.clear();
            return out;
          };

          layout.nextId = (kind) => {
            if (!(kind in counters)) throw new Error("FlowLayout.nextId: unknown kind " + kind);
            counters[kind] += 1;
            return kind + counters[kind];
          };
          layout.mark = (s) => {
            history.push(s || layout.snapshot());
            if (history.length > MAX_UNDO) history.shift();
          };
          layout.undo = () => {
            const s = history.pop();
            if (!s) return false;
            layout.restore(s);
            return true;
          };

          load();
          touched.clear();
          return layout;
        }

        return { create, groupName, flowOrder };
      })();
    </script>

    <script id="commit-module">
      /* ======================================================================
         COMMIT MODULE
         The one place that decides what happens after an edit to the layout: the undo point, the save,
         and which parts of the page are redrawn, in a fixed order. Callers say what changed, not how
         to finish. It knows nothing about the DOM: the page hands it the kinds, each with its own refresh().

         Interface
           const commit = FlowCommit.create({ layout, kinds, redraw, timer? })
             layout  a FlowLayout
             kinds   the annotation kinds (the page's one list); each needs a name and a refresh(), its redraw;
                     a kind's own `redraw` (names, default none) is what a change to it asks for
             redraw  { world, layout }, one function each, both required
             timer   { set, clear } for the typing save (default setTimeout / clearTimeout); tests pass their own
           commit(change, { redraw, undo, force, quiet })
             Runs change(), returns its result. If the layout is now different: marks the state before
             as one undo step, saves, then redraws. If nothing changed, nothing happens. A change to
             only how the groups are shown (open or closed) is saved and redrawn but is not an undo step.
             What is redrawn is what the change touched (the layout says: "layout" for groups and places, a kind's
             name for an edit to it, which asks for that kind's own `redraw`) plus whatever `redraw` names.
               redraw  "all" (the layout and every kind) or a list of names ("world", "layout", a kind's name);
                       default none. Always drawn in this order: world, layout, then the kinds in the order of
                       the list they were declared in. A name nobody declared throws before anything changes.
               undo    false for edits that are saved and redrawn but are not undo steps (an arrow-key burst)
               force   true to redraw even if nothing changed: a drag moved things on screen (a preview) and
                       the page must be drawn from the layout again, whether the drop changed it or not
               quiet   true when the page has drawn the change itself (a card just built, a field just typed in): what
                       the change touched is not redrawn, only what `redraw` names
             Only the outermost commit decides: a commit inside another one can add redraws, but its own
             undo option is ignored.
           commit.typing.change(fn)
             For text typed in place (a note, a caption, a group's title): fn() writes through the layout's mutators
             on each keystroke. The first change of a visit takes the starting point; the text is saved a moment after
             the last key; nothing is redrawn (the field shows it already).
           commit.typing.end()
             The visit is over (blur): one undo step back to where it started if the text changed, and a save.
             Returns whether it changed anything. Any commit or undo ends a visit first, so a step is never mixed.
           commit.undo(afterRestore)
             Undoes one step, runs afterRestore() (the page's own clean-up), redraws everything.
             Returns false when there is nothing to undo.
         ====================================================================== */
      var FlowCommit = (function () {
        "use strict";
        const SAVE_AFTER = 400;
        function create({ layout, kinds, redraw, timer }) {
          ["world", "layout"].forEach((k) => {
            if (typeof redraw[k] !== "function") throw new Error('FlowCommit: missing redraw function for "' + k + '"');
          });
          if (!Array.isArray(kinds)) throw new Error("FlowCommit.create: kinds is required");
          kinds.forEach((k) => {
            if (!k.name) throw new Error("FlowCommit: every kind needs a name");
            if (typeof k.refresh !== "function") throw new Error('FlowCommit: "' + k.name + '" has no refresh');
          });
          /* the page's timers; where there are none (a bare context) the save waits for the end of the visit */
          const clock =
            timer ||
            (typeof setTimeout === "function"
              ? { set: (f, ms) => setTimeout(f, ms), clear: (t) => clearTimeout(t) }
              : { set: () => null, clear: () => {} });
          const fns = { world: redraw.world, layout: redraw.layout };
          kinds.forEach((k) => {
            if (k.name in fns) throw new Error('FlowCommit: the kind name "' + k.name + '" is taken');
            fns[k.name] = k.refresh;
          });
          const ORDER = Object.keys(fns);
          const ALL = ORDER.filter((k) => k !== "world");
          /* the kinds a caller asked for, checked, so a typo fails before anything is changed */
          const namesOf = (names) => {
            const list = names === "all" ? ALL : names || [];
            list.forEach((k) => {
              if (!ORDER.includes(k)) throw new Error('FlowCommit: unknown redraw kind "' + k + '"');
            });
            return list;
          };
          /* what the layout says the writes touched, as redraw names: the arrangement itself, or what a kind asks for */
          const redrawnFor = (touched) =>
            touched.flatMap((t) => (t === "layout" ? ["layout"] : ((kinds.find((k) => k.name === t) || {}).redraw || []).filter((n) => ORDER.includes(n))));
          const redrawInOrder = (wanted) => ORDER.filter((k) => wanted.includes(k)).forEach((k) => fns[k]());
          let running = null; /* the outer commit's pending redraws while its change runs */
          let visit = null; /* the typing visit in progress: { before, timer } */

          /* the tail every edit shares: undo point, save, redraw. Nothing changed, nothing to record;
             a live gesture (alwaysRedraw) still redraws, because it moved things on screen. */
          function finish(before, shown, opts, names, alwaysRedraw) {
            const edited = layout.snapshot() !== before;
            if (!edited && layout.viewStamp() === shown) {
              if (alwaysRedraw) redrawInOrder(names);
              return;
            }
            if (edited && opts.undo !== false) layout.mark(before);
            layout.save();
            redrawInOrder(names);
          }
          function endVisit() {
            if (!visit) return false;
            const v = visit;
            visit = null;
            clock.clear(v.timer);
            if (layout.snapshot() === v.before) return false;
            layout.mark(v.before);
            layout.save();
            return true;
          }
          function commit(change, opts = {}) {
            const names = namesOf(opts.redraw);
            if (running) {
              names.forEach((k) => running.add(k));
              return change();
            }
            endVisit();
            const before = layout.snapshot();
            const shown = layout.viewStamp();
            layout.takeTouched();
            running = new Set(names);
            let result, wanted;
            try {
              result = change();
            } finally {
              redrawnFor(layout.takeTouched()).forEach((k) => opts.quiet || running.add(k));
              wanted = [...running];
              running = null;
            }
            finish(before, shown, opts, wanted, !!opts.force);
            return result;
          }
          commit.typing = {
            change(fn) {
              if (!visit) visit = { before: layout.snapshot(), timer: null };
              fn();
              layout.takeTouched();
              clock.clear(visit.timer);
              visit.timer = clock.set(() => layout.save(), SAVE_AFTER);
            },
            end: endVisit,
          };
          commit.undo = (afterRestore) => {
            endVisit();
            if (!layout.undo()) return false;
            if (afterRestore) afterRestore();
            redrawInOrder(ALL);
            return true;
          };
          return commit;
        }
        return { create };
      })();
    </script>

    <script id="annotations-module">
      /* ======================================================================
         ANNOTATIONS MODULE
         What the annotation kinds (notes, findings, connectors, captions) share: one drag (threshold, zoom
         scale, cancel), one keyboard move (arrow keys, bursts count as one undo step), one delete, and one
         "is this an annotation" check. It is the one drag for annotation kinds; dragging frames or a group
         (FlowGesture), panning and drawing a connector or a marquee are different gestures with their own rules.
         A kind is one object that FlowLayout, FlowCommit and this module all read (the page declares one list
         and hands it to each): this module reads the view half's input fields, described below. Items are ids: every method
         takes the id of the item, and a kind keeps whatever it needs to find the item's DOM to itself. The
         module never touches the DOM and saves only through FlowCommit, so every move and delete is one
         undoable commit.

         Interface
           const annotations = FlowAnnotations.create({ commit, kinds, threshold, clock, typing })
             commit     a FlowCommit
             kinds      the page's list of kinds (see below); one that takes no input has none of the fields
             threshold  screen px before a press becomes a drag (default 4)
             clock      () => ms, for the keyboard burst (default Date.now)
             typing     (target) => bool, the page's own test for "the user is typing in this": while it is true,
                        Delete and the arrow keys act on no kind (default: never)
           annotations.owns(target)             any kind recognises target as its own
           annotations.down(target, {x, y})     null, or { prevent } when a movable annotation was grabbed
           annotations.dragging()               a grab is in progress (pressed, moved or not)
           annotations.move({x, y}, k)          pointer moved; k is the zoom, so places follow in world units
           annotations.up()                     { moved } or null; saves a drag, or taps if it never moved
           annotations.cancel()                 the pointer was taken away: put the item back, save nothing
           annotations.keyDown(target, key, {shift})   true when handled: Delete/Backspace, arrow keys
           annotations.remove(kindName, id)     the same removal, for a × button

         The input fields of a kind's view half. Only name is required; the rest depends on what the kind does, and create()
         refuses a movable kind that is missing origin, place or save.
           name                       also the kind's field in the layout and its redraw name in FlowCommit
           owns(target)               is target part of this kind (a kind without it is not part of owns())
           movable, preventDefault    can it be grabbed and moved; should the page preventDefault on press
           match(target, how)         the item's id, or null. how is "pointer", "nudge" or "delete".
           origin(id) -> {x, y}       where it is now, in the units place() takes
           lift(id)                   a drag began
           place(id, pos)             show it at pos while it moves (DOM only)
           save(id, pos, {nudged})    the data change for a move (layout.edit), run inside a commit. nudged is true for an
                                      arrow-key move, so a note can move in place instead of re-homing.
           settle(id, {moved, cancelled, nudged})   DOM clean-up, after the commit and its redraws
           tap(id)                    pressed and released without moving
           erase(id)                  the data change for a delete (layout.remove), run inside a commit (needed to be deletable)
           erased(id)                 DOM clean-up and message after a delete
           redraw                     kinds to redraw after a save or an erase (default none)

         One order throughout: the data change, then the commit's undo point and save, then its redraws,
         then settle()/erased(). The drag threshold is 4 screen px for every kind (notes used 3).
         ====================================================================== */
      var FlowAnnotations = (function () {
        "use strict";
        const ARROWS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
        const NUDGE = 8,
          NUDGE_BIG = 32,
          BURST_MS = 600;

        function create({ commit, kinds, threshold = 4, clock = Date.now, typing }) {
          const seen = new Set();
          kinds.forEach((k) => {
            if (!k.name) throw new Error("FlowAnnotations: every kind needs a name");
            if (seen.has(k.name)) throw new Error('FlowAnnotations: two kinds are named "' + k.name + '"');
            seen.add(k.name);
            if (k.movable)
              for (const need of ["origin", "place", "save"])
                if (typeof k[need] !== "function") throw new Error('FlowAnnotations: "' + k.name + '" is movable but has no ' + need);
          });
          const redrawOf = (kind) => kind.redraw || [];
          let grab = null;
          let burst = null; /* the arrow-key burst in progress: { key, at } */
          const keyOf = (f) => f.kind.name + "\u0000" + f.item;
          const find = (target, how) => {
            for (const kind of kinds) {
              if (how === "delete" && typeof kind.erase !== "function") continue; /* a kind that cannot erase is never offered a delete */
              const item = kind.match && kind.match(target, how);
              if (item) return { kind, item };
            }
            return null;
          };
          function erase(kind, item) {
            commit(() => kind.erase(item), { redraw: redrawOf(kind) });
            if (kind.erased) kind.erased(item);
          }
          return {
            /* does any kind recognise this target as one of its own? Lets the page keep one list of
               "not canvas background" instead of one per handler */
            owns: (target) => kinds.some((k) => k.owns && k.owns(target)),
            /* a × button, or any other way a kind has of asking to be removed */
            remove(name, item) {
              const kind = kinds.find((k) => k.name === name);
              if (!kind) throw new Error('FlowAnnotations: unknown annotation kind "' + name + '"');
              erase(kind, item);
            },
            down(target, pt) {
              const f = find(target, "pointer");
              if (!f || !f.kind.movable) return null;
              burst = null; /* a new gesture: the next arrow press starts a new undo step */
              const origin = f.kind.origin(f.item);
              grab = { ...f, start: pt, origin, pos: origin, moved: false };
              return { prevent: !!f.kind.preventDefault };
            },
            dragging: () => !!grab,
            move(pt, k = 1) {
              if (!grab) return;
              const dx = pt.x - grab.start.x,
                dy = pt.y - grab.start.y;
              if (!grab.moved) {
                if (Math.hypot(dx, dy) < threshold) return;
                grab.moved = true;
                if (grab.kind.lift) grab.kind.lift(grab.item);
              }
              grab.pos = { x: grab.origin.x + dx / k, y: grab.origin.y + dy / k };
              grab.kind.place(grab.item, grab.pos);
            },
            up() {
              const g = grab;
              grab = null;
              if (!g) return null;
              if (g.moved) commit(() => g.kind.save(g.item, g.pos, {}), { redraw: redrawOf(g.kind) });
              else if (g.kind.tap) g.kind.tap(g.item);
              if (g.kind.settle) g.kind.settle(g.item, { moved: g.moved });
              return { moved: g.moved };
            },
            /* arrow keys move the focused item; a quick burst on one item is a single undo step */
            keyDown(target, key, mods = {}) {
              if (typing && typing(target)) return false; /* typing in something: Delete and arrows are not ours */
              if (key === "Delete" || key === "Backspace") {
                const f = find(target, "delete");
                if (!f) return false;
                erase(f.kind, f.item);
                return true;
              }
              const dir = ARROWS[key];
              if (!dir) return false;
              const f = find(target, "nudge");
              if (!f || !f.kind.movable) return false;
              const by = mods.shift ? NUDGE_BIG : NUDGE;
              const at = f.kind.origin(f.item);
              const pos = { x: at.x + dir[0] * by, y: at.y + dir[1] * by };
              f.kind.place(f.item, pos);
              const now = clock();
              const first = !burst || burst.key !== keyOf(f) || now - burst.at >= BURST_MS;
              if (first) burst = { key: keyOf(f), at: now };
              commit(() => f.kind.save(f.item, pos, { nudged: true }), { undo: first, redraw: redrawOf(f.kind) });
              if (f.kind.settle) f.kind.settle(f.item, { moved: true, nudged: true });
              return true;
            },
            /* the pointer was taken away (not released): put it back, save nothing */
            cancel() {
              const g = grab;
              grab = null;
              if (!g) return false;
              if (g.moved) g.kind.place(g.item, g.origin);
              if (g.kind.settle) g.kind.settle(g.item, { moved: false, cancelled: true });
              return true;
            },
          };
        }
        return { create };
      })();
    </script>

    <script id="geometry-module">
      /* ======================================================================
         GEOMETRY MODULE
         The one place that knows where a frame is. Two questions, answered together:
         where it is meant to be (its place, from the groups, the saved positions and the device), and
         where it is right now (the place it is sliding to, and the time it set off). Connectors, note
         homing, hit-tests and the camera all ask here; nobody reads the page to find where a frame is.

         The slide is the module's, not the stylesheet's: it holds each frame's start, destination, wait,
         duration and curve, so "is it there yet" has an answer (restsAt, settled) that follows the flow's
         length instead of a timeout. The page runs one frame loop while something is moving: step(now),
         write what moved, redraw. It knows nothing about the page: no DOM, no clock, no layout object.
         "now" is a number the caller hands in.

         Interface
           m  the numbers one device gives the arrangement (FlowDevice.describe(id).metrics):
              colW phTop phH cap body collH deckS deckW peekX peekY closedW edge
           FlowGeometry.groupH(m)         -> an open group's height on that device (the head, the body, the caption)
           FlowGeometry.WORLD            groupLeft top0 gap head groupGap (world px)
           FlowGeometry.MOVES            { open, deck }: { dur ms, curve [x1,y1,x2,y2] } the slide the stylesheet
                                         eases its tilt and scale with, too
           FlowGeometry.arrange(input, m) -> { places, boxes, bottom }    pure; nothing is written back
             input  { groups: [{ id, screens, open }], screens: [every frame id, in order],
                      pos: { [group or loose frame id]: { x, y } } }   the saved positions on this device
             place  { x, y, r, s, d, z, fx, fy, deck, group, i }   s = drawn scale; d = ms it waits before it slides
             box    { x, top, w, h, n, open }                  one per group; empty ones too
           FlowGeometry.loosePlace(k, bottom, m) -> { x, y }    the k-th default place of a loose frame
           FlowGeometry.readingOrder(ids, place) -> [ids]       rows from the top, each left to right (less than 60px apart in y
                                                                is one row); place(id) -> { x, y }. A new list.
           FlowGeometry.bezier(x1, y1, x2, y2) -> (t) => y      the CSS cubic-bezier curve

           Extents. Nobody else measures a frame, a row, a deck or a group: they ask here.
           FlowGeometry.frame(m)          -> { w, screenTop, screenH, screenBottom, caption, h }   a frame, from the top of its column
           FlowGeometry.slotPitch(m)      -> the distance from one frame of an open group to the next
           FlowGeometry.rowW(n, m)        -> the width of a row of n frames (an empty row has room for one)
           FlowGeometry.deckSpread(n, m)  -> the width of a deck of n cards
           FlowGeometry.groupCornerFor(place) -> { x, y }   where a group sits so its first frame lands at `place`
           FlowGeometry.EDGES             every offset these are built from, named once (see its comment)

           const geo = FlowGeometry.create({ reduceMotion })
           geo.setMetrics(m)    geo.setReduceMotion(bool)    geo.reset()   (setMetrics first: retarget throws without it)
           geo.retarget(input, now, { snap }) -> arrangement   new places; frames slide there from where they
                                                are now. A frame seen for the first time, or any frame under
                                                reduced motion or { snap }, is simply there.
           geo.place(id)  geo.box(groupId)  geo.isDeck(id)     where it is meant to be; deck unless held
           geo.frame()  geo.groupCornerFor(place)              the statics above, for the metrics the geometry was given
           geo.slotPlace(groupId, i)                           { x, y } frame i of an open group; a dissolved group's frames land here
           geo.exitX(groupId, k = 0)                           the x where the k-th frame let out of a group lands: right of its row or deck
           geo.dropZone(groupId)                               { left, top, w, h } the box that lights up round a group, from its corner
           geo.dropBand(groupId, { count })                    { x0, x1, y0, y1 } where a dragged frame joins it, when `count` frames stay
           geo.slotAt(point, { skip })                         { group, idx } | null   the group a drop here joins and the slot it takes
                                                               among the frames that stay (skip: the ones being dragged). A closed
                                                               group always wins; of open ones, the one whose row's centre is nearer
           geo.closedTitle(groupId)                            { x, y } where a closed group's title stands, beside its deck
           geo.rect(id, now) -> { x, y, s }                    the frame's corner and the scale it is drawn at, now; without now, its place
           geo.screenRect(id, now)  geo.frameBox(id, now)      the screen area / the whole frame with its caption
           geo.frameAt(point, now, { margin, skip }) -> id|null  the frame whose screen is under the point
           geo.bounds()                                        everything on the canvas, with room round it
           geo.hold(id, x, y)  geo.release(ids)                a frame under the pointer; it stays put, then slides home
           geo.step(now) -> [ids that moved]    geo.restsAt()    geo.settled(now)
         ====================================================================== */
      var FlowGeometry = (function () {
        const WORLD = Object.freeze({ groupLeft: 96, top0: 150, gap: 104, head: 220, groupGap: 64 });
        const ROTS = [-2, 1.6, -1.2, 2.2];
        const PER_ROW = 5;

        /* the CSS cubic-bezier: solve x(t) = progress for t (Newton, then bisection), return y(t) */
        function bezier(x1, y1, x2, y2) {
          const cx = 3 * x1,
            bx = 3 * (x2 - x1) - cx,
            ax = 1 - cx - bx,
            cy = 3 * y1,
            by = 3 * (y2 - y1) - cy,
            ay = 1 - cy - by;
          const X = (t) => ((ax * t + bx) * t + cx) * t,
            Y = (t) => ((ay * t + by) * t + cy) * t,
            dX = (t) => (3 * ax * t + 2 * bx) * t + cx;
          return (x) => {
            if (x <= 0) return 0;
            if (x >= 1) return 1;
            let t = x;
            for (let i = 0; i < 8; i++) {
              const err = X(t) - x,
                d = dX(t);
              if (Math.abs(err) < 1e-6) return Y(t);
              if (Math.abs(d) < 1e-6) break;
              t -= err / d;
            }
            let lo = 0,
              hi = 1;
            t = x;
            for (let i = 0; i < 40; i++) {
              if (X(t) < x) lo = t;
              else hi = t;
              t = (lo + hi) / 2;
            }
            return Y(t);
          };
        }
        const MOVES = Object.freeze({
          open: Object.freeze({ dur: 800, curve: Object.freeze([0.22, 1.12, 0.36, 1]) }),
          deck: Object.freeze({ dur: 600, curve: Object.freeze([0.5, 0, 0.15, 1]) }),
        });
        const EASE = { open: bezier(...MOVES.open.curve), deck: bezier(...MOVES.deck.curve) };

        /* Every offset an extent is built from, named once. The values are what the canvas has always drawn; a test pins
           each one. They are not all consistent with each other on purpose (a deck's band and exit assume its widest
           fan of four cards, however many it holds; the drop zone is 4px narrower than the box it lights up), so a
           change to any of them is a change to what the user sees.
             rowPad, rowMin   an open group's box is its row and this much, and never narrower than rowMin
             deckPeeks        peeks of a deck counted in its drop band and its exit: the widest fan, four cards
             loosePitch       loose frames in a row stand a column and this much apart (loosePlace, frames let out of a group)
             looseRowGap/Top  rows of loose frames: this far below the previous row; the first, this far below the groups
             titlePad         a closed group's title starts this far right of its deck
             titleRise        and this far above the middle of the collapsed height
             band             where a dragged frame joins a group: how far past the group's corner and slots it reaches
               open  left, top (px); right (column widths past the last slot); bottom (px below the frames' column)
               closed  left, right (px past the deck's widest fan), top, bottom (px below the collapsed height)
             zone             the box the page lights up: inset (px each side of the row or deck), above (px above the
                              group's corner, plus the head when closed), taller (px added to the height)
             exit             where frames let out of a group land, right of the row (open) or of the deck's widest fan (closed) */
        const EDGES = Object.freeze({
          rowPad: 60,
          rowMin: 460,
          deckPeeks: 3,
          loosePitch: 70,
          looseRowGap: 100,
          looseTop: 140,
          titlePad: 60,
          titleRise: 100,
          band: Object.freeze({
            open: Object.freeze({ left: 90, right: 1.4, top: 30, bottom: 70 }),
            closed: Object.freeze({ left: 30, right: 70, top: 30, bottom: 20 }),
          }),
          zone: Object.freeze({
            open: Object.freeze({ inset: 28, above: 34, taller: 60 }),
            closed: Object.freeze({ inset: 34, above: 14, taller: 10 }),
          }),
          exit: Object.freeze({ open: 40, closed: 120 }),
        });

        const groupH = (m) => WORLD.head + m.body + m.cap;
        /* a frame, from the top of its column: the bezel above the screen, the screen, then the caption */
        const frame = (m) => ({
          w: m.colW,
          screenTop: m.phTop,
          screenH: m.phH,
          screenBottom: m.phTop + m.phH,
          caption: m.cap,
          h: m.phTop + m.phH + m.cap,
        });
        const slotPitch = (m) => m.colW + WORLD.gap;
        /* a row of n frames, side by side (an empty row has room for one) */
        const rowW = (n, m) => Math.max(1, n) * slotPitch(m) - WORLD.gap;
        /* a deck of n cards: the first, and the peek of each card behind it */
        const deckSpread = (n, m) => m.deckW + m.peekX * Math.max(n - 1, 0);
        /* the corner a group takes so its first frame lands at `place` (the frame it replaces) */
        const groupCornerFor = (place) => ({ x: place.x, y: place.y - WORLD.head });
        /* frame i of an open group whose box is `box` */
        /* the widest fan a deck's band and exit allow for, whatever it holds */
        const widestDeck = (m) => deckSpread(EDGES.deckPeeks + 1, m);
        const slotIn = (box, i, m) => ({ x: box.x + i * slotPitch(m), y: box.top + WORLD.head });
        const exitIn = (box, k, m) =>
          box.x +
          (box.open ? box.n * slotPitch(m) + EDGES.exit.open : widestDeck(m) + EDGES.exit.closed) +
          k * (m.colW + EDGES.loosePitch);
        /* the area where a dragged frame joins a group, when `count` frames stay in it */
        function bandIn(box, count, m) {
          if (box.open) {
            const b = EDGES.band.open;
            return {
              x0: box.x - b.left,
              x1: box.x + count * slotPitch(m) + m.colW * b.right,
              y0: box.top - b.top,
              y1: box.top + WORLD.head + frame(m).h + b.bottom,
            };
          }
          const b = EDGES.band.closed;
          return {
            x0: box.x - b.left,
            x1: box.x + widestDeck(m) + b.right,
            y0: box.top - b.top,
            y1: box.top + m.collH + b.bottom,
          };
        }
        /* the box the page lights up round a group, relative to the group's corner */
        function zoneIn(box, m) {
          if (box.open) {
            const z = EDGES.zone.open;
            return { left: -z.inset, top: -z.above, w: rowW(box.n, m) + 2 * z.inset, h: frame(m).h + z.taller };
          }
          const z = EDGES.zone.closed;
          return { left: -z.inset, top: -WORLD.head - z.above, w: deckSpread(box.n, m) + 2 * z.inset, h: m.collH + z.taller };
        }

        /* frames in the order they are read: rows from the top, each row left to right (frames less than 60px apart in y
           are one row). place(id) -> { x, y }. Returns a new list. */
        function readingOrder(ids, place) {
          return [...ids]
            .sort((a, b) => place(a).y - place(b).y || place(a).x - place(b).x)
            .sort((a, b) => (Math.abs(place(a).y - place(b).y) < 60 ? place(a).x - place(b).x : place(a).y - place(b).y));
        }
        /* loose frames with nowhere saved line up in rows of five below the groups */
        function loosePlace(k, bottom, m) {
          return {
            x: WORLD.groupLeft + (k % PER_ROW) * (m.colW + EDGES.loosePitch),
            y: bottom + EDGES.looseTop + Math.floor(k / PER_ROW) * (frame(m).h + EDGES.looseRowGap),
          };
        }

        function arrange(input, m) {
          const { groups, screens, pos } = input;
          const places = {},
            boxes = {};
          let top = WORLD.top0,
            bottom = WORLD.top0;
          groups.forEach((g) => {
            const n = g.screens.length,
              h = g.open ? groupH(m) : m.collH,
              w = g.open ? Math.max(rowW(n, m) + EDGES.rowPad, EDGES.rowMin) : m.closedW;
            const p = pos[g.id];
            let box;
            if (p) box = { x: p.x, top: p.y, w, h, n, open: g.open };
            else {
              box = { x: WORLD.groupLeft, top, w, h, n, open: g.open };
              if (n) top += h + WORLD.groupGap;
            }
            boxes[g.id] = box;
            if (n) bottom = Math.max(bottom, box.top + h);
            g.screens.forEach((id, i) => {
              places[id] = g.open
                ? {
                    ...slotIn(box, i, m),
                    r: 0,
                    s: 1,
                    d: i * 60,
                    z: n - i,
                    fx: 0,
                    fy: 0,
                    deck: false,
                    group: g.id,
                    i,
                  }
                : {
                    x: box.x + m.peekX * i,
                    y: box.top + 10 + m.peekY * (n - 1 - i) - m.phTop * m.deckS,
                    r: ROTS[i % 4],
                    s: m.deckS,
                    d: (n - 1 - i) * 40,
                    z: n - i,
                    fx: 22 * i,
                    fy: -10 * i,
                    deck: true,
                    group: g.id,
                    i,
                  };
            });
          });
          let k = 0;
          screens.forEach((id) => {
            if (places[id]) return;
            const p = pos[id] || loosePlace(k++, bottom, m);
            places[id] = { x: p.x, y: p.y, r: 0, s: 1, d: 0, z: 5, fx: 0, fy: 0, deck: false, group: null, i: -1 };
          });
          return { places, boxes, bottom };
        }

        function create(opts = {}) {
          let m = null,
            reduce = !!opts.reduceMotion,
            arr = { places: {}, boxes: {}, bottom: WORLD.top0 },
            order = [],
            groupIds = []; /* the groups, in the order the arrangement was given them */
          const cur = {} /* where each frame was last reported to be */,
            tw = {} /* id -> the slide it is on: { from, to, start, dur, ease } */,
            held = new Set();

          const posAt = (t, now) => {
            const p = t.dur > 0 ? Math.min(1, Math.max(0, (now - t.start) / t.dur)) : 1;
            if (p <= 0) return t.from;
            if (p >= 1) return t.to;
            const e = t.ease(p),
              lerp = (a, b) => a + (b - a) * e;
            return { x: lerp(t.from.x, t.to.x), y: lerp(t.from.y, t.to.y), s: lerp(t.from.s, t.to.s) };
          };
          const rect = (id, now) => {
            const pl = arr.places[id];
            if (!pl) return undefined;
            if (now === undefined) return { x: pl.x, y: pl.y, s: pl.s };
            const t = tw[id];
            const p = t ? posAt(t, now) : cur[id] || pl;
            return { x: p.x, y: p.y, s: p.s };
          };
          /* a frame is drawn from its corner, scaled about it: a deck frame is small, and grows as it fans out */
          const screenRect = (id, now) => {
            const r = rect(id, now);
            const f = frame(m);
            return r && { x: r.x, y: r.y + f.screenTop * r.s, w: f.w * r.s, h: f.screenH * r.s };
          };
          const frameBox = (id, now) => {
            const r = rect(id, now);
            const f = frame(m);
            return r && { x: r.x, y: r.y, w: f.w * r.s, h: f.h * r.s };
          };

          function retarget(input, now, o = {}) {
            if (!m) throw new Error("FlowGeometry: setMetrics before retarget");
            const next = arrange(input, m);
            order = input.screens.slice();
            groupIds = input.groups.map((g) => g.id);
            const keep = new Set(order);
            Object.keys(cur).forEach((id) => {
              if (!keep.has(id)) {
                delete cur[id];
                delete tw[id];
                held.delete(id);
              }
            });
            order.forEach((id) => {
              let pl = next.places[id];
              if (held.has(id)) {
                pl = next.places[id] = { ...pl, x: cur[id].x, y: cur[id].y, s: 1 };
                return;
              }
              if (!cur[id] || o.snap || reduce) {
                cur[id] = { x: pl.x, y: pl.y, s: pl.s };
                delete tw[id];
                return;
              }
              const old = tw[id],
                to = { x: pl.x, y: pl.y, s: pl.s };
              const same = (a, b) => a.x === b.x && a.y === b.y && a.s === b.s;
              if (old && same(old.to, to)) return;
              const from = old ? posAt(old, now) : cur[id];
              if (!old && same(from, to)) return;
              const kind = pl.deck ? "deck" : "open";
              /* it waits its turn only when it was at rest. Told again while still waiting it keeps the turn it
                 was promised; told again on its way it carries on, so a group dragged along keeps trailing */
              const start = old ? Math.max(now, old.start) : now + pl.d;
              tw[id] = { from: { x: from.x, y: from.y, s: from.s }, to, start, dur: MOVES[kind].dur, ease: EASE[kind] };
            });
            arr = next;
            return arr;
          }

          function step(now) {
            const moved = [];
            Object.keys(tw).forEach((id) => {
              const t = tw[id],
                p = posAt(t, now),
                c = cur[id];
              if (!c || c.x !== p.x || c.y !== p.y || c.s !== p.s) {
                cur[id] = { x: p.x, y: p.y, s: p.s };
                moved.push(id);
              }
              if (now >= t.start + t.dur) delete tw[id];
            });
            return moved;
          }

          return {
            setMetrics(next) {
              m = next;
            },
            setReduceMotion(on) {
              reduce = !!on;
              if (reduce)
                Object.keys(tw).forEach((id) => {
                  cur[id] = { x: tw[id].to.x, y: tw[id].to.y, s: tw[id].to.s };
                  delete tw[id];
                });
            },
            reset() {
              Object.keys(cur).forEach((id) => delete cur[id]);
              Object.keys(tw).forEach((id) => delete tw[id]);
              held.clear();
              arr = { places: {}, boxes: {}, bottom: WORLD.top0 };
              order = [];
              groupIds = [];
            },
            retarget,
            step,
            place: (id) => arr.places[id],
            box: (id) => arr.boxes[id],
            frame: () => frame(m),
            groupCornerFor,
            slotPlace: (id, i) => slotIn(arr.boxes[id], i, m),
            exitX: (id, k = 0) => exitIn(arr.boxes[id], k, m),
            dropZone: (id) => zoneIn(arr.boxes[id], m),
            dropBand: (id, { count }) => bandIn(arr.boxes[id], count, m),
            closedTitle: (id) => ({
              x: deckSpread(Math.max(arr.boxes[id].n, 1), m) + EDGES.titlePad,
              y: Math.max(0, Math.round(m.collH / 2 - EDGES.titleRise)),
            }),
            /* the group a dragged frame would join at this point, and the slot it would take among the frames that
               stay (skip: the ones being dragged). A closed group always wins, an open one when its row's centre is
               nearer; null when the point is over no group. */
            slotAt(pt, { skip = [] } = {}) {
              const out = new Set(skip),
                stay = {};
              Object.keys(arr.places).forEach((fid) => {
                const g = arr.places[fid].group;
                if (g && !out.has(fid)) stay[g] = (stay[g] || 0) + 1;
              });
              let best = null;
              for (const id of groupIds) {
                const box = arr.boxes[id];
                if (!box) continue;
                const count = stay[id] || 0,
                  b = bandIn(box, count, m);
                if (pt.x < b.x0 || pt.x > b.x1 || pt.y < b.y0 || pt.y > b.y1) continue;
                if (!box.open) {
                  best = { group: id, idx: count, dist: 0 };
                  continue;
                }
                const idx = Math.max(0, Math.min(count, Math.round((pt.x - box.x - m.colW / 2) / slotPitch(m)))),
                  /* the row's centre, counted a pitch a frame (no gap trimmed: this is how the nearest group has always been picked) */
                  dist = Math.abs(pt.x - (box.x + (Math.max(1, count) * slotPitch(m)) / 2));
                if (!best || dist < best.dist) best = { group: id, idx, dist };
              }
              return best && { group: best.group, idx: best.idx };
            },
            isDeck: (id) => !!arr.places[id] && arr.places[id].deck && !held.has(id),
            rect,
            screenRect,
            frameBox,
            frameAt(pt, now, o = {}) {
              const margin = o.margin || 0;
              for (const id of order) {
                if (id === o.skip || !arr.places[id] || (arr.places[id].deck && !held.has(id))) continue;
                const r = screenRect(id, now);
                if (pt.x > r.x - margin && pt.x < r.x + r.w + margin && pt.y > r.y - margin && pt.y < r.y + r.h + margin)
                  return id;
              }
              return null;
            },
            bounds() {
              let x0 = 1e9,
                y0 = 1e9,
                x1 = -1e9,
                y1 = -1e9;
              const add = (x, y, w, h) => {
                x0 = Math.min(x0, x);
                y0 = Math.min(y0, y);
                x1 = Math.max(x1, x + w);
                y1 = Math.max(y1, y + h);
              };
              Object.values(arr.boxes).forEach((b) => b.n && add(b.x - 20, b.top - 20, b.w + 40, b.h + 40));
              order.forEach((id) => {
                if (arr.places[id].group) return;
                const b = frameBox(id);
                add(b.x - 20, b.y - 20, b.w + 40, b.h + 40);
              });
              if (x0 > x1) return { x: 0, y: 0, w: 900, h: 600 };
              return { x: x0 - 40, y: y0 - 60, w: x1 - x0 + 80, h: y1 - y0 + 120 };
            },
            hold(id, x, y) {
              held.add(id);
              cur[id] = { x, y, s: 1 };
              delete tw[id];
              if (arr.places[id]) arr.places[id] = { ...arr.places[id], x, y, s: 1 };
            },
            release(ids) {
              ids.forEach((id) => held.delete(id));
            },
            restsAt() {
              return Object.values(tw).reduce((a, t) => Math.max(a, t.start + t.dur), 0);
            },
            settled(now) {
              return Object.values(tw).every((t) => now >= t.start + t.dur);
            },
          };
        }

        return { WORLD, EDGES, MOVES, groupH, frame, slotPitch, rowW, deckSpread, groupCornerFor, arrange, loosePlace, readingOrder, bezier, create };
      })();
    </script>

    <script id="routing-module">
      /* ======================================================================
         ROUTING MODULE
         The line a connector draws between two frames: which sides it leaves and enters by, the
         right-angle path between them, and the rounded shape with its arrowhead. Pure geometry on rects
         handed in; it knows nothing about the page, the animation, or where a rect came from.

         Interface
           FlowRouting.route(a, b, edge)  -> { p0, pts }   from frame rect a to frame rect b
             a, b   { x, y, w, h } the screen areas, in world px
             edge   how far down a screen its side ports sit (the device's)
           FlowRouting.shape({ pts })     -> { d, arr, mid }  svg path, arrowhead points, midpoint
           FlowRouting.sidePt(rect, side, edge)  -> { x, y, nx, ny }   a port and the way it faces
           FlowRouting.pickSides(a, b)    -> [fromSide, toSide]
           FlowRouting.ortho(a, b)        a, b: { x, y, nx, ny }; b may be a free point (nx = ny = 0)
           FlowRouting.rounded(pts, r)    svg path through pts with rounded corners
           FlowRouting.leader(frame, left, top, w, h, moved) -> { x0, y0, d, end }   a scanner finding's leader: from the frame's
                                          bottom edge to its card (frame: FlowGeometry.frame's w and screenBottom)
         ====================================================================== */
      var FlowRouting = (function () {
        function sidePt(r, side, edge) {
          const eo = Math.min(edge, r.h - 6);
          return side === "R"
            ? { x: r.x + r.w, y: r.y + eo, nx: 1, ny: 0 }
            : side === "L"
              ? { x: r.x, y: r.y + eo, nx: -1, ny: 0 }
              : side === "B"
                ? { x: r.x + r.w / 2, y: r.y + r.h, nx: 0, ny: 1 }
                : { x: r.x + r.w / 2, y: r.y, nx: 0, ny: -1 };
        }
        function pickSides(a, b) {
          const g = 24;
          if (b.x >= a.x + a.w - g) return ["R", "L"];
          if (b.x + b.w <= a.x + g) return ["L", "R"];
          return b.y + b.h / 2 >= a.y + a.h / 2 ? ["B", "T"] : ["T", "B"];
        }
        /* flow lines are straight runs with rounded corners: horizontal out of a frame, one jog in the gutter, horizontal in.
           a: { x, y, nx, ny } the port and the way it faces; b: the same, or a free point (nx = ny = 0) while dragging */
        function ortho(a, b) {
          const S = 26,
            P = (x, y) => ({ x, y }),
            out = [P(a.x, a.y)],
            bn = b.nx || b.ny ? b : null,
            horA = a.nx !== 0,
            ahead = horA ? (b.x - a.x) * a.nx : (b.y - a.y) * a.ny,
            opposed = !!bn && bn.nx === -a.nx && bn.ny === -a.ny;
          const jog = (limit) => {
            if (horA) {
              if (ahead >= limit) {
                const mx = (a.x + b.x) / 2;
                out.push(P(mx, a.y), P(mx, b.y));
              } else {
                const ox = a.x + a.nx * S;
                out.push(P(ox, a.y), P(ox, b.y));
              }
            } else if (ahead >= limit) {
              const my = (a.y + b.y) / 2;
              out.push(P(a.x, my), P(b.x, my));
            } else {
              const oy = a.y + a.ny * S;
              out.push(P(a.x, oy), P(b.x, oy));
            }
          };
          const around = () => {
            /* the target is beside or behind: step out, go round, step in */
            const s1 = P(a.x + a.nx * S, a.y + a.ny * S);
            if (!bn) return out.push(s1, horA ? P(s1.x, b.y) : P(b.x, s1.y));
            const s2 = P(b.x + bn.nx * S, b.y + bn.ny * S);
            if (opposed && horA) {
              const ym = Math.abs(a.y - b.y) < 24 ? Math.min(a.y, b.y) - 70 : (a.y + b.y) / 2;
              out.push(s1, P(s1.x, ym), P(s2.x, ym), s2);
            } else if (opposed) {
              const xm = Math.abs(a.x - b.x) < 24 ? Math.max(a.x, b.x) + 70 : (a.x + b.x) / 2;
              out.push(s1, P(xm, s1.y), P(xm, s2.y), s2);
            } else out.push(s1, horA ? P(s1.x, s2.y) : P(s2.x, s1.y), s2);
          };
          if (!bn) jog(S);
          else if (opposed && ahead >= 2 * S) jog(2 * S);
          else if (!opposed && (horA ? bn.ny !== 0 : bn.nx !== 0)) {
            const c = horA ? P(b.x, a.y) : P(a.x, b.y);
            const okA = horA ? (c.x - a.x) * a.nx >= S : (c.y - a.y) * a.ny >= S;
            const okB = horA ? (c.y - b.y) * bn.ny >= S : (c.x - b.x) * bn.nx >= S;
            if (okA && okB) out.push(c);
            else around();
          } else around();
          out.push(P(b.x, b.y));
          /* drop repeats and points that sit on a straight run, so level frames get one clean line */
          const clean = [];
          out.forEach((q) => {
            const l = clean[clean.length - 1];
            if (!l || Math.abs(q.x - l.x) > 0.5 || Math.abs(q.y - l.y) > 0.5) clean.push(q);
          });
          return clean.filter((q, i) => {
            if (i === 0 || i === clean.length - 1) return true;
            const a = clean[i - 1],
              n = clean[i + 1];
            return Math.abs((q.x - a.x) * (n.y - q.y) - (q.y - a.y) * (n.x - q.x)) >= 0.5;
          });
        }
        function rounded(pts, r = 14) {
          let d = `M${pts[0].x} ${pts[0].y}`;
          for (let i = 1; i < pts.length - 1; i++) {
            const p = pts[i],
              a = pts[i - 1],
              b = pts[i + 1],
              l1 = Math.hypot(p.x - a.x, p.y - a.y),
              l2 = Math.hypot(b.x - p.x, b.y - p.y),
              rr = Math.min(r, l1 / 2, l2 / 2),
              u1 = { x: (p.x - a.x) / l1, y: (p.y - a.y) / l1 },
              u2 = { x: (b.x - p.x) / l2, y: (b.y - p.y) / l2 };
            d += `L${p.x - u1.x * rr} ${p.y - u1.y * rr}Q${p.x} ${p.y} ${p.x + u2.x * rr} ${p.y + u2.y * rr}`;
          }
          const L = pts[pts.length - 1];
          return d + `L${L.x} ${L.y}`;
        }
        function polyMid(pts) {
          const seg = pts.slice(1).map((q, i) => Math.hypot(q.x - pts[i].x, q.y - pts[i].y)),
            half = seg.reduce((x, y) => x + y, 0) / 2;
          let run = 0;
          for (let i = 0; i < seg.length; i++) {
            if (run + seg[i] >= half) {
              const t = seg[i] ? (half - run) / seg[i] : 0;
              return { x: pts[i].x + (pts[i + 1].x - pts[i].x) * t, y: pts[i].y + (pts[i + 1].y - pts[i].y) * t };
            }
            run += seg[i];
          }
          return pts[pts.length - 1];
        }
        function shape(c) {
          const pts = c.pts.map((q) => ({ x: q.x, y: q.y })),
            n = pts.length,
            tip = pts[n - 1],
            prev = pts[n - 2],
            l = Math.hypot(tip.x - prev.x, tip.y - prev.y) || 1,
            t = { x: (tip.x - prev.x) / l, y: (tip.y - prev.y) / l },
            pp = { x: -t.y, y: t.x },
            mid = polyMid(pts);
          /* the line stops where the arrowhead starts */
          if (l > 12) pts[n - 1] = { x: tip.x - t.x * 9, y: tip.y - t.y * 9 };
          const b1 = { x: tip.x - t.x * 10 + pp.x * 6.5, y: tip.y - t.y * 10 + pp.y * 6.5 },
            b2 = { x: tip.x - t.x * 10 - pp.x * 6.5, y: tip.y - t.y * 10 - pp.y * 6.5 };
          return {
            d: rounded(pts),
            arr: `${tip.x},${tip.y} ${b1.x},${b1.y} ${b2.x},${b2.y}`,
            mid,
          };
        }
        function route(a, b, edge) {
          const [sa, sb] = pickSides(a, b),
            p0 = sidePt(a, sa, edge),
            p3 = sidePt(b, sb, edge);
          return { p0, pts: ortho(p0, p3) };
        }

        /* a scanner finding's leader, from the frame's bottom edge to its card (left, top, w, h: the card, in the frame's own
           coordinates; moved: the user has put it somewhere). frame: the frame's anatomy, from FlowGeometry.frame
           (w, screenBottom). The dock and the run down the gutter are the leader's own drawing, measured from those two.
           Unmoved: leave the frame's bottom edge, slip between frame and caption, run down the gutter and land on the card.
           Moved: a smooth path from the same dock to the nearest side of the card. -> { x0, y0, d, end } */
        function leader(frame, left, top, w, h, moved) {
          const fr = frame.screenBottom,
            x0 = frame.w - 62,
            right = left + w;
          if (!moved) {
            const yRun = fr + 24,
              runX = frame.w + 22,
              midY = top + 26,
              toTop = runX <= right - 14,
              lead = `M${x0} ${fr}V${fr + 10}Q${x0} ${yRun} ${x0 + 14} ${yRun}H${runX - 14}Q${runX} ${yRun} ${runX} ${yRun + 14}`;
            return {
              x0,
              y0: fr,
              d: toTop ? `${lead}V${top}` : `${lead}V${midY - 14}Q${runX} ${midY} ${runX - 14} ${midY}H${right}`,
              end: toTop ? [runX, top] : [right, midY],
            };
          }
          const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
          let T, nB;
          if (top >= fr + 28) {
            T = [clamp(x0, left + 18, right - 18), top];
            nB = { nx: 0, ny: -1 };
          } else if (left >= frame.w - 4) {
            T = [left, top + h / 2];
            nB = { nx: -1, ny: 0 };
          } else if (right <= 4) {
            T = [right, top + h / 2];
            nB = { nx: 1, ny: 0 };
          } else {
            T = [clamp(x0, left + 18, right - 18), top + h];
            nB = { nx: 0, ny: 1 };
          }
          const pts = ortho({ x: x0, y: fr, nx: 0, ny: 1 }, { x: T[0], y: T[1], ...nB });
          return { x0, y0: fr, d: rounded(pts, 12), end: T };
        }
        return { sidePt, pickSides, ortho, rounded, shape, route, leader };
      })();
    </script>


    <script id="arrange-module">
      /* ======================================================================
         ARRANGE MODULE
         The edits that move frames about as a whole: tidy the canvas, take frames out of their groups, dissolve a
         group. They are writes to the layout (through its mutators, nothing else) worked out from where the geometry
         has things now. No DOM, no commit, no toast, no camera: the page wraps a call in a commit and says what
         happened. Knows no kind by name: moved notes and findings are let go through the layout.

         Interface
           const arrange = FlowArrange.create({ layout, geo, frames, device, metrics, input })
             layout   a FlowLayout
             geo      where things are: box(groupId), place(frameId), slotPlace(groupId, i), exitX(groupId, k) (what
                      FlowGeometry.create answers: where frames land is the geometry's, not the arrangement's)
             frames   every frame id, in order
             device   () => id of the device whose places are written
             metrics  () => the device's metrics (FlowDevice.describe(id).metrics); only tidy reads them, to ask
                      FlowGeometry.arrange and loosePlace where the loose frames go
             input    () => what FlowGeometry.arrange is given: { groups, screens, pos }
           arrange.tidy() -> changed   Put the view in order without touching what the flows are: groups keep the order
                                       they are stacked in (top to bottom, then left to right; empty ones last), lose their
                                       places on this device, and the loose frames are pinned in reading order below them.
                                       Moved notes and findings go back where the scan put them. Membership and order,
                                       connectors, names and notes' text are left alone. True when the layout changed.
           arrange.takeOut(ids) -> [ids that were in a group]
                                       Those frames leave their groups and are set down in a row to the right of the group
                                       they were in (an open group: at the height they had; a closed one: at its own
                                       height). A group left empty goes. Loose frames in `ids` are ignored; when none were
                                       in a group, nothing is written.
           arrange.dissolve(group)     The group goes and its frames stay on the canvas, in a row where it was, in order.
         ====================================================================== */
      var FlowArrange = (function () {
        function create({ layout, geo, frames, device, metrics, input }) {

          function tidy() {
            const was = layout.snapshot(),
              dev = device(),
              M = metrics();
            /* keep the stacking order you arranged: top to bottom, then left to right */
            const rank = (L) => (L.screens.length ? 0 : 1),
              at = (L) => geo.box(L.id);
            layout.orderGroups(
              layout.groups
                .slice()
                .sort((a, b) => rank(a) - rank(b) || at(a).top - at(b).top || at(a).x - at(b).x)
                .map((L) => L.id),
            );
            const loose = FlowGeometry.readingOrder(
              frames.filter((id) => !layout.groupOf(id)),
              geo.place,
            );
            layout.forgetPlaces([...layout.groups.map((L) => L.id), ...loose], dev);
            /* pinning the loose frames is the user's tidy, so it is written here, in reading order, and nowhere else */
            const { bottom } = FlowGeometry.arrange(input(), M);
            loose.forEach((id, k) => layout.place(dev, id, FlowGeometry.loosePlace(k, bottom, M)));
            /* scanned notes and findings back where the scan put them (each kind knows its own rule) */
            layout.letGoOfMoves(dev);
            return layout.snapshot() !== was; /* the same test commit uses */
          }

          function takeOut(ids) {
            const dev = device();
            ids = ids.filter((id) => layout.groupOf(id));
            if (!ids.length) return [];
            const byGroup = new Map();
            ids.forEach((id) => {
              const L = layout.groupOf(id);
              if (!byGroup.has(L)) byGroup.set(L, []);
              byGroup.get(L).push(id);
            });
            /* right of the group they left, in a row; level with their old slot, or with a closed group's row */
            byGroup.forEach((list, L) => {
              list.forEach((id, k) => {
                layout.place(dev, id, { x: geo.exitX(L.id, k), y: L.open ? geo.place(id).y : geo.slotPlace(L.id, 0).y });
              });
            });
            layout.takeOut(ids);
            return ids;
          }

          function dissolve(L) {
            const dev = device();
            L.screens.forEach((id, k) => layout.place(dev, id, geo.slotPlace(L.id, k)));
            layout.takeOut(L.screens);
          }

          return { tidy, takeOut, dissolve };
        }
        return { create };
      })();
    </script>

    <script id="selection-module">
      /* ======================================================================
         SELECTION MODULE
         What is selected, kept in one place: the frames, which of them is the primary one (the frame the toolbar, the
         Inspect panel, the arrow keys and the counter, "03/09", are about), and the selected connector. A connector and frames are never
         selected together: choosing frames lets go of the connector, selecting a connector lets go of the frames.
         (Deselecting frames, by itself, leaves a selected connector alone.) No DOM, no product knowledge, and it
         knows no panel: `follows` needs only something with follow(subject). The page listens and paints.

         Interface
           const sel = FlowSelection.create()
           sel.set(ids, primary?)  select exactly these frames. The primary is `primary` when it is one of them, else the
                                   last. No frames, no primary. Selecting frames lets go of a connector.
           sel.toggle(id)          shift-click: add the frame and make it the primary, or take it out (the primary then
                                   is the last that is left)
           sel.selectConn(id)      select a connector; no frame is selected then
           sel.clearConn()
           sel.prune(exists)       keep only the frames for which exists(id) is true (an undo that brought back a layout
                                   without them); the primary falls back to the last that is left
           sel.state() -> { ids, primary, conn }   copies: change them and nothing happens
           sel.ids()  sel.primary()  sel.conn()  sel.has(id)  sel.count()
           sel.on(listener) -> off listener(state, change) after every change, never for a call that changed nothing.
                                   change: { frames, primary, conn }, each true when that part changed.
           FlowSelection.follows(sel, panel) -> off
                                   the panel (FlowPanel) follows the primary frame, however the selection changes: a
                                   click, a marquee, a shift-click, select all, the start of a drag, deselecting. The
                                   panel itself only follows while it is showing Inspect.
         ====================================================================== */
      var FlowSelection = (function () {
        function create() {
          let ids = [],
            primary = null,
            conn = null;
          const listeners = new Set();
          const state = () => ({ ids: [...ids], primary, conn });
          /* run a change, then tell the listeners if it was one */
          function run(fn) {
            const before = { ids: ids.join("\u0000"), primary, conn };
            fn();
            const change = { frames: before.ids !== ids.join("\u0000"), primary: before.primary !== primary, conn: before.conn !== conn };
            if (!change.frames && !change.primary && !change.conn) return false;
            listeners.forEach((l) => l(state(), change));
            return true;
          }
          const put = (list, want) => {
            ids = [...new Set(list)];
            primary = ids.length ? (ids.includes(want) ? want : ids[ids.length - 1]) : null;
          };
          const api = {
            set(list, want) {
              return run(() => {
                put(list, want);
                if (ids.length) conn = null;
              });
            },
            toggle(id) {
              return run(() => {
                if (ids.includes(id)) put(ids.filter((x) => x !== id));
                else put([...ids, id], id);
                if (ids.length) conn = null;
              });
            },
            selectConn(id) {
              return run(() => {
                put([]);
                conn = id;
              });
            },
            clearConn() {
              return run(() => {
                conn = null;
              });
            },
            prune(exists) {
              return run(() => put(ids.filter(exists), primary));
            },
            state,
            ids: () => [...ids],
            primary: () => primary,
            conn: () => conn,
            has: (id) => ids.includes(id),
            count: () => ids.length,
            on(listener) {
              listeners.add(listener);
              return () => listeners.delete(listener);
            },
          };
          return api;
        }
        function follows(sel, panel) {
          return sel.on((st) => panel.follow(st.primary));
        }
        return { create, follows };
      })();
    </script>

    <script id="pointer-module">
      /* ======================================================================
         POINTER MODULE
         Decides what a press, a move and a release mean on the canvas: pan, drag a frame or a group, draw a marquee,
         draw a connector from an edge dot, drag a note or a finding card, or nothing. Its own mode is idle, pending (a frame or group is held,
         not yet dragged), pan, marquee or connect; whether a frame drag (FlowGesture) or an annotation drag (FlowAnnotations) is live is asked of
         the host each time, because those two own that fact. The page used to hold this as
         seven flags (pan, moved, press, mq, connDrag, handMode, spaceDown) read by four handlers; here it is one mode
         and the rules for moving between modes, in one place. Everything it makes happen is done by the page, through
         the host. It knows no DOM: the page says what was pressed (a "hit") and where, in screen pixels.

         Interface
           const pointer = FlowPointer.create(host)     host: the page's side (see below); it must have every function
           pointer.down({ button, x, y, shift, hit }) -> { prevent }
               button  0 primary, 1 middle (pans, in any tool); any other is ignored.
               hit     what the press landed on, only for the primary button (the page works it out, in this order):
                         { kind: "annotation", prevent }  a note, a card, a chip, a caption: its own press (an annotation
                                                         drag may have begun: the host says so, see annotationDragging)
                         { kind: "port", id, side }      an edge dot: draws a connector from frame `id`
                         { kind: "grip", group }         a group's grip: drags the group
                         { kind: "deck", group }         a closed group's deck: drags the group
                         { kind: "frame", id }           a frame: drags it (and what is selected with it)
                         { kind: "chrome" }              a header, a button, a text field: nothing starts
                         { kind: "canvas" }              empty canvas: a marquee, or a pan with the hand tool or Space
               -> prevent: true when the page should call preventDefault on the event.
           pointer.move({ x, y })    pointer.up()    pointer.cancel()    (the pointercancel event: calls off everything)
           pointer.cancelConnect() -> bool   Escape while a connector is being drawn: calls it off; false if none was
           pointer.cancelDrag() -> bool      Escape while a frame, a group or an annotation is being dragged: calls it
                                             off; false if nothing was being dragged
           pointer.consumeMoved() -> bool    the click that follows a drag is not a click: true once if the pointer
                                             travelled since the press, then forgets
           pointer.setHand(on)  pointer.space(down)  pointer.blur()   the hand tool (H, V) and Space held; a window that
                                             loses focus lets Space go
           pointer.state() -> { mode, moved, hand, space }   mode: idle | pending | pan | marquee | connect

           host (what the page does; all required)
             stopPlay()                      a press stops the flow that is playing
             hand(on)                        the hand tool is on (set, or Space held): show it
             camera() -> { x, y }  moveCamera(x, y)  panStarted()  panEnded()
             gestureActive() -> bool         a frame or group drag is under way (FlowGesture)
             beginDrag(press, at) -> bool    press { kind: "frame", id } | { kind: "group", group }; at { x, y }: where it
                                             was pressed. False when there is nothing to drag (the press is dropped).
             moveDrag(pt)  endDrag()  cancelDrag()
             annotationDragging() -> bool    an annotation is being dragged (FlowAnnotations)
             moveAnnotation(pt)  endAnnotation()  cancelAnnotation()
             startMarquee(at, additive)  moveMarquee(pt)  endMarquee()  cancelMarquee()   additive: shift was held
             startConnect(hit)  moveConnect(pt)  endConnect(cancelled)

           Rules: a press on a frame or group does not drag until the pointer is more than 5px away; a pan does not start
           until 4px; a marquee follows from the first move. While a connector is drawn every move is its; otherwise
           while an annotation is dragged every move is the annotation's; otherwise a drag, a marquee, a pan, in that order.
           A release ends what is live (a drag, an annotation drag, a marquee, a pan); a connector's release ends only
           the connector. A press that started nothing leaves nothing to end.
         ====================================================================== */
      var FlowPointer = (function () {
        const HOST = [
          "stopPlay", "hand", "camera", "moveCamera", "panStarted", "panEnded",
          "gestureActive", "beginDrag", "moveDrag", "endDrag", "cancelDrag",
          "annotationDragging", "moveAnnotation", "endAnnotation", "cancelAnnotation",
          "startMarquee", "moveMarquee", "endMarquee", "cancelMarquee",
          "startConnect", "moveConnect", "endConnect",
        ];
        const PRESS_SLOP = 5,
          PAN_SLOP = 4;

        function create(host) {
          const missing = HOST.filter((k) => !host || typeof host[k] !== "function");
          if (missing.length) throw new Error("FlowPointer: the host has no " + missing.join(", "));
          let mode = "idle",
            moved = false,
            press = null /* what a press on a frame or group is about: { kind, id | group } */,
            from = null /* where the press was, in screen pixels */,
            cam0 = null /* the camera when a pan began */,
            hand = false,
            space = false;
          const reset = () => {
            mode = "idle";
            press = from = cam0 = null;
          };
          const showHand = () => host.hand(hand || space);
          const dist = (pt) => Math.hypot(pt.x - from.x, pt.y - from.y);

          function down({ button, x, y, shift, hit }) {
            if (button === 1) {
              host.stopPlay();
              moved = false;
              mode = "pan";
              from = { x, y };
              cam0 = { ...host.camera() };
              return { prevent: true };
            }
            if (button !== 0) return { prevent: false };
            if (!hit) throw new Error("FlowPointer.down: a primary-button press needs a hit");
            switch (hit.kind) {
              case "annotation":
                return { prevent: !!hit.prevent };
              case "chrome":
                return { prevent: false };
              case "port":
                host.stopPlay();
                moved = false;
                reset();
                mode = "connect";
                host.startConnect(hit);
                return { prevent: true };
              case "grip":
              case "deck":
              case "frame":
                host.stopPlay();
                moved = false;
                reset();
                mode = "pending";
                from = { x, y };
                press = hit.kind === "frame" ? { kind: "frame", id: hit.id } : { kind: "group", group: hit.group };
                return { prevent: hit.kind === "grip" };
              case "canvas":
                host.stopPlay();
                moved = false;
                reset();
                from = { x, y };
                if (hand || space) {
                  mode = "pan";
                  cam0 = { ...host.camera() };
                } else {
                  mode = "marquee";
                  host.startMarquee({ x, y }, !!shift);
                }
                return { prevent: false };
              default:
                throw new Error('FlowPointer.down: no kind of hit "' + hit.kind + '"');
            }
          }

          function move(pt) {
            if (mode === "connect") {
              moved = true;
              host.moveConnect(pt);
              return;
            }
            if (host.annotationDragging()) {
              host.moveAnnotation(pt);
              return;
            }
            if (mode === "pending" && !host.gestureActive() && dist(pt) > PRESS_SLOP) {
              moved = true;
              if (!host.beginDrag(press, from)) reset();
            }
            if (host.gestureActive()) {
              host.moveDrag(pt);
              return;
            }
            if (mode === "marquee") {
              moved = true;
              host.moveMarquee(pt);
              return;
            }
            if (mode !== "pan") return;
            if (!moved && dist(pt) > PAN_SLOP) {
              moved = true;
              host.panStarted();
            }
            if (moved) host.moveCamera(cam0.x + pt.x - from.x, cam0.y + pt.y - from.y);
          }

          function up() {
            if (mode === "connect") {
              reset();
              host.endConnect(false);
              return;
            }
            const was = mode;
            reset();
            if (host.annotationDragging()) host.endAnnotation();
            if (host.gestureActive()) host.endDrag();
            if (was === "marquee") host.endMarquee();
            if (was === "pan") host.panEnded();
          }
