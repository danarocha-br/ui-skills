<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flow Canvas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --fog: #f0ede8;
        --ink: #151919;
        --slate: #5a5f67;
        --line: rgba(16, 19, 19, 0.09);
        --btn: 121, 118, 115;
        --cobalt: #a343f5;
        --cobalt-ink: #7a1fd0; /* the accent as text and as a surface behind white text */
        --cream: #f8f2d4;
        --cream-ink: #443b14;
        --mint: #ddf6e6;
        --mint-ink: #025e50;
        --bone: #f3f0e6;
        --card: #fbf9f3;
        --moss: #34503a;
        --sage: #d5dec8;
        --pink: #1f2a21;
        --pmuted: #5d685b;
        --sans: "Inter", system-ui, -apple-system, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;
        --serif: "Fraunces", Georgia, serif;
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--fog);
        font-family: var(--sans);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      button {
        font-family: inherit;
      }
      body.boot * {
        transition: none !important;
      }
      #stage {
        position: fixed;
        inset: 0;
        cursor: default;
        touch-action: none;
        background: var(--fog);
      }
      #stage.panning {
        cursor: grabbing;
      }
      #world {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        width: 0;
        height: 0;
      }
      #stage.fly #world {
        transition: transform 0.75s var(--ease);
      }

      /* ================= canvas objects: free frames and groups ================= */
      #frames {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
      }
      #notes {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 120;
      }
      .lane {
        position: absolute;
        z-index: 100;
        pointer-events: none;
        transition:
          left 0.7s var(--ease),
          top 0.7s var(--ease),
          opacity 0.3s;
      }
      .lane.empty {
        opacity: 0;
      }
      .gdrag .lane,
      .gdrag .col {
        transition: none !important;
      }
      .gdrag {
        cursor: grabbing;
      }
      .content {
        position: absolute;
        left: 0;
        top: var(--head);
        right: 0;
        bottom: 0;
        pointer-events: none;
      }
      .fade {
        transition: opacity 0.45s 0.55s;
      }
      .lane.closed .fade {
        opacity: 0;
        transition: opacity 0.15s 0s;
      }
      .dz {
        position: absolute;
        border-radius: 34px;
        border: 1.5px dashed rgba(163, 67, 245, 0.5);
        background: rgba(163, 67, 245, 0.05);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.2s,
          width 0.35s var(--ease),
          height 0.35s var(--ease);
      }
      .lane.drop .dz {
        opacity: 1;
      }

      /* header: the group's own headline and standfirst, set like the opening of a printed spread */
      .ghead {
        position: absolute;
        left: 0;
        top: 0;
        width: 900px;
        pointer-events: auto;
        z-index: 40;
        transition:
          left 0.7s var(--ease),
          top 0.7s var(--ease),
          width 0.7s var(--ease);
      }
      .lane.closed .ghead {
        left: var(--hx);
        top: var(--hy);
        width: 540px;
        cursor: pointer;
      }
      .lane.closed [contenteditable] {
        pointer-events: none;
      }
      .gt {
        position: relative;
      }
      .chev {
        position: absolute;
        left: -42px;
        top: 6px;
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: #7c828a;
        display: grid;
        place-items: center;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s,
          transform 0.5s var(--ease),
          top 0.6s var(--ease);
      }
      .chev:hover {
        background: rgba(var(--btn), 0.07);
        color: var(--ink);
      }
      .chev svg {
        width: 17px;
        height: 17px;
      }
      .lane.open .chev {
        transform: rotate(180deg);
      }
      .lane.closed .chev {
        transform: rotate(90deg);
        top: 0;
      }
      .grip {
        position: absolute;
        left: -76px;
        top: 6px;
        width: 28px;
        height: 30px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: #7c828a;
        display: grid;
        place-items: center;
        cursor: grab;
        opacity: 0;
        transition:
          opacity 0.15s,
          background 0.15s,
          color 0.15s,
          top 0.6s var(--ease);
      }
      .grip svg {
        width: 15px;
        height: 15px;
      }
      .ghead:hover .grip,
      .grip:focus-visible {
        opacity: 1;
      }
      .grip:hover {
        background: rgba(var(--btn), 0.07);
        color: var(--ink);
      }
      .grip:active {
        cursor: grabbing;
      }
      .lane.closed .grip {
        top: 0;
      }
      .gtitle {
        font: 600 40px/1.06 var(--sans);
        letter-spacing: -0.035em;
        color: var(--ink);
        text-wrap: balance;
        transition: font-size 0.7s var(--ease);
      }
      .lane.closed .gtitle {
        font-size: 28px;
      }
      .gsubw {
        margin: 14px 0 0;
        max-width: 60ch;
      }
      .gsub {
        font: 400 16px/1.5 var(--sans);
        color: #4a4f57;
        text-wrap: pretty;
        white-space: pre-wrap;
        transition: font-size 0.7s var(--ease);
      }
      .lane.closed .gsub {
        font-size: 15px;
      }
      .gs {
        margin: 14px 0 0;
        font-size: 12.5px;
        color: var(--slate);
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
      }
      .gs code {
        font: 400 11.5px var(--mono);
      }
      .fplay {
        margin-left: 6px;
        height: 28px;
        padding: 0 13px 0 10px;
        border-radius: 14px;
        border: 0;
        background: rgba(var(--btn), 0.2);
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        color: var(--ink);
        font: 500 12.5px var(--sans);
        transition:
          background 0.15s,
          color 0.15s,
          transform 0.15s;
      }
      .fplay:hover {
        background: var(--ink);
        color: #fff;
      }
      .fplay.on {
        background: var(--cobalt);
        color: #fff;
      }
      .fplay svg {
        width: 13px;
        height: 13px;
      }
      .fmore {
        width: 28px;
        height: 28px;
        border-radius: 14px;
        border: 0;
        background: transparent;
        color: var(--slate);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .fmore:hover {
        background: rgba(var(--btn), 0.07);
        color: var(--ink);
      }
      .fmore svg {
        width: 16px;
        height: 16px;
      }

      /* long copy never reaches the cards: clamp until you click in to edit */
      .gtitle:not(:focus) {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow: hidden;
        /* the clamp clips at the line box; give descenders (g, p, y) room and take it back from the margin */
        padding-bottom: 0.2em;
        margin-bottom: -0.2em;
      }
      .gsub:not(:focus) {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
        line-clamp: 3;
        overflow: hidden;
      }
      .ctt:not(:focus) {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow: hidden;
        padding-bottom: 0.2em;
        margin-bottom: -0.2em;
      }
      .cb:not(:focus) {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: var(--capL, 3);
        line-clamp: var(--capL, 3);
        overflow: hidden;
      }

      /* annotations: plain type on the canvas, editable in place. Chrome appears only on hover or focus. */
      ::selection {
        background: rgba(163, 67, 245, 0.2);
      }
      .ann {
        position: relative;
      }
      .ann [contenteditable] {
        outline: 0;
        caret-color: var(--cobalt);
        border-radius: 8px;
        cursor: text;
        transition:
          background 0.15s,
          box-shadow 0.2s;
      }
      .ann [contenteditable]:hover,
      .gtitle:hover {
        background: rgba(255, 255, 255, 0.5);
        box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.5);
      }
      .ann [contenteditable]:focus,
      .gtitle:focus {
        background: rgba(255, 255, 255, 0.9);
        box-shadow:
          0 0 0 5px rgba(255, 255, 255, 0.9),
          0 0 0 6.5px rgba(163, 67, 245, 0.4);
      }
      .gtitle {
        outline: 0;
        caret-color: var(--cobalt);
        border-radius: 8px;
        cursor: text;
      }
      [data-ph]:empty::before {
        content: attr(data-ph);
        color: #666c74;
      }
      .cx {
        position: absolute;
        top: -9px;
        right: -9px;
        z-index: 3;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 0;
        background: var(--ink);
        color: #fff;
        display: grid;
        place-items: center;
        cursor: pointer;
        opacity: 0;
        transform: scale(0.7);
        transition:
          opacity 0.15s,
          transform 0.25s var(--ease);
      }
      .cx svg {
        width: 9px;
        height: 9px;
      }
      .ann:hover > .cx,
      .ann:focus-within > .cx {
        opacity: 1;
        transform: none;
      }
      .pill:focus-visible,
      .circ:focus-visible,
      #seltb button:focus-visible,
      .echip:focus-visible,
      .pop button:focus-visible,
      .menu .mi:focus-visible {
        outline: 2px solid var(--cobalt);
        outline-offset: 2px;
      }
      .pill:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .cx:focus-visible,
      .cadd:focus-visible,
      .chev:focus-visible,
      .fplay:focus-visible,
      .fmore:focus-visible {
        outline: 2px solid var(--cobalt);
        outline-offset: 2px;
      }
      .cadd {
        display: none;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 12px 0 9px;
        border-radius: 14px;
        border: 1px dashed rgba(16, 19, 19, 0.28);
        background: transparent;
        color: var(--slate);
        font: 500 12px var(--sans);
        cursor: pointer;
        opacity: 0;
        transition:
          opacity 0.2s,
          background 0.15s,
          color 0.15s;
      }
      .cadd svg {
        width: 12px;
        height: 12px;
      }
      .cadd:hover {
        background: rgba(255, 255, 255, 0.7);
        color: var(--ink);
      }
      .ann.off > [contenteditable],
      .ann.off > .ct,
      .ann.off > .cx {
        display: none;
      }
      .ann.off > .cadd {
        display: inline-flex;
      }
      .col:hover .ann.off .cadd,
      .ghead:hover .ann.off .cadd,
      .cadd:focus-visible {
        opacity: 1;
      }
      body.hide-ann .cap,
      body.hide-ann .gsubw {
        display: none;
      }

      .cap {
        margin-top: 30px;
        width: var(--cw);
        height: calc(var(--cap) - 30px);
        transition: opacity 0.3s 0.45s;
      }
      .col.deck .cap {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s 0s;
      }
      .ct {
        display: flex;
        gap: 0.5em;
        font: 600 var(--capT)/1.16 var(--sans);
        letter-spacing: -0.028em;
        color: var(--ink);
        text-wrap: balance;
      }
      .cn {
        flex: none;
        color: var(--slate);
        font-weight: 400;
      }
      .cn:empty {
        display: none;
      }
      .ctt {
        min-width: 0;
      }
      .cb {
        margin-top: 9px;
        font: 400 var(--capB)/1.5 var(--sans);
        color: #5d6666;
        text-wrap: pretty;
        white-space: pre-wrap;
      }

      /* a frame (one screen). In a group it takes a slot or a place in the deck; free, it goes where you put it.
         Where it is, and how big, belong to the page's geometry, which moves it by setting `translate` and `scale` as it
         slides. The tilt and the fan are only looks, so they stay here, eased with the same time and curve the geometry
         slides with (--open-*, --deck-*, set from it). */
      .col {
        position: absolute;
        left: 0;
        top: 0;
        width: var(--cw);
        pointer-events: auto;
        transform-origin: 0 0;
        z-index: var(--z, 1);
        transform: none;
        transition:
          transform var(--open-dur, 800ms) var(--open-ease, cubic-bezier(0.22, 1.12, 0.36, 1)) var(--d, 0ms),
          opacity 0.35s;
      }
      .col.deck {
        cursor: pointer;
        /* the fan is drawn inside the frame's scale, so its offset is divided by it to land at full size */
        transform: translate(
            calc(var(--fx, 0px) * var(--fan, 0) / var(--ds)),
            calc(var(--fy, 0px) * var(--fan, 0) / var(--ds))
          )
          rotate(calc(var(--r, 0deg) * (1 + var(--fan, 0) * 0.9)));
        transition:
          transform var(--deck-dur, 600ms) var(--deck-ease, cubic-bezier(0.5, 0, 0.15, 1)) var(--d, 0ms),
          opacity 0.35s;
      }
      @media (prefers-reduced-motion: reduce) {
        .col,
        .col.deck {
          transition: opacity 0.35s;
        }
      }
      .col.fan {
        --fan: 1;
      }
      .col.dragging {
        transition: none !important;
        z-index: 150;
        cursor: grabbing;
      }
      .col.dragging .phone {
        box-shadow:
          0 0 0 1px rgba(16, 19, 19, 0.06),
          0 40px 70px -24px rgba(16, 19, 19, 0.5);
        transform: scale(1.015);
      }
      .col.merge .phone {
        outline: 2px dashed var(--cobalt);
        outline-offset: 8px;
      }
      .label {
        height: 20px;
        margin-bottom: 8px;
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 0 4px;
        transition: opacity 0.3s 0.4s;
        cursor: grab;
      }
      .col.deck .label {
        opacity: 0;
        transition: opacity 0.12s 0s;
      }
      .lname {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.005em;
        white-space: nowrap;
      }
      .route {
        font: 400 11.5px var(--mono);
        color: var(--slate);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .live {
        margin-left: auto;
        display: flex;
        align-items: center;
        align-self: center;
      }
      .live i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #2e9d5b;
        box-shadow: 0 0 0 3px rgba(46, 157, 91, 0.16);
      }
      .states {
        margin-left: auto;
        align-self: center;
        font: 500 11.5px var(--sans);
        color: var(--cobalt);
        background: rgba(163, 67, 245, 0.09);
        border: 0;
        border-radius: 99px;
        padding: 3px 9px;
        cursor: pointer;
        white-space: nowrap;
      }
      .states:hover {
        background: rgba(163, 67, 245, 0.16);
      }
      .pwrap {
        position: relative;
        width: var(--cw);
        height: var(--ch);
      }
      .stack {
        position: absolute;
        left: calc(var(--cw) * 0.052);
        right: calc(var(--cw) * 0.052);
        height: var(--ch);
        border-radius: var(--cr);
        background: #fff;
        box-shadow: 0 1px 2px rgba(16, 19, 19, 0.06);
        transition:
          transform 0.3s var(--ease),
          opacity 0.3s;
      }
      .stack.a {
        top: 10px;
        opacity: 0.8;
      }
      .stack.b {
        top: 20px;
        opacity: 0.5;
      }
      .col.deck .stack {
        opacity: 0;
      }
      .col.hasstack:hover .stack.a {
        transform: translateY(3px);
      }
      .col.hasstack:hover .stack.b {
        transform: translateY(6px);
      }
      .phone {
        position: relative;
        width: var(--cw);
        height: var(--ch);
        border-radius: var(--cr);
        overflow: hidden;
        background: var(--bone);
        display: flex;
        flex-direction: column;
        color: var(--pink);
        box-shadow:
          0 0 0 0 #fff,
          0 0 0 0 rgba(16, 19, 19, 0),
          0 1px 1px rgba(16, 19, 19, 0.05),
          0 2px 4px rgba(16, 19, 19, 0.04),
          0 22px 40px -18px rgba(16, 19, 19, 0.28);
        font-size: 12px;
        user-select: none;
        transition:
          box-shadow 0.6s var(--ease),
          transform 0.25s var(--ease);
      }
      /* cardstock: thick white edge + hairline + a hard little drop, like a printed card */
      .col.deck .phone {
        pointer-events: none;
        box-shadow:
          0 0 0 7px #fff,
          0 0 0 8px rgba(16, 19, 19, 0.08),
          0 1px 1px rgba(16, 19, 19, 0.05),
          0 2px 4px rgba(16, 19, 19, 0.04),
          0 20px 34px -10px rgba(16, 19, 19, 0.34);
      }
      .col.sel .phone {
        box-shadow:
          0 0 0 3px var(--fog),
          0 0 0 5px var(--cobalt),
          0 22px 40px -18px rgba(16, 19, 19, 0.28);
      }
      .col.dragging.sel .phone {
        box-shadow:
          0 0 0 3px var(--fog),
          0 0 0 5px var(--cobalt),
          0 40px 70px -24px rgba(16, 19, 19, 0.5);
      }
      .col .note,
      .col .scan,
      .col .stem {
        transition: opacity 0.4s 0.5s;
      }
      .col.deck .note,
      .col.deck .scan,
      .col.deck .stem {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s 0s;
      }
      .ripple {
        position: absolute;
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        border-radius: 50%;
        background: rgba(163, 67, 245, 0.26);
        border: 2px solid rgba(163, 67, 245, 0.55);
        pointer-events: none;
        animation: rip 0.6s ease-out forwards;
        z-index: 9;
      }
      @keyframes rip {
        from {
          transform: scale(0.3);
          opacity: 1;
        }
        to {
          transform: scale(1.6);
          opacity: 0;
        }
      }
      body.selecting,
      body.selecting * {
        user-select: none !important;
      }
      #stage.hand {
        cursor: grab;
      }
      #stage.hand.panning {
        cursor: grabbing;
      }
      .selbox {
        position: absolute;
        display: none;
        z-index: 130;
        pointer-events: none;
        border: 1.5px solid rgba(163, 67, 245, 0.55);
        border-radius: 14px;
        background: rgba(163, 67, 245, 0.035);
        transition:
          left 0.7s var(--ease),
          top 0.7s var(--ease),
          width 0.7s var(--ease),
          height 0.7s var(--ease);
      }
      .selbox.live {
        transition: none;
      }
      .selbox span {
        position: absolute;
        left: -1.5px;
        top: -28px;
        height: 22px;
        padding: 0 9px;
        border-radius: 11px;
        background: var(--cobalt);
        color: #fff;
        font: 500 12px/22px var(--sans);
        white-space: nowrap;
      }
      .col.premark .phone {
        outline: 2px solid rgba(163, 67, 245, 0.45);
        outline-offset: 5px;
      }
      .marquee {
        position: fixed;
        z-index: 45;
        border: 1px solid rgba(163, 67, 245, 0.7);
        background: rgba(163, 67, 245, 0.08);
        border-radius: 4px;
        pointer-events: none;
      }

      #btnAll {
        left: 166px;
        top: 20px;
        height: 36px;
        padding: 0 15px 0 11px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        gap: 6px;
        font: 500 13px var(--sans);
      }
      #btnAll svg {
        width: 16px;
        height: 16px;
      }
      /* device switcher */
      #devsw {
        left: 20px;
        top: 20px;
        height: 36px;
        border-radius: 18px;
        padding: 3px;
        display: flex;
        gap: 2px;
      }
      #devsw button {
        width: 40px;
        height: 30px;
        border-radius: 15px;
        border: 0;
        background: transparent;
        display: grid;
        place-items: center;
        color: #5c626a;
        cursor: pointer;
        transition:
          background 0.25s,
          color 0.25s,
          box-shadow 0.25s;
      }
      #devsw button svg {
        width: 17px;
        height: 17px;
      }
      #devsw button:hover {
        color: var(--ink);
      }
      #devsw button:focus {
        outline: none;
      }
      #devsw button:focus-visible {
        outline: 2px solid var(--cobalt);
        outline-offset: 1px;
      }
      #devsw button.on {
        background: #fff;
        color: var(--ink);
        box-shadow: 0 1px 3px rgba(16, 19, 19, 0.14);
      }

      /* ================= edges ================= */
      /* ================= connectors: real objects, attached to frames ================= */
      .conns {
        position: absolute;
        left: 0;
        top: 0;
        overflow: visible;
        pointer-events: none;
        z-index: 95;
      }
      #cchips {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 96;
      }
      .conn {
        color: #a4a9b1;
        transition: opacity 0.3s;
      }
      .conn .ln {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        transition: stroke-width 0.15s;
      }
      .conn .hit {
        fill: none;
        stroke: transparent;
        stroke-width: 20;
        pointer-events: stroke;
        cursor: pointer;
      }
      .conn .dot,
      .conn .arr {
        fill: currentColor;
      }
      .conn:hover {
        color: #6e747c;
      }
      .conn:hover .ln {
        stroke-width: 2.25;
      }
      .conn.active {
        color: var(--cobalt);
      }
      .conn.active .ln {
        stroke-width: 2.25;
        stroke-dasharray: 7 7;
        animation: flow 0.9s linear infinite;
      }
      .conn.sel {
        color: var(--cobalt);
      }
      .conn.sel .ln {
        stroke-width: 2.75;
      }
      .conn.off {
        opacity: 0;
        pointer-events: none;
      }
      .conn.off .hit {
        pointer-events: none;
      }
      .conn.preview {
        color: var(--cobalt);
      }
      .conn.preview .ln {
        stroke-dasharray: 5 6;
        stroke-width: 2.25;
      }
      .token {
        fill: var(--cobalt);
        stroke: #fff;
        stroke-width: 3;
      }
      @keyframes flow {
        to {
          stroke-dashoffset: -14;
        }
      }
      .echip {
        position: absolute;
        z-index: 6;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        gap: 2px;
        font: 500 12px var(--sans);
        padding: 5px 11px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.86);
        color: #3a3f46;
        box-shadow: 0 1px 2px rgba(16, 19, 19, 0.06);
        border: 0;
        cursor: pointer;
        white-space: nowrap;
        transition:
          opacity 0.3s,
          background 0.15s,
          color 0.15s;
        pointer-events: auto;
      }
      .echip:hover {
        background: var(--ink);
        color: #fff;
      }
      .echip.active,
      .echip.sel {
        background: var(--cobalt);
        color: #fff;
      }
      .echip.off {
        opacity: 0;
        pointer-events: none;
      }
      .echip .lb {
        outline: 0;
        min-width: 10px;
      }
      .echip .lb[contenteditable] {
        cursor: text;
        background: #fff;
        color: var(--ink);
        border-radius: 6px;
        padding: 0 4px;
        margin: -1px -4px;
      }
      .echip .ex {
        width: 0;
        height: 16px;
        border: 0;
        background: transparent;
        color: inherit;
        font: 500 14px/16px var(--sans);
        padding: 0;
        overflow: hidden;
        opacity: 0;
        cursor: pointer;
        transition:
          width 0.18s var(--ease),
          opacity 0.15s,
          margin 0.18s;
      }
      .echip:hover .ex,
      .echip:focus-within .ex {
        width: 16px;
        opacity: 0.8;
        margin-left: 4px;
      }
      .echip .ex:hover {
        opacity: 1;
      }
      body.hide-edges .conns,
      body.hide-edges #cchips {
        display: none;
      }
      /* edge handles on a frame: drag one onto another frame to connect them */
      .port {
        position: absolute;
        z-index: 12;
        width: 22px;
        height: 22px;
        margin: -11px 0 0 -11px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid var(--cobalt);
        box-shadow: 0 3px 8px rgba(16, 19, 19, 0.22);
        opacity: 0;
        transform: scale(0.4);
        pointer-events: none;
        cursor: crosshair;
        transition:
          opacity 0.15s,
          transform 0.22s var(--ease);
      }
      .port::after {
        content: "";
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        background: var(--cobalt);
      }
      .port[data-side="R"] {
        left: 100%;
        top: var(--edge);
      }
      .port[data-side="L"] {
        left: 0;
        top: var(--edge);
      }
      .port[data-side="T"] {
        left: 50%;
        top: 0;
      }
      .port[data-side="B"] {
        left: 50%;
        top: 100%;
      }
      .col:hover .port,
      .col.sel .port {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      .port:hover {
        transform: scale(1.18);
      }
      .col.deck .port,
      .col.dragging .port {
        display: none;
      }
      body.connecting .port {
        pointer-events: none;
      }
      body.connecting,
      body.connecting * {
        cursor: crosshair !important;
      }
      .col.tgt .phone {
        outline: 2px dashed var(--cobalt);
        outline-offset: 8px;
      }
      body.hide-routes .route {
        visibility: hidden;
      }
      body.hide-human .note {
        display: none;
      }
      body.hide-scan .scan,
      body.hide-scan .stem {
        display: none;
      }
      body.hide-stacks .stack {
        display: none;
      }

      /* ================= notes — Spatial style: flat colored cards ================= */
      .note {
        position: absolute;
        z-index: 10;
        width: 196px;
        padding: 15px 15px 12px;
        border-radius: 14px;
        font-size: 13px;
        line-height: 18px;
        cursor: default;
        box-shadow:
          0 1px 1px rgba(16, 19, 19, 0.05),
          0 12px 24px -12px rgba(16, 19, 19, 0.28);
        pointer-events: auto;
      }
      .note {
        background: var(--cream);
        color: var(--cream-ink);
      }
      .note .txt {
        outline: 0;
        min-height: 18px;
        padding-right: 14px;
        cursor: text;
        white-space: pre-wrap;
      }
      .note:focus-visible {
        outline: 2px solid var(--cobalt-ink);
        outline-offset: 2px;
      }
      .note .nx {
        position: absolute;
        top: 7px;
        right: 7px;
        width: 24px;
        height: 24px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: inherit;
        display: grid;
        place-items: center;
        cursor: pointer;
        opacity: 0;
        transition:
          opacity 0.15s,
          background 0.15s;
      }
      .note:hover .nx,
      .note:focus-within .nx {
        opacity: 0.6;
      }
      @media (hover: none) {
        .note .nx {
          opacity: 0.6;
        }
      }
      @media (hover: hover) {
        .note .nx:hover {
          opacity: 1;
          background: rgba(16, 19, 19, 0.1);
        }
      }
      .note .nx:focus-visible {
        opacity: 1;
        outline: 2px solid var(--cobalt-ink);
        outline-offset: 1px;
      }
      .note .nx svg {
        width: 12px;
        height: 12px;
      }
      .note .who {
        margin-top: 9px;
        font-size: 11px;
        opacity: 0.55;
        font-weight: 500;
      }
      .note.dragging {
        box-shadow: 0 20px 40px -12px rgba(16, 19, 19, 0.4);
        cursor: grabbing;
      }
      .scan {
        position: absolute;
        z-index: 10;
        padding: 12px 14px 12px 12px;
        border: 1px solid transparent; /* keeps the edge in forced-colors */
        border-radius: 14px;
        background: rgba(27, 34, 32, 0.94);
        color: #edeef0;
        display: flex;
        gap: 11px;
        box-shadow: 0 14px 28px -12px rgba(16, 19, 19, 0.45);
        font-size: 12.5px;
        line-height: 17px;
        padding-right: 34px;
        cursor: grab;
        pointer-events: auto;
        touch-action: none;
        transition:
          background 0.15s,
          box-shadow 0.15s;
      }
      .scan.dragging {
        cursor: grabbing;
        z-index: 30;
        box-shadow:
          0 24px 40px -14px rgba(16, 19, 19, 0.55),
          0 0 0 1.5px rgba(209, 118, 255, 0.6);
      }
      .scan:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      .scan .sx {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 24px;
        height: 24px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #c9ced6;
        display: grid;
        place-items: center;
        cursor: pointer;
        opacity: 0;
        transition:
          opacity 0.15s,
          background 0.15s;
      }
      .scan:hover .sx,
      .scan:focus-within .sx {
        opacity: 1;
      }
      @media (hover: none) {
        .scan .sx {
          opacity: 0.8;
        }
      }
      @media (hover: hover) {
        .scan .sx:hover {
          background: rgba(255, 255, 255, 0.14);
          color: #fff;
        }
      }
      .scan .sx:focus-visible {
        opacity: 1;
        outline: 2px solid #fff;
        outline-offset: 1px;
      }
      .scan .sx svg {
        width: 12px;
        height: 12px;
      }
      .col.sel .scan,
      .col.tied .scan {
        box-shadow:
          0 14px 28px -12px rgba(16, 19, 19, 0.45),
          0 0 0 1.5px rgba(209, 118, 255, 0.6);
      }
      @media (hover: hover) {
        .scan:hover {
          background: rgba(36, 45, 42, 0.96);
        }
      }
      .scan .ic {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.12);
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .scan small {
        display: block;
        font: 500 10.5px var(--sans);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9aa1ab;
        margin-bottom: 3px;
      }
      .scan code {
        font: 400 11.5px var(--mono);
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
        padding: 1px 5px;
        border-radius: 5px;
      }
      .scan em {
        font-style: normal;
        color: #d176ff;
      }
      /* names in a finding are links to the frames they are about */
      .scan .hop {
        font: inherit;
        color: #d176ff;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        text-decoration: underline dotted;
        text-decoration-thickness: 1.5px;
        text-underline-offset: 3px;
      }
      @media (hover: hover) {
        .scan .hop:hover {
          text-decoration-style: solid;
        }
      }
      .scan .hop:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
        border-radius: 3px;
      }
      /* the leader: from the frame it is about to the finding, following the frame wherever it goes */
      .stem {
        position: absolute;
        left: 0;
        top: 0;
        overflow: visible;
        pointer-events: none;
        z-index: 11;
        color: rgba(27, 34, 32, 0.55);
        transition: color 0.2s;
      }
      .col.sel .stem,
      .col.tied .stem {
        color: var(--cobalt-ink);
      }
      .stem .sl {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-dasharray: 4 4;
        stroke-linecap: round;
      }
      .stem .dk {
        fill: currentColor;
        stroke: var(--fog);
        stroke-width: 2;
      }
      .stem .en {
        fill: currentColor;
      }
      @keyframes lead {
        to {
          stroke-dashoffset: -8;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .col.tied .stem .sl {
          animation: lead 0.9s linear infinite;
        }
      }
      .col .states.hl {
        box-shadow: 0 0 0 2px var(--cobalt-ink);
      }

      /* ================= chrome — flat gray pills ================= */
      .ui {
        position: fixed;
        z-index: 50;
        font-family: var(--sans);
      }
      .pill {
        background: rgba(var(--btn), 0.1);
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
        color: var(--ink);
        border: 0;
        cursor: pointer;
        transition:
          background 0.15s,
          transform 0.15s;
      }
      .pill:hover {
        background: rgba(var(--btn), 0.17);
      }
      .pill svg {
        width: 17px;
        height: 17px;
      }
      .circ {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: grid;
        place-items: center;
      }
      #btnSearch {
        right: 80px;
        top: 20px;
      }
      #btnSpace {
        left: 20px;
        bottom: 20px;
      }
      #br {
        right: 20px;
        bottom: 20px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #pager {
        height: 36px;
        border-radius: 18px;
        padding: 0 14px;
        display: flex;
        align-items: center;
        font: 500 13.5px var(--mono);
        letter-spacing: 0.03em;
        gap: 0;
      }
      #pager button {
        width: 0;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
        display: grid;
        place-items: center;
        color: var(--ink);
        height: 28px;
        overflow: visible;
        pointer-events: none;
        transition: width 0.22s var(--ease);
      }
      #pager button svg {
        width: 13px;
        height: 13px;
        overflow: visible;
        opacity: 0;
        transition:
          opacity 0.16s ease,
          transform 0.22s var(--ease);
      }
      #pager #prev svg {
        transform: rotate(-90deg) scale(0.5);
      }
      #pager #next svg {
        transform: rotate(90deg) scale(0.5);
      }
      #pager:hover button {
        width: 22px;
        pointer-events: auto;
      }
      #pager:hover #prev svg {
        opacity: 1;
        transform: rotate(-90deg);
      }
      #pager:hover #next svg {
        opacity: 1;
        transform: rotate(90deg);
      }
      #btnViews {
        height: 36px;
        width: 64px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
      }
      #btnViews .chv {
        color: #666c74;
        width: 13px;
        height: 13px;
      }
      #btnAdd {
        right: 20px;
        top: 20px;
        height: 36px;
        width: 52px;
        border-radius: 18px;
        display: grid;
        place-items: center;
      }
      #zoom {
        font: 500 11.5px var(--mono);
        color: var(--slate);
        cursor: pointer;
        margin-right: 8px;
      }

      .menu {
        position: fixed;
        z-index: 60;
        min-width: 240px;
        padding: 6px;
        border-radius: 16px;
        background: rgba(246, 247, 248, 0.94);
        -webkit-backdrop-filter: blur(24px) saturate(1.4);
        backdrop-filter: blur(24px) saturate(1.4);
        box-shadow:
          0 0 0 1px rgba(16, 19, 19, 0.05),
          0 20px 50px -12px rgba(16, 19, 19, 0.3);
        display: none;
        flex-direction: column;
        transform-origin: bottom left;
      }
      .menu.open {
        display: flex;
        animation: pop 0.18s var(--ease);
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.97);
        }
      }
      .menu .mi {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 9px 11px;
        border-radius: 10px;
        font: 500 13.5px var(--sans);
        color: var(--ink);
        cursor: pointer;
        border: 0;
        background: transparent;
        text-align: left;
        width: 100%;
      }
      .menu .mi:hover {
        background: rgba(var(--btn), 0.06);
      }
      .menu .mi:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .menu .mi svg {
        width: 16px;
        height: 16px;
        color: #4a4f57;
        flex-shrink: 0;
      }
      .menu .mi span {
        margin-left: auto;
        font: 400 12.5px var(--sans);
        color: #666c74;
        padding-left: 18px;
      }
      .menu .mi span.k {
        font-family: var(--mono);
        font-size: 12px;
      }
      .menu .mi .tick {
        margin-left: auto;
        padding: 0;
        width: 15px;
        height: 15px;
        color: var(--cobalt);
        opacity: 0;
      }
      .menu .mi.on .tick {
        opacity: 1;
      }
      .menu hr {
        border: 0;
        height: 1px;
        background: rgba(16, 19, 19, 0.08);
        margin: 5px 6px;
      }
      #mGroup {
        transform-origin: top left;
      }
      #mSpace {
        left: 20px;
        bottom: 66px;
      }
      #mViews {
        right: 20px;
        bottom: 66px;
        transform-origin: bottom right;
      }
      #mAdd {
        right: 20px;
        top: 64px;
        transform-origin: top right;
      }

      #seltb {
        left: 50%;
        bottom: 22px;
        transform: translate(-50%, 24px);
        opacity: 0;
        pointer-events: none;
        display: flex;
        gap: 2px;
        padding: 4px;
        border-radius: 22px;
        background: rgba(27, 34, 32, 0.94);
        box-shadow: 0 16px 40px -10px rgba(16, 19, 19, 0.45);
        transition:
          transform 0.35s var(--ease),
          opacity 0.25s;
      }
      #seltb.show {
        transform: translate(-50%, 0);
        opacity: 1;
        pointer-events: auto;
      }
      #seltb button {
        width: 40px;
        height: 36px;
        border-radius: 18px;
        border: 0;
        background: transparent;
        color: #fff;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: background 0.15s;
      }
      #seltb button:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      #seltb svg {
        width: 18px;
        height: 18px;
      }
      #seltb .cnt {
        display: none;
        align-items: center;
        padding: 0 8px 0 14px;
        font: 500 12.5px var(--sans);
        color: #c6cad0;
        white-space: nowrap;
      }
      #seltb.multi .cnt {
        display: flex;
      }
      #seltb button[hidden] {
        display: none;
      }
      #seltb hr {
        width: 1px;
        background: rgba(255, 255, 255, 0.16);
        border: 0;
        margin: 8px 3px;
      }

      #hint {
        left: 50%;
        top: 22px;
        transform: translateX(-50%);
        height: 34px;
        padding: 0 16px;
        border-radius: 17px;
        display: flex;
        align-items: center;
        font-size: 12.5px;
        color: #4a4f57;
        cursor: default;
        transition: opacity 0.6s;
        white-space: nowrap;
      }
      #hint.gone {
        opacity: 0;
        pointer-events: none;
      }

      /* scrollbars like Spatial's thin tracks */
      .sbar {
        position: fixed;
        z-index: 40;
        background: transparent;
        opacity: 0;
        transition: opacity 0.4s;
        pointer-events: none;
      }
      .sbar.show {
        opacity: 1;
      }
      .sbar i {
        position: absolute;
        background: rgba(16, 19, 19, 0.22);
        border-radius: 4px;
      }
      .sbar.h {
        left: 0;
        right: 0;
        bottom: 3px;
        height: 5px;
      }
      .sbar.h i {
        height: 5px;
        top: 0;
      }
      .sbar.v {
        top: 0;
        bottom: 0;
        right: 3px;
        width: 5px;
      }
      .sbar.v i {
        width: 5px;
        left: 0;
      }

      /* right panel (search / inspect) — half-window like Spatial; a bottom sheet on phones */
      #panel {
        top: 0;
        bottom: 0;
        right: 0;
        width: min(560px, 48vw);
        background: #f7f4ef;
        border-left: 1px solid transparent; /* keeps an edge when forced-colors drops the shadow */
        box-shadow:
          -1px 0 0 rgba(16, 19, 19, 0.06),
          -10px 0 60px -30px rgba(16, 19, 19, 0.2);
        transform: translateX(102%);
        visibility: hidden; /* closed means gone: out of the tab order and the accessibility tree */
        transition:
          transform 0.3s var(--ease),
          visibility 0s linear 0.3s;
        display: flex;
        flex-direction: column;
        z-index: 70;
      }
      #panel.open {
        transform: none;
        visibility: visible;
        transition:
          transform 0.5s var(--ease),
          visibility 0s;
      }
      #phead {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        padding: 18px 18px 0 26px;
        flex-shrink: 0;
      }
      #ptitle {
        min-width: 0;
        margin: 5px 0 0;
        font: 500 22px/28px var(--serif);
        letter-spacing: -0.01em;
        color: var(--ink);
        text-wrap: balance;
        outline: 0;
      }
      #ptitle .psub {
        display: block;
        margin-top: 2px;
        font: 400 13px/18px var(--sans);
        letter-spacing: 0;
        color: var(--slate);
      }
      #pclose {
        position: relative;
        flex: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 0;
        background: rgba(var(--btn), 0.08);
        cursor: pointer;
        display: grid;
        place-items: center;
        color: var(--ink);
        transition:
          background 0.15s,
          scale 0.15s ease-out;
      }
      #pclose::after {
        content: "";
        position: absolute;
        inset: -4px;
      }
      @media (hover: hover) {
        #pclose:hover {
          background: rgba(var(--btn), 0.16);
        }
      }
      #pclose:focus-visible {
        outline: 2px solid var(--cobalt-ink);
        outline-offset: 2px;
      }
      #pclose svg {
        width: 16px;
        height: 16px;
      }
      #pbody {
        flex: 1;
        overflow: auto;
        overscroll-behavior: contain;
        padding: 12px 26px 40px;

        margin-top: 15px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--pmuted);
      }
      .dw .pgrid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 8px;
      }
      .dw .pc {
        background: var(--card);
        border-radius: 14px;
        padding: 11px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        align-items: flex-start;
      }
      .dw .pc b {
        font-size: 11.5px;
        font-weight: 600;
        margin-top: 6px;
      }
      .pc small {
        font-size: 10px;
        color: var(--pmuted);
        margin-bottom: 5px;
      }
      .dw .chip {
        font-size: 10px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 99px;
        background: var(--sage);
        color: var(--moss);
        white-space: nowrap;
      }
      .dw .chip.soft {
        background: rgba(52, 80, 58, 0.08);
        color: var(--pmuted);
        font-weight: 500;
      }
      .dw .toast {
        position: absolute;
        right: 14px;
        top: 12px;
        width: 196px;
        padding: 10px 12px;
        border-radius: 14px;
        background: var(--pink);
        color: var(--bone);
        font-size: 11px;
        display: flex;
        gap: 9px;
        align-items: center;
        z-index: 5;
        box-shadow: 0 10px 24px -8px rgba(16, 19, 19, 0.4);
      }
      .dw .toast .ico {
        width: 22px;
        height: 22px;
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
      }
      .toast .ico svg {
        width: 11px;
        height: 11px;
      }
      .dw .dim {
        position: absolute;
        inset: 0;
        background: rgba(16, 19, 19, 0.42);
      }
      .dw .modal {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        background: var(--bone);
        border-radius: 18px;
        padding: 18px 20px;
        box-shadow: 0 24px 50px -12px rgba(16, 19, 19, 0.45);
        display: flex;
        flex-direction: column;
      }
      .dw .search {
        height: 32px;
        border-radius: 11px;
        background: var(--card);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 11px;
        color: var(--pmuted);
        font-size: 11px;
        margin-top: 10px;
      }
      .dw .search svg {
        width: 13px;
        height: 13px;
      }
      .dw .chips {
        display: flex;
        gap: 5px;
        margin-top: 9px;
      }
      .dw .chips .chip {
        background: var(--card);
        color: var(--pink);
        font-weight: 500;
        font-size: 10px;
        padding: 4px 9px;
      }
      .chips .chip.on {
        background: var(--pink);
        color: var(--bone);
      }
      .dw .lrow2 {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 6px;
        padding: 7px 9px;
        border-radius: 13px;
        background: var(--card);
        border: 1.5px solid transparent;
        cursor: pointer;
      }
      .dw .lrow2 b {
        display: block;
        font-size: 11.5px;
        font-weight: 600;
      }
      .lrow2 small {
        font: italic 10px var(--serif);
        color: var(--pmuted);
      }
      .dw .lrow2.sel {
        border-color: var(--moss);
        background: #fff;
      }
      .dw .mfoot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: auto;
        padding-top: 12px;
      }
      .dw .care {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 10px;
      }
      .dw .care .ico {
        width: 28px;
        height: 28px;
        background: var(--card);
      }
      .dw .care b {
        display: block;
        font-size: 11.5px;
        font-weight: 600;
      }
      .care small {
        font-size: 10.5px;
        color: var(--pmuted);
      }
      .dw .feat {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 9px;
        font-size: 11.5px;
        font-weight: 500;
      }
      .dw .feat i {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.16);
        color: var(--bone);
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .feat i svg {
        width: 9px;
        height: 9px;
      }
      .dw .plans {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 16px;
      }
      .dw .plan {
        border-radius: 14px;
        padding: 11px 12px;
        background: var(--card);
        border: 1.5px solid transparent;
        cursor: pointer;
      }
      .dw .plan.on {
        border-color: var(--moss);
        background: #fff;
      }
      .plan small {
        font-size: 10px;
        color: var(--pmuted);
      }
      .plan b {
        display: block;
        font: 500 19px var(--serif);
        margin-top: 2px;
      }
      .dw .li {
        display: flex;
        justify-content: space-between;
        font-size: 11.5px;
        padding: 8px 0;
        border-bottom: 1px solid rgba(31, 42, 33, 0.09);
      }
      .li span:last-child {
        font-weight: 600;
      }
      .dw .li.t {
        border: 0;
        font-weight: 600;
        font-size: 13px;
      }

      .dw .tsb {
        height: 28px;
        flex-shrink: 0;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding: 0 22px 3px;
        font: 600 10.5px var(--sans);
        background: var(--bone);
      }
      .dw .tsb i {
        display: block;
        width: 24px;
        height: 8px;
        border-radius: 3px;
        background: var(--pink);
        opacity: 0.8;
      }

      /* tablet: same components, re-flowed to one column with an icon rail */
      .dt .split {
        flex-direction: column;
      }
      .dt .lft {
        width: auto !important;
        padding: 18px 30px 0;
      }
      .dt .rgt {
        flex: none !important;
        width: auto !important;
        height: 190px;
        order: -1;
      }
      .dt .h1 {
        font-size: 28px;
        line-height: 30px;
        margin-top: 14px;
      }
      .dt .pgrid3 {
        grid-template-columns: 1fr 1fr;
        margin: 14px 30px 0;
      }
      .dt .two {
        grid-template-columns: 1fr;
        gap: 14px;
        padding: 20px 30px 0;
      }
      .dt .foot {
        left: 30px;
        right: 30px;
      }
      .dt .side {
        width: 54px;
        padding: 14px 9px;
        align-items: center;
      }
      .dt .side .brand {
        font-size: 0;
        margin: 0 0 12px;
      }
      .dt .nv {
        width: 36px;
        height: 30px;
        padding: 0;
        justify-content: center;
        font-size: 0;
        gap: 0;
      }
      .dt .me {
        font-size: 0;
        justify-content: center;
      }
      .dt .main {
        padding: 16px 20px;
      }
      .dt .pgrid {
        grid-template-columns: 1fr 1fr;
      }
      .dt .lft.pw {
        padding-bottom: 22px;
      }
      .dt .rgt.pwr {
        height: auto;
        flex: 1 !important;
        order: 0;
        padding: 20px 30px;
      }

    <script id="flow-scan-behaviour">
      /* ======================================================================
         SCAN: THE PRODUCT'S OWN BEHAVIOUR (optional)
         Small reactions inside the sample's screens, the way the real components would react. The engine
         calls FlowScanBehaviour.onTap(screenId, target, root) after a tap inside a frame (root is the screen's own root), and leaves taps on
         anything matching FlowScanBehaviour.interactive alone when the frame is double-clicked. A scan whose
         screens are static leaves this block empty.
         ====================================================================== */
      var FlowScanBehaviour = {
        interactive: ".plant,.tog,.time,.plan,[data-pick]",
        onTap(screen, t, ph) {
          const plant = t.closest(".plant");
          if (plant) {
            plant.classList.toggle("sel");
            ph.querySelector("[data-cnt]").textContent = ph.querySelectorAll(".plant.sel").length + " selected";
          }
          const time = t.closest(".time");
          if (time) time.parentElement.querySelectorAll(".time").forEach((x) => x.classList.toggle("on", x === time));
          const tog = t.closest(".tog");
          if (tog) tog.querySelector(".sw").classList.toggle("on");
          const pl = t.closest("[data-plan]");
          if (pl) pl.parentElement.querySelectorAll(".plan").forEach((x) => x.classList.toggle("on", x === pl));
          const pk = t.closest("[data-pick]");
          if (pk) {
            ph.querySelectorAll(".lrow2").forEach((x) => x.classList.toggle("sel", x === pk));
            ph.querySelector("[data-pickLbl]").textContent = "Continue with " + pk.dataset.pick;
          }
        },
      };

    <script id="markup-module">
      /* ======================================================================
         MARKUP MODULE
         Where text meets markup. Everything a scanner writes (routes, names, ids, meta, notes) is text, and
         enters the page only through here, so a "<", an "&", a quote or a "[id]" in a route cannot break it.
         The one thing that is markup by design is a screen's own render (its "html"), which is never passed
         through. No DOM, no product knowledge.

         Interface
           FlowMarkup.esc(text)      text made safe in an element and in a quoted attribute (& < > " ');
                                     null and undefined are empty
           FlowMarkup.html`...`      a template whose every ${value} is escaped; a value made by raw() or by
                                     another html`...` goes in as it is; an array is joined with nothing between.
                                     Assign it to innerHTML: it turns into its markup as a string.
           FlowMarkup.raw(markup)    markup that is already safe, for html`...`
           FlowMarkup.sel(value)     a value made safe inside a quoted attribute selector: [data-k="${sel(id)}"]
         ====================================================================== */
      var FlowMarkup = (function () {
        "use strict";
        const ENTITY = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
        const esc = (t) => (t == null ? "" : String(t)).replace(/[&<>"']/g, (c) => ENTITY[c]);
        class Raw {
          constructor(markup) {
            this.markup = markup;
          }
          toString() {
            return this.markup;
          }
        }
        const raw = (markup) => new Raw(String(markup));
        const part = (v) => (v instanceof Raw ? v.markup : Array.isArray(v) ? v.map(part).join("") : esc(v));
        const html = (strings, ...values) => raw(strings.reduce((out, s, i) => out + s + (i < values.length ? part(values[i]) : ""), ""));
        /* a backslash or a quote is escaped with a backslash, a control character with its code point */
        const sel = (v) =>
          String(v)
            .replace(/[\\"]/g, "\\$&")
            .replace(/[\0-\x1f\x7f]/g, (c) => "\\" + c.charCodeAt(0).toString(16) + " ");
        return { esc, raw, html, sel };
      })();
    </script>
    <script id="device-module">
      /* ======================================================================
         DEVICE MODULE
         One description per device. Every other fact about a device (the numbers the arrangement needs, the
         style variables, the class on a frame, the key that reaches it) is derived here from that one entry,
         so it is written once. Adding a device is one more entry in TABLE, the product's screens for it, and
         an icon symbol; nothing else names a device. No DOM, no product knowledge.

         Interface
           FlowDevice.ids()                 -> ["mobile", "tablet", "desktop"], in the order the switcher shows them
           FlowDevice.describe(id)          -> a frozen description; an unknown id throws, naming the ones there are
             { id, label, vp, key, icon, title, cls, findY,
               metrics   colW phH cap body collH deckS deckW peekX peekY closedW edge   (what FlowGeometry arranges with)
               cssVars   { "--cw": "270px", … }                                          (what the stylesheet reads) }
           FlowDevice.idForKey(key)         -> the id a keyboard key reaches, or null
           FlowDevice.restingSpot(id, drop) -> [x, y] where a note goes when it has no place anywhere:
                                               near the frame's right edge, `drop` (120) below the screen's top
           FlowDevice.placeOn(saved, id) -> [x, y]  where an annotation sits on this device:
                                               its saved place here, else carried from the device it was first placed on
                                               (the same relative place on that device's screen), else the resting spot.
                                               Never written back.
           FlowDevice.carried(saved, id) -> [x, y] | null   the same without the last step: null when no device has a
                                               place, for an annotation (a finding) whose default is not the resting spot.
           `metrics.phTop` is where the screen starts inside the frame's column.
         ====================================================================== */
      var FlowDevice = (function () {
        /* the facts, once. cw/ch: the screen (px); top: where it starts in the frame's column; cr: its corner radius; ds: the deck's scale; tw: the
           thumbnail's width; cap*: the caption's insets; edge: where connectors leave a frame; body: the
           frame's height below its head; findY: where a finding sits below its frame's caption */
        const TABLE = [
          { id: "mobile", label: "Mobile", vp: "390 × 844", key: "m", icon: "i-phone", cls: "dm",
            top: 28, cw: 270, ch: 585, cr: 38, ds: 0.4, deckW: 108, peekX: 10, peekY: 8, edge: 509, body: 744,
            cap: 170, capT: 19, capB: 12.5, capL: 4, collH: 290, closedW: 440, tw: 150, findY: 662 },
          { id: "tablet", label: "Tablet", vp: "768 × 1024", key: "t", icon: "i-tablet", cls: "dw dt",
            top: 28, cw: 400, ch: 560, cr: 26, ds: 0.4, deckW: 160, peekX: 12, peekY: 9, edge: 480, body: 724,
            cap: 150, capT: 22, capB: 13.5, capL: 3, collH: 300, closedW: 580, tw: 190, findY: 640 },
          { id: "desktop", label: "Desktop", vp: "1200 × 772", key: "d", icon: "i-desktop", cls: "dw dd",
            top: 28, cw: 600, ch: 420, cr: 14, ds: 0.38, deckW: 228, peekX: 12, peekY: 9, edge: 205, body: 584,
            cap: 140, capT: 26, capB: 15, capL: 2, collH: 240, closedW: 700, tw: 220, findY: 500 },
        ];
        const px = (n) => n + "px";
        function derive(d) {
          return Object.freeze({
            id: d.id,
            label: d.label,
            vp: d.vp,
            key: d.key,
            icon: d.icon,
            title: `${d.label} (${d.key.toUpperCase()})`,
            cls: d.cls,
            findY: d.findY,
            metrics: Object.freeze({
              colW: d.cw, phTop: d.top, phH: d.ch, cap: d.cap, body: d.body, collH: d.collH, deckS: d.ds,
              deckW: d.deckW, peekX: d.peekX, peekY: d.peekY, closedW: d.closedW, edge: d.edge,
            }),
            cssVars: Object.freeze({
              "--cw": px(d.cw), "--ch": px(d.ch), "--cr": px(d.cr), "--ds": String(d.ds),
              "--tw": px(d.tw), "--ts": String(d.tw / d.cw),
              "--cap": px(d.cap), "--capT": px(d.capT), "--capB": px(d.capB), "--capL": String(d.capL),
              "--edge": px(d.edge),
            }),
          });
        }
        const BY_ID = new Map(TABLE.map((d) => [d.id, derive(d)]));
        const IDS = Object.freeze(TABLE.map((d) => d.id));

        const ids = () => IDS;
        function describe(id) {
          const d = BY_ID.get(id);
          if (!d) throw new Error(`FlowDevice: no device "${id}" (there are ${IDS.join(", ")})`);
          return d;
        }
        const idForKey = (key) => (TABLE.find((d) => d.key === key) || { id: null }).id;
        const restingSpot = (id, drop = 120) => [describe(id).metrics.colW - 70, describe(id).metrics.phTop + drop];
        function carry(at, from, to) {
          const a = describe(from).metrics,
            b = describe(to).metrics;
          return [Math.round((at[0] * b.colW) / a.colW), Math.round(b.phTop + ((at[1] - a.phTop) * b.phH) / a.phH)];
        }
        /* the place saved on this device, else the one carried from the first device that has one, else null */
        function carried(saved, id) {
          const isPlace = (a) => Array.isArray(a) && a.length === 2 && a.every(Number.isFinite);
          if (saved && isPlace(saved[id])) return saved[id];
          const from = saved && Object.keys(saved).find((k) => BY_ID.has(k) && isPlace(saved[k]));
          return from ? carry(saved[from], from, id) : null;
        }
        const placeOn = (saved, id) => carried(saved, id) || restingSpot(id);
        return { ids, describe, idForKey, restingSpot, placeOn, carried };
      })();
    </script>
    <script id="scan-module">
      /* ======================================================================
         SCAN MODULE
         The seam between what a scanner found in a product's code and the engine that draws it. The scan is
         the scanner's (the generator writes it into <script id="flow-scan">); the engine only reads it, and the
         user's changes are kept as edits laid over it, so a new scan still reaches someone who has edits.
         No DOM, no product knowledge, and no other module: the devices a scan is read for are handed to read().

         A scan
           { product: { name, scanned? }, start?,           scanned: when, in words; start: the screen selected
                                                            when the canvas opens
             components: { Name: cssSelector },             where each component shows up in a screen's HTML
             screens:  [{ id, name, route, file, components: [Name], note,
                          states: [{ name, reachable, html? }],   html: a state's own render, per device
                          caption: { title, body, on },
                          html: { mobile, tablet, desktop } }],   the screen's render; data-go="<id>" marks a
                                                                 button that follows the connector to <id>
             groups:   [{ id, screens, open, title, sub, subOn, meta }],
             links:    [{ id?, from, to, label }],          id defaults to "from>to"
             findings: [{ id?, kind, frame, ...facts, text? }],  id defaults to "frame:kind"
             notes:    [{ id?, frame, who, t, text, pos?: { device: [x, y] } }] }  id defaults to "frame:who"

         Interface
           FlowScan.read(raw, { devices })   devices: the device ids, e.g. FlowDevice.ids(); every screen gets one
                                  render per device (blank when the scan has none). Required: it throws without.
                                  raw: the JSON text, or the object. Gives { scan, problems }: the scan with every
                                  field the engine reads filled in, and what was wrong (a screen with no id or an
                                  id seen twice is skipped; a group member, link, finding, note or start that
                                  names a screen the scan does not have is dropped). Not a scan at all: scan null.
           FlowScan.merge(scanned, saved)   the items as the user sees them: each scanned item with its edits
                                  laid over it (an edit { gone: true } leaves it out), then the user's own items.
                                  saved is { edits: { id: fields }, mine: [item] }, or nothing. Fresh copies.
           FlowScan.diff(scanned, items)    the reverse: { edits, mine } holding only what differs from the scan,
                                  down to one key of a nested object (one device's position). A field the user
                                  took away is saved as null. Edits to items the scan no longer has are dropped.
           FlowScan.mergeGroups(scanned, saved, { fresh? })   the same for groups, whose frames are not a field but a
                                  relation: saved is { edits, mine, place, order, seq }, where place says, one frame at a
                                  time, which group the user put it in (or null: loose), order the frames of a group the
                                  user rearranged, seq the groups' own order. A frame with no place follows the scan; a
                                  place that points at a group that is gone falls back to the scan; a group left with no
                                  frames is dropped. A group of the user's whose id the scan now uses is given fresh(id).
                                  Gives { groups, renamed: { oldId: newId } }.
           FlowScan.diffGroups(scanned, groups)   the reverse: { edits, mine, place, order, seq } holding only what the
                                  user changed (order and seq only where they differ from what the scan gives).
           FlowScan.dataKinds(get)   the data halves of the four kinds a scan provides (captions, findings, notes,
                                  connectors), in the order the page lists them (the page's KINDS list is what sets the redraw order). get() gives
                                  the scan as read() returns it.
                                  Each is { name, scanned(), clean?, valid?, letGo?, resetBy?, counter? }:
                                  name is the field in the layout and on disk; scanned() the items the scan gives;
                                  clean(items, { hasScreen, scanned }) what loading drops or repairs; valid(item,
                                  { hasScreen }) whether one item may be in the layout at all (loading drops the ones that
                                  are not, and add refuses them); letGo(item, scannedItem, device) puts an item's moved
                                  places back where the scan had them (Tidy); resetBy "annotations" for a kind that
                                  "Reset layout" leaves alone; counter { prefix, saved } for ids handed out as "c7".
                                  FlowLayout reads these and nothing else about a kind.
         ====================================================================== */
      var FlowScan = (function () {
        "use strict";
        const clone = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
        const isObj = (o) => !!o && typeof o === "object" && !Array.isArray(o);
        const str = (v, d = "") => (typeof v === "string" ? v : d);
        const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
        const perDevice = (devices) => (h) => {
          const out = {};
          devices.forEach((d) => (out[d] = str(isObj(h) ? h[d] : "")));
          return out;
        };

        function read(raw, { devices } = {}) {
          if (!Array.isArray(devices) || !devices.length) throw new Error("FlowScan.read: devices is required (the device ids a render is wanted for)");
          const perDev = perDevice(devices);
          const problems = [];
          let src = raw;
          if (typeof raw === "string") {
            try {
              src = JSON.parse(raw);
            } catch (e) {
              return { scan: null, problems: ["the scan is not JSON: " + e.message] };
            }
          }
          if (!isObj(src)) return { scan: null, problems: ["the scan is not an object"] };
          const list = (k) => (Array.isArray(src[k]) ? src[k] : []);

          const screens = [],
            ids = new Set();
          list("screens").forEach((s, i) => {
            if (!isObj(s) || typeof s.id !== "string" || !s.id) return problems.push(`screen ${i} has no id: skipped`);
            if (ids.has(s.id)) return problems.push(`screen "${s.id}" appears twice: the second is skipped`);
            ids.add(s.id);
            const cap = isObj(s.caption) ? s.caption : {};
            screens.push({
              id: s.id,
              name: str(s.name, s.id),
              route: str(s.route),
              file: str(s.file),
              components: Array.isArray(s.components) ? s.components.filter((c) => typeof c === "string") : [],
              states: (Array.isArray(s.states) ? s.states : [])
                .filter((st) => isObj(st) && typeof st.name === "string")
                .map((st) => Object.assign({ name: st.name, reachable: st.reachable !== false }, isObj(st.html) ? { html: perDev(st.html) } : {})),
              note: str(s.note),
              caption: { title: str(cap.title), body: str(cap.body), on: cap.on === true },
              html: perDev(s.html),
            });
          });
          const known = (id) => ids.has(id);

          /* two items of one kind may not share an id: edits are kept by id, so the second would be lost */
          const unique = (kind, seen, id) => {
            if (seen.has(id)) {
              problems.push(`two ${kind} have the same id "${id}": the second is dropped`);
              return false;
            }
            seen.add(id);
            return true;
          };
          const placed = new Set(),
            groupIds = new Set(),
            groups = [];
          list("groups").forEach((g, i) => {
            if (!isObj(g) || typeof g.id !== "string") return problems.push(`group ${i} has no id: skipped`);
            if (!unique("groups", groupIds, g.id)) return;
            const members = [];
            (Array.isArray(g.screens) ? g.screens : []).forEach((id) => {
              if (!known(id)) problems.push(`group "${g.id}" names screen "${id}", which the scan does not have`);
              else if (placed.has(id)) problems.push(`group "${g.id}" names screen "${id}", which is already in another group`);
              else {
                placed.add(id);
                members.push(id);
              }
            });
            if (!members.length) return problems.push(`group "${g.id}" has no screens left: skipped`);
            const out = { id: g.id, screens: members, open: g.open !== false, meta: str(g.meta) };
            ["title", "sub"].forEach((k) => typeof g[k] === "string" && (out[k] = g[k]));
            if (typeof g.subOn === "boolean") out.subOn = g.subOn;
            groups.push(out);
          });

          const links = [],
            linkIds = new Set();
          list("links").forEach((l, i) => {
            if (!isObj(l) || !known(l.from) || !known(l.to)) return problems.push(`link ${i} joins a screen the scan does not have: dropped`);
            if (l.from === l.to) return problems.push(`link ${i} leads from "${l.from}" to itself: dropped`);
            const id = str(l.id, l.from + ">" + l.to);
            if (unique("links", linkIds, id)) links.push({ id, from: l.from, to: l.to, label: str(l.label) });
          });

          const findings = [],
            findingIds = new Set();
          list("findings").forEach((f, i) => {
            if (!isObj(f) || !known(f.frame)) return problems.push(`finding ${i} points at a screen the scan does not have: dropped`);
            const kind = str(f.kind, "note");
            const id = str(f.id, f.frame + ":" + kind);
            if (unique("findings", findingIds, id)) findings.push(Object.assign(clone(f), { id, kind }));
          });

          const notes = [],
            noteIds = new Set();
          list("notes").forEach((n, i) => {
            if (!isObj(n)) return problems.push(`note ${i} is not a note: dropped`);
            if (n.frame != null && !known(n.frame)) return problems.push(`note ${i} is on a screen the scan does not have: dropped`);
            if (typeof n.text !== "string") return problems.push(`note ${i} has no text: dropped`);
            const out = clone(n);
            out.frame = n.frame || null;
            out.who = str(n.who, "Scanner");
            out.id = str(n.id, (out.frame || "canvas") + ":" + out.who);
            if (unique("notes", noteIds, out.id)) notes.push(out);
          });

          let start = null;
          if (src.start != null) {
            if (known(src.start)) start = src.start;
            else problems.push(`start screen "${src.start}" is not in the scan`);
          }
          const components = {};
          if (isObj(src.components)) for (const k in src.components) if (typeof src.components[k] === "string") components[k] = src.components[k];

          return {
            scan: {
              product: { name: str(isObj(src.product) ? src.product.name : "", "Product"), scanned: str(isObj(src.product) ? src.product.scanned : "") },
              start,
              components,
              screens,
              groups,
              links,
              findings,
              notes,
            },
            problems,
          };
        }

        /* lay one item's edits over it: nested objects key by key, anything else replaced (null included) */
        function apply(base, edit) {
          for (const k in edit) {
            if (isObj(edit[k]) && isObj(base[k])) apply(base[k], edit[k]);
            else base[k] = clone(edit[k]);
          }
          return base;
        }
        /* what differs in now from was, as an edit; undefined when nothing does */
        function delta(was, now) {
          const out = {};
          for (const k of new Set([...Object.keys(was), ...Object.keys(now)])) {
            const a = was[k],
              b = k in now ? now[k] : null;
            if (a === undefined && b === null) continue;
            if (isObj(a) && isObj(b)) {
              const d = delta(a, b);
              if (d) out[k] = d;
            } else if (!same(a, b)) out[k] = clone(b);
          }
          return Object.keys(out).length ? out : undefined;
        }

        function merge(scanned, saved) {
          const edits = isObj(saved) && isObj(saved.edits) ? saved.edits : {};
          const mine = isObj(saved) && Array.isArray(saved.mine) ? saved.mine : [];
          const out = [];
          (scanned || []).forEach((item) => {
            const e = edits[item.id];
            if (isObj(e) && e.gone === true) return;
            out.push(isObj(e) ? apply(clone(item), e) : clone(item));
          });
          mine.forEach((m) => isObj(m) && typeof m.id === "string" && out.push(clone(m)));
          return out;
        }

        function diff(scanned, items) {
          const scannedIds = new Set((scanned || []).map((s) => s.id));
          const byId = new Map();
          const mine = [];
          (items || []).forEach((it) => {
            if (scannedIds.has(it.id) && !byId.has(it.id)) byId.set(it.id, it);

          }
          /* groups as the user sees them: the scan's, with the saved edits laid over, cleaned. Says which of the
             user's own groups had to take a new id because the scan now uses theirs, and (from a layout saved when
             open was still an edit) which groups were open. */
          function groupsFrom(saved, d) {
            const merged = FlowScan.mergeGroups(d.groups, saved, { fresh: () => layout.nextId("g") });
            const seenIds = new Set();
            const wasOpen = {};
            const groups = merged.groups
              .map((g) => {
                const screens = g.screens.filter((id) => hasScreen(id) && !seenIds.has(id));
                screens.forEach((id) => seenIds.add(id));
                if (typeof g.open === "boolean") wasOpen[g.id] = g.open;
                return groupRecord({ ...g, screens });
              })
              .filter((g) => g.screens.length);
            return { groups, renamed: merged.renamed, wasOpen };
          }
          /* the view record as saved, for the groups that exist; a layout from before it was kept falls back to the
             groups' own open (then an edit) */
          function viewFrom(st, groups, wasOpen) {
            const said = isObj(st.view) && isObj(st.view.open) ? st.view.open : isObj(st.view) ? {} : wasOpen;
            const out = {};
            groups.forEach((g) => {
              if (typeof said[g.id] === "boolean" && said[g.id] !== openDefault(g.id)) out[g.id] = said[g.id];
            });
            return out;
          }
          /* places only for things that exist, and a renamed group of the user's keeps its place */
          function tidyPos(pos, groups, renamed) {
            const groupIds = new Set(groups.map((g) => g.id));
            Object.values(pos).forEach((P) => {
              Object.keys(renamed).forEach((from) => from in P && ((P[renamed[from]] = P[from]), delete P[from]));
              Object.keys(P).forEach((id) => (hasScreen(id) || groupIds.has(id)) || delete P[id]);
            });
          }

          function load() {
            const d = freshDefaults();
            const start = startCounters(d);
            const fallBack = () => {
              adopt(d);
              setView({});
              counters = start;
            };
            let st = null;
            try {
              st = JSON.parse(storage.getItem(key) || "null");
            } catch (e) {}
            /* nothing saved, or a layout that is not the current shape (an older build's, or not ours at all):
               start from the scan. The old file stays in storage until the next save replaces it. */
            if (!isObj(st) || !isEdits(st.lanes)) return fallBack();
            try {
              /* ids the user's own groups hold are taken before any is handed out */
              const savedCounters = Object.fromEntries(
                COUNTERS.map((c) => [c.prefix, Math.max(Number(st[c.saved]) || start[c.prefix], start[c.prefix])]),
              );
              counters = counted(savedCounters, (c) => list((c.field === "groups" ? st.lanes : st[c.field] || {}).mine));
              const g = groupsFrom(st.lanes, d);
              if (isObj(st.pos)) for (const dev in st.pos) if (isObj(st.pos[dev])) d.pos[dev] = st.pos[dev];
              const out = Object.assign({ groups: g.groups, pos: d.pos }, overlays(st, d));
              tidyPos(out.pos, out.groups, g.renamed);
              adopt(out);
              setView(viewFrom(st, g.groups, g.wasOpen));
              counters = counted(counters, (c) => S[c.field]);
              freshIds();
              /* a user's group whose id the scan now uses took a new one: write that down at once */
              if (Object.keys(g.renamed).length) layout.save();
            } catch (e) {
              fallBack();
            }
          }

          layout.save = () => {
            try {
              storage.setItem(
                key,
                JSON.stringify(
                  Object.assign({ v: VERSION }, persisted().out, { view: { open: openSaid } }, Object.fromEntries(COUNTERS.map((c) => [c.saved, counters[c.prefix]]))),
                ),
              );
            } catch (e) {}
          };
          layout.snapshot = () => persisted().str;
          layout.restore = (s) => {
            const st = JSON.parse(s);
            const d = freshDefaults();
            const g = groupsFrom(st.lanes, d);
