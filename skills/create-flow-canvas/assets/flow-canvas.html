          /* the pointercancel event: the pointer is taken off whatever it was doing. Nothing was written. */
          function cancel() {
            const was = mode;
            reset();
            if (host.annotationDragging()) host.cancelAnnotation();
            if (host.gestureActive()) host.cancelDrag();
            if (was === "connect") host.endConnect(true);
            if (was === "marquee") host.cancelMarquee();
            if (was === "pan") host.panEnded();
          }

          return {
            down,
            move,
            up,
            cancel,
            cancelConnect() {
              if (mode !== "connect") return false;
              reset();
              host.endConnect(true);
              return true;
            },
            cancelDrag() {
              if (!host.gestureActive() && !host.annotationDragging()) return false;
              if (mode === "pending") reset();
              host.cancelAnnotation();
              host.cancelDrag();
              return true;
            },
            consumeMoved() {
              const was = moved;
              moved = false;
              return was;
            },
            setHand(on) {
              hand = !!on;
              showHand();
            },
            space(isDown) {
              if (space === !!isDown) return;
              space = !!isDown;
              showHand();
            },
            blur() {
              space = false;
              showHand();
            },
            state: () => ({ mode, moved, hand, space }),
          };
        }
        return { create };
      })();
    </script>

    <script id="gesture-module">
      /* ======================================================================
         GESTURE MODULE
         A drag of frames, or of a whole group, proposes; the drop commits. While the pointer is down the
         layout is never touched: the gesture holds a *proposal* (where the drop would land) and the page draws
         the layout as it would be if the proposal were dropped (the *view*). Letting go hands the proposal to
         FlowCommit once, as one undo step. Cancelling (Escape, pointercancel) throws the proposal away: there is
         nothing in the layout to put back. It knows nothing about the DOM: where things are comes from the geometry
         it is handed, and the page hands it an adapter for what is drawn.

         Interface
           const gesture = FlowGesture.create({ layout, commit, device, geo, frames, now, adapter })
             layout   a FlowLayout            commit  a FlowCommit
             device   () => id of the device whose positions a drop writes
             geo      where things are, and how big: what a FlowGeometry.create answers, of which it reads seven. The
                      page arranges it again for every preview, so these are about the layout as the drag proposes it
               box(groupId)         { x, top } the group's corner
               place(frameId)       { x, y } where a frame is meant to be
               rect(frameId, now)   { x, y } where a frame is drawn at `now` (it may be sliding)
               screenRect(frameId)  { x, y, w, h } its screen, where it is meant to be
               frame()              { w, screenTop, screenH } the anatomy of a frame on this device
               slotAt(point, { skip }) -> { group, idx } | null   the group a drop at this point joins, and the slot
               groupCornerFor(place) -> { x, y }   where a group sits so its first frame lands at `place`
             frames   every frame id, in order (an array)
             now      () => the clock the geometry's animation runs on, in ms
             adapter  the page's side, what is drawn:
               show(preview)   draw the preview, see below; called after every change, and as the drag begins
               settle(ids)     the drag is over, dropped or cancelled: let go of the held frames and clear
                               everything show() put up. The page is drawn from the layout right after.
           gesture.begin({ kind: "frame", ids, pid, pointer })    pointer in world px; pid is the frame under it
           gesture.begin({ kind: "group", id, pointer })          a group dragged by its grip
           gesture.move(pointer) -> proposal, or null when no gesture is live
           gesture.end() -> what was done, or null when no gesture is live. Commits the proposal once.
                          { kind: "into", ids, group, moved }   into group `group` (moved: it was not in it before)
                          { kind: "loose", ids, moved }         let go on the canvas (moved: it was in a group)
                          { kind: "merge", ids, group }         dropped onto a loose frame: `group` is the new one
                          { kind: "move", id }                  a group moved
                          { kind: "stay", ids }                 let go without moving
           gesture.cancel() -> true, or false when no gesture was live. Changes nothing and makes no undo step; the
                          page is drawn from the layout again (a commit with nothing to record, so frames slide home).
                          A drop is discarded the same way if the layout changed under the drag (undo, ⌘G).
           gesture.view() -> { groups, pos }   what to arrange now. The layout's own groups and positions when no
                          proposal is live; with one, the groups as they would be and the group's new place.
                          groups: [{ id, group, open, screens }]  (`group` is the layout's group, for its title etc.)
           gesture.active() -> a gesture is live

         Proposal   { kind: "into", id, idx }   into group `id`, at slot `idx` among the frames that stay
                    { kind: "merge", id }        onto the loose frame `id`
                    { kind: "loose", at }        on the canvas; at: { [frameId]: { x, y } }
                    { kind: "move", id, at }     group `id` to `at`
                    { kind: "stay" }             nothing: not moved yet, or held over the slot it started in
         Preview    { kind: "frame"|"group", proposal, held: { [frameId]: { x, y } }, regrouped, dropGroup, mergeFrame }
                    regrouped: the arrangement changed (draw the whole layout), not only where the held frames are
                    dropGroup: the group to light up; mergeFrame: the loose frame to light up (or null)
         ====================================================================== */
      var FlowGesture = (function () {
        "use strict";
        const keyOf = (p) => p.kind + "|" + (p.id || "") + "|" + (p.idx === undefined ? "" : p.idx);

        function create({ layout, commit, device, geo, frames, now, adapter }) {
          let g = null; /* the live gesture: { kind, ids, pid, off, was, start, w0, held, proposal, last, base } */

          /* where a drop at this point (the centre of the frame under the pointer) would land: in the group whose band it is
             over (the geometry knows the bands and the slots), onto a loose frame's screen, or on the canvas */
          function targetAt(c, ids) {
            const hit = geo.slotAt(c, { skip: ids });
            if (hit) return { kind: "into", id: hit.group, idx: hit.idx };
            for (const id of frames) {
              if (ids.includes(id) || layout.groupOf(id)) continue;
              const r = geo.screenRect(id);
              if (r && c.x > r.x && c.x < r.x + r.w && c.y > r.y && c.y < r.y + r.h) return { kind: "merge", id };
            }
            return { kind: "loose" };
          }

          function announce(regrouped) {
            const p = g.proposal;
            adapter.show({
              kind: g.kind,
              proposal: p,
              held: g.held,
              regrouped,
              dropGroup: p.kind === "into" ? p.id : null,
              mergeFrame: p.kind === "merge" ? p.id : null,
            });
          }

          /* the data change a drop makes; runs inside a commit */
          function apply(d) {
            const p = d.proposal,
              dev = device();
            if (p.kind === "into") {
              layout.moveInto(d.ids, p.id, p.idx);
              return { kind: "into", ids: d.ids, group: p.id, moved: d.ids.some((i) => (d.was.get(i) || null) !== p.id) };
            }
            if (p.kind === "loose") {
              layout.takeOut(d.ids);
              d.ids.forEach((i) => layout.place(dev, i, p.at[i]));
              return { kind: "loose", ids: d.ids, moved: d.ids.some((i) => d.was.get(i)) };
            }
            if (p.kind === "merge") {
              /* the group sits where the frame it was dropped on is, whether the others came from a group or not */
              const at = geo.place(p.id);
              const ids = [p.id, ...d.ids];
              const group = layout.groupFrames(ids, { device: dev, at: geo.groupCornerFor(at) });
              return { kind: "merge", ids, group };
            }
            if (p.kind === "move") {
              layout.place(dev, p.id, p.at);
              return { kind: "move", id: p.id };
            }
            return { kind: "stay", ids: d.ids };
          }

          return {
            active: () => !!g,
            begin(press) {
              if (g) throw new Error("FlowGesture: a gesture is already live");
              if (press.kind === "group") {
                const b = geo.box(press.id);
                g = {
                  kind: "group",
                  ids: [],
                  id: press.id,
                  start: { x: b.x, y: b.top },
                  w0: press.pointer,
                  held: {},
                  proposal: { kind: "stay" },
                  base: layout.snapshot(),
                };
              } else {
                const off = {},
                  held = {};
                press.ids.forEach((i) => {
                  const r = geo.rect(i, now());
                  off[i] = { x: press.pointer.x - r.x, y: press.pointer.y - r.y };
                  held[i] = { x: r.x, y: r.y };
                });
                /* where the frame under the pointer is now: holding it there proposes nothing */
                const L0 = layout.groupOf(press.pid);
                g = {
                  kind: "frame",
                  ids: press.ids,
                  pid: press.pid,
                  off,
                  held,
                  was: new Map(layout.groups.flatMap((l) => l.screens.map((s) => [s, l.id]))),
                  proposal: { kind: "stay" },
                  last: keyOf(L0 ? { kind: "into", id: L0.id, idx: L0.screens.indexOf(press.pid) } : { kind: "loose" }),
                  base: layout.snapshot(),
                };
              }
              announce(false);
            },
            move(pointer) {
              if (!g) return null;
              if (g.kind === "group") {
                g.proposal = {
                  kind: "move",
                  id: g.id,
                  at: { x: Math.round(g.start.x + (pointer.x - g.w0.x)), y: Math.round(g.start.y + (pointer.y - g.w0.y)) },
                };
                announce(true);
                return g.proposal;
              }
              const held = {};
              g.ids.forEach((i) => {
                held[i] = { x: pointer.x - g.off[i].x, y: pointer.y - g.off[i].y };
              });
              /* the centre of the screen of the frame under the pointer */
              const F = geo.frame(),
                p0 = held[g.pid];
              const t = targetAt({ x: p0.x + F.w / 2, y: p0.y + F.screenTop + F.screenH / 2 }, g.ids);
              const next = t.kind === "loose" ? { kind: "loose", at: held } : t;
              const key = keyOf(next),
                same = key === g.last;
              g.held = held;
              g.last = key;
              /* still where it started: no proposal (a loose frame's own spot is a proposal, it carries where it is) */
              if (next.kind === "loose" || !same) g.proposal = next;
              announce(!same);
              return g.proposal;
            },
            end() {
              if (!g) return null;
              const d = g;
              g = null;
              adapter.settle(d.ids);
              let result = { kind: "stay", ids: d.ids };
              /* the layout changed under the drag (undo, group): the proposal was made against data that is gone */
              const stale = layout.snapshot() !== d.base;
              /* force: the preview moved things on screen, so the page is drawn from the layout whether or not it changed */
              commit(() => !stale && (result = apply(d)), { redraw: ["layout"], force: true });
              return result;
            },
            cancel() {
              if (!g) return false;
              const d = g;
              g = null;
              adapter.settle(d.ids);
              commit(() => {}, { redraw: ["layout"], force: true });
              return true;
            },
            view() {
              const pos = layout.pos[device()] || {};
              const groups = layout.groups.map((L) => ({ id: L.id, group: L, open: L.open, screens: L.screens }));
              const p = g && g.proposal;
              if (!p || p.kind === "stay") return { groups, pos };
              if (p.kind === "move") return { groups, pos: { ...pos, [p.id]: p.at } };
              const out = groups.map((x) => ({ ...x, screens: x.screens.filter((s) => !g.ids.includes(s)) }));
              if (p.kind === "into") {
                const t = out.find((x) => x.id === p.id);
                t.screens = [...t.screens.slice(0, p.idx), ...g.ids, ...t.screens.slice(p.idx)];
              }
              return { groups: out, pos };
            },
          };
        }
        return { create };
      })();
    </script>

    <script id="panel-module">
      /* ======================================================================
         PANEL MODULE
         The side panel (a sheet along the bottom on a narrow window) shows Inspect or Search. This module is the
         one place that knows whether it is open, which mode, which screen Inspect is about, which component is
         being swept ("find every screen that uses it"), and how much of the window it takes. The page does not
         keep a second copy of any of that: it listens, and paints what the module says. No DOM, no product
         knowledge: the page hands it the one question it cannot answer itself.

         Interface
           const panel = FlowPanel.create({ usesOf, narrowAt? })
             usesOf    (component) => [screen ids that use it], from the scan
             narrowAt  a window this wide or narrower gets a sheet instead of a side panel (default 720, the stylesheet's breakpoint)
           Every call below that changes something returns true, and one that changes nothing returns false.
           panel.open(mode, subject?)     "inspect" | "search"; anything else throws. Inspect takes the screen it is
                                          about (or none); Search takes no subject. Opening Search clears a sweep.
           panel.close()                  puts everything away, the sweep too; the last mode is remembered
           panel.toggle(mode, subject?)   closes when that mode is already showing, opens it otherwise
           panel.follow(subject)          the selection moved: Inspect now shows that screen (or none). Only while
                                          Inspect is open.
           panel.sweep(component)         sweep it; sweeping what is swept already changes nothing. Only in Inspect,
                                          and only for a component some screen uses.
           panel.toggleSweep(component)   a click on its chip: on, off, or over to another
           panel.clearSweep()
           panel.state() -> { open, mode, subject, label, sweep }
                                          label: what the panel is called to a screen reader ("Inspector", "Search")
                                          sweep: { component, uses: [ids] }, or null. A copy: change it and nothing happens.
           panel.insets({ width, height }) -> { right, bottom }   the inset it takes from the window right now, which the
                                          camera leaves free. Asked for each time, so a resize is answered for its new size.
           panel.on(listener) -> off      listener(state, change) after every change, never for a call that changed
                                          nothing. change: { opened, closed, mode, subject, sweep }, each true when
                                          that part changed (closing a sweep that was on says sweep: true as well).
         ====================================================================== */
      var FlowPanel = (function () {
        "use strict";
        const MODES = { inspect: "Inspector", search: "Search" };
        const SIDE = { share: 0.48, max: 560 };
        const SHEET = { share: 0.46, max: 430 };

        function create({ usesOf, narrowAt = 720 }) {
          let open = false,
            mode = "search",
            subject = null,
            sweepOf = null; /* the component being swept */
          const listeners = new Set();
          const uses = (c) => [...usesOf(c)];

          const snapshot = () => ({ open, mode, subject, sweepOf });
          function changed(before, after) {
            return {
              opened: !before.open && after.open,
              closed: before.open && !after.open,
              mode: before.mode !== after.mode,
              subject: before.subject !== after.subject,
              sweep: before.sweepOf !== after.sweepOf,
            };
          }
          const state = () => ({
            open,
            mode,
            subject,
            label: MODES[mode],
            sweep: sweepOf === null ? null : { component: sweepOf, uses: uses(sweepOf) },
          });
          /* run a change, then tell the listeners if it was one */
          function run(fn) {
            const before = snapshot();
            fn();
            const change = changed(before, snapshot());
            if (!Object.values(change).some(Boolean)) return false;
            listeners.forEach((l) => l(state(), change));
            return true;
          }
          const inInspect = () => open && mode === "inspect";

          const api = {
            open(next, on) {
              if (!MODES[next]) throw new Error(`FlowPanel: no mode "${next}" (there are ${Object.keys(MODES).join(", ")})`);
              return run(() => {
                open = true;
                mode = next;
                subject = next === "inspect" ? on || null : null;
                if (next !== "inspect") sweepOf = null;
              });
            },
            close() {
              return run(() => {
                open = false;
                subject = null;
                sweepOf = null;
              });
            },
            toggle(next, on) {
              return open && mode === next ? api.close() : api.open(next, on);
            },
            follow(on) {
              if (!inInspect()) return false;
              return run(() => {
                subject = on || null;
              });
            },
            sweep(c) {
              if (!inInspect() || !uses(c).length) return false;
              return run(() => {
                sweepOf = c;
              });
            },
            toggleSweep(c) {
              return sweepOf === c ? api.clearSweep() : api.sweep(c);
            },
            clearSweep() {
              if (sweepOf === null) return false;
              return run(() => {
                sweepOf = null;
              });
            },
            state,
            insets({ width, height }) {
              if (!open) return { right: 0, bottom: 0 };
              if (width <= narrowAt) return { right: 0, bottom: Math.round(Math.min(height * SHEET.share, SHEET.max)) };
              return { right: Math.min(SIDE.max, width * SIDE.share), bottom: 0 };
            },
            on(listener) {
              listeners.add(listener);
              return () => listeners.delete(listener);
            },
          };
          return api;
        }
        return { create };
      })();
    </script>

    <script id="framedom-module">
      /* ======================================================================
         FRAMEDOM MODULE
         The one owner of a screen's own DOM: the product's markup inside a frame. Which render a screen shows
         (its state, on this device), mounting it, counting and lighting up its components, the ripple under a
         tap, the product's own reactions to a tap, and a copy of it for a search tile all come through here.
         Nothing else holds a node of a screen: the page, the panel and the scanner cards name a screen by its
         id and get back plain values (a number, a state, where a tap leads).

         The module is logic. Where a screen actually lives (a light-DOM element today, a shadow root some day)
         is a host adapter's business, so a test stands a fake host in and needs no browser. The page's one
         live host is marked in the page script ("live screen host").

         Interface
           FlowFrameDom.create({ screens, components, device, host, behaviour, report }) -> frames   (the page calls it FrameDom)
             screens      the scan's screens: { id: { html: { deviceId: markup }, states: [{ name, html? }] } }
             components   the scan's component selectors: { name: selector }
             device       () -> { id, ... } the device being shown now
             behaviour    optional, the product's own { onTap(screenId, target, root), interactive: selector }
             report       report(error) for a reaction that throws; the tap goes on
           frames.stateIndex(id)        the state a screen shows (0 until set); kept across devices, not saved
           frames.shownStates(id)       the states that have a render of their own, plus the first
           frames.switchable(id)        more than one state can be shown
           frames.hostHTML(id)          the markup of the element a screen is mounted into (the page puts it in
                                        a frame, then calls render)
           frames.render(id)            mounts the render for the shown state on this device. The whole of it:
                                        what was tapped inside the screen is gone, because a screen is its render
           frames.setState(id, i)       shows state i, if it can be shown -> true; otherwise nothing happens -> false
           frames.count(id, c)          how many instances of component c are on the screen now (a number)
           frames.spotlight(id, c)      dims the screen except around c, with its name; clears the last one first
           frames.clearSpot()
           frames.hit(event)            { id, x, y, target } if the event came from inside a screen, else null.
                                        x and y are on the screen, in its own pixels; target is the host's own
                                        handle and means nothing to anyone but the host and the product's behaviour
           frames.tap(hit)              the ripple, then the product's reaction -> { go }, the screen id a link in the
                                        target led to (read before the reaction runs), or null. The page decides
                                        whether it can follow
           frames.interactive(hit)      the target is a link or something the product reacts to
           frames.copyInto(id, container)   a copy of the screen, drawn into a container, without what the canvas
                                        lays over a live one

         Host adapter (what a host answers)
           hostHTML(id, { device, state }) -> markup      mount(id, markup, state)       root(id) -> the screen's root
           count(id, selector) -> n (only what is shown)  rects(id, selector) -> { w, h, rects: [{x,y,w,h}] } | null
           drawSpot(id, { svg, label: { text, left, top } })   clearSpot()
           hit(event) -> { id, x, y, target } | null      ripple(id, x, y)              goOf(target) -> id | null
           matches(target, selector) -> boolean           copyInto(id, container)
         ====================================================================== */
      var FlowFrameDom = (function () {
        "use strict";
        const PAD = 3;
        function create({ screens, components = {}, device, host, behaviour = null, report = () => {} }) {
          /* the state each switchable screen shows: view state, kept across device switches */
          const stateOf = {};
          const known = (id) => Object.prototype.hasOwnProperty.call(screens, id);
          const shownStates = (id) =>
            known(id) ? screens[id].states.map((st, i) => (i === 0 || st.html ? i : -1)).filter((i) => i >= 0) : [];
          const stateIndex = (id) => (known(id) && stateOf[id]) || 0;
          const markup = (id) => {
            const i = stateIndex(id),
              st = screens[id].states[i];
            return i && st && st.html ? st.html[device().id] : screens[id].html[device().id];
          };

          /* a screen is shown by mounting its whole render, never by patching what is there */
          const show = (id) => {
            host.mount(id, markup(id), stateIndex(id));
          };

          function spotlight(id, c) {
            host.clearSpot();
            if (!known(id) || !components[c]) return;
            const seen = host.rects(id, components[c]);
            if (!seen || !seen.rects.length) return;
            const W = seen.w,
              H = seen.h;
            const rects = seen.rects.map((r) => {
              const x = Math.max(0, r.x - PAD),
                y = Math.max(0, r.y - PAD);
              return { x, y, w: Math.min(W - x, r.w + PAD * 2), h: Math.min(H - y, r.h + PAD * 2) };
            });
            const rad = (r) => Math.min(14, r.h / 2);
            const svg = `<svg class="spot" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs><mask id="spm"><rect width="${W}" height="${H}" fill="#fff"/>${rects.map((r) => `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="${rad(r)}" fill="#000"/>`).join("")}</mask></defs><rect width="${W}" height="${H}" fill="rgba(16,19,19,.46)" mask="url(#spm)"/>${rects.map((r) => `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="${rad(r)}" fill="none" stroke="#A343F5" stroke-width="2"/>`).join("")}</svg>`;
            const first = rects.slice().sort((a, b) => a.y - b.y || a.x - b.x)[0];
            host.drawSpot(id, {
              svg,
              label: {
                text: c + (rects.length > 1 ? " ×" + rects.length : ""),
                left: Math.max(6, Math.min(first.x, W - 130)),
                top: first.y > 30 ? first.y - 26 : first.y + first.h + 6,
              },
            });
          }

          return {
            stateIndex,
            shownStates,
            switchable: (id) => shownStates(id).length > 1,
            hostHTML: (id) => host.hostHTML(id, { device: device(), state: stateIndex(id) }),
            render: (id) => known(id) && show(id),
            setState(id, i) {
              if (!shownStates(id).includes(i)) return false;
              stateOf[id] = i;
              show(id);
              return true;
            },
            count: (id, c) => (known(id) && components[c] ? host.count(id, components[c]) : 0),
            spotlight,
            clearSpot: () => host.clearSpot(),
            hit: (event) => host.hit(event),
            tap(hit) {
              if (!hit) return { go: null };
              host.ripple(hit.id, hit.x, hit.y);
              /* where the tap leads is read first: a reaction may replace the very node that links */
              const go = host.goOf(hit.target) || null;
              if (behaviour && typeof behaviour.onTap === "function") {
                try {
                  behaviour.onTap(hit.id, hit.target, host.root(hit.id));
                } catch (err) {
                  report(err);
                }
              }
              return { go };
            },
            interactive: (hit) =>
              !!hit && host.matches(hit.target, ["[data-go]", behaviour && behaviour.interactive].filter(Boolean).join(",")),
            copyInto: (id, container) => host.copyInto(id, container),
          };
        }
        return { create };
      })();
    </script>

    <script>
      "use strict"; /* a write to what the layout holds (read-only) throws here instead of being ignored */
      /* ======================================================================
   THE SCAN, read through FlowScan. Everything below knows its shape, not its product: no screen ids, no
   product class names, no product words. Problems are reported in the console; a scan that cannot be read
   at all leaves a message instead of a canvas.
   ====================================================================== */
      const READ = FlowScan.read((document.getElementById("flow-scan") || {}).textContent || "", { devices: FlowDevice.ids() });
      READ.problems.forEach((p) => console.warn("flow-scan:", p));
      if (!READ.scan) {
        document.body.innerHTML =
          '<p style="font:15px/1.5 system-ui;max-width:32em;margin:15vh auto;padding:0 16px">This canvas has no readable scan. ' +
          "Regenerate it, or check the &lt;script id=&quot;flow-scan&quot;&gt; block: " +
          String(READ.problems[0] || "").replace(/&/g, "&amp;").replace(/</g, "&lt;") +
          "</p>";
        throw new Error("flow-scan: " + READ.problems[0]);
      }
      const SCAN = READ.scan;
      const SCREENS = Object.fromEntries(SCAN.screens.map((s) => [s.id, s]));
      const ORDER = SCAN.screens.map((s) => s.id);
      const DEFAULT_GROUPS = SCAN.groups;
      const shortName = (x) => SCREENS[x].name.split(" · ")[0];
      const hopTo = (x) => String(html`<button class="hop" data-to="${x}">${shortName(x)}</button>`);
      const andList = (a) =>
        a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
      /* ---------- live screen host: begin ---------- */
      /* FrameDom (FlowFrameDom, above) owns a screen's own DOM. This block is its host: the only place in the page
         that knows a screen is a ".phone" element in the page's own DOM, how that element is made and found,
         how an event from inside one is read, what is laid over it (ripple, spotlight) and how a copy is drawn.
         To mount screens in a shadow root instead, change this block (and where the product styles apply) and
         nothing else. Nothing outside it holds a node of a screen. */
      const FrameDom = (() => {
        const phoneOf = (id) => document.getElementById("p-" + id);
        /* what of a component is on the screen to be seen: the instances that take room, and not the spotlight itself */
        const shown = (ph, selector) => [...ph.querySelectorAll(selector)].filter((el) => el.offsetWidth > 0 && !el.closest(".spot"));
        const host = {
          hostHTML: (id, { device, state }) => `<div class="phone ${device.cls}" id="p-${esc(id)}" data-state="${esc(state)}"></div>`,
          mount(id, markup, state) {
            const ph = phoneOf(id);
            if (!ph) return;
            ph.innerHTML = markup;
            ph.dataset.state = state;
          },
          root: phoneOf,
          count: (id, selector) => {
            const ph = phoneOf(id);
            return ph ? shown(ph, selector).length : 0;
          },
          rects(id, selector) {
            const ph = phoneOf(id);
            if (!ph) return null;
            const pr = ph.getBoundingClientRect(),
              sc = pr.width / ph.offsetWidth;
            return {
              w: ph.offsetWidth,
              h: ph.offsetHeight,
              rects: shown(ph, selector).map((el) => {
                const r = el.getBoundingClientRect();
                return { x: (r.left - pr.left) / sc, y: (r.top - pr.top) / sc, w: r.width / sc, h: r.height / sc };
              }),
            };
          },
          drawSpot(id, { svg, label }) {
            const ph = phoneOf(id);
            if (!ph) return;
            ph.insertAdjacentHTML("beforeend", svg);
            const lbl = document.createElement("span");
            lbl.className = "spotlbl";
            lbl.textContent = label.text;
            lbl.style.left = label.left + "px";
            lbl.style.top = label.top + "px";
            ph.appendChild(lbl);
            requestAnimationFrame(() => {
              const sp = ph.querySelector(".spot");
              if (sp) sp.classList.add("on");
              lbl.classList.add("on");
            });
          },
          clearSpot() {
            document.querySelectorAll(".spot,.spotlbl").forEach((n) => n.remove());
          },
          /* an event from inside a screen: which, where on it (in its own pixels, whatever the zoom), and what was hit */
          hit(e) {
            const ph = e.target.closest && e.target.closest(".phone"),
              col = ph && ph.closest(".col");
            if (!ph || !col) return null;
            const r = ph.getBoundingClientRect();
            return { id: col.dataset.id, x: (e.clientX - r.left) / cam.k, y: (e.clientY - r.top) / cam.k, target: e.target };
          },
          ripple(id, x, y) {
            const ph = phoneOf(id);
            if (!ph) return;
            const rp = document.createElement("span");
            rp.className = "ripple";
            rp.style.left = x + "px";
            rp.style.top = y + "px";
            ph.appendChild(rp);
            setTimeout(() => rp.remove(), 650);
          },
          goOf(target) {
            const el = target.closest("[data-go]");
            return (el && el.dataset.go) || null;
          },
          matches: (target, selector) => !!target.closest(selector),
          /* a copy of a screen to draw somewhere else (a search tile), without what the canvas lays over a live one */
          copyInto(id, container) {
            const clone = phoneOf(id).cloneNode(true);
            clone.removeAttribute("id");
            clone.querySelectorAll("[id]").forEach((n) => n.removeAttribute("id"));
            clone.querySelectorAll(".ripple,.spot,.spotlbl").forEach((n) => n.remove());
            container.appendChild(clone);
          },
        };
        return FlowFrameDom.create({
          screens: SCREENS,
          components: SCAN.components,
          device: () => DEV,
          host,
          behaviour: window.FlowScanBehaviour,
          report: (err) => console.error("flow-scan-behaviour:", err),
        });
      })();
      /* ---------- live screen host: end ---------- */

      /* The finding kinds. The scan says what was found (a kind and its facts); the kind says it in words,
         decides what lights up with the card, and what clicking it does. A kind the engine does not know shows
         the scan's own text and does nothing. */
      const FIND_W = 316;
      const FINDING_KINDS = {
        "unreachable-states": {
          text(f) {
            const s = SCREENS[f.frame],
              only = s.states.filter((x) => !x.reachable).length;
            return `<small>Scanner · unreachable</small><code>${esc(f.source || s.file)}</code> has <em>no entry point</em> in the UI. ${only} of ${s.states.length} states are only reachable in code. <button class="hop" data-act="go">View them</button>`;
          },
          tie(f, col, on) {
            const b = col.querySelector(".states");
            if (b) b.classList.toggle("hl", on);
          },
          act(f) {
            const i = FrameDom.shownStates(f.frame).find((k) => k > 0 && !SCREENS[f.frame].states[k].reachable);
            if (i) setState(f.frame, i);
            select(f.frame, true);
          },
        },
        "reused-component": {
          text(f) {
            const all = usesOf(f.component),
              others = all.filter((x) => x !== f.frame);
            return `<small>Scanner · reused</small><code>${esc(f.component)}</code> is used by <button class="hop" data-act="go">${all.length} routes</button>. Edits here will ripple to ${andList(others.map(hopTo))}.`;
          },
          tie(f, col, on) {
            if (on && !col.classList.contains("deck")) FrameDom.spotlight(f.frame, f.component);
            else FrameDom.clearSpot();
          },
          act(f) {
            select(f.frame, true);
            panel.open("inspect", f.frame);
            panel.sweep(f.component);
          },
        },
      };
      const PLAIN_FINDING = { text: (f) => `<small>Scanner</small>${esc(f.text || "")}`, tie() {}, act() {} };
      const findingKind = (f) => FINDING_KINDS[f.kind] || PLAIN_FINDING;

      /* the canvas's fixed measurements, in world px (from the geometry) */
      const { head: HEAD } = FlowGeometry.WORLD; /* only the stylesheet's --head: the geometry measures with it */
      /* where every frame is, and where it is going: the one answer for the camera, connectors, notes and hit-tests */
      const geo = FlowGeometry.create({
        reduceMotion: matchMedia("(prefers-reduced-motion: reduce)").matches,
      });
      matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", (e) => {
        geo.setReduceMotion(e.matches);
        applyFrames(); /* a slide in progress is put where it was going */
        drawConns();
      });
      /* the device on show: its one description (FlowDevice), from which the numbers, the style variables and the classes come */
      let DEV = FlowDevice.describe(FlowDevice.ids()[0]);
      function applyDevice(id) {
        DEV = FlowDevice.describe(id);
        geo.setMetrics(DEV.metrics);
        const r = document.documentElement.style;
        Object.entries(DEV.cssVars).forEach(([name, value]) => r.setProperty(name, value));
        r.setProperty("--head", HEAD + "px");
        document.querySelectorAll("#devsw button").forEach((b) => {
          b.classList.toggle("on", b.dataset.dev === id);
          b.setAttribute("aria-pressed", String(b.dataset.dev === id));
        });
      }

      /* ======================================================================
   WORLD
   ====================================================================== */
      const $ = (s) => document.querySelector(s);
      const stage = $("#stage"),
        world = $("#world"),
        notesEl = $("#notes"),
        framesEl = $("#frames");
      const svgNS = "http://www.w3.org/2000/svg";

      /* ======================================================================
   ANNOTATIONS: the author's voice. A screen's caption and a group's title and description are part of the layout
   (FlowLayout, saved under the layout key and undone with it). Both are edited in place.
   ====================================================================== */
      const clone = (o) => JSON.parse(JSON.stringify(o));
      /* a screen's caption, as the layout has it (read through the layout every time: undo swaps the objects) */
      const capOf = (id) => layout.caps.find((c) => c.id === id);
      const CE = (() => {
        const d = document.createElement("div");
        try {
          d.contentEditable = "plaintext-only";
        } catch (e) {}
        return d.contentEditable === "plaintext-only"
          ? "plaintext-only"
          : "true";
      })();
      /* scanned text enters markup only through here (see FlowMarkup) */
      const { esc, html, sel: cssStr } = FlowMarkup;
      const X_ICON =
        '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2 2l6 6M8 2L2 8"/></svg>';
      const ADD_ICON = '<svg viewBox="0 0 20 20"><use href="#i-plus"/></svg>';
      function capHTML(id, i) {
        const a = capOf(id);
        return `<div class="cap ann${a.on ? "" : " off"}" data-k="${esc(id)}">
    <h3 class="ct"><span class="cn">${i + 1}</span><span class="ctt" contenteditable="${CE}" spellcheck="false" data-f="title" data-ph="Add a title" role="textbox" aria-label="Screen title">${esc(a.title)}</span></h3>
    <p class="cb" contenteditable="${CE}" spellcheck="false" data-f="body" data-ph="Say what happens here" role="textbox" aria-label="Screen description">${esc(a.body)}</p>
    <button class="cx" title="Remove annotation" aria-label="Remove annotation">${X_ICON}</button>
    <button class="cadd">${ADD_ICON}Add description</button></div>`;
      }
      function gsubHTML(L) {
        return `<div class="gsubw ann${L.subOn ? "" : " off"}" data-k="${esc(L.id)}">
    <p class="gsub" contenteditable="${CE}" spellcheck="false" data-f="sub" data-ph="Say what this flow is for" role="textbox" aria-label="Flow description">${esc(L.sub)}</p>
    <button class="cx" title="Remove description" aria-label="Remove description">${X_ICON}</button>
    <button class="cadd">${ADD_ICON}Add description</button></div>`;
      }
      /* the captions' redraw: a frame gets the caption it is missing (a new world), and every caption shows what the
         layout has (after undo or a reset). A field the user is typing in is left alone when it already says so. */
      function refreshCaps() {
        ORDER.forEach((id) => {
          const col = colOf(id);
          if (col && !col.querySelector(".cap")) col.querySelector(".pwrap").insertAdjacentHTML("afterend", capHTML(id, 0));
        });
        document.querySelectorAll(".cap[data-k]").forEach((w) => {
          const a = capOf(w.dataset.k);
          if (!a) return;
          w.classList.toggle("off", !a.on);
          w.querySelectorAll("[data-f]").forEach((f) => {
            if (f.textContent !== a[f.dataset.f]) f.textContent = a[f.dataset.f];
          });
        });
      }
      /* captions and the groups' text are part of the layout: put back by one commit, so ⌘Z brings them back */
      function resetAnn() {
        commit(() => layout.resetText(), { redraw: ["layout", "caps"] });
        toast("Annotations reset to the scanned copy");
      }
      function caretEnd(f) {
        f.focus();
        const r = document.createRange();
        r.selectNodeContents(f);
        r.collapse(false);
        const sel = getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
      }
      // editing
      world.addEventListener("input", (e) => {
        const f = e.target.closest("[data-f]");
        if (!f) return;
        const w = f.closest("[data-k]");
        if (!w) return;
        /* each key goes through the layout; the undo step is recorded when the field is left (below) */
        if (groupById(w.dataset.k)) commit.typing.change(() => layout.setGroupText(w.dataset.k, { [f.dataset.f]: f.textContent }));
        else if (capOf(w.dataset.k)) commit.typing.change(() => layout.edit("caps", w.dataset.k, { [f.dataset.f]: f.textContent }));
      });
      /* one undo step per visit to a group's, a frame's or a note's text, not one per keystroke */
      const TYPED = ".gtitle,.gsub,.ctt,.cb,.note .txt";
      world.addEventListener("focusout", (e) => {
        if (e.target.closest(TYPED)) commit.typing.end();
      });
      world.addEventListener("keydown", (e) => {
        const f = e.target.closest && e.target.closest("[data-f]");
        if (!f) return;
        e.stopPropagation();
        if (e.key === "Escape") {
          f.blur();
          return;
        }
        if (
          e.key === "Enter" &&
          (f.dataset.f === "title" || e.metaKey || e.ctrlKey)
        ) {
          e.preventDefault();
          f.blur();
        }
      });
      world.addEventListener("paste", (e) => {
        if (e.target.closest && e.target.closest("[data-f]")) {
          e.preventDefault();
          document.execCommand(
            "insertText",
            false,
            e.clipboardData.getData("text/plain"),
          );
        }
      });
      // remove / add back (capture so the header's own click handler never sees it)
      world.addEventListener(
        "click",
        (e) => {
          const b = e.target.closest(".cx,.cadd");
          if (!b) return;
          e.stopPropagation();
          e.preventDefault();
          const w = b.closest("[data-k]"),
            k = w.dataset.k,
            on = b.classList.contains("cadd");
          if (groupById(k)) commit(() => layout.setGroupText(k, { subOn: on }));
          else commit(() => layout.edit("caps", k, { on }));
          w.classList.toggle("off", !on);
          if (on)
            caretEnd(
              w.querySelector("[data-f]:not(.ctt)") ||
                w.querySelector("[data-f]"),
            );
          else toast("Annotation removed. Hover the card to add it back.");
        },
        true,
      );

      /* ---------- notes: one kind, saved with the layout ---------- */
      const ago = (at) => {
        const m = Math.round((Date.now() - at) / 60000);
        if (m < 1) return "now";
        if (m < 60) return m + "m";
        const h = Math.round(m / 60);
        return h < 24 ? h + "h" : Math.round(h / 24) + "d";
      };
      const notePlace = (n) =>
        n.frame ? FlowDevice.placeOn(n.pos, DEV.id) : [n.x, n.y];
      /* which frame is this point on, if any (world coordinates) */
      const homeFor = (wx, wy) => geo.frameAt({ x: wx, y: wy }, performance.now(), { margin: 20 });
      const localFrom = (id, wx, wy) => {
        const r = geo.rect(id, performance.now());
        return [Math.round((wx - r.x) / r.s), Math.round((wy - r.y) / r.s)];
      };
      /* note id -> its element: the notes kind's own, so nothing outside it holds a note's DOM */
      const noteEls = new Map();
      function buildNote(n) {
        const parent = n.frame ? colOf(n.frame) : notesEl;
        if (!parent) return null;
        const [x, y] = notePlace(n);
        const d = document.createElement("div");
        d.className = "note";
        d.dataset.nid = n.id;
        noteEls.set(n.id, d);
        d.style.left = x + "px";
        d.style.top = y + "px";
        d.innerHTML = `<div class="txt" contenteditable="true" spellcheck="false">${esc(n.text)}</div><div class="who">${esc(n.who)} · ${n.at ? ago(n.at) : esc(n.t || "")}</div><button class="nx" type="button" aria-label="Delete this note" title="Delete (Delete key)"><svg aria-hidden="true"><use href="#i-x"/></svg></button>`;
        d.tabIndex = 0;
        d.setAttribute("role", "group");
        d.setAttribute("aria-label", "Note from " + n.who + ". Delete removes it.");
        d.querySelector(".txt").addEventListener("input", (e) => {
          const text = e.currentTarget.textContent;
          commit.typing.change(() => layout.edit("notes", n.id, { text }));
        });
        d.querySelector(".nx").addEventListener("click", (e) => {
          e.stopPropagation();
          annotations.remove("notes", n.id);
        });
        parent.appendChild(d);
        return d;
      }
      function refreshNotes() {
        document.querySelectorAll(".note").forEach((n) => n.remove());
        noteEls.clear();
        layout.notes.forEach(buildNote);
      }
      /* A note's DOM is handled by hand around its commit, not by the "notes" redraw (which rebuilds every
         note): a new note takes focus, and a dragged one is already where it was dropped. Same for the
         finding cards below. */
      function createNote({ text = "New note", frame = null, local = null, world = null }) {
        const n = {
          id: "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
          frame,
          who: "You",
          at: Date.now(),
          text,
          ...(frame ? { pos: { [DEV.id]: local } } : { x: world[0], y: world[1] }),
        };
        commit(() => layout.add("notes", n));
        const d = buildNote(noteOf(n.id));
        if (d) {
          const t = d.querySelector(".txt");
          t.focus();
          document.execCommand("selectAll");
        }
        return d;
      }
      /* after a drag or a nudge: a note dropped on a frame belongs to it from then on; dropped on empty canvas it floats.
         The data change runs inside a commit (FlowAnnotations does that); the DOM follows in rehomeDom. */
      function rehomeData(n, d) {
        const m = worldM(),
          r = d.getBoundingClientRect(),
          wx = (r.left - m.e) / m.a,
          wy = (r.top - m.f) / m.a,
          f = homeFor(wx + r.width / m.a / 2, wy + r.height / m.a / 2);
        if (f) layout.edit("notes", n.id, { frame: f, pos: { ...(f === n.frame ? n.pos : {}), [DEV.id]: localFrom(f, wx, wy) }, x: undefined, y: undefined });
        else layout.edit("notes", n.id, { frame: null, pos: undefined, x: Math.round(wx), y: Math.round(wy) });
      }
      function rehomeDom(n, d) {
        const parent = n.frame ? colOf(n.frame) : notesEl,
          [x, y] = notePlace(n);
        if (d.parentNode !== parent) parent.appendChild(d);
        d.style.left = x + "px";
        d.style.top = y + "px";
        d.style.zIndex = "";
      }

      /* ======================================================================
   ANNOTATION KINDS
   Notes, scanner findings, connectors and captions. Each is one object: the data half FlowScan.dataKinds gives it
   (its field in the layout, the scan's items, how loading cleans them) with its view half laid over it (refresh, and
   how it is found, grabbed, moved and deleted). The page declares one list, KINDS, and hands it to FlowLayout (what
   is saved), FlowCommit (what is redrawn, in the order of the list) and FlowAnnotations (input). A kind finds its
   own DOM by id; nothing else holds a node of it. A new kind is one more object in this list; the throwaway fifth
   kind in tests/kinds.test.mjs shows the whole cost.
   ====================================================================== */
      const DATA = FlowScan.dataKinds(() => SCAN);
      const kind = (name, view) => {
        const data = DATA.find((k) => k.name === name);
        if (!data) throw new Error('kind("' + name + '"): FlowScan.dataKinds has no such kind');
        return { ...data, ...view, name };
      };

      /* notes: a card on a frame or on the canvas */
      const noteOf = (id) => layout.notes.find((x) => x.id === id);
      const noteKind = kind("notes", {
        refresh: refreshNotes,
        movable: true,
        preventDefault: true,
        owns: (t) => !!t.closest(".note"),
        match(t, how) {
          const d = t.closest(".note");
          if (!d) return null;
          if (how === "pointer") {
            /* not on its delete button, and not while its text is being edited */
            return t.closest(".nx") || document.activeElement === d.querySelector(".txt") ? null : d.dataset.nid;
          }
          return t === d ? d.dataset.nid : null; /* keys: only when the note itself has focus, not while typing in it */
        },
        origin(id) {
          const d = noteEls.get(id);
          return { x: parseFloat(d.style.left), y: parseFloat(d.style.top) };
        },
        lift(id) {
          const d = noteEls.get(id);
          d.classList.add("dragging");
          d.style.zIndex = 30;
        },
        place(id, p) {
          const d = noteEls.get(id);
          d.style.left = p.x + "px";
          d.style.top = p.y + "px";
        },
        save(id, p, how) {
          const n = noteOf(id),
            d = noteEls.get(id);
          if (!n || !d) return;
          if (!how.nudged) return rehomeData(n, d); /* a drop: it may land on another frame, or on empty canvas */
          /* a nudge moves the note where it is: 8 px must not attach it to a frame or let go of one */
          const at = [Math.round(p.x), Math.round(p.y)];
          if (n.frame) layout.edit("notes", n.id, { pos: { ...(n.pos || {}), [DEV.id]: at } });
          else layout.edit("notes", n.id, { x: at[0], y: at[1] });
        },
        settle(id, how) {
          const d = noteEls.get(id);
          if (!d) return;
          d.classList.remove("dragging");
          d.style.zIndex = "";
          const n = noteOf(id);
          if (n && how.moved && !how.nudged) rehomeDom(n, d);
        },
        tap(id) {
          const t = noteEls.get(id).querySelector(".txt");
          t.focus();
          const r = document.createRange();
          r.selectNodeContents(t);
          r.collapse(false);
          const s = getSelection();
          s.removeAllRanges();
          s.addRange(r);
        },
        erase(id) {
          layout.remove("notes", id);
        },
        erased(id) {
          const d = noteEls.get(id);
          if (d) d.remove();
          noteEls.delete(id);
          toast("Note deleted. ⌘Z brings it back.");
        },
      });

      /* scanner findings: a card tied to its frame by a leader. buildScan registers each card's handle in scanViews. */
      const scanViews = new Map();
      const scanKind = kind("scans", {
        refresh: refreshScans,
        movable: true,
        owns: (t) => !!t.closest(".scan"),
        match(t, how) {
          const d = t.closest(".scan");
          if (!d) return null;
          if (how === "pointer") return t.closest(".hop,.sx") ? null : d.dataset.sid;
          if (how === "nudge") return t === d ? d.dataset.sid : null;
          return d.dataset.sid; /* delete: from anywhere inside the card */
        },
        origin: (id) => scanViews.get(id).at(),
        lift(id) {
          scanViews.get(id).el.classList.add("dragging");
          document.body.classList.add("selecting");
        },
        place: (id, p) => scanViews.get(id).place(p.x, p.y),
        save: (id, p) => scanViews.get(id).savePos(p),
        settle(id, how) {
          const v = scanViews.get(id);
          if (!v) return;
          v.el.classList.remove("dragging");
          document.body.classList.remove("selecting");
          if (how.cancelled) v.redrawLeader();
          if (how.moved && !how.nudged) v.dragged(); /* the click that follows a drag is not a click on the card */
        },
        erase(id) {
          layout.remove("scans", id);
        },
        erased(id) {
          const v = scanViews.get(id);
          if (v) v.erased();
          scanViews.delete(id);
          toast("Finding dismissed. ⌘Z brings it back.");
        },
      });

      /* connectors do not move; they can be deleted, and a press on their chip is not a press on the canvas */
      const linkKind = kind("conns", {
        refresh: () => drawConns(),
        redraw: ["conns"],
        owns: (t) => !!t.closest(".echip"),
        match(t, how) {
          if (how !== "delete") return null;
          const chip = t.closest(".echip");
          return chip ? chip.dataset.id : selection.conn(); /* a selected connector is deleted from anywhere */
        },
        erase(id) {
          layout.remove("conns", id);
          if (selection.conn() === id) selection.clearConn();
        },
        erased: () => toast("Connector deleted. ⌘Z to undo."),
      });

      /* captions (a screen's title and description) are typed in place; typing, hiding and adding back are the text
         editing below, shared with a group's own title and description (which are part of the group, not a kind).
         The kind builds a frame's caption, refreshes them all, and is part of the ownership check, so a press on
         one is never a press on the canvas behind it. It does not move and is not deleted: it is hidden. */
      const captionKind = kind("caps", { refresh: refreshCaps, owns: (t) => !!t.closest("[data-f],.cx,.cadd") });

      /* the order of this list is the order of the redraw: captions first, then the cards that sit on frames, then
         the connectors, which are drawn from where the frames are */
      const KINDS = [captionKind, scanKind, noteKind, linkKind];

      /* ======================================================================
   LAYOUT MODEL
   A canvas holds free frames and groups. A group is a sequence of frames that either
   fans out into a flow (open) or stacks into a deck (closed). Membership is shared by
   every device; positions are remembered per device, because the frames change size.
   The page reads the layout and asks it to change (its mutators, through commit); it never writes to it.
   ====================================================================== */
      const layout = FlowLayout.create({
        key: "flow-canvas.layout.v1",
        storage: {
          getItem: (k) => localStorage.getItem(k),
          setItem: (k, v) => localStorage.setItem(k, v),
        },
        hasScreen: (id) => !!SCREENS[id],
        /* the scan's groups; the kinds bring their own scanned items, and the layout keeps the user's edits */
        defaults: () => ({
          groups: SCAN.groups,
          pos: Object.fromEntries(FlowDevice.ids().map((id) => [id, {}])),
        }),
        kinds: KINDS,
      });
      /* every edit ends here: undo point, save, redraw, in one fixed order */
      const commit = FlowCommit.create({ layout, kinds: KINDS, redraw: { world: buildWorld, layout: relayout } });
      /* the user is typing in this: Delete and the arrow keys are theirs, not an annotation's */
      const typing = (t) => !!(t.closest && t.closest("input,select,[contenteditable]"));
      const annotations = FlowAnnotations.create({ commit, kinds: KINDS, typing });
      const groupOf = (id) => layout.groupOf(id);
      const isFree = (id) => !groupOf(id);
      const colOf = (id) => document.querySelector(`.col[data-id="${cssStr(id)}"]`);
      const groupEl = (id) => document.getElementById(id);
      /* a group's element, by id: the page's own handle; the layout's groups carry none */
      const groupEls = new Map();
      function sameAsDefault(L) {
        const d = DEFAULT_GROUPS.find((x) => x.id === L.id);
        return (
          !!d &&
          d.screens.length === L.screens.length &&
          d.screens.every((s) => L.screens.includes(s))
        );
      }
      const groupName = FlowLayout.groupName;
      const groupById = (id) => layout.groups.find((l) => l.id === id);

      /* A drag of frames or of a group proposes; the drop commits (FlowGesture). While one is live the page is drawn from
         gesture.view(): the layout as it would be if the proposal were dropped. The layout itself is not touched. */
      const gesture = FlowGesture.create({
        layout,
        commit,
        device: () => DEV.id,
        geo,
        frames: ORDER,
        now: () => performance.now(),
        adapter: { show: showGesture, settle: settleGesture },
      });

      /* what the geometry is asked to arrange: the groups, every frame, and where this device has things saved */
      const geoInput = () => {
        const v = gesture.view();
        return { groups: v.groups.map(({ id, screens, open }) => ({ id, screens, open })), screens: ORDER, pos: v.pos };
      };
      const arrange = FlowArrange.create({ layout, geo, frames: ORDER, device: () => DEV.id, metrics: () => DEV.metrics, input: geoInput });
      const geoMove = FlowGeometry.MOVES;
      for (const k of ["open", "deck"]) {
        const root = document.documentElement.style;
        root.setProperty(`--${k}-dur`, geoMove[k].dur + "ms");
        root.setProperty(`--${k}-ease`, `cubic-bezier(${geoMove[k].curve.join(",")})`);
      }
      /* a frame's corner, as the geometry has it at this moment */
      function putFrame(id, now) {
        const col = colOf(id),
          r = geo.rect(id, now);
        if (col && r) {
          col.style.translate = r.x + "px " + r.y + "px";
          col.style.scale = r.s;
        }
      }
      function applyFrames(now = performance.now()) {
        ORDER.forEach((id) => {
          const col = colOf(id),
            f = geo.place(id);
          if (!col || !f) return;
          const st = col.style;
          col.classList.toggle("deck", geo.isDeck(id));
          col.classList.toggle("free", !f.group);
          col.dataset.lane = f.group || "";
          putFrame(id, now);
          st.setProperty("--r", f.r + "deg");
          st.setProperty("--d", f.d + "ms");
          st.setProperty("--z", f.z);
          st.setProperty("--fx", f.fx + "px");
          st.setProperty("--fy", f.fy + "px");
          const cn = col.querySelector(".cn");
          if (cn) cn.textContent = f.group ? String(f.i + 1) : "";
        });
      }
      /* the one loop that runs while a frame is on its way: move what moved, redraw what hangs off it. It stops
         by itself when the geometry says everything is at rest, however long the flow is. */
      let pumping = false;
      function pump() {
        if (pumping || geo.settled(performance.now())) return;
        pumping = true;
        const tick = () => {
          const now = performance.now();
          geo.step(now).forEach((id) => putFrame(id, now));
          drawConns(now);
          if (geo.settled(now)) pumping = false;
          else requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }
      /* tell the geometry the layout changed: frames slide to their new places */
      function arrangeFrames(opts) {
        geo.retarget(geoInput(), performance.now(), opts);
        applyFrames();
      }

      /* a group's own objects: headline, standfirst, edges between consecutive frames */
      function makeGroup(L) {
        const el = document.createElement("section");
        el.className = "lane";
        el.id = L.id;
        el.innerHTML = `<div class="ghead">
      <div class="gt"><button class="grip" title="Drag to move this group" aria-label="Drag to move group"><svg><use href="#i-grip"/></svg></button><button class="chev" title="Open or close this group" aria-label="Open or close group"><svg><use href="#i-chevup"/></svg></button><h2 class="gtitle" contenteditable="${CE}" spellcheck="false" data-k="${esc(L.id)}" data-f="title" data-ph="Name this group" role="textbox" aria-label="Group name">${esc(L.title)}</h2></div>
      ${gsubHTML(L)}
      <div class="gs"><span class="gcount"></span><span class="gmeta"></span><button class="fplay" title="Play flow"><svg><use href="#i-play"/></svg><span>Play flow</span></button><button class="fmore" title="Group options" aria-label="Group options"><svg><use href="#i-more"/></svg></button></div>
    </div>
    <div class="content"><div class="dz"></div></div>`;
        world.insertBefore(el, notesEl);
        el.querySelector(".ghead").addEventListener("click", (e) => {
          e.stopPropagation();
          const Lc = layout.groups.find((l) => l.id === el.id);
          if (!Lc) return;
          if (e.target.closest(".grip")) return;
          if (e.target.closest(".fmore")) {
            openGroupMenu(Lc, e.target.closest(".fmore"));
            return;
          }
          if (e.target.closest(".fplay")) {
            if (el.querySelector(".fplay").classList.contains("on")) stopPlay();
            else play(Lc.screens);
            return;
          }
          if (e.target.closest(".chev") || !Lc.open) setGroup(Lc.id, !Lc.open);
        });
        return el;
      }
      /* the dashed box that lights up when a frame is dragged over a group: the geometry says how big it is */
      function sizeDz(L) {
        const z = geo.dropZone(L.id);
        Object.assign(groupEls.get(L.id).querySelector(".dz").style, {
          left: z.left + "px",
          top: z.top + "px",
          width: z.w + "px",
          height: z.h + "px",
        });
      }
      /* the group's title and description as the layout has them (after an undo, a reset, a load); the field
         being typed in is left alone */
      function showGroupText(L) {
        const el = groupEls.get(L.id);
        const put = (sel, text) => {
          const f = el.querySelector(sel);
          if (f !== document.activeElement && f.textContent !== text) f.textContent = text;
        };
        put(".gtitle", L.title);
        put(".gsub", L.sub);
        el.querySelector(".gsubw").classList.toggle("off", !L.subOn);
      }
      function syncGroups() {
        const shown = gesture.view().groups;
        const ids = new Set(shown.map((g) => g.id));
        document.querySelectorAll(".lane").forEach((e) => {
          if (!ids.has(e.id)) e.remove();
        });
        /* the page's handles follow the groups shown, however a group's element went (the world is rebuilt too) */
        groupEls.forEach((el, id) => ids.has(id) || groupEls.delete(id));
        shown.forEach(({ group: L, screens }) => {
          let el = document.getElementById(L.id);
          if (!el) el = makeGroup(L);
          groupEls.set(L.id, el);
          showGroupText(L);
          const n = screens.length;
          const box = geo.box(L.id);
          el.style.left = box.x + "px";
          el.style.top = box.top + "px";
          el.style.width = box.w + "px";
          el.style.height = box.h + "px";
          el.classList.toggle("open", L.open);
          el.classList.toggle("closed", !L.open);
          el.classList.toggle("empty", n === 0);
          /* where a closed group's title stands, beside its deck */
          const title = geo.closedTitle(L.id);
          el.style.setProperty("--hx", title.x + "px");
          el.style.setProperty("--hy", title.y + "px");
          el.querySelector(".gcount").textContent =
            n + (n === 1 ? " screen" : " screens");
          const dm = DEFAULT_GROUPS.find((x) => x.id === L.id);
          el.querySelector(".gmeta").innerHTML =
            dm && sameAsDefault(L)
              ? " · <code>" +
                esc(dm.meta.split(" · ")[0]) +
                "</code>" +
                (dm.meta.includes(" · ")
                  ? " · " + esc(dm.meta.split(" · ").slice(1).join(" · "))
                  : "")
              : "";
          sizeDz(L);
        });
      }
      function relayout(opts) {
        arrangeFrames(opts);
        syncGroups();
        updateBars();
        updateAllBtn();
        updateSelBox();
        drawConns();
        pump();
        /* now that frames are attached and sized, the finding cards' leaders can be drawn from real measurements */
        scanViews.forEach((v) => v.redrawLeader());
      }

      /* ---------- scanner findings: a card tied to its frame by a leader; drag it, dismiss it ---------- */
      /* f: a finding as the layout has it (the scan's facts, the user's position if it has one) */
      function buildScan(col, f) {
        const kind = findingKind(f);
        const live = () => layout.scans.find((x) => x.id === f.id);
        /* findings on one frame stand one under the other until they are moved */
        const nth = layout.scans.filter((x) => x.frame === f.frame).findIndex((x) => x.id === f.id);
        /* the place the user gave it on this device, or carried from the one they moved it on; none means the default stack */
        const saved = FlowDevice.carried(f.pos, DEV.id);
        const [dx, dy] = [0, DEV.findY + Math.max(0, nth) * 132];
        let left = saved ? saved[0] : dx,
          top = saved ? saved[1] : dy + geo.frame().caption,
          moved = !!saved;
        const st = document.createElementNS(svgNS, "svg");
        st.setAttribute("class", "stem");
        st.setAttribute("width", "1");
        st.setAttribute("height", "1");
        st.setAttribute("aria-hidden", "true");
        st.innerHTML = `<path class="sl"/><circle class="dk" r="4.5"/><circle class="en" r="3"/>`;
        col.appendChild(st);
        const d = document.createElement("div");
        d.className = "scan";
        d.dataset.sid = f.id;
        d.tabIndex = 0;
        d.setAttribute("role", "group");
        d.setAttribute("aria-label", "Scanner finding. Arrow keys move it, Delete dismisses it.");
        d.style.width = FIND_W + "px";
        d.innerHTML = `<span class="ic"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"><path d="M6 1v2M6 9v2M1 6h2M9 6h2M2.8 2.8l1.4 1.4M7.8 7.8l1.4 1.4M2.8 9.2l1.4-1.4M7.8 4.2l1.4-1.4"/></svg></span><div>${kind.text(f)}</div><button class="sx" type="button" aria-label="Dismiss this finding" title="Dismiss (Delete)"><svg aria-hidden="true"><use href="#i-x"/></svg></button>`;
        col.appendChild(d);
        const place = (l, t, m) => {
          left = l;
          top = t;
          d.style.left = l + "px";
          d.style.top = t + "px";
          const g = FlowRouting.leader(geo.frame(), l, t, d.offsetWidth, d.offsetHeight, m);
          st.querySelector(".sl").setAttribute("d", g.d);
          const dk = st.querySelector(".dk"),
            en = st.querySelector(".en");
          dk.setAttribute("cx", g.x0);
          dk.setAttribute("cy", g.y0);
          en.setAttribute("cx", g.end[0]);
          en.setAttribute("cy", g.end[1]);
        };
        /* the data change for a move or a nudge; FlowAnnotations commits it */
        const savePos = (p) => {
          moved = true; /* it has a place of its own now, so its leader takes the "moved" route */
          const r = live();
          if (r) layout.edit("scans", r.id, { pos: { ...(r.pos || {}), [DEV.id]: [Math.round(p.x), Math.round(p.y)] } });
        };
        place(left, top, moved);
        /* the finding and the thing it describes light up together */
        const tie = (on) => {
          col.classList.toggle("tied", on);
          kind.tie(f, col, on);
        };
        const hoverOk = () => matchMedia("(hover: hover)").matches;
        d.addEventListener("mouseenter", () => hoverOk() && tie(true));
        d.addEventListener("mouseleave", () => hoverOk() && tie(false));
        d.addEventListener("focusin", () => tie(true));
        d.addEventListener("focusout", () => tie(false));
        const dismiss = () => annotations.remove("scans", f.id);
        /* the shared annotation drag, keys and delete drive the card through this handle (see scanKind) */
        let justDragged = false;
        scanViews.set(f.id, {
          el: d,
          at: () => ({ x: left, y: top }),
          place: (x, y) => place(x, y, true),
          /* draw the leader for where the card is now, at its real size: after a cancelled drag, and after every
             layout (a card is built before its frame is attached to the page, so it measures 0 wide at first) */
          redrawLeader: () => place(left, top, moved),
          savePos,
          erased: () => {
            tie(false);
            st.remove();
            d.remove();
          },
          dragged: () => {
            justDragged = true;
            setTimeout(() => (justDragged = false), 0);
          },
        });
        d.addEventListener("click", (e) => {
          e.stopPropagation(); /* a click on the finding is not a click on the frame behind it */
          if (justDragged) return;
          if (e.target.closest(".sx")) return dismiss();
          const h = e.target.closest(".hop");
          if (h && h.dataset.to) select(h.dataset.to, true);
          else kind.act(f);
        });
      }
      function refreshScans() {
        document.querySelectorAll(".col .scan, .col .stem").forEach((n) => n.remove());
        scanViews.clear();
        layout.scans.forEach((f) => {
          const col = colOf(f.frame);
          if (col) buildScan(col, f);
        });
      }

      /* frames */
      function makeCol(id) {
        const s = SCREENS[id],
          col = document.createElement("div"),
          many = FrameDom.switchable(id);
        col.className = "col" + (many ? " hasstack" : "");
        col.dataset.id = id;
        col.innerHTML = `<div class="label"><span class="lname">${esc(s.name)}</span><span class="route">${esc(s.route)}</span>${many ? `<button class="states">${stateLabel(id)}</button>` : '<span class="live"><i></i></span>'}</div>
    <div class="pwrap">${many ? '<div class="stack b"></div><div class="stack a"></div>' : ""}${FrameDom.hostHTML(id)}<i class="port" data-side="R"></i><i class="port" data-side="L"></i><i class="port" data-side="T"></i><i class="port" data-side="B"></i></div>`;
        if (many)
          col.querySelector(".states").addEventListener("click", (e) => {
            e.stopPropagation();
            select(id);
            const shown = FrameDom.shownStates(id);
            setState(id, shown[(shown.indexOf(FrameDom.stateIndex(id)) + 1) % shown.length]);
          });
        framesEl.appendChild(col);
        FrameDom.render(id);
        return col;
      }
      function buildWorld() {
        document.querySelectorAll(".lane,.col").forEach((e) => e.remove());
        ORDER.forEach(makeCol);
        KINDS.forEach((k) => k.refresh());
        geo.reset();
        relayout();
      }

      /* ---------- geometry helpers ---------- */
      function groupRect(L) {
        const b = geo.box(L.id);
        return { x: b.x - 40, y: b.top - 40, w: b.w + 80, h: b.h + 80 };
      }
      function setGroup(id, open, opts = {}) {
        const L = layout.groups.find((l) => l.id === id);
        if (!L || L.open === open) return;
        commit(() => layout.setOpen(id, open));
        if (open) {
          if (opts.fly !== false) fly(fitRect(groupRect(L), 40));
        } else {
          if (selection.ids().some((i) => L.screens.includes(i))) select(null);
          if (playing && playGroup === id) stopPlay();
          if (opts.fly !== false) fly(fitRect(geo.bounds(), 60, 1.1));
        }
      }

      /* the screens that use a component, from the scan; and the panel that sweeps them (see FlowPanel) */
      const usesOf = (c) => ORDER.filter((x) => SCREENS[x].components.includes(c));
      const panel = FlowPanel.create({ usesOf });

      /* ======================================================================
   CAMERA
   ====================================================================== */
      let cam = { x: 0, y: 0, k: 0.6 },
        flyTimer;
      /* the inset the panel takes from the window, which the camera leaves free; asked for each time */
      const panelInset = () => panel.insets({ width: innerWidth, height: innerHeight });
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
      const toWorld = (cx, cy) => ({
        x: (cx - cam.x) / cam.k,
        y: (cy - cam.y) / cam.k,
      });
      function apply() {
        world.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.k})`;
        $("#zoom").textContent = Math.round(cam.k * 100) + "%";
        updateBars(true);
      }
      function fly(t) {
        stage.classList.add("fly");
        cam = { ...t };
        apply();
        clearTimeout(flyTimer);
        /* the flying transition lasts 750ms (.fly in the styles) */
        flyTimer = setTimeout(() => stage.classList.remove("fly"), 810);
      }
      function fitRect(r, pad = 60, maxK = 2) {
        const inset = panelInset(),
          vw = Math.max(240, innerWidth - inset.right),
          vh = Math.max(240, innerHeight - inset.bottom),
          k = clamp(
            Math.min((vw - pad * 2) / r.w, (vh - pad * 2 - 56) / r.h),
            0.1,
            maxK,
          );
        return {
          k,
          x: vw / 2 - (r.x + r.w / 2) * k,
          y: (vh - 30) / 2 - (r.y + r.h / 2) * k,
        };
      }
      function zoomAt(cx, cy, f) {
        const k = clamp(cam.k * f, 0.1, 2.5),
          r = k / cam.k;
        cam.x = cx - (cx - cam.x) * r;
        cam.y = cy - (cy - cam.y) * r;
        cam.k = k;
        apply();
      }
      function focusScreen(id) {
        const r = geo.screenRect(id);
        fly(
          fitRect(
            { x: r.x - 30, y: r.y - 40, w: r.w + 60, h: r.h + 70 },
            30,
            1.6,
          ),
        );
      }
      function view(n) {
        stopPlay();
        if (n === "all") {
          fly(fitRect(geo.bounds(), 30));
          return;
        }
        const L = layout.groups.find((l) => l.id === n);
        if (!L) return;
        if (!L.open) commit(() => layout.setOpen(L.id, true));
        fly(fitRect(groupRect(L), 40));
      }

      /* thin scrollbars */
      let sbT;
      const sH = $(".sbar.h"),
        sV = $(".sbar.v");
      function updateBars(show) {
        const B = geo.bounds(),
          bw = Math.max(B.x + B.w + 400, innerWidth / cam.k),
          bh = Math.max(B.y + B.h + 300, innerHeight / cam.k);
        const vx = -cam.x / cam.k,
          vy = -cam.y / cam.k,
          vw = innerWidth / cam.k,
          vh = innerHeight / cam.k;
        const tw = clamp(vw / bw, 0.06, 1),
          th = clamp(vh / bh, 0.06, 1);
        sH.firstChild.style.left = clamp(vx / bw, 0, 1 - tw) * 100 + "%";
        sH.firstChild.style.width = tw * 100 + "%";
        sV.firstChild.style.top = clamp(vy / bh, 0, 1 - th) * 100 + "%";
        sV.firstChild.style.height = th * 100 + "%";
        if (show) {
          sH.classList.add("show");
          sV.classList.add("show");
          clearTimeout(sbT);
          sbT = setTimeout(() => {
            sH.classList.remove("show");
            sV.classList.remove("show");
          }, 900);
        }
      }

      /* ======================================================================
   SELECTION, TOOLBAR, PANEL
   ====================================================================== */
      /* what is selected is FlowSelection's; the page paints it (reflectSel) and the panel follows it */
      const selection = FlowSelection.create();
      const seltb = $("#seltb");
      function markActive() {
        const primary = selection.primary(),
          conn = selection.conn();
        document
          .querySelectorAll(".conn[data-to],.echip[data-to]")
          .forEach((el) => el.classList.toggle("active", el.dataset.to === primary));
        document
          .querySelectorAll(".conn,.echip")
          .forEach((el) => el.classList.toggle("sel", !!conn && el.dataset.id === conn));
      }
      function reflectSel() {
        const { ids, primary } = selection.state();
        ORDER.forEach((s) => {
          const c = colOf(s);
          if (c) c.classList.toggle("sel", selection.has(s));
        });
        markActive();
        const i = primary ? ORDER.indexOf(primary) + 1 : 0;
        $("#pnum").textContent =
          String(i).padStart(2, "0") +
          "/" +
          String(ORDER.length).padStart(2, "0");
        seltb.classList.toggle("show", ids.length > 0);
        seltb.classList.toggle("multi", ids.length > 1);
        seltb.querySelector(".cnt").textContent = ids.length + " selected";
        seltb.querySelector('[data-a="ungroup"]').hidden = !ids.some(
          (id) => groupOf(id),
        );
        updateSelBox();
      }
      /* every change to the selection repaints it, and the panel follows the primary frame, however it changed */
      selection.on(reflectSel);
      FlowSelection.follows(selection, panel);
      /* select exactly these frames. Repainted even when nothing changed: a rebuilt world has fresh elements to mark. */
      function setSel(ids, primary) {
        if (!selection.set(ids, primary)) reflectSel();
      }
      function select(id, focus) {
        if (id) {
          const L = groupOf(id);
          if (L && !L.open) setGroup(L.id, true, { fly: false });
        }
        setSel(id ? [id] : [], id || null);
        if (focus && id) focusScreen(id);
      }
      function go(from, to) {
        const hop = layout.conns.find((c) => c.from === from && c.to === to);
        if (hop) tokenAlong(hop.id);
        select(to, false);
        const r = geo.screenRect(to);
        if (cam.k >= 0.8) {
          const inset = panelInset();
