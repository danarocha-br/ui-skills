      const switchable = (id) => shownStates(id).length > 1;
      /* the state each switchable frame shows: view state, kept across device switches, not saved */
      const stateOf = {};
      const stateIndex = (id) => stateOf[id] || 0;
      const screenHTML = (id) => {
        const st = SCREENS[id].states[stateIndex(id)];
        return stateIndex(id) && st && st.html ? st.html[DEV.id] : SCREENS[id].html[DEV.id];
      };

      /* The finding kinds. The scan says what was found (a kind and its facts); the kind says it in words,
         decides what lights up with the card, and what clicking it does. A kind the engine does not know shows
         the scan's own text and does nothing. */
      const FIND_W = 316;
      const FINDING_KINDS = {
        "unreachable-states": {
          text(f) {
            const s = SCREENS[f.frame],
              only = s.states.filter((x) => !x.reachable).length;
            return `<small>Scanner · unreachable</small><code>${esc(f.source || s.file)}</code> has <em>no entry point</em> in the UI. ${only} of ${s.states.length} states are only reachable in code. <button class="hop" data-act="go">View them</button>`;
          },
          tie(f, col, on) {
            const b = col.querySelector(".states");
            if (b) b.classList.toggle("hl", on);
          },
          act(f) {
            const i = SCREENS[f.frame].states.findIndex((x, k) => k > 0 && !x.reachable && x.html);
            if (i > 0) setState(f.frame, i);
            select(f.frame, true);
          },
        },
        "reused-component": {
          text(f) {
            const all = usesOf(f.component),
              others = all.filter((x) => x !== f.frame);
            return `<small>Scanner · reused</small><code>${esc(f.component)}</code> is used by <button class="hop" data-act="go">${all.length} routes</button>. Edits here will ripple to ${andList(others.map(hopTo))}.`;
          },
          tie(f, col, on) {
            if (on && !col.classList.contains("deck")) spotlight(f.frame, f.component);
            else clearSpot();
          },
          act(f) {
            select(f.frame, true);
            inspect(f.frame);
            if (usageComp !== f.component) sweep(f.component);
          },
        },
      };
      const PLAIN_FINDING = { text: (f) => `<small>Scanner</small>${esc(f.text || "")}`, tie() {}, act() {} };
      const findingKind = (f) => FINDING_KINDS[f.kind] || PLAIN_FINDING;

      /* the canvas's fixed measurements, in world px (from the geometry) */
      const { laneLeft: LANE_LEFT, gap: GAP, head: HEAD, phTop: PH_TOP } = FlowGeometry.WORLD;
      /* where every frame is, and where it is going: the one answer for the camera, connectors, notes and hit-tests */
      const geo = FlowGeometry.create({
        reduceMotion: matchMedia("(prefers-reduced-motion: reduce)").matches,
      });
      matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", (e) => {
        geo.setReduceMotion(e.matches);
        applyFrames(); /* a slide in progress is put where it was going */
        drawConns();
      });
      let CAP, COL_W, PH_H, COLL_H, DECK_W, PEEK_X;
      const DEVICES = {
        mobile: {
          id: "mobile",
          label: "Mobile",
          vp: "390 × 844",
          cw: 270,
          ch: 585,
          cr: 38,
          ds: 0.4,
          deckW: 108,
          peekX: 10,
          peekY: 8,
          edge: 509,
          body: 744,
          cap: 170,
          capT: 19,
          capB: 12.5,
          capL: 4,
          collH: 290,
          closedW: 440,
          tw: 150,
          cls: "dm",
          findY: 662 /* where a finding sits below its frame's caption */,
        },
        tablet: {
          id: "tablet",
          label: "Tablet",
          vp: "768 × 1024",
          cw: 400,
          ch: 560,
          cr: 26,
          ds: 0.4,
          deckW: 160,
          peekX: 12,
          peekY: 9,
          edge: 480,
          body: 724,
          cap: 150,
          capT: 22,
          capB: 13.5,
          capL: 3,
          collH: 300,
          closedW: 580,
          tw: 190,
          cls: "dw dt",
          findY: 640 /* where a finding sits below its frame's caption */,
        },
        desktop: {
          id: "desktop",
          label: "Desktop",
          vp: "1200 × 772",
          cw: 600,
          ch: 420,
          cr: 14,
          ds: 0.38,
          deckW: 228,
          peekX: 12,
          peekY: 9,
          edge: 205,
          body: 584,
          cap: 140,
          capT: 26,
          capB: 15,
          capL: 2,
          collH: 240,
          closedW: 700,
          tw: 220,
          cls: "dw dd",
          findY: 500 /* where a finding sits below its frame's caption */,
        },
      };
      let DEV = DEVICES.mobile;
      function applyDevice(id) {
        DEV = DEVICES[id];
        const M = FlowGeometry.metrics(DEV);
        geo.setMetrics(M);
        COL_W = M.colW;
        PH_H = M.phH;
        CAP = M.cap;
        COLL_H = M.collH;
        DECK_W = M.deckW;
        PEEK_X = M.peekX;
        const r = document.documentElement.style;
        r.setProperty("--cw", DEV.cw + "px");
        r.setProperty("--ch", DEV.ch + "px");
        r.setProperty("--cr", DEV.cr + "px");
        r.setProperty("--ds", DEV.ds);
        r.setProperty("--tw", DEV.tw + "px");
        r.setProperty("--ts", DEV.tw / DEV.cw);
        r.setProperty("--head", HEAD + "px");
        r.setProperty("--cap", DEV.cap + "px");
        r.setProperty("--capT", DEV.capT + "px");
        r.setProperty("--capB", DEV.capB + "px");
        r.setProperty("--capL", DEV.capL);
        r.setProperty("--edge", DEV.edge + "px");
        document.querySelectorAll("#devsw button").forEach((b) => {
          b.classList.toggle("on", b.dataset.dev === id);
          b.setAttribute("aria-pressed", String(b.dataset.dev === id));
        });
      }

      /* ======================================================================
   WORLD
   ====================================================================== */
      const $ = (s) => document.querySelector(s);
      const stage = $("#stage"),
        world = $("#world"),
        notesEl = $("#notes"),
        framesEl = $("#frames");
      const svgNS = "http://www.w3.org/2000/svg";

      /* ======================================================================
   ANNOTATIONS: the author's voice. A caption per screen is kept here (ANN_KEY). A group's title and description
   are part of the layout (FlowLayout, saved under the layout key and undone with it). Both are edited in place.
   ====================================================================== */
      /* each frame's caption as the scan wrote it; the user's changes are kept as edits over it */
      const ANN_DEFAULT = Object.fromEntries(SCAN.screens.map((s) => [s.id, s.caption]));
      const ANN_KEY = "flow-canvas.annotations.v1";
      const clone = (o) => JSON.parse(JSON.stringify(o));
      /* captions as a list, for FlowScan's edits; and back */
      const capList = (m) => Object.keys(m).map((id) => ({ id, ...m[id] }));
      const capMap = (l) => Object.fromEntries(l.map(({ id, ...c }) => [id, c]));
      /* saved: { screenId: { field: value } }, only what differs from the scan. A caption saved whole by an
         older build reads the same way: its fields win, and the next save keeps only those that differ. */
      function loadAnn() {
        let edits = {};
        try {
          edits = JSON.parse(localStorage.getItem(ANN_KEY) || "{}") || {};
        } catch (e) {}
        return capMap(FlowScan.merge(capList(ANN_DEFAULT), { edits }));
      }
      /* Group titles and descriptions used to be kept here, under the group's id. They live on the group
         now; this is read once, so a layout saved before the move keeps its names. */
      function legacyGroupText() {
        const out = {};
        try {
          const st = JSON.parse(localStorage.getItem(ANN_KEY) || "{}");
          for (const k in st) if (/^g\d+$/.test(k)) out[k] = st[k];
        } catch (e) {}
        return out;
      }
      let ANN = loadAnn(),
        annT;
      function saveAnn() {
        clearTimeout(annT);
        annT = setTimeout(() => {
          try {
            localStorage.setItem(ANN_KEY, JSON.stringify(FlowScan.diff(capList(ANN_DEFAULT), capList(ANN)).edits));
          } catch (e) {}
        }, 250);
      }
      if (localStorage.getItem(ANN_KEY)) saveAnn(); /* a caption saved whole by an older build goes back as edits */
      const CE = (() => {
        const d = document.createElement("div");
        try {
          d.contentEditable = "plaintext-only";
        } catch (e) {}
        return d.contentEditable === "plaintext-only"
          ? "plaintext-only"
          : "true";
      })();
      const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
      const X_ICON =
        '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2 2l6 6M8 2L2 8"/></svg>';
      const ADD_ICON = '<svg viewBox="0 0 20 20"><use href="#i-plus"/></svg>';
      function capHTML(id, i) {
        const a = ANN[id];
        return `<div class="cap ann${a.on ? "" : " off"}" data-k="${id}">
    <h3 class="ct"><span class="cn">${i + 1}</span><span class="ctt" contenteditable="${CE}" spellcheck="false" data-f="title" data-ph="Add a title" role="textbox" aria-label="Screen title">${esc(a.title)}</span></h3>
    <p class="cb" contenteditable="${CE}" spellcheck="false" data-f="body" data-ph="Say what happens here" role="textbox" aria-label="Screen description">${esc(a.body)}</p>
    <button class="cx" title="Remove annotation" aria-label="Remove annotation">${X_ICON}</button>
    <button class="cadd">${ADD_ICON}Add description</button></div>`;
      }
      function gsubHTML(L) {
        return `<div class="gsubw ann${L.subOn ? "" : " off"}" data-k="${L.id}">
    <p class="gsub" contenteditable="${CE}" spellcheck="false" data-f="sub" data-ph="Say what this flow is for" role="textbox" aria-label="Flow description">${esc(L.sub)}</p>
    <button class="cx" title="Remove description" aria-label="Remove description">${X_ICON}</button>
    <button class="cadd">${ADD_ICON}Add description</button></div>`;
      }
      function fillAnn() {
        document.querySelectorAll("[data-k]").forEach((w) => {
          const a = ANN[w.dataset.k];
          if (!a) return;
          if (w.classList.contains("ann")) w.classList.toggle("off", !a.on);
          w.querySelectorAll("[data-f]").forEach((f) => {
            f.textContent = a[f.dataset.f];
          });
        });
      }
      function resetAnn() {
        ANN = clone(ANN_DEFAULT);
        try {
          localStorage.removeItem(ANN_KEY);
        } catch (e) {}
        /* the groups' text is part of the layout: put back by a commit, so ⌘Z brings it back */
        commit(() => layout.resetGroupText(), { redraw: ["layout"] });
        fillAnn();
        toast("Annotations reset to the scanned copy");
      }
      function caretEnd(f) {
        f.focus();
        const r = document.createRange();
        r.selectNodeContents(f);
        r.collapse(false);
        const sel = getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
      }
      // editing
      world.addEventListener("input", (e) => {
        const f = e.target.closest("[data-f]");
        if (!f) return;
        const w = f.closest("[data-k]");
        if (!w) return;
        const L = groupById(w.dataset.k);
        if (L) {
          /* live while typing; the undo step is recorded when the field is left (below) */
          L[f.dataset.f] = f.textContent;
          saveNotesSoon();
        } else if (ANN[w.dataset.k]) {
          ANN[w.dataset.k][f.dataset.f] = f.textContent;
          saveAnn();
        }
      });
      /* one undo step per visit to a group's title or description, not one per keystroke */
      let groupEdit = null;
      world.addEventListener("focusin", (e) => {
        if (e.target.closest(".gtitle,.gsub")) groupEdit = { before: layout.snapshot() };
      });
      world.addEventListener("focusout", (e) => {
        if (!groupEdit || !e.target.closest(".gtitle,.gsub")) return;
        const { before } = groupEdit;
        groupEdit = null;
        commit.since(before);
      });
      world.addEventListener("keydown", (e) => {
        const f = e.target.closest && e.target.closest("[data-f]");
        if (!f) return;
        e.stopPropagation();
        if (e.key === "Escape") {
          f.blur();
          return;
        }
        if (
          e.key === "Enter" &&
          (f.dataset.f === "title" || e.metaKey || e.ctrlKey)
        ) {
          e.preventDefault();
          f.blur();
        }
      });
      world.addEventListener("paste", (e) => {
        if (e.target.closest && e.target.closest("[data-f]")) {
          e.preventDefault();
          document.execCommand(
            "insertText",
            false,
            e.clipboardData.getData("text/plain"),
          );
        }
      });
      // remove / add back (capture so the header's own click handler never sees it)
      world.addEventListener(
        "click",
        (e) => {
          const b = e.target.closest(".cx,.cadd");
          if (!b) return;
          e.stopPropagation();
          e.preventDefault();
          const w = b.closest("[data-k]"),
            k = w.dataset.k,
            on = b.classList.contains("cadd");
          const L = groupById(k);
          if (L) commit(() => (L.subOn = on));
          else {
            ANN[k].on = on;
            saveAnn();
          }
          w.classList.toggle("off", !on);
          if (on)
            caretEnd(
              w.querySelector("[data-f]:not(.ctt)") ||
                w.querySelector("[data-f]"),
            );
          else toast("Annotation removed. Hover the card to add it back.");
        },
        true,
      );

      /* ---------- notes: one kind, saved with the layout ---------- */
      const ago = (at) => {
        const m = Math.round((Date.now() - at) / 60000);
        if (m < 1) return "now";
        if (m < 60) return m + "m";
        const h = Math.round(m / 60);
        return h < 24 ? h + "h" : Math.round(h / 24) + "d";
      };
      let noteSave;
      const saveNotesSoon = () => {
        clearTimeout(noteSave);
        noteSave = setTimeout(layout.save, 400);
      };
      const notePlace = (n) =>
        n.frame ? (n.pos && n.pos[DEV.id]) || [COL_W - 70, PH_TOP + 120] : [n.x, n.y];
      /* which frame is this point on, if any (world coordinates) */
      const homeFor = (wx, wy) => geo.frameAt({ x: wx, y: wy }, performance.now(), { margin: 20 });
      const localFrom = (id, wx, wy) => {
        const r = geo.rect(id, performance.now());
        return [Math.round((wx - r.x) / r.s), Math.round((wy - r.y) / r.s)];
      };
      function buildNote(n) {
        const parent = n.frame ? colOf(n.frame) : notesEl;
        if (!parent) return null;
        const [x, y] = notePlace(n);
        const d = document.createElement("div");
        d.className = "note";
        d.dataset.nid = n.id;
        d.style.left = x + "px";
        d.style.top = y + "px";
        d.innerHTML = `<div class="txt" contenteditable="true" spellcheck="false">${esc(n.text)}</div><div class="who">${esc(n.who)} · ${n.at ? ago(n.at) : esc(n.t || "")}</div><button class="nx" type="button" aria-label="Delete this note" title="Delete (Delete key)"><svg aria-hidden="true"><use href="#i-x"/></svg></button>`;
        d.tabIndex = 0;
        d.setAttribute("role", "group");
        d.setAttribute("aria-label", "Note from " + n.who + ". Delete removes it.");
        d.querySelector(".txt").addEventListener("input", (e) => {
          n.text = e.currentTarget.textContent;
          saveNotesSoon();
        });
        d.querySelector(".nx").addEventListener("click", (e) => {
          e.stopPropagation();
          annotations.remove("note", d);
        });
        parent.appendChild(d);
        return d;
      }
      function refreshNotes() {
        document.querySelectorAll(".note").forEach((n) => n.remove());
        layout.notes.forEach(buildNote);
      }
      /* A note's DOM is handled by hand around its commit, not by the "notes" redraw (which rebuilds every
         note): a new note takes focus, and a dragged one is already where it was dropped. Same for the
         finding cards below. */
      function createNote({ text = "New note", frame = null, local = null, world = null }) {
        const n = {
          id: "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
          frame,
          who: "You",
          at: Date.now(),
          text,
        };
        if (frame) n.pos = { [DEV.id]: local };
        else {
          n.x = world[0];
          n.y = world[1];
        }
        commit(() => layout.notes.push(n));
        const d = buildNote(n);
        if (d) {
          const t = d.querySelector(".txt");
          t.focus();
          document.execCommand("selectAll");
        }
        return d;
      }
      /* after a drag or a nudge: a note dropped on a frame belongs to it from then on; dropped on empty canvas it floats.
         The data change runs inside a commit (FlowAnnotations does that); the DOM follows in rehomeDom. */
      function rehomeData(n, d) {
        const m = worldM(),
          r = d.getBoundingClientRect(),
          wx = (r.left - m.e) / m.a,
          wy = (r.top - m.f) / m.a,
          f = homeFor(wx + r.width / m.a / 2, wy + r.height / m.a / 2);
        if (f) {
          n.pos = f === n.frame ? { ...(n.pos || {}) } : {};
          n.pos[DEV.id] = localFrom(f, wx, wy);
          n.frame = f;
          delete n.x;
          delete n.y;
        } else {
          n.frame = null;
          delete n.pos;
          n.x = Math.round(wx);
          n.y = Math.round(wy);
        }
      }
      function rehomeDom(n, d) {
        const parent = n.frame ? colOf(n.frame) : notesEl,
          [x, y] = notePlace(n);
        if (d.parentNode !== parent) parent.appendChild(d);
        d.style.left = x + "px";
        d.style.top = y + "px";
        d.style.zIndex = "";
      }

      /* ======================================================================
   LAYOUT MODEL
   A canvas holds free frames and groups. A group is a sequence of frames that either
   fans out into a flow (open) or stacks into a deck (closed). Membership is shared by
   every device; positions are remembered per device, because the frames change size.
   ====================================================================== */
      const layout = FlowLayout.create({
        key: "flow-canvas.layout.v1",
        storage: {
          getItem: (k) => localStorage.getItem(k),
          setItem: (k, v) => localStorage.setItem(k, v),
        },
        legacyGroupText,
        hasScreen: (id) => !!SCREENS[id],
        /* the scan's groups, links (drawn as connectors), findings and notes; the layout keeps the user's edits */
        defaults: () => ({
          lanes: SCAN.groups,
          pos: { mobile: {}, tablet: {}, desktop: {} },
          conns: SCAN.links,
          notes: NOTES,
          scans: FINDINGS,
        }),
      });
      /* the layout has taken in the old copies of the groups' text (and saved them), so they can go */
      (function dropLegacyGroupText() {
        try {
          const st = JSON.parse(localStorage.getItem(ANN_KEY) || "{}");
          const old = Object.keys(st).filter((k) => /^g\d+$/.test(k));
          old.forEach((k) => delete st[k]);
          if (old.length) localStorage.setItem(ANN_KEY, JSON.stringify(st));
        } catch (e) {}
      })();
      /* open or closed is view state: saved and redrawn, never an undo step */
      const VIEW_STATE = { undo: false, redraw: ["layout"] };
      /* every edit ends here: undo point, save, redraw, in one fixed order */
      const commit = FlowCommit.create({
        layout,
        redraw: { world: buildWorld, layout: relayout, scans: refreshScans, notes: refreshNotes, conns: drawConns },
      });

      /* The annotation kinds. FlowAnnotations owns what they share (drag, arrow keys, delete, the ownership
         check); each adapter below does what is its own. A new kind is one more adapter. */
      const noteOf = (d) => layout.notes.find((x) => x.id === d.dataset.nid);
      const noteKind = {
        name: "note",
        movable: true,
        preventDefault: true,
        owns: (t) => !!t.closest(".note"),
        match(t, how) {
          const d = t.closest(".note");
          if (!d) return null;
          if (how === "pointer") {
            /* not on its delete button, and not while its text is being edited */
            return t.closest(".nx") || document.activeElement === d.querySelector(".txt") ? null : d;
          }
          return t === d ? d : null; /* keys: only when the note itself has focus, not while typing in it */
        },
        origin: (d) => ({ x: parseFloat(d.style.left), y: parseFloat(d.style.top) }),
        lift(d) {
          d.classList.add("dragging");
          d.style.zIndex = 30;
        },
        place(d, p) {
          d.style.left = p.x + "px";
          d.style.top = p.y + "px";
        },
        save(d, p, how) {
          const n = noteOf(d);
          if (!n) return;
          if (!how.nudged) return rehomeData(n, d); /* a drop: it may land on another frame, or on empty canvas */
          /* a nudge moves the note where it is: 8 px must not attach it to a frame or let go of one */
          const at = [Math.round(p.x), Math.round(p.y)];
          if (n.frame) n.pos = { ...(n.pos || {}), [DEV.id]: at };
          else [n.x, n.y] = at;
        },
        settle(d, how) {
          d.classList.remove("dragging");
          d.style.zIndex = "";
          const n = noteOf(d);
          if (n && how.moved && !how.nudged) rehomeDom(n, d);
        },
        tap(d) {
          const t = d.querySelector(".txt");
          t.focus();
          const r = document.createRange();
          r.selectNodeContents(t);
          r.collapse(false);
          const s = getSelection();
          s.removeAllRanges();
          s.addRange(r);
        },
        erase(d) {
          layout.notes = layout.notes.filter((n) => n.id !== d.dataset.nid);
        },
        erased(d) {
          d.remove();
          toast("Note deleted. ⌘Z brings it back.");
        },
      };
      const scanKind = {
        name: "scan",
        movable: true,
        owns: (t) => !!t.closest(".scan"),
        match(t, how) {
          const d = t.closest(".scan");
          if (!d) return null;
          if (how === "pointer") return t.closest(".hop,.sx") ? null : d;
          if (how === "nudge") return t === d ? d : null;
          return d; /* delete: from anywhere inside the card */
        },
        origin: (d) => d._scan.at(),
        lift(d) {
          d.classList.add("dragging");
          document.body.classList.add("selecting");
        },
        place: (d, p) => d._scan.place(p.x, p.y),
        save: (d, p) => d._scan.savePos(p),
        settle(d, how) {
          d.classList.remove("dragging");
          document.body.classList.remove("selecting");
          if (how.cancelled) d._scan.redrawLeader();
          if (how.moved && !how.nudged) d._scan.dragged(); /* the click that follows a drag is not a click on the card */
        },
        erase: (d) => d._scan.erase(),
        erased: (d) => d._scan.erased(),
      };
      /* connectors do not move; they take part in delete and in the ownership check */
      const linkKind = {
        name: "link",
        redraw: ["conns"],
        owns: (t) => !!t.closest(".echip"),
        match(t, how) {
          if (how !== "delete") return null;
          const chip = t.closest(".echip");
          if (chip) return chip.querySelector(".lb").isContentEditable ? null : { id: chip.dataset.id };
          /* a selected connector is deleted from anywhere, unless the user is typing */
          return selConn && !t.closest("input,select,[contenteditable]") ? { id: selConn } : null;
        },
        erase(item) {
          layout.conns = layout.conns.filter((x) => x.id !== item.id);
          if (selConn === item.id) selConn = null;
        },
        erased: () => toast("Connector deleted. ⌘Z to undo."),
      };
      /* captions (titles and descriptions) are typed in place and live in their own store: they only
         take part in the ownership check, so a press on one is never a press on the canvas behind it */
      const captionKind = { name: "caption", owns: (t) => !!t.closest("[data-f],.cx,.cadd") };
      const annotations = FlowAnnotations.create({ commit, kinds: [noteKind, scanKind, linkKind, captionKind] });
      const laneOf = (id) => layout.groupOf(id);
      const isFree = (id) => !laneOf(id);
      const colOf = (id) => document.querySelector(`.col[data-id="${id}"]`);
      const laneEl = (id) => document.getElementById(id);
      function posOf() {
        return layout.pos[DEV.id] || (layout.pos[DEV.id] = {});
      }
      function sameAsDefault(L) {
        const d = DEFAULT_LANES.find((x) => x.id === L.id);
        return (
          !!d &&
          d.screens.length === L.screens.length &&
          d.screens.every((s) => L.screens.includes(s))
        );
      }
      const laneName = FlowLayout.groupName;
      const groupById = (id) => layout.lanes.find((l) => l.id === id);

      /* A drag of frames or of a group proposes; the drop commits (FlowGesture). While one is live the page is drawn from
         gesture.view(): the layout as it would be if the proposal were dropped. The layout itself is not touched. */
      const gesture = FlowGesture.create({
        layout,
        commit,
        device: () => DEV.id,
        metrics: () => ({ colW: COL_W, gap: GAP, head: HEAD, phTop: PH_TOP, phH: PH_H, cap: CAP, collH: COLL_H, deckW: DECK_W, peekX: PEEK_X }),
        adapter: {
          frames: () => ORDER,
          box: (id) => geo.box(id),
          place: (id) => geo.place(id),
          rect: (id) => geo.rect(id, performance.now()),
          show: showGesture,
          settle: settleGesture,
        },
      });

      /* what the geometry is asked to arrange: the groups, every frame, and where this device has things saved */
      const geoInput = () => {
        const v = gesture.view();
        return { groups: v.groups.map(({ id, screens, open }) => ({ id, screens, open })), screens: ORDER, pos: v.pos };
      };
      const geoMove = FlowGeometry.MOVES;
      for (const k of ["open", "deck"]) {
        const root = document.documentElement.style;
        root.setProperty(`--${k}-dur`, geoMove[k].dur + "ms");
        root.setProperty(`--${k}-ease`, `cubic-bezier(${geoMove[k].curve.join(",")})`);
      }
      /* a frame's corner, as the geometry has it at this moment */
      function putFrame(id, now) {
        const col = colOf(id),
          r = geo.rect(id, now);
        if (col && r) {
          col.style.translate = r.x + "px " + r.y + "px";
          col.style.scale = r.s;
        }
      }
      function applyFrames(now = performance.now()) {
        ORDER.forEach((id) => {
          const col = colOf(id),
            f = geo.place(id);
          if (!col || !f) return;
          const st = col.style;
          col.classList.toggle("deck", geo.isDeck(id));
          col.classList.toggle("free", !f.lane);
          col.dataset.lane = f.lane || "";
          putFrame(id, now);
          st.setProperty("--r", f.r + "deg");
          st.setProperty("--d", f.d + "ms");
          st.setProperty("--z", f.z);
          st.setProperty("--fx", f.fx + "px");
          st.setProperty("--fy", f.fy + "px");
          const cn = col.querySelector(".cn");
          if (cn) cn.textContent = f.lane ? String(f.i + 1) : "";
        });
      }
      /* the one loop that runs while a frame is on its way: move what moved, redraw what hangs off it. It stops
         by itself when the geometry says everything is at rest, however long the flow is. */
      let pumping = false;
      function pump() {
        if (pumping || geo.settled(performance.now())) return;
        pumping = true;
        const tick = () => {
          const now = performance.now();
          geo.step(now).forEach((id) => putFrame(id, now));
          drawConns(now);
          if (geo.settled(now)) pumping = false;
          else requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }
      /* tell the geometry the layout changed: frames slide to their new places */
      function arrangeFrames(opts) {
        geo.retarget(geoInput(), performance.now(), opts);
        applyFrames();
      }

      /* a group's own objects: headline, standfirst, edges between consecutive frames */
      function makeLane(L) {
        const el = document.createElement("section");
        el.className = "lane";
        el.id = L.id;
        el.innerHTML = `<div class="ghead">
      <div class="gt"><button class="grip" title="Drag to move this group" aria-label="Drag to move group"><svg><use href="#i-grip"/></svg></button><button class="chev" title="Open or close this group" aria-label="Open or close group"><svg><use href="#i-chevup"/></svg></button><h2 class="gtitle" contenteditable="${CE}" spellcheck="false" data-k="${L.id}" data-f="title" data-ph="Name this group" role="textbox" aria-label="Group name">${esc(L.title)}</h2></div>
      ${gsubHTML(L)}
      <div class="gs"><span class="gcount"></span><span class="gmeta"></span><button class="fplay" title="Play flow"><svg><use href="#i-play"/></svg><span>Play flow</span></button><button class="fmore" title="Group options" aria-label="Group options"><svg><use href="#i-more"/></svg></button></div>
    </div>
    <div class="content"><div class="dz"></div></div>`;
        world.insertBefore(el, notesEl);
        el.querySelector(".ghead").addEventListener("click", (e) => {
          e.stopPropagation();
          const Lc = layout.lanes.find((l) => l.id === el.id);
          if (!Lc) return;
          if (e.target.closest(".grip")) return;
          if (e.target.closest(".fmore")) {
            openGroupMenu(Lc, e.target.closest(".fmore"));
            return;
          }
          if (e.target.closest(".fplay")) {
            if (el.querySelector(".fplay").classList.contains("on")) stopPlay();
            else play(Lc.screens);
            return;
          }
          if (e.target.closest(".chev") || !Lc.open) setLane(Lc.id, !Lc.open);
        });
        return el;
      }
      function sizeDz(L, n = L.screens.length) {
        const dz = L.el.querySelector(".dz");
        if (L.open) {
          const w = Math.max(1, n) * (COL_W + GAP) - GAP;
          Object.assign(dz.style, {
            left: "-28px",
            top: "-34px",
            width: w + 56 + "px",
            height: PH_TOP + PH_H + CAP + 60 + "px",
          });
        } else {
          Object.assign(dz.style, {
            left: "-34px",
            top: -HEAD - 14 + "px",
            width: DECK_W + PEEK_X * Math.max(n - 1, 0) + 68 + "px",
            height: COLL_H + 10 + "px",
          });
        }
      }
      /* the group's title and description as the layout has them (after an undo, a reset, a load); the field
         being typed in is left alone */
      function showGroupText(L) {
        const put = (sel, text) => {
          const f = L.el.querySelector(sel);
          if (f !== document.activeElement && f.textContent !== text) f.textContent = text;
        };
        put(".gtitle", L.title);
        put(".gsub", L.sub);
        L.el.querySelector(".gsubw").classList.toggle("off", !L.subOn);
      }
      function syncLanes() {
        const shown = gesture.view().groups;
        const ids = new Set(shown.map((g) => g.id));
        document.querySelectorAll(".lane").forEach((e) => {
          if (!ids.has(e.id)) e.remove();
        });
        shown.forEach(({ group: L, screens }) => {
          let el = document.getElementById(L.id);
          if (!el) el = makeLane(L);
          L.el = el;
          showGroupText(L);
          const n = screens.length;
          const box = geo.box(L.id);
          el.style.left = box.x + "px";
          el.style.top = box.top + "px";
          el.style.width = box.w + "px";
          el.style.height = box.h + "px";
          el.classList.toggle("open", L.open);
          el.classList.toggle("closed", !L.open);
          el.classList.toggle("empty", n === 0);
          el.style.setProperty(
            "--hx",
            DECK_W + PEEK_X * (Math.max(n, 1) - 1) + 60 + "px",
          );
          el.style.setProperty(
            "--hy",
            Math.max(0, Math.round(COLL_H / 2 - 100)) + "px",
          );
          el.querySelector(".gcount").textContent =
            n + (n === 1 ? " screen" : " screens");
          const dm = DEFAULT_LANES.find((x) => x.id === L.id);
          el.querySelector(".gmeta").innerHTML =
            dm && sameAsDefault(L)
              ? " · <code>" +
                dm.meta.split(" · ")[0] +
                "</code>" +
                (dm.meta.includes(" · ")
                  ? " · " + dm.meta.split(" · ").slice(1).join(" · ")
                  : "")
              : "";
          sizeDz(L, n);
        });
      }
      function relayout(opts) {
        arrangeFrames(opts);
        syncLanes();
        updateBars();
        updateAllBtn();
        if (typeof updateSelBox === "function") updateSelBox();
        if (typeof drawConns === "function") drawConns();
        pump();
        /* now that frames are attached and sized, the finding cards' leaders can be drawn from real measurements */
        document.querySelectorAll(".scan").forEach((d) => d._scan.redrawLeader());
      }

      /* ---------- scanner findings: a card tied to its frame by a leader; drag it, dismiss it ---------- */
      /* default: leave the frame's bottom edge, slip between frame and caption, run down the gutter and land on the card.
         once the card has been moved: a smooth curve from the same dock to the nearest side of the card */
      function leaderGeom(left, top, w, h, moved) {
        const fr = PH_TOP + PH_H,
          x0 = COL_W - 62,
          right = left + w;
        if (!moved) {
          const yRun = fr + 24,
            runX = COL_W + 22,
            midY = top + 26,
            toTop = runX <= right - 14,
            lead = `M${x0} ${fr}V${fr + 10}Q${x0} ${yRun} ${x0 + 14} ${yRun}H${runX - 14}Q${runX} ${yRun} ${runX} ${yRun + 14}`;
          return {
            x0,
            y0: fr,
            d: toTop
              ? `${lead}V${top}`
              : `${lead}V${midY - 14}Q${runX} ${midY} ${runX - 14} ${midY}H${right}`,
            end: toTop ? [runX, top] : [right, midY],
          };
        }
        let T, nB;
        if (top >= fr + 28) {
          T = [clamp(x0, left + 18, right - 18), top];
          nB = { nx: 0, ny: -1 };
        } else if (left >= COL_W - 4) {
          T = [left, top + h / 2];
          nB = { nx: -1, ny: 0 };
        } else if (right <= 4) {
          T = [right, top + h / 2];
          nB = { nx: 1, ny: 0 };
        } else {
          T = [clamp(x0, left + 18, right - 18), top + h];
          nB = { nx: 0, ny: 1 };
        }
        const pts = FlowRouting.ortho({ x: x0, y: fr, nx: 0, ny: 1 }, { x: T[0], y: T[1], ...nB });
        return { x0, y0: fr, d: FlowRouting.rounded(pts, 12), end: T };
      }
      /* f: a finding as the layout has it (the scan's facts, the user's position if it has one) */
      function buildScan(col, f) {
        const kind = findingKind(f);
        const live = () => layout.scans.find((x) => x.id === f.id);
        /* findings on one frame stand one under the other until they are moved */
        const nth = layout.scans.filter((x) => x.frame === f.frame).findIndex((x) => x.id === f.id);
        const saved = f.pos && f.pos[DEV.id];
        const [dx, dy] = [0, DEV.findY + Math.max(0, nth) * 132];
        let left = saved ? saved[0] : dx,
          top = saved ? saved[1] : dy + CAP,
          moved = !!saved;
        const st = document.createElementNS(svgNS, "svg");
        st.setAttribute("class", "stem");
        st.setAttribute("width", "1");
        st.setAttribute("height", "1");
        st.setAttribute("aria-hidden", "true");
        st.innerHTML = `<path class="sl"/><circle class="dk" r="4.5"/><circle class="en" r="3"/>`;
        col.appendChild(st);
        const d = document.createElement("div");
        d.className = "scan";
        d.tabIndex = 0;
        d.setAttribute("role", "group");
        d.setAttribute("aria-label", "Scanner finding. Arrow keys move it, Delete dismisses it.");
        d.style.width = FIND_W + "px";
        d.innerHTML = `<span class="ic"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"><path d="M6 1v2M6 9v2M1 6h2M9 6h2M2.8 2.8l1.4 1.4M7.8 7.8l1.4 1.4M2.8 9.2l1.4-1.4M7.8 4.2l1.4-1.4"/></svg></span><div>${kind.text(f)}</div><button class="sx" type="button" aria-label="Dismiss this finding" title="Dismiss (Delete)"><svg aria-hidden="true"><use href="#i-x"/></svg></button>`;
        col.appendChild(d);
        const place = (l, t, m) => {
          left = l;
          top = t;
          d.style.left = l + "px";
          d.style.top = t + "px";
          const g = leaderGeom(l, t, d.offsetWidth, d.offsetHeight, m);
          st.querySelector(".sl").setAttribute("d", g.d);
          const dk = st.querySelector(".dk"),
            en = st.querySelector(".en");
          dk.setAttribute("cx", g.x0);
          dk.setAttribute("cy", g.y0);
          en.setAttribute("cx", g.end[0]);
          en.setAttribute("cy", g.end[1]);
        };
        /* the data change for a move or a nudge; FlowAnnotations commits it */
        const savePos = (p) => {
          moved = true; /* it has a place of its own now, so its leader takes the "moved" route */
          const r = live();
          if (r) r.pos = Object.assign(r.pos || {}, { [DEV.id]: [Math.round(p.x), Math.round(p.y)] });
        };
        place(left, top, moved);
        /* the finding and the thing it describes light up together */
        const tie = (on) => {
          col.classList.toggle("tied", on);
          kind.tie(f, col, on);
        };
        const hoverOk = () => matchMedia("(hover: hover)").matches;
        d.addEventListener("mouseenter", () => hoverOk() && tie(true));
        d.addEventListener("mouseleave", () => hoverOk() && tie(false));
        d.addEventListener("focusin", () => tie(true));
        d.addEventListener("focusout", () => tie(false));
        const dismiss = () => annotations.remove("scan", d);
        /* the shared annotation drag, keys and delete drive the card through this handle (see scanKind) */
        let justDragged = false;
        d._scan = {
          at: () => ({ x: left, y: top }),
          place: (x, y) => place(x, y, true),
          /* draw the leader for where the card is now, at its real size: after a cancelled drag, and after every
             layout (a card is built before its frame is attached to the page, so it measures 0 wide at first) */
          redrawLeader: () => place(left, top, moved),
          savePos,
          erase: () => {
            layout.scans = layout.scans.filter((x) => x.id !== f.id);
          },
          erased: () => {
            tie(false);
            st.remove();
            d.remove();
            toast("Finding dismissed. ⌘Z brings it back.");
          },
          dragged: () => {
            justDragged = true;
            setTimeout(() => (justDragged = false), 0);
          },
        };
        d.addEventListener("click", (e) => {
          e.stopPropagation(); /* a click on the finding is not a click on the frame behind it */
          if (justDragged) return;
          if (e.target.closest(".sx")) return dismiss();
          const h = e.target.closest(".hop");
          if (h && h.dataset.to) select(h.dataset.to, true);
          else kind.act(f);
        });
      }
      function refreshScans() {
        document.querySelectorAll(".col .scan, .col .stem").forEach((n) => n.remove());
        layout.scans.forEach((f) => {
          const col = colOf(f.frame);
          if (col) buildScan(col, f);
        });
      }

      /* frames */
      function makeCol(id) {
        const s = SCREENS[id],
          col = document.createElement("div"),
          many = switchable(id);
        col.className = "col" + (many ? " hasstack" : "");
        col.dataset.id = id;
        col.innerHTML = `<div class="label"><span class="lname">${esc(s.name)}</span><span class="route">${esc(s.route)}</span>${many ? `<button class="states">${stateLabel(id)}</button>` : '<span class="live"><i></i></span>'}</div>
    <div class="pwrap">${many ? '<div class="stack b"></div><div class="stack a"></div>' : ""}<div class="phone ${DEV.cls}" id="p-${id}" data-state="${stateIndex(id)}">${screenHTML(id)}</div><i class="port" data-side="R"></i><i class="port" data-side="L"></i><i class="port" data-side="T"></i><i class="port" data-side="B"></i></div>${capHTML(id, 0)}`;
        layout.scans.filter((f) => f.frame === id).forEach((f) => buildScan(col, f));
        if (many)
          col.querySelector(".states").addEventListener("click", (e) => {
            e.stopPropagation();
            select(id);
            const shown = shownStates(id);
            setState(id, shown[(shown.indexOf(stateIndex(id)) + 1) % shown.length]);
          });
        framesEl.appendChild(col);
        return col;
      }
      function buildWorld() {
        document.querySelectorAll(".lane,.col").forEach((e) => e.remove());
        ORDER.forEach(makeCol);
        refreshNotes();
        geo.reset();
        relayout();
      }

      /* ---------- geometry helpers ---------- */
      function laneRect(L) {
        const b = geo.box(L.id);
        return { x: b.x - 40, y: b.top - 40, w: b.w + 80, h: b.h + 80 };
      }
      function setLane(id, open, opts = {}) {
        const L = layout.lanes.find((l) => l.id === id);
        if (!L || L.open === open) return;
        commit(
          () => {
            L.open = open;
          },
          VIEW_STATE,
        );
        if (open) {
          if (opts.fly !== false) fly(fitRect(laneRect(L), 40));
        } else {
          if ([...selSet].some((i) => L.screens.includes(i))) select(null);
          if (playing && playLane === id) stopPlay();
          if (opts.fly !== false) fly(fitRect(geo.bounds(), 60, 1.1));
        }
      }

      /* ======================================================================
   CAMERA
   ====================================================================== */
      let cam = { x: 0, y: 0, k: 0.6 },
        flyTimer,
        insetR = 0,
        insetB = 0;
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
