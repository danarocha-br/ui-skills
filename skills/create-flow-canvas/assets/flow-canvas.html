    <script id="scan-module">
      /* ======================================================================
         SCAN MODULE
         The seam between what a scanner found in a product's code and the engine that draws it. The scan is
         the scanner's (the generator writes it into <script id="flow-scan">); the engine only reads it, and the
         user's changes are kept as edits laid over it, so a new scan still reaches someone who has edits.
         No DOM, no product knowledge.

         A scan
           { product: { name, scanned? }, start?,           scanned: when, in words; start: the screen selected
                                                            when the canvas opens
             components: { Name: cssSelector },             where each component shows up in a screen's HTML
             screens:  [{ id, name, route, file, components: [Name], note,
                          states: [{ name, reachable, html? }],   html: a state's own render, per device
                          caption: { title, body, on },
                          html: { mobile, tablet, desktop } }],   the screen's render; data-go="<id>" marks a
                                                                 button that follows the connector to <id>
             groups:   [{ id, screens, open, title, sub, subOn, meta }],
             links:    [{ id?, from, to, label }],          id defaults to "from>to"
             findings: [{ id?, kind, frame, ...facts, text? }],  id defaults to "frame:kind"
             notes:    [{ id?, frame, who, t, text, pos?: { device: [x, y] } }] }  id defaults to "frame:who"

         Interface
           FlowScan.read(raw)     raw: the JSON text, or the object. Gives { scan, problems }: the scan with every
                                  field the engine reads filled in, and what was wrong (a screen with no id or an
                                  id seen twice is skipped; a group member, link, finding, note or start that
                                  names a screen the scan does not have is dropped). Not a scan at all: scan null.
           FlowScan.merge(scanned, saved)   the items as the user sees them: each scanned item with its edits
                                  laid over it (an edit { gone: true } leaves it out), then the user's own items.
                                  saved is { edits: { id: fields }, mine: [item] }, or nothing. Fresh copies.
           FlowScan.diff(scanned, items)    the reverse: { edits, mine } holding only what differs from the scan,
                                  down to one key of a nested object (one device's position). A field the user
                                  took away is saved as null. Edits to items the scan no longer has are dropped.
         ====================================================================== */
      var FlowScan = (function () {
        "use strict";
        const RENDER_KEYS = ["mobile", "tablet", "desktop"];
        const clone = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
        const isObj = (o) => !!o && typeof o === "object" && !Array.isArray(o);
        const str = (v, d = "") => (typeof v === "string" ? v : d);
        const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
        const perDevice = (h) => {
          const out = {};
          RENDER_KEYS.forEach((d) => (out[d] = str(isObj(h) ? h[d] : "")));
          return out;
        };

        function read(raw) {
          const problems = [];
          let src = raw;
          if (typeof raw === "string") {
            try {
              src = JSON.parse(raw);
            } catch (e) {
              return { scan: null, problems: ["the scan is not JSON: " + e.message] };
            }
          }
          if (!isObj(src)) return { scan: null, problems: ["the scan is not an object"] };
          const list = (k) => (Array.isArray(src[k]) ? src[k] : []);

          const screens = [],
            ids = new Set();
          list("screens").forEach((s, i) => {
            if (!isObj(s) || typeof s.id !== "string" || !s.id) return problems.push(`screen ${i} has no id: skipped`);
            if (ids.has(s.id)) return problems.push(`screen "${s.id}" appears twice: the second is skipped`);
            ids.add(s.id);
            const cap = isObj(s.caption) ? s.caption : {};
            screens.push({
              id: s.id,
              name: str(s.name, s.id),
              route: str(s.route),
              file: str(s.file),
              components: Array.isArray(s.components) ? s.components.filter((c) => typeof c === "string") : [],
              states: (Array.isArray(s.states) ? s.states : [])
                .filter((st) => isObj(st) && typeof st.name === "string")
                .map((st) => Object.assign({ name: st.name, reachable: st.reachable !== false }, isObj(st.html) ? { html: perDevice(st.html) } : {})),
              note: str(s.note),
              caption: { title: str(cap.title), body: str(cap.body), on: cap.on === true },
              html: perDevice(s.html),
            });
          });
          const known = (id) => ids.has(id);

          /* two items of one kind may not share an id: edits are kept by id, so the second would be lost */
          const unique = (kind, seen, id) => {
            if (seen.has(id)) {
              problems.push(`two ${kind} have the same id "${id}": the second is dropped`);
              return false;
            }
            seen.add(id);
            return true;
          };
          const placed = new Set(),
            groupIds = new Set(),
            groups = [];
          list("groups").forEach((g, i) => {
            if (!isObj(g) || typeof g.id !== "string") return problems.push(`group ${i} has no id: skipped`);
            if (!unique("groups", groupIds, g.id)) return;
            const members = [];
            (Array.isArray(g.screens) ? g.screens : []).forEach((id) => {
              if (!known(id)) problems.push(`group "${g.id}" names screen "${id}", which the scan does not have`);
              else if (placed.has(id)) problems.push(`group "${g.id}" names screen "${id}", which is already in another group`);
              else {
                placed.add(id);
                members.push(id);
              }
            });
            if (!members.length) return problems.push(`group "${g.id}" has no screens left: skipped`);
            const out = { id: g.id, screens: members, open: g.open !== false, meta: str(g.meta) };
            ["title", "sub"].forEach((k) => typeof g[k] === "string" && (out[k] = g[k]));
            if (typeof g.subOn === "boolean") out.subOn = g.subOn;
            groups.push(out);
          });

          const links = [],
            linkIds = new Set();
          list("links").forEach((l, i) => {
            if (!isObj(l) || !known(l.from) || !known(l.to)) return problems.push(`link ${i} joins a screen the scan does not have: dropped`);
            if (l.from === l.to) return problems.push(`link ${i} leads from "${l.from}" to itself: dropped`);
            const id = str(l.id, l.from + ">" + l.to);
            if (unique("links", linkIds, id)) links.push({ id, from: l.from, to: l.to, label: str(l.label) });
          });

          const findings = [],
            findingIds = new Set();
          list("findings").forEach((f, i) => {
            if (!isObj(f) || !known(f.frame)) return problems.push(`finding ${i} points at a screen the scan does not have: dropped`);
            const kind = str(f.kind, "note");
            const id = str(f.id, f.frame + ":" + kind);
            if (unique("findings", findingIds, id)) findings.push(Object.assign(clone(f), { id, kind }));
          });

          const notes = [],
            noteIds = new Set();
          list("notes").forEach((n, i) => {
            if (!isObj(n)) return problems.push(`note ${i} is not a note: dropped`);
            if (n.frame != null && !known(n.frame)) return problems.push(`note ${i} is on a screen the scan does not have: dropped`);
            if (typeof n.text !== "string") return problems.push(`note ${i} has no text: dropped`);
            const out = clone(n);
            out.frame = n.frame || null;
            out.who = str(n.who, "Scanner");
            out.id = str(n.id, (out.frame || "canvas") + ":" + out.who);
            if (unique("notes", noteIds, out.id)) notes.push(out);
          });

          let start = null;
          if (src.start != null) {
            if (known(src.start)) start = src.start;
            else problems.push(`start screen "${src.start}" is not in the scan`);
          }
          const components = {};
          if (isObj(src.components)) for (const k in src.components) if (typeof src.components[k] === "string") components[k] = src.components[k];

          return {
            scan: {
              product: { name: str(isObj(src.product) ? src.product.name : "", "Product"), scanned: str(isObj(src.product) ? src.product.scanned : "") },
              start,
              components,
              screens,
              groups,
              links,
              findings,
              notes,
            },
            problems,
          };
        }

        /* lay one item's edits over it: nested objects key by key, anything else replaced (null included) */
        function apply(base, edit) {
          for (const k in edit) {
            if (isObj(edit[k]) && isObj(base[k])) apply(base[k], edit[k]);
            else base[k] = clone(edit[k]);
          }
          return base;
        }
        /* what differs in now from was, as an edit; undefined when nothing does */
        function delta(was, now) {
          const out = {};
          for (const k of new Set([...Object.keys(was), ...Object.keys(now)])) {
            const a = was[k],
              b = k in now ? now[k] : null;
            if (a === undefined && b === null) continue;
            if (isObj(a) && isObj(b)) {
              const d = delta(a, b);
              if (d) out[k] = d;
            } else if (!same(a, b)) out[k] = clone(b);
          }
          return Object.keys(out).length ? out : undefined;
        }

        function merge(scanned, saved) {
          const edits = isObj(saved) && isObj(saved.edits) ? saved.edits : {};
          const mine = isObj(saved) && Array.isArray(saved.mine) ? saved.mine : [];
          const out = [];
          (scanned || []).forEach((item) => {
            const e = edits[item.id];
            if (isObj(e) && e.gone === true) return;
            out.push(isObj(e) ? apply(clone(item), e) : clone(item));
          });
          mine.forEach((m) => isObj(m) && typeof m.id === "string" && out.push(clone(m)));
          return out;
        }

        function diff(scanned, items) {
          const scannedIds = new Set((scanned || []).map((s) => s.id));
          const byId = new Map();
          const mine = [];
          (items || []).forEach((it) => {
            if (scannedIds.has(it.id) && !byId.has(it.id)) byId.set(it.id, it);
            else mine.push(clone(it));
          });
          const edits = {};
          (scanned || []).forEach((s) => {
            if (!byId.has(s.id)) return (edits[s.id] = { gone: true });
            const d = delta(s, byId.get(s.id));
            if (d) edits[s.id] = d;
          });
          return { edits, mine };
        }

        return { read, merge, diff };
      })();
    </script>

    <script id="layout-module">
      /* ======================================================================
         LAYOUT MODULE
         Owns the persisted layout: groups (saved as "lanes"), positions per device, connectors,
         findings and notes, plus the id counters and the undo history. It knows nothing about
         the page: no DOM, no screens, no demo data. Everything it needs is handed to create().

         Connectors, findings and notes come from the scan, and the scan stays the scanner's: what is saved
         is only what the user changed on them and the ones the user made (FlowScan.diff), and loading lays
         that over the scan it is given (FlowScan.merge). So a new scan reaches a saved layout, and the
         user's edits win where they touched it. Groups and positions are saved whole. Needs FlowScan.
      
         A group is { id, screens, open, title, sub, subOn }: its frames, whether it is fanned out, its
         title (the text before a colon is its name), its description, and whether the description is
         shown. The text belongs to the group, so it is saved, snapshotted, undone and reset with it, and
         is gone when the group is. Frame captions are not part of the layout.

         Interface
           const layout = FlowLayout.create({ key, storage, hasScreen, defaults, legacyGroupText? })
             key        localStorage key the layout is saved under
             storage    anything with getItem(key) / setItem(key, value)
             hasScreen  (id) => boolean, so saved layouts drop frames that no longer exist
             defaults   () => { lanes, pos, conns, scans?, notes }: the scan's groups, connectors (links),
                        findings and notes, and empty positions. Called for a fresh copy each time; a default
                        group may carry title, sub and subOn (blank when it does not)
             legacyGroupText  () => { [groupId]: { title, sub, on } }, the group text an older build kept
                        elsewhere. Read once at load, only for groups that were saved without text, then
                        saved into the layout. Optional; a throwing reader is ignored.
           FlowLayout.groupName(group)   the short name: the title before its first colon, or
                                         "Untitled group". Pure; never changes the group.
           layout.lanes layout.pos layout.conns layout.scans layout.notes
                      Live state, as the user sees it: scanned items with their edits laid over, then the
                      user's own (scans are the findings still shown). Read through layout every time, never
                      keep your own reference: restore, undo and reset swap the arrays and objects for new ones.
           layout.newGroup(screens)  a blank, open group with the next id ("g4"), not yet in layout.lanes
           layout.groupOf(id)        the group a frame is in, or undefined for a loose frame
           layout.takeOut(ids)       the frames leave their groups; a group left empty (or already empty) goes. Their
                             places are not touched.
           layout.moveInto(ids, groupId, idx)
                             the frames leave their groups and go into `groupId` at slot `idx` among the frames that
                             stay there; their own places are forgotten on every device; a group left empty goes,
                             but never the one they are going into. A data change: the caller commits it.
           layout.groupFrames(ids, { device, at? })
                             make a group of these frames, in this order: they leave their groups (a group left
                             empty goes), their own places are forgotten on every device, and the new group is
                             added last and returned. With `at` { x, y } the group is pinned there on `device`;
                             without it, it takes the next free place. A data change: the caller commits it.
           layout.resetGroupText()   every group's title, description and visibility back to the scanned
                                     text (blank for a group that was not scanned); the caller commits it
           layout.save()           write to storage. FlowCommit calls it after every edit; restore and reset
                             save by themselves.
           layout.snapshot()       the persisted kinds as an opaque string; equal state, equal string. Connectors,
                             findings and notes are in it as { edits, mine }.
           layout.restore(s)       put a snapshot back and save. Two things are not restored: the counters
                             (they never fall below an id the snapshot brings back) and the open state
                             of groups that still exist (view state, not an edit).
           layout.reset()          back to the defaults, counters included, and save
           layout.nextId("c"|"g")  the next connector / group id, "c7" / "g4"
           layout.mark(s?)         push s (default: a snapshot now) on the undo history, 40 deep (FlowCommit
                             is its caller)
           layout.undo()           restore the latest mark; false when there is none
      
         A new persisted kind is added here, in persisted() and load()/restore() (through overlays()), and nowhere else; a kind the scan
         provides and the user edits goes in OVERLAID as well.

         On disk: { v: 2, lanes, pos, conns, scans, notes, cc, gc }. A layout saved before v2 kept connectors
         and notes as full lists and findings as { id: { gone, pos } }; it is read as it was and saved as edits.
         ====================================================================== */
      var FlowLayout = (function () {
        "use strict";
        const MAX_UNDO = 40;
        const VERSION = 2;
        /* the kinds the scan provides and the user edits: saved as edits over the scan */
        const OVERLAID = ["conns", "scans", "notes"];
        const isObj = (o) => !!o && typeof o === "object" && !Array.isArray(o);
        const list = (x) => (Array.isArray(x) ? x : []);
        /* id prefix -> the field the counter is saved in */
        const COUNTER_FIELD = { c: "cc", g: "gc" };
        const clone = (o) => JSON.parse(JSON.stringify(o));
        const BLANK_TEXT = { title: "Untitled group", sub: "", subOn: false };
        /* the short name of a group: its title up to the first colon */
        const groupName = (g) => String((g && g.title) || "").split(":")[0].trim() || BLANK_TEXT.title;
        /* what is persisted of a group; text a group does not have yet is blank */
        const groupRecord = (g) => ({
          id: g.id,
          screens: g.screens,
          open: g.open,
          title: typeof g.title === "string" ? g.title : BLANK_TEXT.title,
          sub: typeof g.sub === "string" ? g.sub : BLANK_TEXT.sub,
          subOn: g.subOn === true,
        });
        /* the highest number among ids like "c12": ids are never handed out twice */
        function highestId(list, prefix) {
          let top = 0;
          (list || []).forEach((x) => {
            const m = x && typeof x.id === "string" && x.id.startsWith(prefix) && /^\d+$/.test(x.id.slice(prefix.length));
            if (m) top = Math.max(top, Number(x.id.slice(prefix.length)));
          });
          return top;
        }

        function create({ key, storage, hasScreen, defaults, legacyGroupText }) {
          const layout = {};
          let history = [];
          let counters = { c: 0, g: 0 };

          function freshDefaults() {
            const d = clone(defaults());
            return {
              lanes: d.lanes.map(groupRecord),
              pos: d.pos,
              conns: list(d.conns),
              scans: list(d.scans),
              notes: list(d.notes),
            };
          }
          /* what the scan says for each overlaid kind: what the edits are taken against */
          const scanned = (kind) => freshDefaults()[kind];
          /* a scanned item an older layout cannot have held, so its absence there is not a deletion: before v2
             every connector had a numbered id no higher than the saved counter. With no counter saved, nothing
             can be told to be new, and an absent connector counts as deleted. */
          const couldNotHaveHad = (kind, cc) => (item) =>
            kind === "conns" && Number.isFinite(cc) && !(/^c\d+$/.test(item.id) && Number(item.id.slice(1)) <= cc);
          /* an old layout's connector the user drew by hand between the same two screens as a newer scanned link
             is that link: it takes the link's id and keeps the user's label */
          function adoptByEnds(saved, fresh) {
            const out = saved.slice();
            fresh.forEach((f) => {
              const i = out.findIndex((c) => c && c.from === f.from && c.to === f.to && c.id !== f.id);
              if (i >= 0) out[i] = Object.assign({}, out[i], { id: f.id });
            });
            return out;
          }
          /* one kind as it was saved, as the user sees it: edits laid over the scan. A full list (notes and
             connectors) or an { id: edit } map (findings) from before v2 is read as it was, and what the scan
             has that it could not have had is added. Says whether it found the old form. */
          function overlaid(kind, saved, cc) {
            if (isObj(saved) && ("edits" in saved || "mine" in saved)) return { items: FlowScan.merge(scanned(kind), saved), old: false };
            if (Array.isArray(saved)) {
              const fresh = scanned(kind).filter(couldNotHaveHad(kind, cc));
              const had = saved.filter((x) => x && typeof x === "object" && typeof x.id === "string");
              const edits = FlowScan.diff(scanned(kind), kind === "conns" ? adoptByEnds(had, fresh) : had);
              /* what the old layout could not have held was not deleted by the user */
              fresh.forEach((f) => edits.edits[f.id] && edits.edits[f.id].gone && delete edits.edits[f.id]);
              return { items: FlowScan.merge(scanned(kind), edits), old: true };
            }
            if (kind === "scans" && isObj(saved)) return { items: FlowScan.merge(scanned(kind), { edits: saved }), old: true };
            return null;
          }
          /* the scanned text of a group, or blank when it is not a scanned group */
          const scannedText = (id) => {
            const l = defaults().lanes.find((x) => x.id === id);
            const { title, sub, subOn } = l ? groupRecord(l) : BLANK_TEXT;
            return { title, sub, subOn };
          };
          /* text an older build kept outside the layout: the fields that are usable, or null. Any field it
             lacks keeps the scanned text, as the old loader merged it onto the defaults. */
          function legacyText() {
            try {
              const all = (legacyGroupText && legacyGroupText()) || {};
              return (id) => {
                const e = all[id];
                if (!e || typeof e !== "object") return null;
                const out = {};
                if (typeof e.title === "string") out.title = e.title;
                if (typeof e.sub === "string") out.sub = e.sub;
                if (typeof e.on === "boolean") out.subOn = e.on;
                return Object.keys(out).length ? out : null;
              };
            } catch (e) {
              return () => null;
            }
          }
          const startCounters = (d) => ({ c: highestId(d.conns, "c"), g: highestId(d.lanes, "g") });
          function adopt(state) {
            layout.lanes = state.lanes;
            layout.pos = state.pos;
            layout.conns = state.conns;
            layout.scans = state.scans;
            layout.notes = state.notes;
          }
          /* what is saved and snapshotted: lanes keep id, screens and open; the page keeps its own
             DOM handle on the same objects (el), which is not persisted */
          const persisted = () => ({
            lanes: layout.lanes.map(groupRecord),
            pos: layout.pos,
            conns: FlowScan.diff(scanned("conns"), layout.conns),
            scans: FlowScan.diff(scanned("scans"), layout.scans),
            notes: FlowScan.diff(scanned("notes"), layout.notes),
          });
          /* a connector of the user's own whose id a new scan now uses gets a fresh one */
          function freshIds(conns) {
            const seen = new Set();
            conns.forEach((c) => {
              if (seen.has(c.id)) c.id = layout.nextId("c");
              seen.add(c.id);
            });
          }

          /* connectors, findings and notes as saved, laid over the scan, cleaned; d supplies the fallbacks */
          function overlays(st, d) {
            const out = { old: false };
            OVERLAID.forEach((k) => {
              const o = overlaid(k, st[k], st.cc == null ? NaN : Number(st.cc));
              out[k] = o ? o.items.filter((x) => x && typeof x === "object") : d[k];
              if (o && o.old) out.old = true;
            });
            out.conns = out.conns.filter((c) => hasScreen(c.from) && hasScreen(c.to) && c.from !== c.to);
            out.notes = out.notes.filter((n) => n.id && typeof n.text === "string");
            return out;
          }

          function load() {
            const d = freshDefaults();
            const start = startCounters(d);
            const legacy = legacyText();
            let migrated = false;
            const fallBack = () => {
              /* no layout yet: the user's old group text, if there is any, goes onto the default groups */
              d.lanes.forEach((l) => {
                const old = legacy(l.id);
                if (old) {
                  Object.assign(l, old);
                  migrated = true;
                }
              });
              adopt(d);
              counters = start;
              if (migrated) layout.save();
            };
            let st = null;
            try {
              st = JSON.parse(storage.getItem(key) || "null");
            } catch (e) {}
            if (!st || !Array.isArray(st.lanes)) return fallBack();
            try {
              const seen = new Set(),
                lanes = [];
              st.lanes.forEach((l) => {
                const sc = ((l && l.screens) || []).filter((id) => hasScreen(id) && !seen.has(id));
                sc.forEach((id) => seen.add(id));
                if (!sc.length) return;
                const g = { id: l.id, screens: sc, open: !!l.open };
                if (typeof l.title === "string") Object.assign(g, groupRecord({ ...l, screens: sc, open: g.open }));
                else {
                  /* saved before groups carried their text: the old annotations, else the scanned text */
                  Object.assign(g, scannedText(l.id), legacy(l.id));
                  migrated = true;
                }
                lanes.push(g);
              });
              const out = Object.assign({ lanes, pos: Object.assign(d.pos, st.pos || {}) }, overlays(st, d));
              if (out.old) migrated = true;
              delete out.old;
              adopt(out);
              counters = {
                c: Math.max(Number(st.cc) || start.c, highestId(out.conns, "c")),
                g: Math.max(Number(st.gc) || start.g, highestId(out.lanes, "g")),
              };
              freshIds(layout.conns);
              if (migrated) layout.save();
            } catch (e) {
              fallBack();
            }
          }

          layout.save = () => {
            try {
              storage.setItem(
                key,
                JSON.stringify(Object.assign({ v: VERSION }, persisted(), { cc: counters.c, gc: counters.g })),
              );
            } catch (e) {}
          };
          layout.snapshot = () => JSON.stringify(persisted());
          layout.restore = (s) => {
            const st = JSON.parse(s);
            /* open or closed is view state: a group still here keeps how it is shown now */
            const shown = new Map(layout.lanes.map((l) => [l.id, l.open]));
            st.lanes.forEach((l) => shown.has(l.id) && (l.open = shown.get(l.id)));
            const kinds = overlays(st, layout);
            delete kinds.old;
            adopt(Object.assign({ lanes: st.lanes.map(groupRecord), pos: st.pos }, kinds));
            freshIds(layout.conns);
            /* ids that came back with the snapshot must not be handed out again */
            counters = {
              c: Math.max(counters.c, highestId(layout.conns, "c")),
              g: Math.max(counters.g, highestId(layout.lanes, "g")),
            };
            layout.save();
          };
          layout.reset = () => {
            const d = freshDefaults();
            adopt(d);
            counters = startCounters(d);
            layout.save();
          };
          layout.newGroup = (screens) => ({ id: layout.nextId("g"), screens, open: true, ...BLANK_TEXT });
          const leave = (ids) =>
            layout.lanes.forEach((L) => {
              L.screens = L.screens.filter((x) => !ids.includes(x));
            });
          const dropEmpty = () => {
            layout.lanes = layout.lanes.filter((L) => L.screens.length);
          };
          const forgetPlaces = (ids) => Object.values(layout.pos).forEach((P) => ids.forEach((i) => delete P[i]));
          layout.groupOf = (id) => layout.lanes.find((l) => l.screens.includes(id));
          layout.takeOut = (ids) => {
            leave(ids);
            dropEmpty();
          };
          layout.moveInto = (ids, groupId, idx) => {
            leave(ids);
            layout.lanes.find((l) => l.id === groupId).screens.splice(idx, 0, ...ids);
            forgetPlaces(ids);
            dropEmpty();
          };
          layout.groupFrames = (ids, { device, at } = {}) => {
            layout.takeOut(ids);
            const g = layout.newGroup(ids.slice());
            layout.lanes.push(g);
            forgetPlaces(ids);
            if (at) (layout.pos[device] || (layout.pos[device] = {}))[g.id] = { x: Math.round(at.x), y: Math.round(at.y) };
            return g;
          };
          layout.resetGroupText = () => layout.lanes.forEach((l) => Object.assign(l, scannedText(l.id)));
          layout.nextId = (kind) => {
            if (!COUNTER_FIELD[kind]) throw new Error("FlowLayout.nextId: unknown kind " + kind);
            counters[kind] += 1;
            return kind + counters[kind];
          };
          layout.mark = (s) => {
            history.push(s || layout.snapshot());
            if (history.length > MAX_UNDO) history.shift();
          };
          layout.undo = () => {
            const s = history.pop();
            if (!s) return false;
            layout.restore(s);
            return true;
          };

          load();
          return layout;
        }

        return { create, groupName };
      })();
    </script>

    <script id="commit-module">
      /* ======================================================================
         COMMIT MODULE
         The one place that decides what happens after an edit to the layout: the undo point, the save,
         and which parts of the page are redrawn, in a fixed order. Callers say what changed, not how
         to finish. It knows nothing about the DOM: the page hands it the redraw functions.

         Interface
           const commit = FlowCommit.create({ layout, redraw })
             layout  a FlowLayout
             redraw  { world, layout, scans, notes, conns }, one function each, all required
           commit(change, { redraw, undo })
             Runs change(), returns its result. If the layout is now different: marks the state before
             as one undo step, saves, then redraws what was asked for. If nothing changed, nothing
             happens. A commit inside a change joins the outer one.
               redraw  "all" (layout, scans, notes, conns) or a list of kinds; default none.
                       Always drawn in this order: world, layout, scans, notes, conns.
               undo    false for edits that are saved and redrawn but are not undo steps (folding a group)
               force   true to redraw even if nothing changed: a drag moved things on screen (a preview) and
                       the page must be drawn from the layout again, whether the drop changed it or not
             Only the outermost commit decides: a commit inside another one can add redraws, but its own
             undo option and since() are ignored.
           commit.since(before, { redraw, undo })
             For an edit typed in place: the change already happened live, `before` is layout.snapshot() from the
             start. (Dragging frames or a group does not need it: FlowGesture commits its proposal on the drop.)
             Marks and saves only if something changed, but always redraws.
           commit.undo(afterRestore)
             Undoes one step, runs afterRestore() (the page's own clean-up), redraws everything.
             Returns false when there is nothing to undo.
         ====================================================================== */
      var FlowCommit = (function () {
        "use strict";
        const ORDER = ["world", "layout", "scans", "notes", "conns"];
        const ALL = ORDER.filter((k) => k !== "world");

        function create({ layout, redraw }) {
          ORDER.forEach((k) => {
            if (typeof redraw[k] !== "function") throw new Error('FlowCommit: missing redraw function for "' + k + '"');
          });
          /* the kinds a caller asked for, checked, so a typo fails before anything is changed */
          const kindsOf = (kinds) => {
            const list = kinds === "all" ? ALL : kinds || [];
            list.forEach((k) => {
              if (!ORDER.includes(k)) throw new Error('FlowCommit: unknown redraw kind "' + k + '"');
            });
            return list;
          };
          const redrawInOrder = (kinds) => ORDER.filter((k) => kinds.includes(k)).forEach((k) => redraw[k]());
          let running = null; /* the outer commit's pending redraws while its change runs */

          /* the tail every edit shares: undo point, save, redraw. Nothing changed, nothing to record;
             a live gesture (alwaysRedraw) still redraws, because it moved things on screen. */
          function finish(before, opts, kinds, alwaysRedraw) {
            if (layout.snapshot() === before) {
              if (alwaysRedraw) redrawInOrder(kinds);
              return;
            }
            if (opts.undo !== false) layout.mark(before);
            layout.save();
            redrawInOrder(kinds);
          }
          function commit(change, opts = {}) {
            const kinds = kindsOf(opts.redraw);
            if (running) {
              kinds.forEach((k) => running.add(k));
              return change();
            }
            const before = layout.snapshot();
            running = new Set(kinds);
            let result, wanted;
            try {
              result = change();
            } finally {
              wanted = [...running];
              running = null;
            }
            finish(before, opts, wanted, !!opts.force);
            return result;
          }
          commit.since = (before, opts = {}) => finish(before, opts, kindsOf(opts.redraw), true);
          commit.undo = (afterRestore) => {
            if (!layout.undo()) return false;
            if (afterRestore) afterRestore();
            redrawInOrder(ALL);
            return true;
          };
          return commit;
        }
        return { create };
      })();
    </script>

    <script id="annotations-module">
      /* ======================================================================
         ANNOTATIONS MODULE
         What notes, findings and connectors share: one drag (threshold, zoom scale, cancel), one
         keyboard move (arrow keys, bursts count as one undo step), one delete, and one "is this an
         annotation" check. Each kind brings an adapter for what is its own: finding itself in the DOM,
         showing and saving a position, cleaning up. The module never touches the DOM and saves only
         through FlowCommit, so every move and delete is one undoable commit.

         Interface
           const annotations = FlowAnnotations.create({ commit, kinds, threshold, clock })
             commit     a FlowCommit
             kinds      adapters, see below
             threshold  screen px before a press becomes a drag (default 4)
             clock      () => ms, for the keyboard burst (default Date.now)
           annotations.owns(target)             any kind recognises target as its own
           annotations.down(target, {x, y})     null, or { prevent } when a movable annotation was grabbed
           annotations.dragging()               a grab is in progress (pressed, moved or not)
           annotations.move({x, y}, k)          pointer moved; k is the zoom, so places follow in world units
           annotations.up()                     { moved } or null; saves a drag, or taps if it never moved
           annotations.cancel()                 the pointer was taken away: put the item back, save nothing
           annotations.keyDown(target, key, {shift})   true when handled: Delete/Backspace, arrow keys
           annotations.remove(kindName, item)   the same removal, for a × button

         Adapter. Only name is required; the rest depends on what the kind does, and create() refuses a
         movable kind that is missing origin, place or save.
           name
           owns(target)               is target part of this kind (a kind without it is not part of owns())
           movable, preventDefault    can it be grabbed and moved; should the page preventDefault on press
           match(target, how)         the item, or null. how is "pointer", "nudge" or "delete".
                                      The same item must come back as the same object (a DOM element does).
           origin(item) -> {x, y}     where it is now, in the units place() takes
           lift(item)                 a drag began
           place(item, pos)           show it at pos while it moves (DOM only)
           save(item, pos, {nudged})  the data change for a move, run inside a commit. nudged is true for an
                                      arrow-key move, so a note can move in place instead of re-homing.
           settle(item, {moved, cancelled, nudged})   DOM clean-up, after the commit and its redraws
           tap(item)                  pressed and released without moving
           erase(item)                the data change for a delete, run inside a commit (needed to be deletable)
           erased(item)               DOM clean-up and message after a delete
           redraw                     FlowCommit kinds to redraw after a save or an erase (default none)

         One order throughout: the data change, then the commit's undo point and save, then its redraws,
         then settle()/erased(). The drag threshold is 4 screen px for every kind (notes used 3).
         ====================================================================== */
      var FlowAnnotations = (function () {
        "use strict";
        const ARROWS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
        const NUDGE = 8,
          NUDGE_BIG = 32,
          BURST_MS = 600;

        function create({ commit, kinds, threshold = 4, clock = Date.now }) {
          kinds.forEach((k) => {
            if (!k.name) throw new Error("FlowAnnotations: every kind needs a name");
            if (k.movable)
              for (const need of ["origin", "place", "save"])
                if (typeof k[need] !== "function") throw new Error('FlowAnnotations: "' + k.name + '" is movable but has no ' + need);
          });
          const redrawOf = (kind) => kind.redraw || [];
          let grab = null;
          let burst = null; /* the arrow-key burst in progress: { item, at } */
          const find = (target, how) => {
            for (const kind of kinds) {
              const item = kind.match && kind.match(target, how);
              if (item) return { kind, item };
            }
            return null;
          };
          function erase(kind, item) {
            commit(() => kind.erase(item), { redraw: redrawOf(kind) });
            if (kind.erased) kind.erased(item);
          }
          return {
            /* does any kind recognise this target as one of its own? Lets the page keep one list of
               "not canvas background" instead of one per handler */
            owns: (target) => kinds.some((k) => k.owns && k.owns(target)),
            /* a × button, or any other way a kind has of asking to be removed */
            remove(name, item) {
              const kind = kinds.find((k) => k.name === name);
              if (!kind) throw new Error('FlowAnnotations: unknown annotation kind "' + name + '"');
              erase(kind, item);
            },
            down(target, pt) {
              const f = find(target, "pointer");
              if (!f || !f.kind.movable) return null;
              burst = null; /* a new gesture: the next arrow press starts a new undo step */
              const origin = f.kind.origin(f.item);
              grab = { ...f, start: pt, origin, pos: origin, moved: false };
              return { prevent: !!f.kind.preventDefault };
            },
            dragging: () => !!grab,
            move(pt, k = 1) {
              if (!grab) return;
              const dx = pt.x - grab.start.x,
                dy = pt.y - grab.start.y;
              if (!grab.moved) {
                if (Math.hypot(dx, dy) < threshold) return;
                grab.moved = true;
                if (grab.kind.lift) grab.kind.lift(grab.item);
              }
              grab.pos = { x: grab.origin.x + dx / k, y: grab.origin.y + dy / k };
              grab.kind.place(grab.item, grab.pos);
            },
            up() {
              const g = grab;
              grab = null;
              if (!g) return null;
              if (g.moved) commit(() => g.kind.save(g.item, g.pos, {}), { redraw: redrawOf(g.kind) });
              else if (g.kind.tap) g.kind.tap(g.item);
              if (g.kind.settle) g.kind.settle(g.item, { moved: g.moved });
              return { moved: g.moved };
            },
            /* arrow keys move the focused item; a quick burst on one item is a single undo step */
            keyDown(target, key, mods = {}) {
              if (key === "Delete" || key === "Backspace") {
                const f = find(target, "delete");
                if (!f) return false;
                erase(f.kind, f.item);
                return true;
              }
              const dir = ARROWS[key];
              if (!dir) return false;
              const f = find(target, "nudge");
              if (!f || !f.kind.movable) return false;
              const by = mods.shift ? NUDGE_BIG : NUDGE;
              const at = f.kind.origin(f.item);
              const pos = { x: at.x + dir[0] * by, y: at.y + dir[1] * by };
              f.kind.place(f.item, pos);
              const now = clock();
              const first = !burst || burst.item !== f.item || now - burst.at >= BURST_MS;
              if (first) burst = { item: f.item, at: now };
              commit(() => f.kind.save(f.item, pos, { nudged: true }), { undo: first, redraw: redrawOf(f.kind) });
              if (f.kind.settle) f.kind.settle(f.item, { moved: true, nudged: true });
              return true;
            },
            /* the pointer was taken away (not released): put it back, save nothing */
            cancel() {
              const g = grab;
              grab = null;
              if (!g) return false;
              if (g.moved) g.kind.place(g.item, g.origin);
              if (g.kind.settle) g.kind.settle(g.item, { moved: false, cancelled: true });
              return true;
            },
          };
        }
        return { create };
      })();
    </script>

    <script id="geometry-module">
      /* ======================================================================
         GEOMETRY MODULE
         The one place that knows where a frame is. Two questions, answered together:
         where it is meant to be (its place, from the groups, the saved positions and the device), and
         where it is right now (the place it is sliding to, and the time it set off). Connectors, note
         homing, hit-tests and the camera all ask here; nobody reads the page to find where a frame is.

         The slide is the module's, not the stylesheet's: it holds each frame's start, destination, wait,
         duration and curve, so "is it there yet" has an answer (restsAt, settled) that follows the flow's
         length instead of a timeout. The page runs one frame loop while something is moving: step(now),
         write what moved, redraw. It knows nothing about the page: no DOM, no clock, no layout object.
         "now" is a number the caller hands in.

         Interface
           FlowGeometry.metrics(device)  -> m   the numbers one device gives the arrangement:
                                                colW phH cap laneH collH deckS deckW peekX peekY closedW edge
           FlowGeometry.WORLD            laneLeft top0 gap head phTop laneGap (world px)
           FlowGeometry.MOVES            { open, deck }: { dur ms, curve [x1,y1,x2,y2] } the slide the stylesheet
                                         eases its tilt and scale with, too
           FlowGeometry.arrange(input, m) -> { places, boxes, bottom }    pure; nothing is written back
             input  { groups: [{ id, screens, open }], screens: [every frame id, in order],
                      pos: { [group or loose frame id]: { x, y } } }   the saved positions on this device
             place  { x, y, r, s, d, z, fx, fy, deck, lane, i }   s = drawn scale; d = ms it waits before it slides
             box    { x, top, w, h, n, open }                  one per group; empty ones too
           FlowGeometry.loosePlace(k, bottom, m) -> { x, y }    the k-th default place of a loose frame
           FlowGeometry.bezier(x1, y1, x2, y2) -> (t) => y      the CSS cubic-bezier curve

           const geo = FlowGeometry.create({ reduceMotion })
           geo.setMetrics(m)    geo.setReduceMotion(bool)    geo.reset()   (setMetrics first: retarget throws without it)
           geo.retarget(input, now, { snap }) -> arrangement   new places; frames slide there from where they
                                                are now. A frame seen for the first time, or any frame under
                                                reduced motion or { snap }, is simply there.
           geo.place(id)  geo.box(groupId)  geo.isDeck(id)     where it is meant to be; deck unless held
           geo.rect(id, now) -> { x, y, s }                    the frame's corner and the scale it is drawn at, now; without now, its place
           geo.screenRect(id, now)  geo.frameBox(id, now)      the screen area / the whole frame with its caption
           geo.frameAt(point, now, { margin, skip }) -> id|null  the frame whose screen is under the point
           geo.bounds()                                        everything on the canvas, with room round it
           geo.hold(id, x, y)  geo.release(ids)                a frame under the pointer; it stays put, then slides home
           geo.step(now) -> [ids that moved]    geo.restsAt()    geo.settled(now)
         ====================================================================== */
      var FlowGeometry = (function () {
        const WORLD = Object.freeze({ laneLeft: 96, top0: 150, gap: 104, head: 220, phTop: 28, laneGap: 64 });
        const ROTS = [-2, 1.6, -1.2, 2.2];
        const PER_ROW = 5;

        /* the CSS cubic-bezier: solve x(t) = progress for t (Newton, then bisection), return y(t) */
        function bezier(x1, y1, x2, y2) {
          const cx = 3 * x1,
            bx = 3 * (x2 - x1) - cx,
            ax = 1 - cx - bx,
            cy = 3 * y1,
            by = 3 * (y2 - y1) - cy,
            ay = 1 - cy - by;
          const X = (t) => ((ax * t + bx) * t + cx) * t,
            Y = (t) => ((ay * t + by) * t + cy) * t,
            dX = (t) => (3 * ax * t + 2 * bx) * t + cx;
          return (x) => {
            if (x <= 0) return 0;
            if (x >= 1) return 1;
            let t = x;
            for (let i = 0; i < 8; i++) {
              const err = X(t) - x,
                d = dX(t);
              if (Math.abs(err) < 1e-6) return Y(t);
              if (Math.abs(d) < 1e-6) break;
              t -= err / d;
            }
            let lo = 0,
              hi = 1;
            t = x;
            for (let i = 0; i < 40; i++) {
              if (X(t) < x) lo = t;
              else hi = t;
              t = (lo + hi) / 2;
            }
            return Y(t);
          };
        }
        const MOVES = Object.freeze({
          open: Object.freeze({ dur: 800, curve: Object.freeze([0.22, 1.12, 0.36, 1]) }),
          deck: Object.freeze({ dur: 600, curve: Object.freeze([0.5, 0, 0.15, 1]) }),
        });
        const EASE = { open: bezier(...MOVES.open.curve), deck: bezier(...MOVES.deck.curve) };

        function metrics(d) {
          return {
            colW: d.cw,
            phH: d.ch,
            cap: d.cap,
            laneH: WORLD.head + d.body + d.cap,
            collH: d.collH,
            deckS: d.ds,
            deckW: d.deckW,
            peekX: d.peekX,
            peekY: d.peekY,
            closedW: d.closedW,
            edge: d.edge,
          };
        }

        /* loose frames with nowhere saved line up in rows of five below the groups */
        function loosePlace(k, bottom, m) {
          return {
            x: WORLD.laneLeft + (k % PER_ROW) * (m.colW + 70),
            y: bottom + 140 + Math.floor(k / PER_ROW) * (WORLD.phTop + m.phH + m.cap + 100),
          };
        }

        function arrange(input, m) {
          const { groups, screens, pos } = input;
          const places = {},
            boxes = {};
          let top = WORLD.top0,
            bottom = WORLD.top0;
          groups.forEach((g) => {
            const n = g.screens.length,
              h = g.open ? m.laneH : m.collH,
              w = g.open ? Math.max(Math.max(1, n) * m.colW + (Math.max(1, n) - 1) * WORLD.gap + 60, 460) : m.closedW;
            const p = pos[g.id];
            let box;
            if (p) box = { x: p.x, top: p.y, w, h, n, open: g.open };
            else {
              box = { x: WORLD.laneLeft, top, w, h, n, open: g.open };
              if (n) top += h + WORLD.laneGap;
            }
            boxes[g.id] = box;
            if (n) bottom = Math.max(bottom, box.top + h);
            g.screens.forEach((id, i) => {
              places[id] = g.open
                ? {
                    x: box.x + i * (m.colW + WORLD.gap),
                    y: box.top + WORLD.head,
                    r: 0,
                    s: 1,
                    d: i * 60,
                    z: n - i,
                    fx: 0,
                    fy: 0,
                    deck: false,
                    lane: g.id,
                    i,
                  }
                : {
                    x: box.x + m.peekX * i,
                    y: box.top + 10 + m.peekY * (n - 1 - i) - WORLD.phTop * m.deckS,
                    r: ROTS[i % 4],
                    s: m.deckS,
                    d: (n - 1 - i) * 40,
                    z: n - i,
                    fx: 22 * i,
                    fy: -10 * i,
                    deck: true,
                    lane: g.id,
                    i,
                  };
            });
          });
          let k = 0;
          screens.forEach((id) => {
            if (places[id]) return;
            const p = pos[id] || loosePlace(k++, bottom, m);
            places[id] = { x: p.x, y: p.y, r: 0, s: 1, d: 0, z: 5, fx: 0, fy: 0, deck: false, lane: null, i: -1 };
          });
          return { places, boxes, bottom };
        }

        function create(opts = {}) {
          let m = null,
            reduce = !!opts.reduceMotion,
            arr = { places: {}, boxes: {}, bottom: WORLD.top0 },
            order = [];
          const cur = {} /* where each frame was last reported to be */,
            tw = {} /* id -> the slide it is on: { from, to, start, dur, ease } */,
            held = new Set();

          const posAt = (t, now) => {
            const p = t.dur > 0 ? Math.min(1, Math.max(0, (now - t.start) / t.dur)) : 1;
            if (p <= 0) return t.from;
            if (p >= 1) return t.to;
            const e = t.ease(p),
              lerp = (a, b) => a + (b - a) * e;
            return { x: lerp(t.from.x, t.to.x), y: lerp(t.from.y, t.to.y), s: lerp(t.from.s, t.to.s) };
          };
          const rect = (id, now) => {
            const pl = arr.places[id];
            if (!pl) return undefined;
            if (now === undefined) return { x: pl.x, y: pl.y, s: pl.s };
            const t = tw[id];
            const p = t ? posAt(t, now) : cur[id] || pl;
            return { x: p.x, y: p.y, s: p.s };
          };
          /* a frame is drawn from its corner, scaled about it: a deck frame is small, and grows as it fans out */
          const screenRect = (id, now) => {
            const r = rect(id, now);
            return r && { x: r.x, y: r.y + WORLD.phTop * r.s, w: m.colW * r.s, h: m.phH * r.s };
          };
          const frameBox = (id, now) => {
            const r = rect(id, now);
            return r && { x: r.x, y: r.y, w: m.colW * r.s, h: (WORLD.phTop + m.phH + m.cap) * r.s };
          };

          function retarget(input, now, o = {}) {
            if (!m) throw new Error("FlowGeometry: setMetrics before retarget");
            const next = arrange(input, m);
            order = input.screens.slice();
            const keep = new Set(order);
            Object.keys(cur).forEach((id) => {
              if (!keep.has(id)) {
                delete cur[id];
                delete tw[id];
                held.delete(id);
              }
            });
            order.forEach((id) => {
              let pl = next.places[id];
              if (held.has(id)) {
                pl = next.places[id] = { ...pl, x: cur[id].x, y: cur[id].y, s: 1 };
                return;
              }
              if (!cur[id] || o.snap || reduce) {
                cur[id] = { x: pl.x, y: pl.y, s: pl.s };
                delete tw[id];
                return;
              }
              const old = tw[id],
                to = { x: pl.x, y: pl.y, s: pl.s };
              const same = (a, b) => a.x === b.x && a.y === b.y && a.s === b.s;
              if (old && same(old.to, to)) return;
              const from = old ? posAt(old, now) : cur[id];
              if (!old && same(from, to)) return;
              const kind = pl.deck ? "deck" : "open";
              /* it waits its turn only when it was at rest. Told again while still waiting it keeps the turn it
                 was promised; told again on its way it carries on, so a group dragged along keeps trailing */
              const start = old ? Math.max(now, old.start) : now + pl.d;
              tw[id] = { from: { x: from.x, y: from.y, s: from.s }, to, start, dur: MOVES[kind].dur, ease: EASE[kind] };
            });
            arr = next;
            return arr;
          }

          function step(now) {
            const moved = [];
            Object.keys(tw).forEach((id) => {
              const t = tw[id],
                p = posAt(t, now),
                c = cur[id];
              if (!c || c.x !== p.x || c.y !== p.y || c.s !== p.s) {
                cur[id] = { x: p.x, y: p.y, s: p.s };
                moved.push(id);
              }
              if (now >= t.start + t.dur) delete tw[id];
            });
            return moved;
          }

          return {
            setMetrics(next) {
              m = next;
            },
            setReduceMotion(on) {
              reduce = !!on;
              if (reduce)
                Object.keys(tw).forEach((id) => {
                  cur[id] = { x: tw[id].to.x, y: tw[id].to.y, s: tw[id].to.s };
                  delete tw[id];
                });
            },
            reset() {
              Object.keys(cur).forEach((id) => delete cur[id]);
              Object.keys(tw).forEach((id) => delete tw[id]);
              held.clear();
              arr = { places: {}, boxes: {}, bottom: WORLD.top0 };
              order = [];
            },
            retarget,
            step,
            place: (id) => arr.places[id],
            box: (id) => arr.boxes[id],
            isDeck: (id) => !!arr.places[id] && arr.places[id].deck && !held.has(id),
            rect,
            screenRect,
            frameBox,
            frameAt(pt, now, o = {}) {
              const margin = o.margin || 0;
              for (const id of order) {
                if (id === o.skip || !arr.places[id] || (arr.places[id].deck && !held.has(id))) continue;
                const r = screenRect(id, now);
                if (pt.x > r.x - margin && pt.x < r.x + r.w + margin && pt.y > r.y - margin && pt.y < r.y + r.h + margin)
                  return id;
              }
              return null;
            },
            bounds() {
              let x0 = 1e9,
                y0 = 1e9,
                x1 = -1e9,
                y1 = -1e9;
              const add = (x, y, w, h) => {
                x0 = Math.min(x0, x);
                y0 = Math.min(y0, y);
                x1 = Math.max(x1, x + w);
                y1 = Math.max(y1, y + h);
              };
              Object.values(arr.boxes).forEach((b) => b.n && add(b.x - 20, b.top - 20, b.w + 40, b.h + 40));
              order.forEach((id) => {
                if (arr.places[id].lane) return;
                const b = frameBox(id);
                add(b.x - 20, b.y - 20, b.w + 40, b.h + 40);
              });
              if (x0 > x1) return { x: 0, y: 0, w: 900, h: 600 };
              return { x: x0 - 40, y: y0 - 60, w: x1 - x0 + 80, h: y1 - y0 + 120 };
            },
            hold(id, x, y) {
              held.add(id);
              cur[id] = { x, y, s: 1 };
              delete tw[id];
              if (arr.places[id]) arr.places[id] = { ...arr.places[id], x, y, s: 1 };
            },
            release(ids) {
              ids.forEach((id) => held.delete(id));
            },
            restsAt() {
              return Object.values(tw).reduce((a, t) => Math.max(a, t.start + t.dur), 0);
            },
            settled(now) {
              return Object.values(tw).every((t) => now >= t.start + t.dur);
            },
          };
        }

        return { WORLD, MOVES, metrics, arrange, loosePlace, bezier, create };
      })();
    </script>

    <script id="routing-module">
      /* ======================================================================
         ROUTING MODULE
         The line a connector draws between two frames: which sides it leaves and enters by, the
         right-angle path between them, and the rounded shape with its arrowhead. Pure geometry on rects
         handed in; it knows nothing about the page, the animation, or where a rect came from.

         Interface
           FlowRouting.route(a, b, edge)  -> { p0, pts }   from frame rect a to frame rect b
             a, b   { x, y, w, h } the screen areas, in world px
             edge   how far down a screen its side ports sit (the device's)
           FlowRouting.shape({ pts })     -> { d, arr, mid }  svg path, arrowhead points, midpoint
           FlowRouting.sidePt(rect, side, edge)  -> { x, y, nx, ny }   a port and the way it faces
           FlowRouting.pickSides(a, b)    -> [fromSide, toSide]
           FlowRouting.ortho(a, b)        a, b: { x, y, nx, ny }; b may be a free point (nx = ny = 0)
           FlowRouting.rounded(pts, r)    svg path through pts with rounded corners
           FlowRouting.polyMid(pts)       the point half way along the polyline (where the label chip sits)
         ====================================================================== */
      var FlowRouting = (function () {
        function sidePt(r, side, edge) {
          const eo = Math.min(edge, r.h - 6);
          return side === "R"
            ? { x: r.x + r.w, y: r.y + eo, nx: 1, ny: 0 }
            : side === "L"
              ? { x: r.x, y: r.y + eo, nx: -1, ny: 0 }
              : side === "B"
                ? { x: r.x + r.w / 2, y: r.y + r.h, nx: 0, ny: 1 }
                : { x: r.x + r.w / 2, y: r.y, nx: 0, ny: -1 };
        }
        function pickSides(a, b) {
          const g = 24;
          if (b.x >= a.x + a.w - g) return ["R", "L"];
          if (b.x + b.w <= a.x + g) return ["L", "R"];
          return b.y + b.h / 2 >= a.y + a.h / 2 ? ["B", "T"] : ["T", "B"];
        }
        /* flow lines are straight runs with rounded corners: horizontal out of a frame, one jog in the gutter, horizontal in.
           a: { x, y, nx, ny } the port and the way it faces; b: the same, or a free point (nx = ny = 0) while dragging */
        function ortho(a, b) {
          const S = 26,
            P = (x, y) => ({ x, y }),
            out = [P(a.x, a.y)],
            bn = b.nx || b.ny ? b : null,
            horA = a.nx !== 0,
            ahead = horA ? (b.x - a.x) * a.nx : (b.y - a.y) * a.ny,
            opposed = !!bn && bn.nx === -a.nx && bn.ny === -a.ny;
          const jog = (limit) => {
            if (horA) {
              if (ahead >= limit) {
                const mx = (a.x + b.x) / 2;
                out.push(P(mx, a.y), P(mx, b.y));
              } else {
                const ox = a.x + a.nx * S;
                out.push(P(ox, a.y), P(ox, b.y));
              }
            } else if (ahead >= limit) {
              const my = (a.y + b.y) / 2;
              out.push(P(a.x, my), P(b.x, my));
            } else {
              const oy = a.y + a.ny * S;
              out.push(P(a.x, oy), P(b.x, oy));
            }
          };
          const around = () => {
            /* the target is beside or behind: step out, go round, step in */
            const s1 = P(a.x + a.nx * S, a.y + a.ny * S);
            if (!bn) return out.push(s1, horA ? P(s1.x, b.y) : P(b.x, s1.y));
            const s2 = P(b.x + bn.nx * S, b.y + bn.ny * S);
            if (opposed && horA) {
              const ym = Math.abs(a.y - b.y) < 24 ? Math.min(a.y, b.y) - 70 : (a.y + b.y) / 2;
              out.push(s1, P(s1.x, ym), P(s2.x, ym), s2);
            } else if (opposed) {
              const xm = Math.abs(a.x - b.x) < 24 ? Math.max(a.x, b.x) + 70 : (a.x + b.x) / 2;
              out.push(s1, P(xm, s1.y), P(xm, s2.y), s2);
            } else out.push(s1, horA ? P(s1.x, s2.y) : P(s2.x, s1.y), s2);
          };
          if (!bn) jog(S);
          else if (opposed && ahead >= 2 * S) jog(2 * S);
          else if (!opposed && (horA ? bn.ny !== 0 : bn.nx !== 0)) {
            const c = horA ? P(b.x, a.y) : P(a.x, b.y);
            const okA = horA ? (c.x - a.x) * a.nx >= S : (c.y - a.y) * a.ny >= S;
            const okB = horA ? (c.y - b.y) * bn.ny >= S : (c.x - b.x) * bn.nx >= S;
            if (okA && okB) out.push(c);
            else around();
          } else around();
          out.push(P(b.x, b.y));
          /* drop repeats and points that sit on a straight run, so level frames get one clean line */
          const clean = [];
          out.forEach((q) => {
            const l = clean[clean.length - 1];
            if (!l || Math.abs(q.x - l.x) > 0.5 || Math.abs(q.y - l.y) > 0.5) clean.push(q);
          });
          return clean.filter((q, i) => {
            if (i === 0 || i === clean.length - 1) return true;
            const a = clean[i - 1],
              n = clean[i + 1];
            return Math.abs((q.x - a.x) * (n.y - q.y) - (q.y - a.y) * (n.x - q.x)) >= 0.5;
          });
        }
        function rounded(pts, r = 14) {
          let d = `M${pts[0].x} ${pts[0].y}`;
          for (let i = 1; i < pts.length - 1; i++) {
            const p = pts[i],
              a = pts[i - 1],
              b = pts[i + 1],
              l1 = Math.hypot(p.x - a.x, p.y - a.y),
              l2 = Math.hypot(b.x - p.x, b.y - p.y),
              rr = Math.min(r, l1 / 2, l2 / 2),
              u1 = { x: (p.x - a.x) / l1, y: (p.y - a.y) / l1 },
              u2 = { x: (b.x - p.x) / l2, y: (b.y - p.y) / l2 };
            d += `L${p.x - u1.x * rr} ${p.y - u1.y * rr}Q${p.x} ${p.y} ${p.x + u2.x * rr} ${p.y + u2.y * rr}`;
          }
          const L = pts[pts.length - 1];
          return d + `L${L.x} ${L.y}`;
        }
        function polyMid(pts) {
          const seg = pts.slice(1).map((q, i) => Math.hypot(q.x - pts[i].x, q.y - pts[i].y)),
            half = seg.reduce((x, y) => x + y, 0) / 2;
          let run = 0;
          for (let i = 0; i < seg.length; i++) {
            if (run + seg[i] >= half) {
              const t = seg[i] ? (half - run) / seg[i] : 0;
              return { x: pts[i].x + (pts[i + 1].x - pts[i].x) * t, y: pts[i].y + (pts[i + 1].y - pts[i].y) * t };
            }
            run += seg[i];
          }
          return pts[pts.length - 1];
        }
        function shape(c) {
          const pts = c.pts.map((q) => ({ x: q.x, y: q.y })),
            n = pts.length,
            tip = pts[n - 1],
            prev = pts[n - 2],
            l = Math.hypot(tip.x - prev.x, tip.y - prev.y) || 1,
            t = { x: (tip.x - prev.x) / l, y: (tip.y - prev.y) / l },
            pp = { x: -t.y, y: t.x },
            mid = polyMid(pts);
          /* the line stops where the arrowhead starts */
          if (l > 12) pts[n - 1] = { x: tip.x - t.x * 9, y: tip.y - t.y * 9 };
          const b1 = { x: tip.x - t.x * 10 + pp.x * 6.5, y: tip.y - t.y * 10 + pp.y * 6.5 },
            b2 = { x: tip.x - t.x * 10 - pp.x * 6.5, y: tip.y - t.y * 10 - pp.y * 6.5 };
          return {
            d: rounded(pts),
            arr: `${tip.x},${tip.y} ${b1.x},${b1.y} ${b2.x},${b2.y}`,
            mid,
          };
        }
        function route(a, b, edge) {
          const [sa, sb] = pickSides(a, b),
            p0 = sidePt(a, sa, edge),
            p3 = sidePt(b, sb, edge);
          return { p0, pts: ortho(p0, p3) };
        }

        return { sidePt, pickSides, ortho, rounded, polyMid, shape, route };
      })();
    </script>


    <script id="gesture-module">
      /* ======================================================================
         GESTURE MODULE
         A drag of frames, or of a whole group, proposes; the drop commits. While the pointer is down the
         layout is never touched: the gesture holds a *proposal* (where the drop would land) and the page draws
         the layout as it would be if the proposal were dropped (the *view*). Letting go hands the proposal to
         FlowCommit once, as one undo step. Cancelling (Escape, pointercancel) throws the proposal away: there is
         nothing in the layout to put back. It knows nothing about the DOM: the page hands it an adapter.

         Interface
           const gesture = FlowGesture.create({ layout, commit, device, metrics, adapter })
             layout   a FlowLayout            commit  a FlowCommit
             device   () => id of the device whose positions a drop writes
             metrics  () => { colW gap head phTop phH cap collH deckW peekX }, the sizes on this device
             adapter  the page's side:
               frames()        every frame id
               box(groupId)    { x, top } the group's corner, as the arrangement has it now
               place(frameId)  { x, y } where a frame is meant to be
               rect(frameId)   { x, y } where a frame is drawn right now (it may be sliding)
               show(preview)   draw the preview, see below; called after every change, and as the drag begins
               settle(ids)     the drag is over, dropped or cancelled: let go of the held frames and clear
                               everything show() put up. The page is drawn from the layout right after.
           gesture.begin({ kind: "frame", ids, pid, pointer })    pointer in world px; pid is the frame under it
           gesture.begin({ kind: "group", id, pointer })          a group dragged by its grip
           gesture.move(pointer) -> proposal, or null when no gesture is live
           gesture.end() -> what was done, or null when no gesture is live. Commits the proposal once.
                          { kind: "into", ids, group, moved }   into group `group` (moved: it was not in it before)
                          { kind: "loose", ids, moved }         let go on the canvas (moved: it was in a group)
                          { kind: "merge", ids, group }         dropped onto a loose frame: `group` is the new one
                          { kind: "move", id }                  a group moved
                          { kind: "stay", ids }                 let go without moving
           gesture.cancel() -> true, or false when no gesture was live. Changes nothing and makes no undo step; the
                          page is drawn from the layout again (a commit with nothing to record, so frames slide home).
                          A drop is discarded the same way if the layout changed under the drag (undo, ⌘G).
           gesture.view() -> { groups, pos }   what to arrange now. The layout's own groups and positions when no
                          proposal is live; with one, the groups as they would be and the group's new place.
                          groups: [{ id, group, open, screens }]  (`group` is the layout's group, for its title etc.)
           gesture.active() -> a gesture is live

         Proposal   { kind: "into", id, idx }   into group `id`, at slot `idx` among the frames that stay
                    { kind: "merge", id }        onto the loose frame `id`
                    { kind: "loose", at }        on the canvas; at: { [frameId]: { x, y } }
                    { kind: "move", id, at }     group `id` to `at`
                    { kind: "stay" }             nothing: not moved yet, or held over the slot it started in
         Preview    { kind: "frame"|"group", proposal, held: { [frameId]: { x, y } }, regrouped, dropGroup, mergeFrame }
                    regrouped: the arrangement changed (draw the whole layout), not only where the held frames are
                    dropGroup: the group to light up; mergeFrame: the loose frame to light up (or null)
         ====================================================================== */
      var FlowGesture = (function () {
        "use strict";
        const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
        const keyOf = (p) => p.kind + "|" + (p.id || "") + "|" + (p.idx === undefined ? "" : p.idx);

        function create({ layout, commit, device, metrics, adapter }) {
          let g = null; /* the live gesture: { kind, ids, pid, off, was, start, w0, held, proposal, last, base } */

          /* where a drop at this point (the centre of the frame under the pointer) would land */
          function targetAt(c, ids) {
            const M = metrics();
            let best = null;
            for (const L of layout.lanes) {
              const m = L.screens.filter((x) => !ids.includes(x)).length;
              const B = adapter.box(L.id);
              if (!B) continue;
              if (L.open) {
                const rowW = Math.max(1, m) * (M.colW + M.gap);
                if (
                  c.x >= B.x - 90 &&
                  c.x <= B.x + m * (M.colW + M.gap) + M.colW * 1.4 &&
                  c.y >= B.top - 30 &&
                  c.y <= B.top + M.head + M.phTop + M.phH + M.cap + 70
                ) {
                  const idx = clamp(Math.round((c.x - B.x - M.colW / 2) / (M.colW + M.gap)), 0, m),
                    dist = Math.abs(c.x - (B.x + rowW / 2));
                  if (!best || dist < best.dist) best = { kind: "into", id: L.id, idx, dist };
                }
              } else if (
                c.x >= B.x - 30 &&
                c.x <= B.x + M.deckW + M.peekX * 3 + 70 &&
                c.y >= B.top - 30 &&
                c.y <= B.top + M.collH + 20
              ) {
                best = { kind: "into", id: L.id, idx: m, dist: 0 };
              }
            }
            if (best) return { kind: "into", id: best.id, idx: best.idx };
            for (const id of adapter.frames()) {
              if (ids.includes(id) || layout.groupOf(id)) continue;
              const f = adapter.place(id);
              if (f && c.x > f.x && c.x < f.x + M.colW && c.y > f.y + M.phTop && c.y < f.y + M.phTop + M.phH)
                return { kind: "merge", id };
            }
            return { kind: "loose" };
          }

          function announce(regrouped) {
            const p = g.proposal;
            adapter.show({
              kind: g.kind,
              proposal: p,
              held: g.held,
              regrouped,
              dropGroup: p.kind === "into" ? p.id : null,
              mergeFrame: p.kind === "merge" ? p.id : null,
            });
          }

          /* the data change a drop makes; runs inside a commit */
          function apply(d) {
            const p = d.proposal,
              dev = device();
            const places = () => layout.pos[dev] || (layout.pos[dev] = {});
            if (p.kind === "into") {
              layout.moveInto(d.ids, p.id, p.idx);
              return { kind: "into", ids: d.ids, group: p.id, moved: d.ids.some((i) => (d.was.get(i) || null) !== p.id) };
            }
            if (p.kind === "loose") {
              layout.takeOut(d.ids);
              d.ids.forEach((i) => {
                places()[i] = { x: Math.round(p.at[i].x), y: Math.round(p.at[i].y) };
              });
              return { kind: "loose", ids: d.ids, moved: d.ids.some((i) => d.was.get(i)) };
            }
            if (p.kind === "merge") {
              /* the group sits where the frame it was dropped on is, whether the others came from a group or not */
              const at = adapter.place(p.id);
              const ids = [p.id, ...d.ids];
              const group = layout.groupFrames(ids, { device: dev, at: { x: at.x, y: at.y - metrics().head } });
              return { kind: "merge", ids, group };
            }
            if (p.kind === "move") {
              places()[p.id] = { x: p.at.x, y: p.at.y };
              return { kind: "move", id: p.id };
            }
            return { kind: "stay", ids: d.ids };
          }

          return {
            active: () => !!g,
            begin(press) {
              if (g) throw new Error("FlowGesture: a gesture is already live");
              if (press.kind === "group") {
                const b = adapter.box(press.id);
                g = {
                  kind: "group",
                  ids: [],
                  id: press.id,
                  start: { x: b.x, y: b.top },
                  w0: press.pointer,
                  held: {},
                  proposal: { kind: "stay" },
                  base: layout.snapshot(),
                };
              } else {
                const off = {},
                  held = {};
                press.ids.forEach((i) => {
                  const r = adapter.rect(i);
                  off[i] = { x: press.pointer.x - r.x, y: press.pointer.y - r.y };
                  held[i] = { x: r.x, y: r.y };
                });
                /* where the frame under the pointer is now: holding it there proposes nothing */
                const L0 = layout.groupOf(press.pid);
                g = {
                  kind: "frame",
                  ids: press.ids,
                  pid: press.pid,
                  off,
                  held,
                  was: new Map(layout.lanes.flatMap((l) => l.screens.map((s) => [s, l.id]))),
                  proposal: { kind: "stay" },
                  last: keyOf(L0 ? { kind: "into", id: L0.id, idx: L0.screens.indexOf(press.pid) } : { kind: "loose" }),
                  base: layout.snapshot(),
                };
              }
              announce(false);
            },
            move(pointer) {
              if (!g) return null;
              if (g.kind === "group") {
                g.proposal = {
                  kind: "move",
                  id: g.id,
                  at: { x: Math.round(g.start.x + (pointer.x - g.w0.x)), y: Math.round(g.start.y + (pointer.y - g.w0.y)) },
                };
                announce(true);
                return g.proposal;
              }
              const held = {};
              g.ids.forEach((i) => {
                held[i] = { x: pointer.x - g.off[i].x, y: pointer.y - g.off[i].y };
              });
              const M = metrics(),
                p0 = held[g.pid];
              const t = targetAt({ x: p0.x + M.colW / 2, y: p0.y + M.phTop + M.phH / 2 }, g.ids);
              const next = t.kind === "loose" ? { kind: "loose", at: held } : t;
              const key = keyOf(next),
                same = key === g.last;
              g.held = held;
              g.last = key;
              /* still where it started: no proposal (a loose frame's own spot is a proposal, it carries where it is) */
              if (next.kind === "loose" || !same) g.proposal = next;
              announce(!same);
              return g.proposal;
            },
            end() {
              if (!g) return null;
              const d = g;
              g = null;
              adapter.settle(d.ids);
              let result = { kind: "stay", ids: d.ids };
              /* the layout changed under the drag (undo, group): the proposal was made against data that is gone */
              const stale = layout.snapshot() !== d.base;
              /* force: the preview moved things on screen, so the page is drawn from the layout whether or not it changed */
              commit(() => !stale && (result = apply(d)), { redraw: ["layout"], force: true });
              return result;
            },
            cancel() {
              if (!g) return false;
              const d = g;
              g = null;
              adapter.settle(d.ids);
              commit(() => {}, { redraw: ["layout"], force: true });
              return true;
            },
            view() {
              const pos = layout.pos[device()] || {};
              const groups = layout.lanes.map((L) => ({ id: L.id, group: L, open: L.open, screens: L.screens }));
              const p = g && g.proposal;
              if (!p || p.kind === "stay") return { groups, pos };
              if (p.kind === "move") return { groups, pos: { ...pos, [p.id]: p.at } };
              const out = groups.map((x) => ({ ...x, screens: x.screens.filter((s) => !g.ids.includes(s)) }));
              if (p.kind === "into") {
                const t = out.find((x) => x.id === p.id);
                t.screens = [...t.screens.slice(0, p.idx), ...g.ids, ...t.screens.slice(p.idx)];
              }
              return { groups: out, pos };
            },
          };
        }
        return { create };
      })();
    </script>

    <script>
      /* ======================================================================

   product class names, no product words. Problems are reported in the console; a scan that cannot be read

   ====================================================================== */
      const READ = FlowScan.read((document.getElementById("flow-scan") || {}).textContent || "");

      const andList = (a) =>

         its own. A frame with more than one can be switched. */
