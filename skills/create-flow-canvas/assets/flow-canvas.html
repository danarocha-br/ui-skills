                    ].join(" ");
          return hay.toLowerCase().includes(q);
        });
        const res = $("#results");
        res.innerHTML = "";
        if (!hit.length) {
          res.innerHTML =
            '<div class="empty">Nothing in this codebase matches.</div>';
          return;
        }
        hit.forEach((id) => {
          const s = SCREENS[id],
            t = document.createElement("div");
          t.className = "tile";
          const clone = $("#p-" + id).cloneNode(true);
          clone.removeAttribute("id");
          clone
            .querySelectorAll("[id]")
            .forEach((n) => n.removeAttribute("id"));
          clone
            .querySelectorAll(".ripple,.spot,.spotlbl")
            .forEach((n) => n.remove());
          t.innerHTML = `<div class="th"></div><b>${esc(s.name)}</b><small>${esc(s.route)}</small>`;
          t.querySelector(".th").appendChild(clone);
          t.onclick = () => select(id, true);
          res.appendChild(t);
        });
      }

      /* ======================================================================
   PLAY FLOW
   ====================================================================== */
      let playing = false,
        playLane = null;
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      function flowOrder(L, start) {
        const allowed = new Set(L.screens),
          seen = new Set(),
          seq = [];
        const heads = L.screens.filter(
          (id) => !layout.conns.some((c) => c.to === id && allowed.has(c.from)),
        );
        let cur = start || heads[0] || L.screens[0];
        while (cur && !seen.has(cur)) {
          seq.push(cur);
          seen.add(cur);
          const nx = layout.conns.find(
            (c) => c.from === cur && allowed.has(c.to) && !seen.has(c.to),
          );
          cur = nx && nx.to;
        }
        const from = start ? L.screens.indexOf(start) : 0;
        L.screens.forEach((id, i) => {
          if (!seen.has(id) && i >= from) {
            seq.push(id);
            seen.add(id);
          }
        });
        return seq;
      }
      async function play(ids) {
        if (!ids.length) return;
        const L = laneOf(ids[0]);
        if (!L) return;
        ids =
          ids.length >= L.screens.length ? flowOrder(L) : flowOrder(L, ids[0]);
        stopPlay();
        playing = true;
        playLane = L.id;
        const pl = laneEl(playLane).querySelector(".fplay");
        pl.classList.add("on");
        pl.querySelector("use").setAttribute("href", "#i-stop");
        pl.querySelector("span").textContent = "Stop";
        if (!L.open) {
          setLane(L.id, true, { fly: false });
          await sleep(450);
        }
        let prev = null;
        for (const id of ids) {
          if (!playing) break;
          const hop = prev && layout.conns.find((c) => c.from === prev && c.to === id);
          if (hop) tokenAlong(hop.id);
          select(id, true);
          prev = id;
          await sleep(1900);
        }
        stopPlay();
      }
      function stopPlay() {
        playing = false;
        playLane = null;
        document.querySelectorAll(".fplay").forEach((b) => {
          b.classList.remove("on");
          b.querySelector("use").setAttribute("href", "#i-play");
          b.querySelector("span").textContent = "Play flow";
        });
      }

      /* ======================================================================
   CONNECTORS
   A connector belongs to two frames, not to a group. It leaves the side that faces the other
   frame, bends around whatever is between them, and follows both ends while they move.
   ====================================================================== */
      let selConn = null,
        connDrag = null;
      const connEls = new Map();
      function worldM() {
        return new DOMMatrixReadOnly(getComputedStyle(world).transform);
      }
      function mkConnEl(c) {
        const g = document.createElementNS(svgNS, "g");
        g.setAttribute("class", "conn");
        g.dataset.id = c.id;
        g.innerHTML =
          '<path class="hit"/><path class="ln"/><circle class="dot" r="4.5"/><polygon class="arr"/>';
        $("#conns").appendChild(g);
        const chip = document.createElement("div");
        chip.className = "echip";
        chip.dataset.id = c.id;
        chip.tabIndex = 0;
        chip.setAttribute("role", "button");
        chip.title = "Click to follow · double-click to rename";
        chip.innerHTML =
          '<span class="lb"></span><button class="ex" aria-label="Delete connector" title="Delete connector">×</button>';
        $("#cchips").appendChild(chip);
        const o = {
          g,
          chip,
          lb: chip.querySelector(".lb"),
          ln: g.querySelector(".ln"),
          hit: g.querySelector(".hit"),
          dot: g.querySelector(".dot"),
          arr: g.querySelector(".arr"),
        };
        connEls.set(c.id, o);
        return o;
      }
      function drawConns(now = performance.now()) {
        const alive = new Set();
        layout.conns.forEach((c) => {
          alive.add(c.id);
          const o = connEls.get(c.id) || mkConnEl(c);
          const hidden =
            !geo.place(c.from) ||
            !geo.place(c.to) ||
            geo.isDeck(c.from) ||
            geo.isDeck(c.to);
          o.g.classList.toggle("off", hidden);
          o.chip.classList.toggle("off", hidden);
          o.g.dataset.to = c.to;
          o.chip.dataset.to = c.to;
          o.chip.dataset.from = c.from;
          if (document.activeElement !== o.lb && o.lb.textContent !== c.label)
            o.lb.textContent = c.label;
          if (hidden) return;
          const a = geo.screenRect(c.from, now),
            b = geo.screenRect(c.to, now);
          if (!a || !b) return;
          const r = FlowRouting.route(a, b, DEV.edge),
            sh = FlowRouting.shape(r);
          o.ln.setAttribute("d", sh.d);
          o.hit.setAttribute("d", sh.d);
          o.dot.setAttribute("cx", r.p0.x);
          o.dot.setAttribute("cy", r.p0.y);
          o.arr.setAttribute("points", sh.arr);
          o.chip.style.left = sh.mid.x + "px";
          o.chip.style.top = sh.mid.y + "px";
        });
        connEls.forEach((o, id) => {
          if (!alive.has(id)) {
            o.g.remove();
            o.chip.remove();
            connEls.delete(id);
          }
        });
        markActive();
      }
      const connBetween = (a, b) =>
        layout.conns.find((c) => c.from === a && c.to === b);
      function tokenAlong(id) {
        const o = connEls.get(id);
        if (!o || o.g.classList.contains("off")) return Promise.resolve();
        const len = o.ln.getTotalLength();
        if (!len) return Promise.resolve();
        const dot = document.createElementNS(svgNS, "circle");
        dot.setAttribute("r", 7);
        dot.setAttribute("class", "token");
        $("#conns").appendChild(dot);
        const t0 = performance.now(),
          D = Math.min(950, 420 + len * 0.3);
        return new Promise((res) => {
          const done = () => {
            dot.remove();
            res();
          };
          const step = (now) => {
            const k = Math.min(1, (now - t0) / D),
              e = 1 - Math.pow(1 - k, 3),
              pt = o.ln.getPointAtLength(len * e);
            dot.setAttribute("cx", pt.x);
            dot.setAttribute("cy", pt.y);
            if (k < 1) requestAnimationFrame(step);
            else done();
          };
          requestAnimationFrame(step);
          setTimeout(done, D + 250);
        });
      }
      function addConn(from, to, opts = {}) {
        if (from === to || connBetween(from, to)) {
          toast(
            from === to
              ? "A frame can’t connect to itself."
              : "Those frames are already connected.",
          );
          return null;
        }
        const c = commit(
          () => {
            const link = {
              id: layout.nextId("c"),
              from,
              to,
              label: opts.label || "Next",
            };
            layout.conns.push(link);
            return link;
          },
          { redraw: ["conns"] },
        );
        if (!opts.noEdit) setTimeout(() => editChip(c.id), 40);
        return c;
      }
      function deleteConn(id) {
        if (layout.conns.some((x) => x.id === id)) annotations.remove("link", { id });
      }
      function selectConn(id) {
        setSel([], null);
        selConn = id;
        markActive();
        toast(
          "Connector selected. Delete removes it, double-click its label to rename.",
        );
      }
      function editChip(id) {
        const o = connEls.get(id);
        if (!o) return;
        o.lb.contentEditable = CE;
        o.lb.focus();
        const r = document.createRange();
        r.selectNodeContents(o.lb);
        const sel = getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
      }
      function connectSel() {
        const ids = readingOrder(
          [...selSet].filter((i) => geo.place(i) && !geo.place(i).deck),
        );
        if (ids.length < 2) {
          toast("Select two or more frames to connect them in order.");
          return;
        }
        const n = commit(
          () => {
            let n = 0;
            for (let i = 0; i < ids.length - 1; i++) {
              if (!connBetween(ids[i], ids[i + 1]) && addConn(ids[i], ids[i + 1], { noEdit: true })) n++;
            }
            return n;
          },
          { redraw: ["conns"] },
        );
        toast(
          n
            ? `Connected ${ids.length} frames in order. ⌘Z to undo.`
            : "Those frames are already connected.",
        );
      }
      /* drag from an edge dot to another frame */
      function startConnDrag(e, port) {
        const id = port.closest(".col").dataset.id;
        e.preventDefault();
        stopPlay();
        moved = false;
        connDrag = { from: id, side: port.dataset.side, tgt: null, el: null };
        document.body.classList.add("connecting");
        if (!selSet.has(id)) setSel([id], id);
      }
      function updateConnDrag(e) {
        moved = true;
        const now = performance.now(),
          w = toWorld(e.clientX, e.clientY),
          a = geo.screenRect(connDrag.from, now);
        if (!a) return;
        const tgt = geo.frameAt(w, now, { margin: 10, skip: connDrag.from });
        if (tgt !== connDrag.tgt) {
          document
            .querySelectorAll(".col.tgt")
            .forEach((c) => c.classList.remove("tgt"));
          if (tgt) colOf(tgt).classList.add("tgt");
          connDrag.tgt = tgt;
        }
        if (!connDrag.el) {
          const g = document.createElementNS(svgNS, "g");
          g.setAttribute("class", "conn preview");
          g.innerHTML =
            '<path class="ln"/><circle class="dot" r="4.5"/><polygon class="arr"/>';
          $("#conns").appendChild(g);
          connDrag.el = g;
        }
        let r;
        if (tgt) {
          r = FlowRouting.route(a, geo.screenRect(tgt, now), DEV.edge);
        } else {
          const p0 = FlowRouting.sidePt(a, connDrag.side, DEV.edge);
          r = { p0, pts: FlowRouting.ortho(p0, { x: w.x, y: w.y, nx: 0, ny: 0 }) };
        }
        const sh = FlowRouting.shape(r);
        connDrag.el.querySelector(".ln").setAttribute("d", sh.d);
        connDrag.el.querySelector(".dot").setAttribute("cx", r.p0.x);
        connDrag.el.querySelector(".dot").setAttribute("cy", r.p0.y);
        connDrag.el.querySelector(".arr").setAttribute("points", sh.arr);
      }
      function endConnDrag(cancel) {
        const d = connDrag;
        connDrag = null;
        if (!d) return;
        document.body.classList.remove("connecting");
        document
          .querySelectorAll(".col.tgt")
          .forEach((c) => c.classList.remove("tgt"));
        if (d.el) d.el.remove();
        if (cancel) return;
        if (d.tgt) addConn(d.from, d.tgt);
        else if (d.el) toast("Drop on a frame to connect them.");
      }
      /* labels: click follows, double-click renames, × deletes */
      let chipT;
      world.addEventListener(
        "click",
        (e) => {
          const ex = e.target.closest(".echip .ex");
          if (ex) {
            e.stopPropagation();
            deleteConn(ex.closest(".echip").dataset.id);
            return;
          }
          const hit = e.target.closest(".conn .hit");
          if (hit) {
            e.stopPropagation();
            selectConn(hit.closest(".conn").dataset.id);
            return;
          }
          const c = e.target.closest(".echip");
          if (!c || c.querySelector(".lb").isContentEditable) return;
          e.stopPropagation();
          clearTimeout(chipT);
          chipT = setTimeout(() => go(c.dataset.from, c.dataset.to), 240);
        },
        true,
      );
      world.addEventListener("dblclick", (e) => {
        const c = e.target.closest(".echip");
        if (!c || e.target.closest(".ex")) return;
        clearTimeout(chipT);
        editChip(c.dataset.id);
      });
      world.addEventListener("focusout", (e) => {
        const lb = e.target.closest && e.target.closest(".echip .lb");
        if (!lb || !lb.isContentEditable) return;
        lb.contentEditable = "false";
        const id = lb.closest(".echip").dataset.id,
          c = layout.conns.find((x) => x.id === id);
        if (!c) return;
        const v = lb.textContent.trim() || "Next";
        lb.textContent = v;
        if (c.label !== v) {
          commit(() => {
            c.label = v;
          });
        }
      });
      world.addEventListener("keydown", (e) => {
        const chip = e.target.closest && e.target.closest(".echip");
        if (!chip) return;
        const lb = chip.querySelector(".lb");
        if (lb.isContentEditable) {
          e.stopPropagation();
          if (e.key === "Enter" || e.key === "Escape") {
            e.preventDefault();
            lb.blur();
          }
        } else if (e.key === "Enter") {
          go(chip.dataset.from, chip.dataset.to);
        } else if (e.key === "F2") {
          e.preventDefault();
          editChip(chip.dataset.id);
        }
      });

      /* ======================================================================
   EDIT THE ARRANGEMENT: group, name, remove, drag, undo
   ====================================================================== */
      function undo() {
        const done = commit.undo(() => {
          selConn = null;
          document.querySelectorAll(".lane").forEach((e) => delete e.dataset.sig);
          setSel(
            [...selSet].filter((id) => SCREENS[id]),
            selected,
          );
        });
        toast(done ? "Undone" : "Nothing to undo");
      }
      function readingOrder(ids) {
        return [...ids]
          .sort((a, b) => geo.place(a).y - geo.place(b).y || geo.place(a).x - geo.place(b).x)
          .sort((a, b) =>
            Math.abs(geo.place(a).y - geo.place(b).y) < 60
              ? geo.place(a).x - geo.place(b).x
              : geo.place(a).y - geo.place(b).y,
          );
      }

      /* what follows a new group, however it was made: select it, bring it into view if it was placed for the user,
         and ask for its name */
      function afterGrouped(L, ids, { fly: bring }) {
        setSel(ids, ids[ids.length - 1]);
        if (bring) fly(fitRect(laneRect(L), 40));
        setTimeout(() => focusTitle(L.id), 650);
        toast(
          ids.length === 1
            ? "Grouped. Name it, then drag frames in."
            : `Grouped ${ids.length} frames. Name the group.`,
        );
      }
      function groupFrames(ids) {
        ids = [...new Set(ids)].filter((id) => SCREENS[id]);
        if (!ids.length) return null;
        const allFree = ids.every(isFree);
        ids = readingOrder(ids);
        const minX = Math.min(...ids.map((i) => geo.place(i).x)),
          minY = Math.min(...ids.map((i) => geo.place(i).y));
        /* frames that were all loose keep their spot; otherwise the group takes the next free one */
        const at = allFree ? { x: minX, y: minY - HEAD } : undefined;
        const L = commit(() => layout.groupFrames(ids, { device: DEV.id, at }), { redraw: ["layout"] });
        afterGrouped(L, ids, { fly: !allFree });
        return L;
      }
      function removeFromGroup(ids) {
        ids = ids.filter((i) => laneOf(i));
        if (!ids.length) return;
        commit(
          () => {
            const P = posOf();
            const byLane = new Map();
            ids.forEach((i) => {
              const L = laneOf(i);
              if (!byLane.has(L)) byLane.set(L, []);
              byLane.get(L).push(i);
            });
            byLane.forEach((list, L) => {
              const box = geo.box(L.id);
              const end =
                box.x +
                (L.open
                  ? L.screens.length * (COL_W + GAP) + 40
                  : DECK_W + PEEK_X * 3 + 120);
              let k = 0;
              list.forEach((i) => {
                P[i] = {
                  x: Math.round(end + k * (COL_W + 70)),
                  y: Math.round(L.open ? geo.place(i).y : box.top + HEAD),
                };
                k++;
              });
            });
            layout.takeOut(ids);
          },
          { redraw: ["layout"] },
        );
        toast(
          ids.length === 1
            ? "Removed from group. ⌘Z to undo."
            : `Removed ${ids.length} frames from their groups. ⌘Z to undo.`,
        );
      }
      function dissolveGroup(L) {
        const name = laneName(L);
        commit(
          () => {
            const P = posOf();
            const box = geo.box(L.id);
            L.screens.forEach((i, k) => {
              P[i] = {
                x: Math.round(box.x + k * (COL_W + GAP)),
                y: Math.round(box.top + HEAD),
              };
            });
            layout.takeOut([...L.screens]);
          },
          { redraw: ["layout"] },
        );
        toast(`Ungrouped “${name}”. Frames stay on the canvas. ⌘Z to undo.`);
      }
      function groupSel() {
        if (selSet.size) groupFrames([...selSet]);
      }
      function removeSel() {
        removeFromGroup([...selSet]);
      }
      /* put the view back in order without touching what the flows are: group membership and order,
         connectors, names, annotations and every note's text stay; only positions are reset on this device */
      function tidy() {
        const changed = commit(
          () => {
            const was = layout.snapshot();
            /* keep the stacking order you arranged: top to bottom, then left to right */
            const rank = (L) => (L.screens.length ? 0 : 1);
            const at = (L) => geo.box(L.id);
            layout.lanes = layout.lanes.slice().sort((a, b) => rank(a) - rank(b) || at(a).top - at(b).top || at(a).x - at(b).x);
            const loose = readingOrder(ORDER.filter(isFree));
            const P = layout.pos[DEV.id];
            layout.lanes.forEach((L) => delete P[L.id]);
            loose.forEach((id) => delete P[id]);
            /* pinning the loose frames is the user's tidy, so it is written here, in reading order, and nowhere else */
            const M = FlowGeometry.metrics(DEV);
            const { bottom } = FlowGeometry.arrange(geoInput(), M);
            loose.forEach((id, k) => (P[id] = FlowGeometry.loosePlace(k, bottom, M)));
            /* findings back beside their frames; scanned notes back where the scan put them */
            /* forgetting the user's position for this device puts a scanned card back where the scan put it */
            const forget = (item, scanned) => {
              if (!item.pos) return;
              if (scanned && scanned.pos && scanned.pos[DEV.id]) item.pos[DEV.id] = [...scanned.pos[DEV.id]];
              else delete item.pos[DEV.id];
              if (!Object.keys(item.pos).length && !(scanned && scanned.pos)) delete item.pos;
            };
            layout.scans.forEach((f) => forget(f, FINDINGS.find((x) => x.id === f.id)));
            layout.notes.forEach((n) => {
              const scanned = NOTES.find((x) => x.id === n.id);
              if (scanned && n.frame === scanned.frame) forget(n, scanned);
            });
            return layout.snapshot() !== was; /* the same test commit uses */
          },
          { redraw: "all" },
        );
        if (!changed) {
          toast("Already tidy.");
          return;
        }
        fly(fitRect(geo.bounds(), 40, 1.1));
        toast("Tidied. Groups, flows and connectors are as they were. ⌘Z to undo.");
      }
      function resetLayout() {
        commit(
          () => {
            layout.reset();
            selConn = null;
            setSel([]);
          },
          { redraw: ["world"] },
        );
        fly(fitRect(geo.bounds(), 40, 1.1));
        toast("Layout reset to the scanned arrangement");
      }
      function focusTitle(id) {
        const L = layout.lanes.find((l) => l.id === id);
        if (!L) return;
        if (!L.open) setLane(id, true, { fly: false });
        const t = laneEl(id) && laneEl(id).querySelector(".gtitle");
        if (!t) return;
        t.focus();
        const r = document.createRange();
        r.selectNodeContents(t);
        const s = getSelection();
        s.removeAllRanges();
        s.addRange(r);
      }

      /* group options menu (header “…”) */
      function openGroupMenu(L, btn) {
        const m = $("#mGroup");
        const r = btn.getBoundingClientRect();
        m.innerHTML = `<button class="mi" data-ga="rename"><svg><use href="#i-note"/></svg>Rename</button>
    <button class="mi" data-ga="toggle"><svg><use href="#i-layers"/></svg>${L.open ? "Close group" : "Open group"}</button>
    <button class="mi" data-ga="play"><svg><use href="#i-play"/></svg>Play flow</button>
    <hr><button class="mi" data-ga="ungroup"><svg><use href="#i-ungroup"/></svg>Ungroup<span>keeps the frames</span></button>`;
        m.style.left = Math.min(r.left, innerWidth - 260) + "px";
        m.style.top = Math.min(r.bottom + 8, innerHeight - 220) + "px";
        m.style.bottom = "auto";
        closeMenus();
        m.classList.add("open");
        m.querySelectorAll("[data-ga]").forEach(
          (b) =>
            (b.onclick = (ev) => {
              ev.stopPropagation();
              closeMenus();
              const a = b.dataset.ga;
              if (a === "rename") focusTitle(L.id);
              if (a === "toggle") setLane(L.id, !L.open);
              if (a === "play") play(L.screens);
              if (a === "ungroup") dissolveGroup(L);
            }),
        );
      }

      /* ---------- dragging ---------- */
      let pan = null,
        moved = false,
        press = null,
        mq = null,
        handMode = false,
        spaceDown = false;
      function setHand(on) {
        handMode = on;
        stage.classList.toggle("hand", on || spaceDown);
        toast(
          on
            ? "Hand tool: drag to pan. V returns to select."
            : "Select tool: drag to select frames.",
        );
      }
      const selbox = document.createElement("div");
      selbox.className = "selbox";
      selbox.innerHTML = "<span></span>";
      world.insertBefore(selbox, notesEl);
      function updateSelBox() {
        const ids = [...selSet].filter(
          (id) => geo.place(id) && !geo.place(id).deck && colOf(id),
        );
        if (ids.length < 2) {
          selbox.style.display = "none";
          return;
        }
        let x0 = 1e9,
          y0 = 1e9,
          x1 = -1e9,
          y1 = -1e9;
        ids.forEach((id) => {
          const f = geo.place(id);
          x0 = Math.min(x0, f.x);
          y0 = Math.min(y0, f.y + PH_TOP);
          x1 = Math.max(x1, f.x + COL_W);
          y1 = Math.max(y1, f.y + PH_TOP + PH_H);
        });
        const pad = 14;
        Object.assign(selbox.style, {
          display: "block",
          left: x0 - pad + "px",
          top: y0 - pad + "px",
          width: x1 - x0 + pad * 2 + "px",
          height: y1 - y0 + pad * 2 + "px",
        });
        selbox.firstChild.textContent = ids.length + " frames";
      }
      const hint = $("#hint");
      const hideHint = () => hint.classList.add("gone");
      setTimeout(hideHint, 9000);
      /* the page's side of a gesture: draw its preview, and clean up after it. Everything a drag puts on the page is
         drawn from the preview and cleared in settleGesture, which a drop and a cancel both end in. */
      function showGesture(pv) {
        if (pv.kind === "group") {
          document.body.classList.add("gdrag");
          document.querySelectorAll(".col.fan").forEach((c) => c.classList.remove("fan"));
          /* a group dragged by its grip moves as one piece with its header: the frames do not slide after it */
          if (pv.regrouped) {
            arrangeFrames({ snap: true });
            syncLanes();
            updateBars();
            drawConns();
          }
          return;
        }
        selbox.classList.add("live");
        Object.entries(pv.held).forEach(([id, at]) => {
          const c = colOf(id);
          if (!c) return;
          geo.hold(id, at.x, at.y);
          c.classList.add("dragging");
          c.classList.remove("deck");
        });
        document.querySelectorAll(".col.merge").forEach((c) => c.dataset.id !== pv.mergeFrame && c.classList.remove("merge"));
        if (pv.mergeFrame) colOf(pv.mergeFrame)?.classList.add("merge");
        layout.lanes.forEach((L) => L.el && L.el.classList.toggle("drop", L.id === pv.dropGroup));
        if (pv.regrouped) relayout();
        else {
          Object.keys(pv.held).forEach((id) => putFrame(id));
          updateSelBox();
          drawConns();
        }
      }
      function settleGesture(ids) {
        geo.release(ids);
        document.body.classList.remove("gdrag");
        selbox.classList.remove("live");
        document.querySelectorAll(".col.dragging,.col.merge").forEach((c) => c.classList.remove("dragging", "merge"));
        layout.lanes.forEach((L) => L.el && L.el.classList.remove("drop"));
      }
      function beginDrag() {
        moved = true;
        stage.classList.remove("fly");
        hideHint();
        const pointer = toWorld(press.sx, press.sy);
        if (press.kind === "group") {
          if (!press.lane) {
            press = null;
            return;
          }
          gesture.begin({ kind: "group", id: press.lane.id, pointer });
          return;
        }
        const id = press.id;
        const ids =
          selSet.has(id) && selSet.size > 1
            ? [...selSet].filter((x) => geo.place(x) && !geo.place(x).deck)
            : [id];
        if (!selSet.has(id) || selSet.size <= 1) setSel([id], id);
        gesture.begin({ kind: "frame", ids, pid: id, pointer });
      }
      function updateDrag(e) {
        gesture.move(toWorld(e.clientX, e.clientY));
      }
      function endDrag() {
        const r = gesture.end();
        if (!r) return;
        if (r.kind === "merge") afterGrouped(r.group, r.ids, { fly: false });
        else if (r.kind === "into") {
          const where = layout.lanes.find((l) => l.id === r.group);
          toast((r.moved ? `Moved into “${laneName(where)}”` : "Reordered") + ". ⌘Z to undo.");
        } else if (r.kind === "loose" && r.moved) toast("Taken out of its group. ⌘Z to undo.");
      }
      /* Escape and pointercancel: the pointer is taken off whatever it was dragging. Nothing was written, so there is
         nothing to put back; what is left of the press does nothing. */
      function cancelDrag() {
        annotations.cancel();
        gesture.cancel();
        press = null;
      }
      function marqueeHits(r) {
        const a = toWorld(r.x, r.y),
          b = toWorld(r.x + r.w, r.y + r.h),
          now = performance.now();
        return ORDER.filter((id) => {
          if (!geo.place(id) || geo.isDeck(id)) return false;
          const q = geo.screenRect(id, now);
          return q.x + q.w > a.x && q.x < b.x && q.y + q.h > a.y && q.y < b.y;
        });
      }
      function updateMarquee(e) {
        if (!mq.el) {
          mq.el = document.createElement("div");
          mq.el.className = "marquee";
          document.body.appendChild(mq.el);
          moved = true;
          hideHint();
          document.body.classList.add("selecting");
          getSelection().removeAllRanges();
          document.activeElement &&
            document.activeElement.blur &&
            document.activeElement.blur();
        }
        const x = Math.min(e.clientX, mq.sx),
          y = Math.min(e.clientY, mq.sy),
          w = Math.abs(e.clientX - mq.sx),
          h = Math.abs(e.clientY - mq.sy);
        Object.assign(mq.el.style, {
          left: x + "px",
          top: y + "px",
          width: w + "px",
          height: h + "px",
        });
        mq.r = { x, y, w, h };
        const hits = marqueeHits(mq.r),
          next = [...new Set([...mq.base, ...hits])],
          key = next.join();
        if (key !== mq.last) {
          mq.last = key;
          setSel(next, next[next.length - 1] || null);
        }
      }
      function endMarquee() {
        const m = mq;
        mq = null;
        document.body.classList.remove("selecting");
        if (!m || !m.el) return;
        m.el.remove();
        if (selSet.size > 1)
          toast(
            selSet.size +
              " selected. ⌘G groups them, ⌘⇧G takes them out of their groups.",
          );
      }

      stage.addEventListener("pointerdown", (e) => {
        if (e.button === 1) {
          e.preventDefault();
          stopPlay();
          moved = false;
          pan = { sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y };
          return;
        }
        if (e.button !== 0) return;
        const grabbed = annotations.down(e.target, { x: e.clientX, y: e.clientY });
        if (grabbed) {
          if (grabbed.prevent) e.preventDefault();
          return;
        }
        /* a press on any part of an annotation (a note's button, a connector chip, a caption) is not a press on the canvas */
        if (annotations.owns(e.target)) return;
        const port = e.target.closest(".port");
        if (port) {
          startConnDrag(e, port);
          return;
        }
        const grip = e.target.closest(".grip");
        if (grip) {
          const L = layout.lanes.find((l) => l.id === grip.closest(".lane").id);
          e.preventDefault();
          stopPlay();
          moved = false;
          press = { kind: "group", lane: L, sx: e.clientX, sy: e.clientY };
          return;
        }
        const col = e.target.closest(".col");
        if (
          col &&
          !e.target.closest(".states,button,[contenteditable]")
        ) {
          stopPlay();
          moved = false;
          press = col.classList.contains("deck")
            ? {
                kind: "group",
                lane: laneOf(col.dataset.id),
                sx: e.clientX,
                sy: e.clientY,
              }
            : {
                kind: "frame",
                id: col.dataset.id,
                sx: e.clientX,
                sy: e.clientY,
              };
          return;
        }
        if (e.target.closest(".ghead,button,[contenteditable]")) return;
        stopPlay();
        moved = false;
        if (handMode || spaceDown) {
          pan = { sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y };
          return;
        }
        mq = {
          sx: e.clientX,
          sy: e.clientY,
          el: null,
          base: e.shiftKey ? [...selSet] : [],
          last: null,
        };
      });
      addEventListener("pointermove", (e) => {
        if (connDrag) {
          updateConnDrag(e);
          return;
        }
        if (annotations.dragging()) {
          annotations.move({ x: e.clientX, y: e.clientY }, cam.k);
          return;
        }
        if (
          press &&
          !gesture.active() &&
          Math.hypot(e.clientX - press.sx, e.clientY - press.sy) > 5
        )
          beginDrag();
        if (gesture.active()) {
          updateDrag(e);
          return;
        }
        if (mq) {
          updateMarquee(e);
          return;
        }
        if (!pan) return;
        const dx = e.clientX - pan.sx,
          dy = e.clientY - pan.sy;
        if (!moved && Math.hypot(dx, dy) > 4) {
          moved = true;
          stage.classList.add("panning");
          hideHint();
          stage.classList.remove("fly");
        }
        if (moved) {
          cam.x = pan.cx + dx;
          cam.y = pan.cy + dy;
          apply();
        }
      });
      addEventListener("pointerup", () => {
        if (connDrag) {
          endConnDrag(false);
          press = null;
          return;
        }
        annotations.up();
        endDrag();
        if (mq) endMarquee();
        press = null;
        pan = null;
        stage.classList.remove("panning");
      });
      addEventListener("pointercancel", () => {
        cancelDrag();
        if (connDrag) endConnDrag(true);
        press = null;
        pan = null;
        mq = null;
      });
      stage.addEventListener(
        "click",
        (e) => {
          if (moved) {
            e.stopPropagation();
            e.preventDefault();
            moved = false;
          }
        },
        true,
      );
      stage.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          stopPlay();
          hideHint();
          stage.classList.remove("fly");
          if (e.ctrlKey || e.metaKey)
            zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.012));
          else {
            cam.x -= e.deltaX;
            cam.y -= e.deltaY;
            apply();
          }
        },
        { passive: false },
      );

      /* deck hover fans the cards */
      function fanLane(id, on) {
        const L = layout.lanes.find((l) => l.id === id);
        if (L)
          L.screens.forEach((s) => {
            const c = colOf(s);
            if (c) c.classList.toggle("fan", on && !gesture.active());
          });
      }
      world.addEventListener("pointerover", (e) => {
        const c = e.target.closest(".col.deck");
        if (c) {
          fanLane(c.dataset.lane, true);
          return;
        }
        const h = e.target.closest(".ghead");
        if (h) {
          const L = layout.lanes.find((l) => l.id === h.closest(".lane").id);
          if (L && !L.open) fanLane(L.id, true);
        }
      });
      world.addEventListener("pointerout", (e) => {
        const c = e.target.closest(".col.deck");
        if (c) {
          const to =
            e.relatedTarget &&
            e.relatedTarget.closest &&
            e.relatedTarget.closest(".col.deck");
          if (!to || to.dataset.lane !== c.dataset.lane)
            fanLane(c.dataset.lane, false);
          return;
        }
        const h = e.target.closest(".ghead");
        if (h) {
          const L = layout.lanes.find((l) => l.id === h.closest(".lane").id);
          if (L && !(e.relatedTarget && h.contains(e.relatedTarget)))
            fanLane(L.id, false);
        }
      });

      world.addEventListener("click", (e) => {
        const col = e.target.closest(".col");
        if (col && col.classList.contains("deck")) {
          const L = laneOf(col.dataset.id);
          if (L) setLane(L.id, true);
          return;
        }
        if (col) {
          const id = col.dataset.id;
          if (e.shiftKey) {
            const s = new Set(selSet);
            if (s.has(id)) s.delete(id);
            else s.add(id);
            setSel([...s], s.has(id) ? id : [...s].pop() || null);
            return;
          }
          if (!(selSet.size > 1 && selSet.has(id)) && selected !== id)
            select(id, false);
        }
        const ph = e.target.closest(".phone");
        if (ph && col) {
          const r = ph.getBoundingClientRect(),
            rp = document.createElement("span");
          rp.className = "ripple";
          rp.style.left = (e.clientX - r.left) / cam.k + "px";
          rp.style.top = (e.clientY - r.top) / cam.k + "px";
          ph.appendChild(rp);
          setTimeout(() => rp.remove(), 650);
          const goEl = e.target.closest("[data-go]");
          /* the product's own reactions, if the scan brought any */
          if (window.FlowScanBehaviour && typeof FlowScanBehaviour.onTap === "function") {
            try {
              FlowScanBehaviour.onTap(col.dataset.id, e.target, ph);
            } catch (err) {
              console.error("flow-scan-behaviour:", err);
            }
          }
          /* a button that leads somewhere follows the connector that says so; no connector, no jump (a button
             that leads to its own screen has nowhere to go and needs none) */
          if (goEl && goEl.dataset.go && SCREENS[goEl.dataset.go]) {
            const from = col.dataset.id,
              to = goEl.dataset.go;
            if (from === to || layout.conns.some((c) => c.from === from && c.to === to)) setTimeout(() => go(from, to), 180);
            else toast(`No connector from ${shortName(from)} to ${shortName(to)}. Draw one to follow this button.`);
          }
        }
        if (!col && !annotations.owns(e.target) && !e.target.closest(".ghead")) {
          select(null);
        }
      });
      world.addEventListener("dblclick", (e) => {
        const col = e.target.closest(".col");
        if (
          col &&
          !col.classList.contains("deck") &&
          !e.target.closest(
            /* .cap is not part of captionKind.owns on purpose: a press on a caption's padding still drags the frame */
            ["[data-go],.states,.cap", window.FlowScanBehaviour && FlowScanBehaviour.interactive].filter(Boolean).join(","),
          ) &&
          !annotations.owns(e.target)
        )
          select(col.dataset.id, true);
      });

      /* states: a switchable frame shows one state at a time, from the state's own render */
      const stateLabel = (id) => `${shownStates(id).length} states · ${esc(SCREENS[id].states[stateIndex(id)].name)}`;
      function setState(id, i) {
        if (!shownStates(id).includes(i)) return;
        stateOf[id] = i;
        const ph = document.getElementById("p-" + id);
        if (ph) {
          ph.innerHTML = screenHTML(id);
          ph.dataset.state = i;
        }
        const b = colOf(id) && colOf(id).querySelector(".states");
        if (b) b.innerHTML = stateLabel(id);
      }

      /* ======================================================================
   CHROME: menus, pager, keys
   ====================================================================== */
      const menus = {
        space: $("#mSpace"),
        views: $("#mViews"),
        add: $("#mAdd"),
        group: $("#mGroup"),
      };
      function menu(n) {
        Object.entries(menus).forEach(([k, el]) =>
          el.classList.toggle(
            "open",
            k === n && !el.classList.contains("open"),
          ),
        );
      }
      function closeMenus() {
        Object.values(menus).forEach((m) => m.classList.remove("open"));
      }
      $("#btnTidy").onclick = (e) => {
        e.stopPropagation();
        closeMenus();
        tidy();
      };
      $("#btnSpace").onclick = (e) => {
        e.stopPropagation();
        menu("space");
      };
      $("#btnViews").onclick = (e) => {
        e.stopPropagation();
        buildViews();
        menu("views");
      };
      $("#btnAdd").onclick = (e) => {
        e.stopPropagation();
        menu("add");
      };
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".menu")) closeMenus();
      });
      function buildViews() {
        $("#mViews").innerHTML =
          `<button class="mi" data-view="all"><svg><use href="#i-frame"/></svg>Overview<span class="k">1</span></button>` +
          layout.lanes.filter((l) => l.screens.length)
            .map(
              (l, i) =>
                `<button class="mi" data-view="${l.id}"><svg><use href="#i-frame"/></svg>${esc(laneName(l))}<span class="k">${i < 3 ? i + 2 : ""}</span></button>`,
            )
            .join("");
        $("#mViews")
          .querySelectorAll("[data-view]")
          .forEach(
            (b) =>
              (b.onclick = () => {
                view(b.dataset.view);
                closeMenus();
              }),
          );
      }
      menus.space.querySelectorAll("[data-hide]").forEach(
        (b) =>
          (b.onclick = (e) => {
            e.stopPropagation();
            const on = b.classList.toggle("on");
            document.body.classList.toggle("hide-" + b.dataset.hide, !on);
          }),
      );
      document.querySelectorAll(".menu [data-a]").forEach((b) =>
        b.addEventListener("click", () => {
          const a = b.dataset.a;
          closeMenus();
          if (a === "note") newNote();
          if (a === "group") groupSel();
          if (a === "tidy") tidy();
          if (a === "resetlayout") resetLayout();
          if (a === "resetann") resetAnn();
          if (a === "rescan")
            toast(`${SCAN.product.name}: ${ORDER.length} screens in this scan. Regenerate the canvas to rescan.`);
          if (a === "route") toast("Pick a route to render it on the canvas");
        }),
      );
      function newNote() {
        const wx = (innerWidth / 2 - cam.x) / cam.k - 98,
          wy = (innerHeight / 2 - cam.y) / cam.k - 50,
          f = homeFor(wx + 98, wy + 50);
        createNote(f ? { frame: f, local: localFrom(f, wx, wy) } : { world: [Math.round(wx), Math.round(wy)] });
      }
      const step = (d) => {
        const i = selected ? ORDER.indexOf(selected) : -1;
        stopPlay();
        select(ORDER[clamp(i + d, 0, ORDER.length - 1)], true);
      };
      $("#next").onclick = () => step(1);
      $("#prev").onclick = () => step(-1);
      $("#zoom").onclick = () => view("all");
      $("#btnSearch").onclick = () => {
        if (panelOpen && panelMode === "search") closePanel();
        else openSearch();
      };
      let tt;
      function toast(m) {
        const t = $("#toast");
        t.textContent = m;
        t.classList.add("show");
        clearTimeout(tt);
        tt = setTimeout(() => t.classList.remove("show"), 2800);
      }

      /* Delete and the arrow keys on an annotation: one handler for every kind, ahead of the others */
      addEventListener(
        "keydown",
        (e) => {
          if (!e.target.closest) return; /* the document itself */
          /* Cmd/Ctrl/Alt + arrow belongs to the browser (back, forward), not to a note */
          if ((e.metaKey || e.ctrlKey || e.altKey) && e.key.startsWith("Arrow")) return;
          if (annotations.keyDown(e.target, e.key, { shift: e.shiftKey })) {
            e.preventDefault();
            e.stopPropagation();
          }
        },
        true,
      );
      addEventListener("keydown", (e) => {
        const typing = e.target.closest?.("input,select,[contenteditable]");
        const mod = e.metaKey || e.ctrlKey;
        if (mod && e.key.toLowerCase() === "k") {
          e.preventDefault();
          openSearch();
          return;
        }
        if (!typing && mod && e.key.toLowerCase() === "g") {
          e.preventDefault();
          if (e.shiftKey) removeSel();
          else groupSel();
          return;
        }
        if (!typing && mod && e.key.toLowerCase() === "z" && !e.shiftKey) {
          e.preventDefault();
          undo();
          return;
        }
        if (!typing && mod && e.key.toLowerCase() === "a") {
          e.preventDefault();
          const ids = ORDER.filter((id) => geo.place(id) && !geo.place(id).deck);
          setSel(ids, ids[ids.length - 1] || null);
          toast(ids.length + " frames selected");
          return;
        }
        if (
          e.code === "Space" &&
          !typing &&
          !(
            e.target.closest && e.target.closest("button,select,input,textarea")
          )
        ) {
          e.preventDefault();
          if (!spaceDown) {
            spaceDown = true;
            stage.classList.add("hand");
          }
          return;
        }
        if (e.key === "Escape") {
          if (connDrag) {
            endConnDrag(true);
            return;
          }
          if (selConn) {
            selConn = null;
            markActive();
            return;
          }
          if (gesture.active() || annotations.dragging()) {
            e.preventDefault();
            cancelDrag();
            return;
          }
          if (usageComp !== null) {
            clearSweep();
            return;
          }
          if (typing) e.target.blur();
          closeMenus();
          stopPlay();
          if (panelOpen) closePanel();
          else if (selSet.size) select(null);
          return;
        }
        if (typing) return;
        if (e.key === "c" && selSet.size > 1) {
          connectSel();
          return;
        }
        if (e.key === "h") setHand(true);
        if (e.key === "v") setHand(false);
        if (e.key === "a") toggleAll();
        if (e.key === "l") tidy();
        if (e.key === "m") setDevice("mobile");
        if (e.key === "t") setDevice("tablet");
        if (e.key === "d") setDevice("desktop");
        if (e.key === "1") view("all");
        if (e.key === "2" && layout.lanes[0]) view(layout.lanes[0].id);
        if (e.key === "3" && layout.lanes[1]) view(layout.lanes[1].id);
        if (e.key === "4" && layout.lanes[2]) view(layout.lanes[2].id);
        if (e.key === "ArrowRight") {
          step(1);
          e.preventDefault();
        }
        if (e.key === "ArrowLeft") {
          step(-1);
          e.preventDefault();
        }
        if (e.key === "f" && selected) focusScreen(selected);
        if (e.key === "i") {
          if (selected) inspect(selected);
          else inspectEmpty(true);
        }
        if (e.key === "n") {
          e.preventDefault();
          newNote();
        }
        if (e.key === "=" || e.key === "+")
          zoomAt(innerWidth / 2, innerHeight / 2, 1.2);
        if (e.key === "-") zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.2);
        if (e.key === "/") {
          e.preventDefault();
          openSearch();
        }
      });
      addEventListener("keyup", (e) => {
        if (e.code === "Space") {
          spaceDown = false;
          stage.classList.toggle("hand", handMode);
        }
      });
      addEventListener("blur", () => {
        spaceDown = false;
        stage.classList.toggle("hand", handMode);
      });
      addEventListener("resize", () => {
        updateBars();
        if (panelOpen) {
          insetR = panelW();
          insetB = panelH();
        }
      });

      /* ======================================================================
   OPEN / CLOSE ALL GROUPS
   ====================================================================== */
      function updateAllBtn() {
        const b = $("#btnAll");
        if (!b) return;
        /* what is drawn: a group a drag has emptied does not count */
        const L = gesture.view().groups.filter((g) => g.screens.length),
          all = L.length > 0 && L.every((g) => g.open);
        b.querySelector("span").textContent = all ? "Close all" : "Open all";
        b.querySelector("use").setAttribute(
          "href",
          all ? "#i-collapse" : "#i-expand",
        );
        b.title = (all ? "Close" : "Open") + " all groups (A)";
        b.disabled = !L.length;
      }
      function toggleAll() {
        stopPlay();
        const L = layout.lanes.filter((l) => l.screens.length);
        if (!L.length) return;
        const open = !L.every((l) => l.open);
        if (!open && [...selSet].some((i) => laneOf(i))) select(null);
        commit(
          () => {
            L.forEach((l) => {
              l.open = open;
            });
          },
          VIEW_STATE,
        );
        fly(fitRect(geo.bounds(), 40, 1.1));
      }

      /* ======================================================================
   DEVICE: same scan, same flows, rendered at another viewport
   ====================================================================== */
      let switching = false;
      async function setDevice(id) {
        if (id === DEV.id || switching) return;
        switching = true;
        stopPlay();
        closeMenus();
        const sel = [...selSet],
          prim = selected;
        world.style.transition = "opacity .18s";
        world.style.opacity = 0;
        await sleep(200);
        document.body.classList.add("boot");
        applyDevice(id);
        buildWorld();
        setSel(sel, prim);
        clearSpot();
        if (usageComp !== null) {
          const u = usageComp;
          usageComp = null;
          sweepQuiet(u);
        }
        if (panelOpen && panelMode === "inspect" && prim)
          inspect(prim, true, true);
        if (prim) {
          const q = geo.screenRect(prim);
          cam = fitRect(
            { x: q.x - 30, y: q.y - 40, w: q.w + 60, h: q.h + 70 },
            30,
            1.6,
          );
        } else cam = fitRect(geo.bounds(), 30);
        stage.classList.remove("fly");
        apply();
        await sleep(80);
        document.body.classList.remove("boot");
        world.style.opacity = 1;
        await sleep(240);
        world.style.transition = "";
        switching = false;
        toast(DEV.label + " · " + DEV.vp);
      }
      document
        .querySelectorAll("#devsw button")
        .forEach((b) => (b.onclick = () => setDevice(b.dataset.dev)));
      $("#btnAll").onclick = toggleAll;

      /* ======================================================================
   BOOT
   ====================================================================== */
      function labelUi() {
        document.querySelectorAll("button[title]").forEach((b) => {
          if (!b.getAttribute("aria-label"))
            b.setAttribute(
              "aria-label",
              b.title.replace(/\s*\([^)]*\)\s*$/, ""),
            );
        });
        $("#seltb").setAttribute("role", "toolbar");
        $("#seltb").setAttribute("aria-label", "Selected frames");
        $("#devsw").setAttribute("role", "group");
        $("#devsw").setAttribute("aria-label", "Device size");
        $("#toast").setAttribute("role", "status");
        $("#toast").setAttribute("aria-live", "polite");
        $("#panel").setAttribute("role", "complementary");
        $("#panel").setAttribute("aria-label", "Inspector");
      }
      function boot() {
        labelUi();
        $("#productName").textContent = SCAN.product.name;
        $("#rescanFacts").textContent = SCAN.product.name;
        $("#productFacts").textContent =
          ORDER.length + " screens" + (SCAN.product.scanned ? " · scanned " + SCAN.product.scanned : "");
        document.body.classList.add("boot");
        applyDevice("mobile");
        buildWorld();
        cam = fitRect(geo.bounds(), 30);
        apply();
        if (SCAN.start) select(SCAN.start, false);
        requestAnimationFrame(() =>
          requestAnimationFrame(() => document.body.classList.remove("boot")),
        );
      }
      (document.fonts && document.fonts.ready
        ? document.fonts.ready
        : Promise.resolve()
      ).then(boot);
    </script>
  </body>
</html>
