<!doctype html><meta charset="utf-8"><title>60-screen canvas measurements</title>
<style>body{font:14px system-ui;margin:20px}iframe{width:1280px;height:800px;border:1px solid #aaa}pre{white-space:pre-wrap}</style>
<button id="run">Measure 60 screens (3 runs)</button><pre id="result">Ready</pre><div id="fixture"></div>
<script type="module">
import {largeScan} from './large-scan.mjs';
const template = new URLSearchParams(location.search).get('template') || '../assets/flow-canvas.html';
const original = await (await fetch(template)).text();
const sample = JSON.parse(original.match(/<script type="application\/json" id="flow-scan">([\s\S]*?)<\/script>/)[1]);
const source = original.replace(/(<script type="application\/json" id="flow-scan">)[\s\S]*?(<\/script>)/,
  (_,a,b) => a + JSON.stringify(largeScan(sample)).replace(/<\//g,'<\\/') + b);
const wait = async (read) => { const end=performance.now()+15000; while(performance.now()<end){if(read())return;await new Promise(r=>setTimeout(r,16));}throw Error('Canvas did not settle'); };
const paint = () => new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
document.querySelector('#run').onclick = async () => {
  const rows=[]; document.querySelector('#result').textContent='Running…';
  try { for(let i=0;i<3;i++) {
    const frame=document.createElement('iframe'); frame.title='60-screen canvas';
    const start=performance.now();frame.srcdoc=source; document.querySelector('#fixture').replaceChildren(frame);
    await wait(()=>frame.contentDocument?.querySelectorAll('.col').length===60);
    await paint(); const firstPaint=performance.now()-start;
    await wait(()=>!frame.contentDocument.body.classList.contains('boot'));
    await paint(); const ready=performance.now()-start;
    const doc=frame.contentDocument;const live=doc.querySelectorAll('#frames iframe').length;
    const switchStart=performance.now();doc.querySelector('[data-dev="desktop"]').click();
    await wait(()=>doc.querySelector('[data-dev="desktop"]').getAttribute('aria-pressed')==='true' && !doc.querySelector('#world').classList.contains('fading') && !doc.body.classList.contains('boot'));
    await paint();rows.push({firstCanvasPaintMs:+firstPaint.toFixed(1),canvasReadyMs:+ready.toFixed(1),liveIframes:live,deviceSwitchMs:+(performance.now()-switchStart).toFixed(1),afterSwitchIframes:doc.querySelectorAll('#frames iframe').length});
    document.querySelector('#result').textContent=JSON.stringify(rows,null,2);
  }} catch(e) {document.querySelector('#result').textContent += '\n'+e.stack;}
};
</script>
